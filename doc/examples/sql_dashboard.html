<!DOCTYPE html>
<html>

<head>
    <title>My Knowledge Stats</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            padding: 20px;
        }

        .chart-container {
            width: 100%;
            height: 300px;
            margin-top: 20px;
        }

        button {
            padding: 8px 16px;
            background: #34c759;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <h1>Note Stats</h1>
    <p>Visualizing your `note_synapse.db` data using Chart.js.</p>
    <button onclick="loadData()">Refresh Data</button>

    <div class="chart-container">
        <canvas id="myChart"></canvas>
    </div>

    <script>
        async function loadData() {
            try {
                // 1. Query the SQLite database via Synapse API
                // Count notes by type (note, task, etc)
                const result = await window.Synapse.runQuery(`
                    SELECT type, COUNT(*) as count 
                    FROM notes 
                    GROUP BY type
                `);

                // 2. Process Data
                const labels = result.map(r => r.type || 'unknown');
                const data = result.map(r => r.count);

                // 3. Render Chart
                const ctx = document.getElementById('myChart');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '# of Notes',
                            data: data,
                            backgroundColor: ['#ff6384', '#36a2eb', '#ffce56', '#4bc0c0']
                        }]
                    },
                    options: { scales: { y: { beginAtZero: true } } }
                });

            } catch (e) {
                alert("Error: " + e.message);
            }
        }
    </script>
</body>

</html>
