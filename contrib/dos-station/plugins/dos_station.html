<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>DOS Station</title>
<!--
  DOS Station — a Note Synapse user app that plays DOS games stored in notes.

  * Reads a .zip attachment from a note (Synapse.readAttachment), unpacks it in
    JS and mounts it as the DOS C: drive of a DOSBox-to-WebAssembly emulator.
  * The emulator engine (js-dos 6.22.60 "wdosbox", DOSBox is GPL-2.0) is
    downloaded on first run via Synapse.proxyFetch, verified against pinned
    SHA-256 hashes with Synapse.crypto.digest, and cached with
    Synapse.storeAppState for offline use. The engine is fetched onto the
    user's device and is not distributed with this file.
  * Emulator config comes from a ```dosbox fenced block in the note body.
  * Frames can be captured back into the note (attachment + inline markdown
    append) via Synapse.updateNotes.
  * Files games write to C: (RPG saves, configs, high scores) are diffed
    against the game zip and persisted to the note as a dos-saves-*.zip
    attachment (manual 💾, 60 s autosave, eject); restored on the next boot.

  Plugin code license: MIT (c) Note Synapse contributors.
  Embedded library: fflate 0.8.2 (MIT) — https://github.com/101arrowz/fflate
-->
<style>
  :root{
    --bg:#07090d; --panel:#10151d; --panel2:#161d28; --line:#223041;
    --ph:#3dff7c; --ph-dim:#1d7a41; --amber:#ffb020; --red:#ff5252;
    --txt:#c8ffdd; --muted:#6f9b82;
    font-size:16px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--txt);
    font-family:ui-monospace,"Cascadia Mono",Menlo,Consolas,"Roboto Mono",monospace;
    overflow:hidden; touch-action:manipulation;
    -webkit-user-select:none; user-select:none;
  }
  /* ---- CRT flavor ------------------------------------------------------ */
  .crt::after{
    content:""; pointer-events:none; position:absolute; inset:0; z-index:60;
    background:
      repeating-linear-gradient(0deg, rgba(255,255,255,.028) 0 1px, transparent 1px 3px),
      radial-gradient(ellipse at center, transparent 58%, rgba(0,0,0,.38) 100%);
  }
  .screen{position:absolute; inset:0; display:none; flex-direction:column;}
  body[data-screen="boot"]     #scr-boot,
  body[data-screen="setup"]    #scr-setup,
  body[data-screen="launcher"] #scr-launcher,
  body[data-screen="player"]   #scr-player{display:flex;}

  /* ---- generic UI ------------------------------------------------------ */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:.5em;
    background:var(--panel2); color:var(--txt); border:1px solid var(--line);
    border-bottom-color:#0c1016; border-radius:6px; padding:.7em 1em;
    font:inherit; font-size:.95rem; cursor:pointer; text-align:center;
  }
  .btn:active{transform:translateY(1px); filter:brightness(1.25);}
  .btn.primary{background:#0d2b18; border-color:var(--ph-dim); color:var(--ph);
    text-shadow:0 0 6px rgba(61,255,124,.5); font-weight:700;}
  .btn.warn{color:var(--amber); border-color:#5c4310;}
  .btn.small{padding:.35em .6em; font-size:.8rem;}
  .card{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px;}
  .tag{display:inline-block; font-size:.68rem; letter-spacing:.08em; padding:.15em .5em;
    border:1px solid var(--ph-dim); color:var(--ph); border-radius:4px;}
  .tag.amber{border-color:#6b4c12; color:var(--amber);}
  .muted{color:var(--muted);}
  h1,h2{margin:.2em 0; font-weight:700; letter-spacing:.04em;}

  /* ---- boot / TTY ------------------------------------------------------ */
  #scr-boot{background:#04060a; padding:18px; position:relative;}
  .ttytext{
    white-space:pre-wrap; word-break:break-word; color:var(--ph); margin:0;
    font-size:.82rem; line-height:1.5; text-shadow:0 0 7px rgba(61,255,124,.35);
    overflow-y:auto; flex:1;
  }
  .cursor::after{content:"█"; animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  /* ---- setup / launcher ------------------------------------------------ */
  #scr-setup,#scr-launcher{padding:20px; overflow-y:auto; position:relative; gap:14px; align-items:center;}
  .logo{
    color:var(--ph); text-shadow:0 0 14px rgba(61,255,124,.45);
    font-size:.55rem; line-height:1.15; white-space:pre; margin:10px 0 0;
    text-align:center;
  }
  .sub{color:var(--muted); font-size:.8rem; letter-spacing:.14em; text-align:center;}
  .stack{display:flex; flex-direction:column; gap:10px; width:min(520px,100%);}
  .exe-row{display:flex; align-items:center; gap:10px; width:100%;}
  .exe-row .btn{flex:1; justify-content:flex-start;}
  .divider{border-top:1px dashed var(--line); margin:6px 0;}

  /* ---- player ---------------------------------------------------------- */
  #scr-player{background:#000;}
  #hud{
    display:flex; align-items:center; gap:6px; padding:6px 8px;
    background:linear-gradient(#131a24,#0c1119); border-bottom:1px solid var(--line);
    z-index:40; flex-wrap:nowrap;
  }
  #hud .title{
    flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    font-size:.8rem; color:var(--ph); text-shadow:0 0 6px rgba(61,255,124,.4);
  }
  .led{width:8px; height:8px; border-radius:50%; background:#28323f; box-shadow:none; flex:none;}
  .led.on{background:var(--ph); box-shadow:0 0 8px var(--ph);}
  .hudbtn{
    flex:none; background:var(--panel2); border:1px solid var(--line); color:var(--txt);
    border-radius:6px; font-size:1.02rem; line-height:1; padding:.42em .55em; cursor:pointer;
  }
  .hudbtn.active{border-color:var(--ph-dim); color:var(--ph); box-shadow:0 0 6px rgba(61,255,124,.35) inset;}
  #stage{position:relative; flex:1; min-height:0; display:flex;}
  #cnv{
    /* !important: the SDL glue writes inline width/height styles on mode
       changes; keep the canvas letterboxed inside the stage regardless. */
    width:100% !important; height:100% !important; object-fit:contain;
    background:#000; image-rendering:pixelated; display:block; touch-action:none;
  }
  #tty{
    position:absolute; inset:0; z-index:30; background:rgba(3,6,9,.96);
    padding:14px; display:flex; overflow:hidden;
  }
  #tty.hidden{display:none;}

  /* ---- on-screen keyboard --------------------------------------------- */
  #kb{
    position:absolute; left:0; right:0; bottom:0; z-index:45;
    background:rgba(9,13,19,.94); border-top:1px solid var(--line);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom)); display:none;
    touch-action:none;
  }
  #kb.show{display:block;}
  .kbrow{display:flex; gap:4px; margin:4px 2px;}
  .k{
    flex:1 1 0; min-width:0; background:#1a2230; border:1px solid #2c3a4e;
    border-bottom:2px solid #0b0f15; color:var(--txt); border-radius:5px;
    font:inherit; font-size:.78rem; padding:.62em 0; text-align:center; cursor:pointer;
  }
  .k:active,.k.down{background:#2c4a35; color:var(--ph);}
  .k.mod.armed{background:#0d2b18; color:var(--ph); border-color:var(--ph-dim);
    box-shadow:0 0 7px rgba(61,255,124,.4) inset;}
  #typebar{display:flex; gap:5px; margin:2px 2px 6px;}
  #typebar input{
    flex:1; min-width:0; background:#0b1016; color:var(--ph); border:1px solid var(--line);
    border-radius:5px; font:inherit; font-size:.9rem; padding:.45em .6em;
    -webkit-user-select:text; user-select:text;
  }

  /* ---- virtual gamepad -------------------------------------------------- */
  #pad{position:absolute; inset:0; z-index:44; display:none; pointer-events:none;}
  #pad.show{display:block;}
  #dpad{
    position:absolute; left:14px; bottom:calc(16px + env(safe-area-inset-bottom));
    width:148px; height:148px; border-radius:50%; pointer-events:auto;
    background:radial-gradient(circle, rgba(30,40,54,.55) 0 60%, rgba(30,40,54,.25) 100%);
    border:1px solid rgba(80,110,140,.5); touch-action:none;
  }
  #dstick{
    position:absolute; width:56px; height:56px; border-radius:50%;
    left:46px; top:46px; background:rgba(61,255,124,.28);
    border:1px solid var(--ph-dim); pointer-events:none;
  }
  #padbtns{
    position:absolute; right:14px; bottom:calc(16px + env(safe-area-inset-bottom));
    display:flex; gap:12px; align-items:flex-end; pointer-events:auto;
  }
  .pbtn{
    width:62px; height:62px; border-radius:50%; touch-action:none;
    background:rgba(30,40,54,.6); border:1px solid rgba(80,110,140,.6);
    color:var(--txt); font:inherit; font-size:.72rem; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; cursor:pointer;
  }
  .pbtn b{font-size:1rem; color:var(--ph);}
  .pbtn.down{background:rgba(61,255,124,.3);}
  #padcfg{
    position:absolute; right:14px; bottom:calc(96px + env(safe-area-inset-bottom));
    pointer-events:auto; display:flex; gap:6px;
  }
  #padcfg select{
    background:#0b1016; color:var(--txt); border:1px solid var(--line);
    font:inherit; font-size:.68rem; border-radius:4px; padding:2px;
  }

  /* ---- capture modal / toast ------------------------------------------ */
  #flash{position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; z-index:70;}
  #flash.go{animation:flashA .28s ease-out;}
  @keyframes flashA{0%{opacity:.85;}100%{opacity:0;}}
  .modal-wrap{
    position:absolute; inset:0; z-index:80; display:none;
    align-items:center; justify-content:center; background:rgba(2,4,7,.78); padding:14px;
  }
  .modal-wrap.show{display:flex;}
  .modal{
    width:min(460px,100%); max-height:100%; overflow-y:auto;
    background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px;
    display:flex; flex-direction:column; gap:10px;
  }
  .modal img{width:100%; border:1px solid var(--line); border-radius:6px; image-rendering:pixelated; background:#000;}
  .modal textarea{
    background:#0b1016; color:var(--txt); border:1px solid var(--line); border-radius:6px;
    font:inherit; font-size:.9rem; padding:.6em; min-height:64px; resize:vertical;
    -webkit-user-select:text; user-select:text;
  }
  .modal .row{display:flex; gap:8px;}
  .modal .row .btn{flex:1;}
  #aiOut{
    display:none; background:#0b1016; border:1px dashed var(--ph-dim); border-radius:6px;
    padding:.6em; font-size:.85rem; white-space:pre-wrap; color:var(--txt);
  }
  #toast{
    position:absolute; left:50%; transform:translateX(-50%);
    bottom:calc(20px + env(safe-area-inset-bottom)); z-index:90;
    background:#0d2b18; color:var(--ph); border:1px solid var(--ph-dim);
    padding:.6em 1.1em; border-radius:8px; font-size:.85rem; opacity:0;
    transition:opacity .25s; pointer-events:none; max-width:88%; text-align:center;
  }
  #toast.show{opacity:1;}
  #toast.err{background:#2b0d0d; color:#ffb2b2; border-color:#7a1d1d;}
</style>
</head>
<body data-screen="boot" class="crt">

<!-- ======================= BOOT ======================= -->
<div class="screen" id="scr-boot">
  <pre class="ttytext cursor" id="bootlog"></pre>
</div>

<!-- ======================= SETUP (no note yet) ======================= -->
<div class="screen" id="scr-setup">
  <pre class="logo" id="logo"></pre>
  <div class="sub">NOTE&nbsp;SYNAPSE&nbsp;·&nbsp;RETRO&nbsp;COMPUTING&nbsp;BAY</div>
  <div class="stack" id="setupStack"></div>
</div>

<!-- ======================= LAUNCHER ======================= -->
<div class="screen" id="scr-launcher">
  <pre class="logo" id="logo2"></pre>
  <div class="stack" id="launchStack"></div>
</div>

<!-- ======================= PLAYER ======================= -->
<div class="screen" id="scr-player">
  <div id="hud">
    <button class="hudbtn" id="btnEject" title="Eject">⏏</button>
    <span class="led on" id="ledPower"></span>
    <span class="led" id="ledDisk"></span>
    <span class="title" id="hudTitle">DOS STATION</span>
    <button class="hudbtn" id="btnTty" title="Console">≣</button>
    <button class="hudbtn" id="btnKb" title="Keyboard">⌨</button>
    <button class="hudbtn" id="btnPad" title="Gamepad">🎮</button>
    <button class="hudbtn" id="btnSave" title="Save game files to note">💾</button>
    <button class="hudbtn" id="btnShot" title="Capture frame">📸</button>
    <button class="hudbtn" id="btnPause" title="Pause">⏸</button>
  </div>
  <div id="stage">
    <canvas id="cnv" width="0" height="0"></canvas>
    <div id="tty"><pre class="ttytext cursor" id="ttylog"></pre></div>
    <div id="pad">
      <div id="dpad"><div id="dstick"></div></div>
      <div id="padcfg">
        <select id="mapA"></select><select id="mapB"></select><select id="mapC"></select>
      </div>
      <div id="padbtns">
        <button class="pbtn" id="pbC"><b>C</b><span id="lblC"></span></button>
        <button class="pbtn" id="pbB"><b>B</b><span id="lblB"></span></button>
        <button class="pbtn" id="pbA"><b>A</b><span id="lblA"></span></button>
      </div>
    </div>
    <div id="kb"></div>
    <div id="flash"></div>
  </div>
</div>

<!-- ======================= CAPTURE MODAL ======================= -->
<div class="modal-wrap" id="capWrap">
  <div class="modal">
    <h2 style="font-size:.95rem;">📸 FRAME CAPTURED</h2>
    <img id="capImg" alt="captured frame">
    <div id="aiOut"></div>
    <textarea id="capText" placeholder="Optional note about this moment…"></textarea>
    <div class="row">
      <button class="btn" id="btnAskAI">🤖 Ask AI</button>
      <button class="btn primary" id="btnSaveCap">💾 Append to note</button>
    </div>
    <div class="row">
      <button class="btn" id="btnCloseCap">Close</button>
    </div>
  </div>
</div>

<div id="toast"></div>

/* ---------------------------------------------------------------- utils */
function log(msg) { console.log('[DOS Station] ' + msg); }
function logErr(msg, e) { console.log('[DOS Station] ERROR ' + msg + (e && e.stack ? '\n' + e.stack : '')); }

function b64ToU8(b64) {
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}
function u8ToB64(u8) {
  let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) {
    s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
  }
  return btoa(s);
}
function bytesEqual(a, b) {
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length; i++) if (a[i] !== b[i]) return false;
  return true;
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
function fmtSize(n) {
  if (n > 1048576) return (n / 1048576).toFixed(1) + ' MB';
  if (n > 1024) return (n / 1024).toFixed(0) + ' KB';
  return n + ' B';
}
function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let toastTimer = null;

/* ------------------------------------------------------ audio unlocking */
(function patchAudioContext() {
  const Orig = window.AudioContext || window.webkitAudioContext;
  if (!Orig) return;
  const created = [];
  function Wrapped() {
    const ctx = new Orig();
    created.push(ctx);
    return ctx;
  }
  Wrapped.prototype = Orig.prototype;
  window.AudioContext = Wrapped;
  try { window.webkitAudioContext = Wrapped; } catch (_) {}
  const resume = () => {
    created.forEach((c) => { if (c.state === 'suspended') c.resume().catch(() => {}); });
  };
  ['touchend', 'mousedown', 'keydown'].forEach((ev) =>
    document.addEventListener(ev, resume, true));
})();

async function loadPersisted() {

  } catch (e) { logErr('loadAppState failed', e); }
  if (state.appState.padMap) state.padMap = { ...state.padMap, ...state.appState.padMap };
}
async function persist(patch) {

    const r = await Synapse.storeAppState(state.appState);

/* ------------------------------------------------------------ engine */
async function fetchEngineFile(spec, label) {
  for (const url of spec.urls) {
    try {
      ttyLog('FETCH ' + label + ' <- ' + new URL(url).host + ' ...');
      const r = await Synapse.proxyFetch(url, { responseMode: 'binary' });
      if (!r || r.status !== 'success' || !r.content || !r.content.data) {
        ttyLog('  ' + (r && (r.error || ('HTTP ' + r.statusCode)) || 'no response'));
        continue;
      }
      const b64 = r.content.data;
      ttyLog('  VERIFY SHA-256 ...');
      const d = await Synapse.crypto.digest('sha256', { base64: b64 });
      if (!d || !d.success || d.hex !== spec.sha256) {
        ttyLog('  HASH MISMATCH — skipping mirror');
        continue;
      }
      ttyLog('  OK (' + fmtSize(b64.length * 3 / 4) + ')');
      return b64;
    } catch (e) {
      logErr('fetch ' + url, e);
      ttyLog('  FAILED: ' + (e && e.message));
    }
  }
  throw new Error('Could not download ' + label + ' from any mirror');
}

async function ensureEngine() {
  if (state.engine) return state.engine;
  const cached = state.appState.engine;
  if (cached && cached.version === ENGINE.version && cached.glue && cached.wasm) {
    ttyLog('ENGINE CACHE ... HIT (js-dos ' + ENGINE.version + ')');
    state.engine = {
      glueText: new TextDecoder().decode(b64ToU8(cached.glue)),
      wasmU8: b64ToU8(cached.wasm),
    };
    return state.engine;
  }
  ttyLog('ENGINE CACHE ... MISS');
  ttyLog('INSTALLING DOSBOX/WASM ENGINE (one-time, ~2 MB)');
  const glueB64 = await fetchEngineFile(ENGINE.files.glue, 'WDOSBOX.JS');
  const wasmB64 = await fetchEngineFile(ENGINE.files.wasm, 'WDOSBOX.WASM');
  await persist({ engine: { version: ENGINE.version, glue: glueB64, wasm: wasmB64 } });
  ttyLog('ENGINE CACHED FOR OFFLINE USE');
  state.engine = {
    glueText: new TextDecoder().decode(b64ToU8(glueB64)),
    wasmU8: b64ToU8(wasmB64),
  };
  return state.engine;
}

/* ------------------------------------------------------- note handling */
function baseName(p) { return String(p).split('/').pop(); }

async function resolveLaunchNote() {
  const notes = (window.Synapse && Synapse.Notes) || [];
  if (notes.length) {
    // Prefer a selected note that actually has a .zip attachment.
    const withZip = notes.find((n) =>
      (n.attachmentPaths || []).some((p) => /\.zip$/i.test(p)));
    const n = withZip || notes[0];
    state.noteId = n.id;
    state.noteTitle = n.title || 'Untitled note';
    state.noteContent = n.content || '';
    state.attachments = (n.attachmentPaths || []).map((p) => ({ path: p, name: baseName(p) }));
    return true;
  }
  return false;
}

async function loadNoteById(noteId) {
  const r = await Synapse.exportNotes([noteId], { includeSubNotesAndLinkedNotes: false });
  if (!r || !r.success || !r.notes || !r.notes.length) {
    throw new Error((r && r.error) || 'Could not read the note');
  }
  const n = r.notes[0];
  state.noteId = n.id;
  state.noteTitle = n.title || 'Untitled note';
  state.noteContent = n.markdown || '';
  state.attachments = (n.attachments || []).map((a) => ({
    path: a.path, name: a.fileName || baseName(a.path),
  }));
}

function zipAttachments() {
  return state.attachments.filter((a) =>
    (/\.zip$/i.test(a.name) || /\.zip$/i.test(a.path)) && !isSavesAttachment(a));
}

/* ------------------------------------------------------- zip mounting */
async function mountZip(att) {
  state.zip = att;
  ttyLog('READ ATTACHMENT "' + att.name + '" ...');
  const r = await Synapse.readAttachment(att.path);
  if (!r || !r.success || !r.data) {
    throw new Error((r && r.error) || 'readAttachment failed');
  }
  const u8 = b64ToU8(r.data);
  ttyLog('  ' + fmtSize(u8.length) + ' — UNPACKING ...');
  let entries;
  try {
    entries = fflate.unzipSync(u8);
  } catch (e) {
    throw new Error('Not a valid zip file: ' + (e && e.message));
  }
  let files = [];
  for (const rawName of Object.keys(entries)) {
    let name = rawName.replace(/\\/g, '/').replace(/^\.\//, '').replace(/^\/+/, '');
    if (!name || name.endsWith('/')) continue;
    if (/(^|\/)__MACOSX\//.test(name) || /(^|\/)\.DS_Store$/i.test(name)) continue;
    files.push({ name, data: entries[rawName] });
  }
  if (!files.length) throw new Error('The zip contains no files');
  // If everything lives in a single wrapper folder, strip it (zip-of-a-folder).
  for (let guard = 0; guard < 4; guard++) {
    const tops = new Set(files.map((f) => f.name.split('/')[0]));
    if (tops.size !== 1 || !files.every((f) => f.name.includes('/'))) break;
    files = files.map((f) => ({ name: f.name.split('/').slice(1).join('/'), data: f.data }));
  }
  state.zipBaseline = new Map(files.map((f) => [f.name, f.data]));
  state.lastSaveSig = null;
  files = await restoreSaves(files);
  state.files = files;
  ttyLog('  MOUNTED ' + files.length + ' FILES AT C:\\');
  scanExecutables();
}

function scanExecutables() {
  const title = (state.noteTitle + ' ' + (state.zip ? state.zip.name : '')).toLowerCase();
  const good = /^(start|play|run|go|game)/i;
  const bad = /(install|setup|unins|config|readme|manual|order|vendor)/i;
  state.executables = state.files
    .filter((f) => /\.(exe|com|bat)$/i.test(f.name))
    .map((f) => {
      const base = baseName(f.name);
      const stem = base.replace(/\.[^.]+$/, '').toLowerCase();
      let score = 0;
      score -= (f.name.split('/').length - 1) * 10;
      if (bad.test(stem)) score -= 50;
      if (good.test(stem)) score += 30;
      if (stem.length > 2 && title.includes(stem)) score += 25;
      return { path: f.name, base, score };
    })
    .sort((a, b) => b.score - a.score || a.path.localeCompare(b.path));
}

/* ------------------------------------------------------- game saves ----
 * Anything a game writes to C: (RPG save files, configs, high scores) is
 * diffed against the pristine game zip, packed with fflate and stored as a
 * `dos-saves-<zipslug>-<stamp>.zip` attachment on the note, replacing the
 * previous one. On mount the newest matching saves zip is overlaid on the
 * game files before DOSBox boots. A `__dos_station__/meta.json` entry inside
 * the zip records deletions and the source game zip. */
const SAVES_META_DIR = '__dos_station__/';
const AUTOSAVE_MS = 60000;

function savesSlug(zipName) {
  const s = String(zipName).toLowerCase().replace(/\.zip$/, '')
    .replace(/[^a-z0-9]/g, '').slice(0, 24);
  return s || 'disk';
}
function isSavesAttachment(a) {
  return /(^|\/)dos-saves-/i.test(a.name) || /(^|\/)dos-saves-/i.test(a.path);
}
function isSavesFor(a, slug) {
  return new RegExp('(^|/)dos-saves-' + slug + '-\\d', 'i').test(a.name) ||
    new RegExp('(^|/)dos-saves-' + slug + '-\\d', 'i').test(a.path);
}
function savesStamp(a) {
  const m = /dos-saves-.*?-(\d{6,})/i.exec(a.name + ' ' + a.path);
  return m ? Number(m[1]) : 0;
}
function fnv1a(u8) {
  let h = 0x811c9dc5;
  for (let i = 0; i < u8.length; i++) { h ^= u8[i]; h = Math.imul(h, 0x01000193); }
  return (h >>> 0).toString(16);
}
function saveSig(snap) {
  const c = snap.changed.map((f) => f.name + ':' + f.data.length + ':' + fnv1a(f.data)).sort();
  return c.join(',') + '|' + snap.deleted.slice().sort().join(',');
}
function safeRelName(name) {
  return name && !name.startsWith('/') && !name.split('/').includes('..');
}

/* Overlay the newest saves attachment for this game zip onto the files
 * about to be mounted. Returns the (possibly patched) file list. */
async function restoreSaves(files) {
  const slug = savesSlug(state.zip.name);
  const cands = state.attachments.filter((a) => isSavesFor(a, slug))
    .sort((a, b) => savesStamp(b) - savesStamp(a));
  for (const att of cands) {
    try {
      const r = await Synapse.readAttachment(att.path);
      if (!r || !r.success || !r.data) continue;
      const entries = fflate.unzipSync(b64ToU8(r.data));
      let meta = null;
      const over = [];
      for (const raw of Object.keys(entries)) {
        const name = raw.replace(/\\/g, '/');
        if (name === SAVES_META_DIR + 'meta.json') {
          try { meta = JSON.parse(fflate.strFromU8(entries[raw])); } catch (_) {}
          continue;
        }
        if (!name || name.endsWith('/') || name.startsWith(SAVES_META_DIR)) continue;
        if (!safeRelName(name)) continue;
        over.push({ name, data: entries[raw] });
      }
      if (meta && meta.game && meta.game !== state.zip.name) {
        ttyLog('  SAVES "' + att.name + '" belong to ' + meta.game + ' — skipped');
        continue;
      }
      const map = new Map(files.map((f) => [f.name, f]));
      for (const o of over) map.set(o.name, o);
      const deleted = ((meta && meta.deleted) || []).filter(safeRelName);
      for (const d of deleted) map.delete(d);
      state.lastSaveSig = saveSig({ changed: over, deleted });
      ttyLog('  SAVES RESTORED: ' + over.length + ' file' + (over.length === 1 ? '' : 's') +
        (deleted.length ? ', ' + deleted.length + ' deleted' : ''));
      return Array.from(map.values());
    } catch (e) {
      logErr('restoreSaves ' + att.name, e);
      ttyLog('  SAVES "' + att.name + '" unreadable — skipped');
    }
  }
  return files;
}

/* Walk the live guest FS and diff /dos against the pristine game zip. */
function snapshotChanges() {
  const FS = state.module && state.module.FS;
  if (!FS || !state.zipBaseline) return null;
  const seen = new Set();
  const changed = [];
  const readNode = (p) => {
    const node = FS.lookupPath(p).node;
    if (node && node.contents && node.contents.subarray) {
      return node.contents.subarray(0,
        node.usedBytes !== undefined ? node.usedBytes : node.contents.length);
    }
    return FS.readFile(p);
  };
  const walk = (dir) => {
    for (const name of FS.readdir(dir)) {
      if (name === '.' || name === '..') continue;
      const p = dir + '/' + name;
      let st;
      try { st = FS.stat(p); } catch (_) { continue; }
      if (FS.isDir(st.mode)) { walk(p); continue; }
      if (!FS.isFile(st.mode)) continue;
      const rel = p.slice('/dos/'.length);
      seen.add(rel);
      let data;
      try { data = readNode(p); } catch (e) { logErr('snapshot read ' + p, e); continue; }
      const base = state.zipBaseline.get(rel);
      if (!base || !bytesEqual(base, data)) {
        changed.push({ name: rel, data: new Uint8Array(data) });
      }
    }
  };
  try { walk('/dos'); } catch (e) { logErr('snapshot walk', e); return null; }
  const deleted = [];
  for (const name of state.zipBaseline.keys()) if (!seen.has(name)) deleted.push(name);
  return { changed, deleted };
}

async function saveGameState(auto) {
  if (state.saveBusy) return;
  if (!state.live || !state.noteId || !state.zip) {
    if (!auto) toast('Nothing to save yet', true);
    return;
  }
  const snap = snapshotChanges();
  if (!snap) { if (!auto) toast('Guest filesystem unavailable', true); return; }
  if (!snap.changed.length && !snap.deleted.length) {
    if (!auto) toast('No changes on C: to save');
    return;
  }
  const sig = saveSig(snap);
  if (sig === state.lastSaveSig) { if (!auto) toast('Already saved ✓'); return; }
  const total = snap.changed.reduce((s, f) => s + f.data.length, 0);
  if (auto && total > 8 * 1024 * 1024) {
    log('autosave skipped: changed payload ' + fmtSize(total));
    return;
  }
  state.saveBusy = true;
  try {
    const zobj = {};
    for (const f of snap.changed) zobj[f.name] = f.data;
    zobj[SAVES_META_DIR + 'meta.json'] = fflate.strToU8(JSON.stringify({
      v: 1,
      game: state.zip.name,
      savedAt: new Date().toISOString(),
      deleted: snap.deleted,
    }));
    const zipU8 = fflate.zipSync(zobj, { level: 6 });
    const slug = savesSlug(state.zip.name);
    const fileName = 'dos-saves-' + slug + '-' + Date.now() + '.zip';
    const oldPaths = state.attachments.filter((a) => isSavesFor(a, slug)).map((a) => a.path);
    const r = await Synapse.updateNotes([{
      id: state.noteId,
      modification: {
        attachments: {
          added: [{ type: 'base64', data: u8ToB64(zipU8), fileName }],
          removed: oldPaths,
        },
      },
    }]);
    if (!r || !r.success || !r.updatedCount) {
      throw new Error((r && r.error) || 'update declined');
    }
    state.lastSaveSig = sig;
    // Re-export the note so state.attachments reflects the stored (renamed)
    // saves file — the next save must remove it, a later restore must find it.
    try {
      const exp = await Synapse.exportNotes([state.noteId], { includeSubNotesAndLinkedNotes: false });
      const n = exp && exp.success && exp.notes && exp.notes[0];
      if (n) {
        state.attachments = (n.attachments || []).map((a) => ({
          path: a.path, name: a.fileName || baseName(a.path),
        }));
      }
    } catch (e) { logErr('saves path discovery', e); }
    log('saved ' + snap.changed.length + ' files, ' + fmtSize(zipU8.length) +
      (snap.deleted.length ? ', ' + snap.deleted.length + ' deletions' : ''));
    toast('💾 ' + (auto ? 'Auto-saved' : 'Saved') + ' ' + snap.changed.length +
      ' file' + (snap.changed.length === 1 ? '' : 's') + ' (' + fmtSize(zipU8.length) + ')');
  } catch (e) {
    logErr('saveGameState', e);
    if (!auto) toast('Save failed: ' + (e && e.message), true);
  } finally {
    state.saveBusy = false;
  }
}

function startAutoSave() {
  if (state.autoSaveTimer) return;
  state.autoSaveTimer = setInterval(() => {
    if (state.live && !state.paused && !document.hidden) saveGameState(true);
  }, AUTOSAVE_MS);
  // Backgrounding the app is the moment most likely to precede getting
  // killed — flush a save right away.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && state.live) saveGameState(true);
  });
}

/* -------------------------------------------------------- conf building */
function parseUserConf(md) {
  const m = /```dosbox[ \t]*\r?\n([\s\S]*?)```/i.exec(md || '');
  if (!m) return null;
  const head = [];
  const autoexec = [];
  let cur = null;
  let sawAe = false;
  for (const line of m[1].split(/\r?\n/)) {
    const s = /^\s*\[([^\]]+)\]/.exec(line);
    if (s) {
      cur = s[1].trim().toLowerCase();
      if (cur === 'autoexec') { sawAe = true; continue; }
    }
    if (cur === 'autoexec') autoexec.push(line);
    else head.push(line);
  }
  return { head: head.join('\n').trim(), autoexec: sawAe ? autoexec : null };
}

function buildConf(exePath) {
  const user = state.userConf;
  let conf = BASE_CONF;
  if (user && user.head) conf += '\n' + user.head + '\n';
  let ae;
  if (user && user.autoexec) {
    ae = user.autoexec.slice();
    if (!ae.some((l) => /^\s*(mount|imgmount)\s/i.test(l))) {
      ae.unshift('mount c /dos', 'c:');
    }
  } else {
    ae = ['@echo off', 'mount c /dos', 'c:'];
    if (exePath) {
      const parts = exePath.split('/');
      const base = parts.pop();
      if (parts.length) ae.push('cd \\' + parts.join('\\'));
      ae.push(base);
    } else {
      ae.push('echo DOS STATION READY. Type DIR to list files.');
    }
  }
  return conf + '\n[autoexec]\n' + ae.join('\n') + '\n';
}

/* -------------------------------------------------------------- booting */
function writeGuestFS(M, conf) {
  M.FS_createPath('/', 'dos', true, true);
  const made = new Set();
  for (const f of state.files) {
    const parts = f.name.split('/');
    const base = parts.pop();
    let dir = '';
    for (const part of parts) {
      const next = dir ? dir + '/' + part : part;
      if (!made.has(next)) {
        M.FS_createPath('/dos' + (dir ? '/' + dir : ''), part, true, true);
        made.add(next);
      }
      dir = next;
    }
    M.FS_createDataFile('/dos' + (dir ? '/' + dir : ''), base, f.data, true, true);
  }
  M.FS_createDataFile('/', 'dosbox.conf', conf, true, true);
}

async function boot(exePath) {
  showScreen('player');
  $('hudTitle').textContent = state.noteTitle.toUpperCase();
  $('tty').classList.remove('hidden');
  try {
    const eng = await ensureEngine();
    const conf = buildConf(exePath);
    log('conf:\n' + conf);
    if (!window.WDOSBOX) {
      ttyLog('LOADING ENGINE ...');
      (0, eval)(eng.glueText);
      if (!window.WDOSBOX) throw new Error('engine did not initialize');
    }
    ttyLog('BOOTING DOSBOX ...');
    ttyLog('');
    const M = {
      canvas: $('cnv'),
      wasmBinary: eng.wasmU8.buffer,
      TOTAL_MEMORY: 128 * 1024 * 1024,
      keyboardListeningElement: document,
      // js-dos build hooks: the wdosbox binary reads Module.version at startup
      // and reports events (write_stdout, shell_input, ...) through ping().
      version: ENGINE.version,
      ping: function (event, a, b) {
        if (event === 'write_stdout' && a) log('dosbox: ' + a);
      },
      print: (t) => log('dosbox: ' + t),
      printErr: (t) => log('dosbox! ' + t),
      preRun: [function () { writeGuestFS(M, conf); }],
      onAbort: (why) => fatal('Emulator aborted', new Error(String(why))),
      // The wdosbox glue is built with INVOKE_RUN=0 (js-dos drives it via
      // callMain), so start DOSBox ourselves once the runtime is up.
      onRuntimeInitialized: () => {
        try {
          M.callMain(['-conf', 'dosbox.conf']);
        } catch (e) {
          // emscripten_set_main_loop unwinds with a pseudo-exception; only
          // treat everything else as a real boot failure.
          const s = String((e && e.message) || e);
          if (!/unwind|SimulateInfiniteLoop|ExitStatus/i.test(s)) {
            fatal('DOSBox failed to start', e);
          }
        }
      },
    };
    state.module = M;
    window.WDOSBOX(M);
    // Remember this game for next time.
    persist({
      lastNote: { id: state.noteId, title: state.noteTitle },
      choices: {
        ...(state.appState.choices || {}),
        [state.noteId]: { zip: state.zip ? state.zip.path : null, exe: exePath || null },
      },
    });
    watchFirstFrame();
  } catch (e) {
    fatal('Boot failed', e);
  }
}

function watchFirstFrame() {
  const cnv = $('cnv');
  let ticks = 0;
  const iv = setInterval(() => {
    ticks++;
    if (cnv.width > 32 && cnv.height > 32) {
      clearInterval(iv);
      state.live = true;
      $('ledDisk').classList.add('on');
      $('tty').classList.add('hidden');
      startAutoSave();
      toast('▶ ' + state.noteTitle);
    } else if (ticks > 120) { // 30 s
      clearInterval(iv);
      ttyLog('*** No video signal — check the [autoexec] commands in your note.');
    }
  }, 250);
}

async function pickNote() {

async function startFromNoteId(noteId) {
  showScreen('boot');
  try {
    ttyLog('READING NOTE ...');
    await loadNoteById(noteId);
    await afterNoteLoaded();
  } catch (e) {
    fatal('Could not load the note', e);
    setTimeout(setupScreen, 2200);
  }
}

async function afterNoteLoaded() {
  state.userConf = parseUserConf(state.noteContent);
  ttyLog('NOTE: ' + state.noteTitle);
  ttyLog('CONFIG BLOCK ... ' + (state.userConf ? 'FOUND' : 'NOT PRESENT (using defaults)'));

  const zips = zipAttachments();
  if (!zips.length) {
    ttyLog('*** This note has no .zip attachment.');
    setTimeout(() => {
      setupScreen();
      toast('Attach a game .zip to "' + state.noteTitle + '" first', true);
    }, 1600);
    return;
  }

  // Pick the zip: embed param > remembered choice > single > chooser.
  const params = (window.Synapse && Synapse.Params) || {};
  const remembered = ((state.appState.choices || {})[state.noteId]) || {};
  let zip = null;
  if (params.zip) zip = zips.find((z) => z.name.toLowerCase() === String(params.zip).toLowerCase());
  if (!zip && remembered.zip) zip = zips.find((z) => z.path === remembered.zip);
  if (!zip && zips.length === 1) zip = zips[0];

  if (!zip) { launcherZipChooser(zips); return; }
  await mountAndRoute(zip);
}

async function mountAndRoute(zip) {
  showScreen('boot');
  try {
    await mountZip(zip);
  } catch (e) {
    fatal('Could not mount the game zip', e);
    return;
  }

  const params = (window.Synapse && Synapse.Params) || {};
  const remembered = ((state.appState.choices || {})[state.noteId]) || {};
  const autoboot = params.autoboot === '1' || params.autoboot === 'true' || params.autoboot === true;

  // The note's [autoexec] always wins: boot straight into it.
  if (state.userConf && state.userConf.autoexec) { boot(null); return; }

  // Explicit program requested by embed params?
  if (params.exe) {
    const want = String(params.exe).replace(/\\/g, '/').toLowerCase();
    const hit = state.executables.find((x) =>
      x.path.toLowerCase() === want || x.base.toLowerCase() === want);
    if (hit) { boot(hit.path); return; }
    ttyLog('*** exe param "' + params.exe + '" not found in zip');
  }

  if (autoboot) {
    const exe = (remembered.exe &&
        state.executables.find((x) => x.path === remembered.exe)) ||
      (state.executables.length === 1 ? state.executables[0] : null) ||
      (state.executables.length ? state.executables[0] : null);
    boot(exe ? (exe.path || exe) : null);
    return;
  }

  launcherScreen(remembered.exe);
}

function launcherZipChooser(zips) {
  showScreen('launcher');
  const stack = $('launchStack');
  stack.innerHTML = '<h2 style="font-size:.95rem;">💾 ' + esc(state.noteTitle) + '</h2>' +
    '<div class="muted" style="font-size:.8rem;">Several disks found — choose one:</div>';
  zips.forEach((z) => {
    const b = document.createElement('button');
    b.className = 'btn';
    b.textContent = '💾 ' + z.name;
    b.onclick = () => mountAndRoute(z);
    stack.appendChild(b);
  });
}

  }
}

/* =====================================================================
 *  Input: synthetic keyboard events into SDL
 * =================================================================== */
function sendKey(code, down) {
  const e = new KeyboardEvent(down ? 'keydown' : 'keyup', { bubbles: true, cancelable: true });
  Object.defineProperty(e, 'keyCode', { get: () => code });
  Object.defineProperty(e, 'which', { get: () => code });
  document.dispatchEvent(e);
}
async function tapKey(code, mods) {
  (mods || []).forEach((m) => sendKey(m, true));
  sendKey(code, true);
  // Release immediately: DOSBox's emulated clock can run far ahead of real
  // time, so even a short real-time hold triggers typematic key repeat.
  sendKey(code, false);
  (mods || []).forEach((m) => sendKey(m, false));
  await sleep(30);
}

/* character → key mapping for the quick-type bar */
const CHARKEYS = (() => {
  const m = {};
  for (let i = 0; i < 26; i++) {
    m[String.fromCharCode(97 + i)] = { code: 65 + i };
    m[String.fromCharCode(65 + i)] = { code: 65 + i, shift: true };
  }
  for (let i = 0; i < 10; i++) m[String(i)] = { code: 48 + i };
  const plain = { ' ': 32, '-': 189, '=': 187, '[': 219, ']': 221, '\\': 220,
    ';': 186, "'": 222, ',': 188, '.': 190, '/': 191, '`': 192 };
  for (const c in plain) m[c] = { code: plain[c] };
  const shifted = { '!': 49, '@': 50, '#': 51, '$': 52, '%': 53, '^': 54, '&': 55,
    '*': 56, '(': 57, ')': 48, '_': 189, '+': 187, '{': 219, '}': 221, '|': 220,
    ':': 186, '"': 222, '<': 188, '>': 190, '?': 191, '~': 192 };
  for (const c in shifted) m[c] = { code: shifted[c], shift: true };
  return m;
})();

async function typeString(text, pressEnter) {
  for (const ch of text) {
    const k = CHARKEYS[ch];
    if (!k) continue;
    await tapKey(k.code, k.shift ? [16] : []);
  }
  if (pressEnter) await tapKey(13, []);
}

/* ------------------------------------------------------ keyboard overlay */
const KB_LAYOUT = [
  [['Esc',27],['F1',112],['F2',113],['F3',114],['F4',115],['F5',116],['F6',117],['F7',118],['F8',119],['F9',120],['F10',121]],
  [['`',192],['1',49],['2',50],['3',51],['4',52],['5',53],['6',54],['7',55],['8',56],['9',57],['0',48],['-',189],['=',187],['⌫',8,1.6]],
  [['Tab',9,1.4],['Q',81],['W',87],['E',69],['R',82],['T',84],['Y',89],['U',85],['I',73],['O',79],['P',80],['[',219],[']',221],['\\',220]],
  [['Ctrl',17,1.6,'mod'],['A',65],['S',83],['D',68],['F',70],['G',71],['H',72],['J',74],['K',75],['L',76],[';',186],["'",222],['⏎',13,1.7]],
  [['Shift',16,2,'mod'],['Z',90],['X',88],['C',67],['V',86],['B',66],['N',78],['M',77],[',',188],['.',190],['/',191],['↑',38,1.2,'hold']],
  [['Alt',18,1.5,'mod'],['Space',32,6,'hold'],['←',37,1.2,'hold'],['↓',40,1.2,'hold'],['→',39,1.2,'hold']],
];

function buildKeyboard() {
  const kb = $('kb');
  const bar = document.createElement('div');
  bar.id = 'typebar';
  const inp = document.createElement('input');
  inp.placeholder = 'type a command…';
  inp.autocapitalize = 'off'; inp.autocomplete = 'off'; inp.spellcheck = false;
  const send = document.createElement('button');
  send.className = 'btn small'; send.textContent = 'SEND ⏎';
  send.addEventListener('click', async () => {
    const v = inp.value; inp.value = ''; inp.blur();
    if (v) { await typeString(v, true); }
  });
  bar.appendChild(inp); bar.appendChild(send);
  kb.appendChild(bar);

  for (const row of KB_LAYOUT) {
    const r = document.createElement('div');
    r.className = 'kbrow';
    for (const [label, code, w, kind] of row) {
      const k = document.createElement('button');
      k.className = 'k' + (kind === 'mod' ? ' mod' : '');
      k.textContent = label;
      k.style.flexGrow = w || 1;
      const clearArmed = () => {
        state.armedMods.forEach((m) => sendKey(m, false));
        state.armedMods.clear();
        document.querySelectorAll('.k.mod.armed').forEach((el) => el.classList.remove('armed'));
      };
      const down = (ev) => {
        ev.preventDefault();
        if (kind === 'mod') {
          if (state.armedMods.has(code)) state.armedMods.delete(code);
          else state.armedMods.add(code);
          k.classList.toggle('armed', state.armedMods.has(code));
          return;
        }
        if (kind === 'hold') {
          // Arrows/Space: games read the held state — press until released.
          sendKey(code, true);
          k.classList.add('down');
          return;
        }
        // Ordinary keys tap immediately: DOSBox's emulated typematic repeat
        // is far faster than real time, so even a quick finger hold would
        // spill repeated characters.
        state.armedMods.forEach((m) => sendKey(m, true));
        sendKey(code, true);
        sendKey(code, false);
        clearArmed();
        k.classList.add('down');
        setTimeout(() => k.classList.remove('down'), 130);
      };
      const up = (ev) => {
        ev.preventDefault();
        if (kind !== 'hold') return;
        sendKey(code, false);
        k.classList.remove('down');
      };
      k.addEventListener('touchstart', down, { passive: false });
      k.addEventListener('touchend', up, { passive: false });
      k.addEventListener('touchcancel', up, { passive: false });
      k.addEventListener('mousedown', (e) => { if (!('ontouchstart' in window)) down(e); });
      k.addEventListener('mouseup', (e) => { if (!('ontouchstart' in window)) up(e); });
      r.appendChild(k);
    }
    kb.appendChild(r);
  }
}

/* --------------------------------------------------------- virtual pad */
const PAD_CHOICES = [
  ['Ctrl', 17], ['Alt', 18], ['Space', 32], ['Enter', 13], ['Shift', 16],
  ['Z', 90], ['X', 88], ['Y', 89], ['Esc', 27], ['F1', 112],
];

function buildPad() {
  // A/B/C mapping selectors
  for (const btn of ['A', 'B', 'C']) {
    const sel = $('map' + btn);
    for (const [label, code] of PAD_CHOICES) {
      const o = document.createElement('option');
      o.value = code; o.textContent = btn + ':' + label;
      sel.appendChild(o);
    }
    sel.value = state.padMap[btn];
    sel.addEventListener('change', () => {
      state.padMap[btn] = Number(sel.value);
      refreshPadLabels();
      persist({ padMap: state.padMap });
    });
  }
  refreshPadLabels();

  for (const btn of ['A', 'B', 'C']) {
    const el = $('pb' + btn);
    const down = (ev) => { ev.preventDefault(); el.classList.add('down'); sendKey(state.padMap[btn], true); };
    const up = (ev) => { ev.preventDefault(); el.classList.remove('down'); sendKey(state.padMap[btn], false); };
    el.addEventListener('touchstart', down, { passive: false });
    el.addEventListener('touchend', up, { passive: false });
    el.addEventListener('touchcancel', up, { passive: false });
    el.addEventListener('mousedown', down);
    el.addEventListener('mouseup', up);
  }

  // D-pad: track one touch, translate position to arrow-key chords.
  const dpad = $('dpad');
  const stick = $('dstick');
  let touchId = null;
  const active = new Set();
  const applyKeys = (want) => {
    for (const c of [37, 38, 39, 40]) {
      const on = want.has(c);
      if (on && !active.has(c)) { sendKey(c, true); active.add(c); }
      if (!on && active.has(c)) { sendKey(c, false); active.delete(c); }
    }
  };
  const track = (t) => {
    const r = dpad.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
    let dx = t.clientX - cx, dy = t.clientY - cy;
    const dist = Math.hypot(dx, dy);
    const max = r.width / 2 - 24;
    if (dist > max) { dx *= max / dist; dy *= max / dist; }
    stick.style.left = (r.width / 2 - 28 + dx) + 'px';
    stick.style.top = (r.height / 2 - 28 + dy) + 'px';
    const want = new Set();
    if (dist > 16) {
      if (dx < -Math.abs(dy) * 0.414) want.add(37);
      if (dx > Math.abs(dy) * 0.414) want.add(39);
      if (dy < -Math.abs(dx) * 0.414) want.add(38);
      if (dy > Math.abs(dx) * 0.414) want.add(40);
    }
    applyKeys(want);
  };
  const reset = () => {
    touchId = null;
    stick.style.left = '46px'; stick.style.top = '46px';
    applyKeys(new Set());
  };
  dpad.addEventListener('touchstart', (ev) => {
    ev.preventDefault();
    const t = ev.changedTouches[0];
    touchId = t.identifier;
    track(t);
  }, { passive: false });
  dpad.addEventListener('touchmove', (ev) => {
    ev.preventDefault();
    for (const t of ev.changedTouches) if (t.identifier === touchId) track(t);
  }, { passive: false });
  const endT = (ev) => {
    for (const t of ev.changedTouches) if (t.identifier === touchId) reset();
  };
  dpad.addEventListener('touchend', endT);
  dpad.addEventListener('touchcancel', endT);
}

function refreshPadLabels() {
  for (const btn of ['A', 'B', 'C']) {
    const found = PAD_CHOICES.find(([, c]) => c === state.padMap[btn]);
    $('lbl' + btn).textContent = found ? found[0] : '?';
  }
}

/* =====================================================================
 *  Frame capture → note
 * =================================================================== */
function openCapture() {
  if (!state.live) { toast('No video yet', true); return; }
  let dataUrl = null;
  try {
    dataUrl = $('cnv').toDataURL('image/png');
  } catch (e) {
    logErr('toDataURL', e);
  }
  if (!dataUrl || dataUrl.length < 256) { toast('Could not capture the frame', true); return; }
  state.lastCapture = dataUrl;
  $('flash').classList.remove('go');
  void $('flash').offsetWidth;
  $('flash').classList.add('go');
  state.capWasPaused = state.paused;
  if (!state.paused) pauseToggle(true);
  $('capImg').src = dataUrl;
  $('capText').value = '';
  $('aiOut').style.display = 'none';
  $('aiOut').textContent = '';
  $('capWrap').classList.add('show');
}

function closeCapture() {
  $('capWrap').classList.remove('show');
  if (!state.capWasPaused && state.paused) pauseToggle(false);
}

async function saveCapture() {
  const btn = $('btnSaveCap');
  btn.disabled = true;
  btn.textContent = 'SAVING…';
  try {
    const stampId = 'dos-capture-' + Date.now();
    const comment = $('capText').value.trim();

    // 1) attach the frame to the note
    const add = await Synapse.updateNotes([{
      id: state.noteId,
      modification: {
        attachments: { added: [{ type: 'base64', data: state.lastCapture, fileName: stampId + '.png' }] },
      },
    }]);
    if (!add || !add.success || !add.updatedCount) {
      throw new Error((add && add.error) || 'attachment declined');
    }

    // 2) find the stored file name so the image can be embedded inline
    let imgRef = null;
    try {
      const exp = await Synapse.exportNotes([state.noteId], { includeSubNotesAndLinkedNotes: false });
      const atts = (exp && exp.success && exp.notes && exp.notes[0] && exp.notes[0].attachments) || [];
      const hit = atts.find((a) =>
        String(a.path || '').includes(stampId) || String(a.fileName || '').includes(stampId));
      if (hit && hit.path) imgRef = baseName(hit.path);
    } catch (e) { logErr('capture path discovery', e); }

    // 3) append the moment to the note body
    const when = new Date().toLocaleString();
    let block = '\n\n---\n\n🕹️ **DOS Station** — ' + when;
    if (imgRef) block += '\n\n![DOS capture](' + imgRef + ')';
    else block += '\n\n_(frame saved as attachment ' + stampId + '.png)_';
    if (comment) block += '\n\n' + comment;
    const app = await Synapse.updateNotes([{
      id: state.noteId,
      modification: { content: { action: 'append', text: block } },
    }]);
    if (app && app.success && app.updatedCount) {
      toast('Saved to "' + state.noteTitle + '" ✓');
      closeCapture();
    } else {
      toast('Frame attached, but the text append was declined', true);
    }
  } catch (e) {
    logErr('saveCapture', e);
    toast('Save failed: ' + (e && e.message), true);
  } finally {
    btn.disabled = false;
    btn.textContent = '💾 Append to note';
  }
}

async function askAI() {
  const out = $('aiOut');
  out.style.display = 'block';
  out.textContent = '🤖 examining the frame…';
  try {
    const r = await Synapse.chatAI(
      'This is a screenshot of a DOS game or program running in an emulator. ' +
      'Briefly describe what is on screen, identify the game if you can, and give one ' +
      'helpful, spoiler-light tip. Answer in 2-4 plain-text sentences.',
      { attachments: [{ type: 'base64', mimeType: 'image/png', data: state.lastCapture }] },
    );
    if (r && r.success && r.response) {
      out.textContent = '🤖 ' + r.response;
      const cur = $('capText');
      if (!cur.value) cur.value = r.response.trim();
    } else {
      out.textContent = 'AI unavailable: ' + ((r && r.error) || 'no response');
    }
  } catch (e) {
    logErr('askAI', e);
    out.textContent = 'AI request failed: ' + (e && e.message);
  }
}

/* =====================================================================
 *  HUD wiring
 * =================================================================== */
function pauseToggle(force) {
  const M = state.module;
  if (!M) return;
  const next = typeof force === 'boolean' ? force : !state.paused;
  if (next === state.paused) return;
  state.paused = next;
  try {
    if (M.sync_sleep) {
      // This build runs on ASYNCIFY sleeps (window.postMessage), not
      // emscripten_set_main_loop, so pause by holding the next wake-up
      // callback and releasing it on resume.
      if (!M.__pausePatched) {
        M.__pausePatched = true;
        const origSleep = M.sync_sleep.bind(M);
        M.sync_sleep = function (wakeUp) {
          if (state.paused) { state.pendingWake = wakeUp; return; }
          origSleep(wakeUp);
        };
      }
      if (!next && state.pendingWake) {
        const wake = state.pendingWake;
        state.pendingWake = null;
        setTimeout(wake, 0);
      }
    } else {
      if (next) M.pauseMainLoop(); else M.resumeMainLoop();
    }
  } catch (e) { logErr('pauseToggle', e); }
  $('btnPause').textContent = next ? '▶' : '⏸';
  $('btnPause').classList.toggle('active', next);
}

function wireHud() {
  // window.confirm is not reliably wired inside the app's WebView, so Eject
  // uses an arm-then-confirm double tap instead.
  let ejectArmed = null;
  $('btnEject').addEventListener('click', () => {
    if (ejectArmed) {
      // Best-effort flush of unsaved game files before ending the session.
      const done = () => location.reload();
      if (state.live) Promise.race([saveGameState(true), sleep(4000)]).then(done, done);
      else done();
      return;
    }
    const b = $('btnEject');
    b.textContent = '⏏?';
    b.style.color = 'var(--red)';
    toast('Tap ⏏ again to end the DOS session');
    ejectArmed = setTimeout(() => {
      ejectArmed = null;
      b.textContent = '⏏';
      b.style.color = '';
    }, 2800);
  });
  $('btnTty').addEventListener('click', () => $('tty').classList.toggle('hidden'));
  $('btnKb').addEventListener('click', () => {
    const on = $('kb').classList.toggle('show');
    $('btnKb').classList.toggle('active', on);
    if (on) { $('pad').classList.remove('show'); $('btnPad').classList.remove('active'); }
  });
  $('btnPad').addEventListener('click', () => {
    const on = $('pad').classList.toggle('show');
    $('btnPad').classList.toggle('active', on);
    if (on) { $('kb').classList.remove('show'); $('btnKb').classList.remove('active'); }
  });
  $('btnSave').addEventListener('click', () => saveGameState(false));
  $('btnShot').addEventListener('click', openCapture);
  $('btnPause').addEventListener('click', () => pauseToggle());
  $('btnAskAI').addEventListener('click', askAI);
  $('btnSaveCap').addEventListener('click', saveCapture);
  $('btnCloseCap').addEventListener('click', closeCapture);
}

/* =====================================================================
 *  Entry
 * =================================================================== */
async function main() {
  $('logo').textContent = LOGO;
  $('logo2').textContent = LOGO;
  buildKeyboard();
  buildPad();
  wireHud();

  if (!window.Synapse || !Synapse.readAttachment || !Synapse.updateNotes) {
    showScreen('boot');
    ttyLog('*** Synapse API not available.');
    ttyLog('*** DOS Station must run inside Note Synapse as a user app.');
    return;
  }

  showScreen('boot');
  ttyLog('NOTE SYNAPSE · DOS STATION BIOS 1.0');
  ttyLog('CPU: WEBASSEMBLY VM ......... OK');
  ttyLog('SYNAPSE BRIDGE .............. OK');
  await loadPersisted();
  ttyLog('ENGINE CACHE ................ ' +
    (state.appState.engine && state.appState.engine.version === ENGINE.version ? 'READY' : 'EMPTY'));
  ttyLog('');

  try {
    if (await resolveLaunchNote()) {
      await afterNoteLoaded();
    } else {
      setupScreen();
    }
  } catch (e) {
    fatal('Startup failed', e);
  }
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => { main().catch((e) => fatal('init', e)); });
} else {
  main().catch((e) => fatal('init', e));
}
</script>
