<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mermaid Block Renderer</title>
  <script type="text/javascript" src="synapse://mermaid.min.js"></script>
  <style>
    /*
      Mobile-first: Note Synapse ships Android + iOS, so this is laid out for a
      narrow viewport with large tap targets.
    */
    :root {
      --app-bg: #1e1e1e;
      --panel-bg: #2d2d2d;
      --panel-contrast: #3c3c3c;
      --accent: #64b5f6;
      --heading: #90caf9;
      --svg-bg: #282c34;   /* must match the rect injected into the SVG */
      --error-bg: #442222;
      --ok: #a5d6a7;
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--app-bg);
      color: #e0e0e0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap { padding: 12px; box-sizing: border-box; }
    h1 { font-size: 1.1rem; margin: 0 0 4px; color: var(--heading); }
    .muted { color: #bfcbdc; font-size: 0.85rem; margin-bottom: 12px; }
    .panel {
      background: var(--panel-bg);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      flex: 1 1 auto;
      min-height: 44px;
      padding: 10px 14px;
      background: var(--accent);
      color: #10243a;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 6px;
    }
    button.secondary {
      background: transparent;
      border: 1px solid #555;
      color: #e0e0e0;
      font-weight: 500;
    }
    button:disabled { opacity: 0.55; }
    #preview {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 6px;
      background: var(--svg-bg);
      border: 1px solid #555;
      padding: 6px;
      box-sizing: border-box;
    }
    pre {
      background: var(--panel-contrast);
      padding: 10px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 0.8rem;
      margin: 0;
      max-height: 30vh;
      overflow: auto;
    }
    .msg { padding: 10px; border-radius: 6px; font-size: 0.9rem; margin-bottom: 12px; }
    .msg.error { background: var(--error-bg); color: #ffd2d2; }
    .msg.ok { background: #22331f; color: var(--ok); }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Mermaid Block Renderer</h1>
    <div class="muted" id="subtitle">Loading…</div>

    <div id="message" class="msg hidden"></div>

    <div class="panel" id="previewPanel">
      <img id="preview" alt="Rendered Mermaid diagram" />
    </div>

    <div class="panel">
      <div class="controls">
        <button id="insertButton" disabled>Insert into note</button>
        <button id="rerenderButton" class="secondary">Re-render</button>
      </div>
    </div>

    <div class="panel">
      <div class="muted" style="margin:0 0 6px">Diagram source</div>
      <pre id="source"></pre>
    </div>
  </div>

  <script type="text/javascript">
  /*
   Purpose:
     Render the Mermaid diagram in the selected note block to an SVG and write
     the image back into that block, keeping the original code fence.

   How it writes back:
     The host hands this app a transient "block note" (isBlockScope) whose
     content is just the selected block. Calling Synapse.updateNotes with that
     id splices the result back over exactly that block in the parent note, and
     promotes the synapsetemp:/// SVG to a real attachment on the parent note.

     We use action 'replace' with `image + original fence` rather than
     'prepend', so re-rendering swaps the previous image instead of stacking a
     new one on every run.
  */
  (function () {
    const SVG_BG = '#282c34';

    const els = {
      subtitle: document.getElementById('subtitle'),
      message: document.getElementById('message'),
      preview: document.getElementById('preview'),
      previewPanel: document.getElementById('previewPanel'),
      insert: document.getElementById('insertButton'),
      rerender: document.getElementById('rerenderButton'),
      source: document.getElementById('source'),
    };

    let note = null;         // the (possibly block-scoped) note we operate on
    let diagramCode = '';    // extracted mermaid source
    let bodyWithoutImage = ''; // block text with any previously inserted image removed
    let lastUri = null;

    function showMessage(text, kind) {
      els.message.textContent = text;
      els.message.className = 'msg ' + (kind || 'error');
      els.message.classList.remove('hidden');
    }

    function clearMessage() {
      els.message.classList.add('hidden');
      els.message.textContent = '';
    }

    if (typeof mermaid !== 'undefined' && mermaid && typeof mermaid.initialize === 'function') {
      try {
        mermaid.initialize({
          startOnLoad: false,
          theme: 'dark',
          themeVariables: {
            background: SVG_BG,
            primaryColor: '#3f51b5',
            primaryTextColor: '#ffffff',
            primaryBorderColor: '#7986cb',
            lineColor: '#9ea7b3',
            secondaryColor: '#e0e0e0',
            tertiaryColor: '#ffffff',
            mainBkg: SVG_BG,
          },
        });
      } catch (e) {
        console.error('[MermaidBlock] initialize failed:', e);
      }
    } else {
      console.error('[MermaidBlock] mermaid library not found (synapse://mermaid.min.js).');
    }

    /**
     * Pulls the mermaid source out of a block. Handles a fenced ```mermaid
     * block, a bare fence, and raw diagram text with no fence at all.
     */
    function extractDiagram(text) {
      const fence = text.match(/```[ \t]*mermaid[ \t]*\r?\n([\s\S]*?)```/i);
      if (fence) return fence[1].trim();
      const anyFence = text.match(/```[ \t]*\r?\n([\s\S]*?)```/);
      if (anyFence) return anyFence[1].trim();
      return text.trim();
    }

    /**
     * Removes THIS app's own previously inserted renders from the start of the
     * block, so re-inserting swaps the image instead of stacking another.
     *
     * Deliberately matched on the `mermaid` alt text only. Stripping any
     * leading image would silently destroy the user's own content: a block
     * selection can be expanded upwards (expand-above in the block toolbar) to
     * include a preceding image, and the write below replaces the whole span.
     */
    function stripLeadingImages(text) {
      return text.replace(/^(?:\s*!\[mermaid\]\([^)]*\)\s*)+/, '');
    }

    /** Ensures the SVG paints its own background so it isn't white in a note. */
    function ensureSvgBackground(svgString, bgColor) {
      try {
        const doc = new DOMParser().parseFromString(svgString, 'image/svg+xml');
        const svgEl = doc.documentElement;
        if (!svgEl || svgEl.nodeName.toLowerCase() !== 'svg') return svgString;

        let rect = svgEl.querySelector('#__synapse_bg_rect__');
        if (!rect) {
          rect = doc.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('id', '__synapse_bg_rect__');
          rect.setAttribute('x', '0');
          rect.setAttribute('y', '0');
          rect.setAttribute('width', '100%');
          rect.setAttribute('height', '100%');
          rect.setAttribute('fill', bgColor);
          if (svgEl.firstChild) svgEl.insertBefore(rect, svgEl.firstChild);
          else svgEl.appendChild(rect);
        } else {
          rect.setAttribute('fill', bgColor);
        }
        if (!svgEl.getAttribute('preserveAspectRatio')) {
          svgEl.setAttribute('preserveAspectRatio', 'xMidYMid meet');
        }
        return new XMLSerializer().serializeToString(svgEl);
      } catch (e) {
        console.error('[MermaidBlock] background injection failed:', e);
        return svgString;
      }
    }

    async function render() {
      clearMessage();
      els.insert.disabled = true;
      els.rerender.disabled = true;
      lastUri = null;

      try {
        if (!diagramCode) {
          showMessage('No Mermaid diagram found in the selected block.');
          els.previewPanel.classList.add('hidden');
          return;
        }

        const renderId = 'mermaid-block-' + Date.now();
        let result;
        try {
          result = await mermaid.render(renderId, diagramCode);
        } catch (e) {
          showMessage('Mermaid could not render this diagram: ' + (e && e.message ? e.message : e));
          return;
        }

        const svg = typeof result === 'string' ? result : (result && result.svg);
        if (!svg || !svg.trim()) {
          showMessage('Mermaid produced an empty diagram.');
          return;
        }

        const withBg = ensureSvgBackground(svg, SVG_BG);
        const saved = await Synapse.saveTemp({ text: withBg }, 'image/svg+xml');
        if (!saved || !saved.success) {
          showMessage('Could not save the rendered diagram: ' + ((saved && saved.error) || 'unknown error'));
          return;
        }

        lastUri = saved.uri;
        els.preview.src = saved.uri;
        els.previewPanel.classList.remove('hidden');
        els.insert.disabled = false;
      } finally {
        els.rerender.disabled = false;
      }
    }

    async function insert() {
      if (!lastUri) return;
      clearMessage();
      els.insert.disabled = true;

      try {
        // image + the original fence, so the diagram source stays editable.
        const newText = '![mermaid](' + lastUri + ')\n\n' + bodyWithoutImage.trim();
        const response = await Synapse.updateNotes([
          {
            id: note.id,
            modification: { content: { action: 'replace', text: newText } },
          },
        ]);

        if (!response || !response.success) {
          showMessage('Could not update the note: ' + ((response && response.error) || 'unknown error'));
          els.insert.disabled = false;
          return;
        }
        if (!response.updatedCount) {
          // success:true only means the call ran; the host can still refuse the
          // individual write, and it tells us why in `errors`.
          const reason = (response.errors && response.errors.length)
            ? response.errors.join(' ')
            : 'The block may have changed since this app was opened - go back, reselect the block and try again.';
          showMessage('The note was not updated. ' + reason);
          els.insert.disabled = false;
          return;
        }

        // Keep local state in step with what the note now holds so a
        // subsequent re-render + insert replaces rather than stacks.
        bodyWithoutImage = stripLeadingImages(newText);
        showMessage('Diagram inserted above the block.', 'ok');
      } catch (e) {
        showMessage('Could not update the note: ' + (e && e.message ? e.message : e));
        els.insert.disabled = false;
      }
    }

    function start() {
      const notes = (window.Synapse && window.Synapse.Notes) || [];
      if (!notes.length) {
        els.subtitle.textContent = 'No note selected.';
        showMessage('Open this app on a selected block containing a Mermaid diagram.');
        els.previewPanel.classList.add('hidden');
        els.rerender.disabled = true;
        return;
      }

      note = notes[0];

      /*
       Block scope only, deliberately.

       Writing the image into a WHOLE note goes through the ordinary
       updateNotes path, which does NOT scan content for synapsetemp:/// URIs.
       The SVG would never be promoted to an attachment, so the image would
       render until the OS purges its cache directory and then break for good.
       Only the block-scoped path promotes it. Refusing here beats silently
       producing a note that rots.
      */
      if (!note.isBlockScope) {
        els.subtitle.textContent = 'Needs a selected block.';
        showMessage(
          'Run this app on a single Mermaid block, not on a whole note: ' +
          'long-press the edit button in the note, drag it onto the ```mermaid ' +
          'block, then choose this app from the block toolbar.'
        );
        els.previewPanel.classList.add('hidden');
        els.rerender.disabled = true;
        return;
      }

      const content = note.content || '';
      bodyWithoutImage = stripLeadingImages(content);
      diagramCode = extractDiagram(bodyWithoutImage);
      els.source.textContent = diagramCode || '(nothing found)';
      els.subtitle.textContent =
        'Rendering the selected block of "' + (note.title || 'note') + '".';

      els.insert.addEventListener('click', insert);
      els.rerender.addEventListener('click', render);
      render();
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', start);
    } else {
      start();
    }
  })();
  </script>
</body>
</html>
