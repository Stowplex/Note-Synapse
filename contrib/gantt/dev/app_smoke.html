<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gantt app smoke</title>
<style>
  body { font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 16px;
         background: #0e1013; color: #e8eaf0; }
  .row { padding: 3px 0; border-bottom: 1px solid #262b36; }
  .pass::before { content: 'PASS '; color: #34d399; }
  .fail::before { content: 'FAIL '; color: #f87171; }
  .fail { color: #f87171; }
  pre { color: #8b93a5; white-space: pre-wrap; margin: 4px 0 8px 40px; }
  #sum { padding: 12px 0; font-size: 15px; font-weight: 700; }
  /* Frames lay out at phone size off to the side; nothing here measures a painted pixel. */
  /* Stacked in view: Chrome throttles rendering (rAF, ResizeObserver) in frames outside the viewport. */
  iframe { position: absolute; top: 0; left: 0; opacity: .02; width: 390px; height: 780px; border: 0; }
</style>
</head>
<body>
<div id="sum">running…</div>
<div id="out"></div>
<script>
/*
 * M4 app flows in a real browser: the real shell (plugins/gantt.html) over
 * the mock host, one frame per launch (dev/shot.html, see dev/shell.js).
 * Positions come from the app's own geometry and the model, never from
 * getBoundingClientRect: under --virtual-time-budget a painted rect can lag.
 */
var results = [];
function ok(name, cond, detail) { results.push({ name: name, pass: !!cond, detail: cond ? '' : (detail || '') }); }
function eq(name, a, b) { ok(name, a === b, a === b ? '' : 'expected ' + JSON.stringify(b) + ', got ' + JSON.stringify(a)); }

// appState the home frame starts with: a Recent chart with a journal entry.
var HOME_APP = 'gt-smoke-home';
sessionStorage.setItem('gt-mock-appstate:' + HOME_APP, JSON.stringify({
  v: 1,
  recents: [{ id: 'chart-note', title: 'Q4 Launch', at: Date.now() - 3600e3 }],
  journal: { 'chart-note': { at: Date.now() - 7200e3, owner: 'an-earlier-launch', baseKey: 'x', base: { v: 1 }, chart: { v: 1, tasks: [] } } }
}));

var FRAMES = {
  basic: 'fixture=region-basic.md&launch=note',
  big: 'fixture=big.json&launch=note',
  home: 'fixture=region-basic.md&launch=home&space=work&persist=1&app=' + HOME_APP,
  chooser: 'fixture=region-basic.md&launch=chooser',
  embed: 'fixture=region-basic.md&launch=embed',
  resolve: 'fixture=region-basic.md&launch=resolve',
  resolvePlain: 'fixture=region-basic.md&launch=resolve-plain',
  future: 'fixture=future.md&launch=note',
  malformed: 'fixture=malformed.md&launch=note',
  dark: 'fixture=region-basic.md&launch=note&theme=dark',
  zh: 'fixture=region-basic.md&launch=note&locale=zh-CN',
  missing: 'fixture=region-basic.md&launch=chart&chart=nope',
  two: 'fixture=two-blocks.md&launch=note',
  multi: 'fixture=region-basic.md&launch=multi',
  // Review round 1: a launch that needs bridge reads, with latency, flushed mid-load.
  latency: 'fixture=region-basic.md&launch=chart&latency=runQuery:800,loadAppState:300',
  land: 'fixture=region-basic.md&launch=note',
  bigDark: 'fixture=big.json&launch=note&theme=dark&dpr=3',
  bigLand: 'fixture=big.json&launch=note&theme=dark&dpr=3',
  // M5: touch navigation, and rotation plus hide.
  nav: 'fixture=region-basic.md&launch=note&frame=timer',
  rot: 'fixture=region-basic.md&launch=note&frame=timer',
  // M6: editing, the save modes, the journal across "reloads" (hold=: a
  // fresh mock and store over the same sessionStorage, booted on release).
  edit: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-edit',
  deny: 'fixture=region-basic.md&launch=note&frame=timer&space=work&approvals=deny&app=gt-smoke-deny',
  manual: 'fixture=region-basic.md&launch=note&frame=timer&approvals=once,once&approvalMs=1000&app=gt-smoke-manual',
  hidden: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-hidden',
  rl1: 'fixture=region-basic.md&launch=note&frame=timer&persist=1&app=gt-smoke-rl&approvals=once,once&approvalMs=600',
  rl2: 'fixture=region-basic.md&launch=note&frame=timer&persist=1&app=gt-smoke-rl&hold=rl2',
  hl2: 'fixture=region-basic.md&launch=note&frame=timer&persist=1&app=gt-smoke-hl&entry=move:t3:3',
  em: 'fixture=region-basic.md&launch=embed&frame=timer&persist=1&app=gt-smoke-hl&hold=em',
  hl3: 'fixture=region-basic.md&launch=note&frame=timer&persist=1&app=gt-smoke-hl&hold=hl3',
  hl4: 'fixture=region-basic.md&launch=note&frame=timer&persist=1&app=gt-smoke-hl&hold=hl4',
  au1: 'fixture=region-basic.md&launch=note&frame=timer&persist=1&app=gt-smoke-au',
  au2: 'fixture=region-basic.md&launch=note&frame=timer&persist=1&app=gt-smoke-au&hold=au2',
  sideLand: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-side',
  mfail: 'fixture=malformed.md&launch=note&frame=timer&app=gt-smoke-mfail',
  cfail: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-cfail&failLoads=8',
  // Review round 1: save conflicts and a Restore conflict.
  conf: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-conf',
  rconf: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-rconf&entry=move:t3:3&noteMove=t3:5',
  // M7: membership, toggles, syncDates, a zh-CN new chart, the chooser in a Space.
  mem: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-mem',
  tog: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-tog',
  sync: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-sync',
  zhNew: 'fixture=region-basic.md&launch=home&locale=zh-CN&frame=timer&app=gt-smoke-zhnew',
  chooserSp: 'fixture=region-basic.md&launch=chooser&space=work&frame=timer&app=gt-smoke-chsp',
  // M8: styles x colour modes, progress source changes, prefs across a "reload", lite, states.
  sty: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-sty',
  src: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-src',
  prf: 'fixture=region-basic.md&launch=note&frame=timer&persist=1&app=gt-smoke-prf',
  prf2: 'fixture=region-basic.md&launch=note&frame=timer&persist=1&app=gt-smoke-prf&hold=prf2',
  lite: 'fixture=lite.json&launch=note&frame=timer&app=gt-smoke-lite',
  emp: 'fixture=empty.json&launch=note&frame=timer&app=gt-smoke-emp',
  uns: 'fixture=unscheduled.json&launch=note&frame=timer&app=gt-smoke-uns',
  load: 'fixture=region-basic.md&launch=chart&frame=timer&latency=runQuery:1500&app=gt-smoke-load&hold=load',
  // M9: live locale switching, the Task list view, roving focus, the aria
  // audit, the reconciliation banner and reduced motion.
  loc9: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-loc9',
  tl9: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-tl9',
  rv9: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-rv9',
  a119: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-a119',
  rc9: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-rc9',
  mo9: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-mo9',
  ch9: 'fixture=region-basic.md&launch=chooser&frame=timer&app=gt-smoke-ch9',
  cjk9: 'fixture=cjk.json&launch=note&locale=zh-CN&frame=timer&app=gt-smoke-cjk9',
  // M9 review round 1.
  r19: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-r19',
  r19b: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-r19b',
  r19l: 'fixture=cjk.json&launch=note&locale=zh-CN&frame=timer&app=gt-smoke-r19l',
  // Device feedback round 1: the top bar, own colours, the name column toggle across a "reload".
  df1: 'fixture=region-basic.md&launch=note&frame=timer&persist=1&app=gt-smoke-df',
  df2: 'fixture=region-basic.md&launch=note&frame=timer&persist=1&app=gt-smoke-df&hold=df2',
  dfc: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-dfc',
  dfzh: 'fixture=region-basic.md&launch=note&locale=zh-CN&frame=timer&app=gt-smoke-dfzh',
  // ... review round 1: narrow corner and remembered widths, landscape toggle target, CJK titles, missing notes.
  dfr: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-dfr',
  dfl: 'fixture=region-basic.md&launch=note&frame=timer&app=gt-smoke-dfl',
  dfcjk: 'fixture=cjk.json&launch=note&locale=zh-CN&frame=timer&app=gt-smoke-dfcjk',
  dfu: 'fixture=unscheduled.json&launch=note&frame=timer&app=gt-smoke-dfu'
};
// Landscape phone frames; the rest are 390 x 780.
var SIZES = { land: [844, 390], bigLand: [844, 390], sideLand: [844, 390], r19l: [844, 390], dfl: [844, 390] };
// Releases for the hold= frames, and a clean slate for their appState.
window.GT_RELEASE = {};
['gt-smoke-rl', 'gt-smoke-hl', 'gt-smoke-au', 'gt-smoke-prf', 'gt-smoke-df'].forEach(function (a) {
  sessionStorage.removeItem('gt-mock-appstate:' + a);
  sessionStorage.removeItem('gt-dev-notes:' + a);
});
// Written while the page parses: a frame navigation started from script
// deadlocks headless Chrome under --virtual-time-budget.
var html = '', left = 400;
Object.keys(FRAMES).forEach(function (k) {
  var sz = SIZES[k] ? ' style="width:' + SIZES[k][0] + 'px;height:' + SIZES[k][1] + 'px"' : '';
  html += '<iframe id="f-' + k + '"' + sz + ' src="shot.html?' + FRAMES[k] + '&today=2026-10-20"></iframe>';
  left += 402;
});
document.write(html);

// The latency frame is watched from the start: while its chart note is still
// loading (mode 'chart', no session yet), a frame is flushed.
var latencyFlushed = false;
(function watch() {
  var f = document.getElementById('f-latency'), W = f && f.contentWindow, a = W && W.GT && W.GT.app && W.GT.app.S;
  if (a && a.view && a.mode === 'chart' && !a.session) { a.view.flushNow(); latencyFlushed = true; }
  if (!latencyFlushed && !(a && a.booted)) setTimeout(watch, 10);
})();

function waitFor(test, ms, what) {
  return new Promise(function (res, rej) {
    var t0 = Date.now(), polls = 0, limit = Math.max(200, Math.ceil((ms || 5000) / 25));
    (function poll() {
      var v;
      try { v = test(); } catch (e) { v = null; }
      if (v) return res(v);
      if (++polls > limit && Date.now() - t0 > (ms || 5000)) return rej(new Error('timed out waiting for ' + (what || String(test).slice(0, 160))));
      setTimeout(poll, 25);
    })();
  });
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function booted(k) {
  var f = document.getElementById('f-' + k);
  return waitFor(function () {
    var W = f.contentWindow;
    return W && W.GT && W.GT.app && W.GT.app.S.booted ? W : null;
  }, 8000, 'frame ' + k + ' to boot').then(function (W) { return wait(60).then(function () { return W; }); });
}
function S(W) { return W.GT.app.S; }
function flush(W) { S(W).view.flushNow(); }
function liveBars(W) {
  return Array.prototype.filter.call(W.document.querySelectorAll('.g-bar'), function (b) { return b.style.display !== 'none'; });
}
function bar(W, id) { return W.document.querySelector('.g-bar[data-id="' + id + '"]:not([style*="display: none"])'); }
function tx(el) { var m = /translate3d\((-?[\d.]+)px,\s*(-?[\d.]+)px/.exec(el.style.transform); return m ? { x: +m[1], y: +m[2] } : null; }
// The canvases are sized to the view (floor(css * capped dpr)) and within the caps.
function capsOk(W, k) {
  var v = S(W).view, c = v.canvases(), vs = v.viewSize(), m = vs.metrics;
  var dpr = +(W.GTDev.opts.dpr) > 0 ? +W.GTDev.opts.dpr : (W.devicePixelRatio || 1), R = W.GT.render;
  var want = {
    hdr: [vs.bodyW, m.hdrH], grid: [vs.bodyW, vs.bodyH]
  };
  ['hdr', 'grid'].forEach(function (n) {
    var d = R.capDpr(want[n][0], want[n][1], dpr);
    var ew = Math.floor(want[n][0] * d), eh = Math.floor(want[n][1] * d), got = c[n];
    ok(k + ': ' + n + ' canvas is ' + ew + 'x' + eh + ' (got ' + got.w + 'x' + got.h + ')', got.w === ew && got.h === eh && ew > 0 && eh > 0);
    ok(k + ': ' + n + ' canvas within 8 Mpx and 4096 a side', got.w * got.h <= 8e6 && got.w <= 4096 && got.h <= 4096);
    var el = W.document.querySelector(n === 'hdr' ? '.g-hdr-cv' : '.g-grid-cv');
    eq(k + ': ' + n + ' canvas css width', el.style.width, want[n][0] + 'px');
  });
}
function pointer(W, el, type, x, y) {
  var e = new W.PointerEvent(type, { bubbles: true, cancelable: true, pointerId: 7, pointerType: 'mouse', button: 0, buttons: type === 'pointerup' ? 0 : 1, clientX: x || 0, clientY: y || 0 });
  el.dispatchEvent(e);
}
function click(W, el) { pointer(W, el, 'pointerdown', 10, 10); pointer(W, el, 'pointerup', 10, 10); }

/* ------------------------------------------------------------- flows */

var P;
function basic() {
  return booted('basic').then(function (W) {
    var s = S(W), G = W.GT;
    P = G.dates.parse;
    eq('basic: note_action on the §5.2 note opens the chart', s.mode, 'chart');
    eq('basic: title is the chart note title', W.document.getElementById('title').textContent, 'Q4 Launch');
    ok('basic: no banner', W.document.getElementById('banner').hidden);
    return s.session.resolved.then(function () { return wait(30); }).then(function () {
      // Virtualized: Beta cut (Nov 9) is outside the rendered window at the
      // week preset, so fit all first.
      flush(W);
      ok('basic: the milestone is out of the rendered window at first', !bar(W, 't4'));
      s.view.fitAll();
      flush(W);
      var bars = liveBars(W).map(function (b) { return b.getAttribute('data-id'); }).sort();
      eq('basic: four bars', bars.join(','), 't1,t2,t3,t4');
      var cam = s.view.camera();
      var DATES = { t1: ['2026-10-01', '2026-10-09'], t2: ['2026-10-05', '2026-10-14'], t3: ['2026-10-12', '2026-11-06'] };
      Object.keys(DATES).forEach(function (id) {
        var el = bar(W, id), a = P(DATES[id][0]), b = P(DATES[id][1]);
        var x = Math.round((a - cam.epoch) * cam.ppd), w = Math.round((b + 1 - cam.epoch) * cam.ppd) - x;
        eq('basic: ' + id + ' starts at its start date', tx(el).x, x);
        eq('basic: ' + id + ' spans its inclusive dates', el.style.width, w + 'px');
      });
      var ms = bar(W, 't4');
      ok('basic: the milestone is a diamond at Nov 9', /\bms\b/.test(ms.className) && tx(ms).x === Math.round((P('2026-11-09') - cam.epoch) * cam.ppd + cam.ppd / 2 - 8));
      eq('basic: t1 3/5 renders as a 60% fill', bar(W, 't1').querySelector('.g-fill').style.transform, 'scaleX(0.6)');
      eq('basic: t2 0/4 has no fill', bar(W, 't2').querySelector('.g-fill').style.transform, 'scaleX(0)');
      eq('basic: t3 6/10 renders as a 60% fill', bar(W, 't3').querySelector('.g-fill').style.transform, 'scaleX(0.6)');
      // M8 replaced M4's "segments renders as fill" fallback: segments render where the cells fit (§12.4).
      ok('basic: segments render (M8): cells = items where they fit, fill otherwise and for the milestone', liveBars(W).every(function (b) {
        var inf = S(W).view.info(b.getAttribute('data-id')), w = parseFloat(b.style.width), seg = b.querySelector('.g-seg');
        if (/\bms\b/.test(b.className)) return /\bpm-fill\b/.test(b.className);
        if (inf.seg && W.GT.layout.segFits(inf.seg.n, w)) return /\bpm-segments\b/.test(b.className) && seg.getAttribute('data-cells') === String(inf.sum.bits.length);
        return /\bpm-fill\b/.test(b.className);
      }));
      ok('basic: t1 is overdue on 2026-10-20 (rose)', /cls-late/.test(bar(W, 't1').className) && /c-rose/.test(bar(W, 't1').className));
      ok('basic: t3 is doing (blue)', /cls-doing/.test(bar(W, 't3').className) && /c-blue/.test(bar(W, 't3').className));
      eq('basic: chips show the counts', ['t1', 't2', 't3'].map(function (id) { return bar(W, id).querySelector('.g-lab .g-chip').textContent; }).join(' '), '3/5 0/4 6/10');
      ok('basic: bars carry an aria-label with dates and progress', /Customer interviews, Oct 1.*3 of 5 done, overdue/.test(bar(W, 't1').getAttribute('aria-label')), bar(W, 't1').getAttribute('aria-label'));
      var groups = Array.prototype.map.call(W.document.querySelectorAll('.g-grp .g-gt'), function (e) { return e.textContent; });
      eq('basic: group headers', groups.join(','), 'Discovery,Build');
      var names = Array.prototype.map.call(W.document.querySelectorAll('.g-name .g-nt'), function (e) { return e.textContent; });
      eq('basic: name rows', names.join(','), 'Customer interviews,Competitive teardown,Sync engine,Beta cut');
      capsOk(W, 'basic');
      eq('basic: the view never writes the note', s.store && W.GTDev.mock.count('updateNotes') + W.GTDev.mock.count('saveNotes'), 0);
      // Group collapse is view state: a tap on the header.
      click(W, W.document.querySelector('.g-grp[data-group="g1"]'));
      flush(W);
      ok('basic: collapsing Discovery hides its bars', !bar(W, 't1') && !bar(W, 't2') && !!bar(W, 't3'));
      click(W, W.document.querySelector('.g-grp[data-group="g1"]'));
      flush(W);
      ok('basic: expanding shows them again', !!bar(W, 't1') && !!bar(W, 't2'));
      // D/W/M.
      W.document.querySelector('#zoomSeg [data-zoom="month"]').click();
      flush(W);
      eq('basic: M sets 5 px per day', s.view.camera().ppd, 5);
      eq('basic: M is pressed', W.document.querySelector('#zoomSeg [data-zoom="month"]').getAttribute('aria-pressed'), 'true');
      W.document.querySelector('#zoomSeg [data-zoom="day"]').click();
      flush(W);
      eq('basic: D sets 44 px per day', s.view.camera().ppd, 44);
      // ctrl-wheel zooms at the cursor.
      var m = s.view.viewSize().metrics, fx = 120, before = s.view.camera();
      var dayBefore = (before.sx + fx) / before.ppd;
      W.document.getElementById('gantt').dispatchEvent(new W.WheelEvent('wheel', { deltaY: -50, ctrlKey: true, clientX: m.nameW + fx, clientY: 300, bubbles: true, cancelable: true }));
      flush(W);
      var after = s.view.camera();
      ok('basic: ctrl-wheel zooms in', after.ppd > before.ppd);
      ok('basic: ... keeping the day under the cursor', Math.abs((after.sx + fx) / after.ppd - dayBefore) < 1e-6);
      // Mouse drag pans.
      var g = W.document.getElementById('gantt'), c0 = s.view.camera();
      pointer(W, g.querySelector('.g-body'), 'pointerdown', 300, 400);
      pointer(W, g, 'pointermove', 250, 380);
      pointer(W, g, 'pointermove', 200, 360);
      pointer(W, g, 'pointerup', 200, 360);
      flush(W);
      var c1 = s.view.camera();
      eq('basic: a mouse drag pans horizontally', Math.round(c1.sx - c0.sx), 100);
      eq('basic: the meta line starts with the status word', W.document.querySelector('.g-name[data-id="t1"] .g-nm').textContent.split(' \u00B7 ')[0], 'Overdue');
      eq('basic: a dropped or plain row starts with its dates', W.document.querySelector('.g-name[data-id="t4"] .g-nm').textContent, 'Nov 9');
      // Header labels never run off either edge of the canvas.
      [44, 16, 5, 2].forEach(function (ppd) {
        s.view.setPpd(ppd);
        for (var step = 0; step < 6; step++) {
          s.view.panBy(37, 0);
          s.view.traceLabels(true);
          s.view.invalidate(1);
          flush(W);
          var labs = s.view.traceLabels(false) || [];
          var out = labs.filter(function (l) { return l.x < 2 || l.x + l.w > l.W - 2 + 1e-6; });
          if (out.length) ok('basic: header labels stay inside the canvas at ppd ' + ppd, false, JSON.stringify(out));
        }
      });
      ok('basic: header label bounds were checked', true);
      // Today.
      W.document.getElementById('btnToday').click();
      flush(W);
      var tdx = W.GT.scale.xOf(s.view.camera(), P('2026-10-20'));
      ok('basic: Today puts today at the left third', Math.abs(tdx - s.view.viewSize().bodyW / 3) < 1, String(tdx));
      // A day change re-derives classes (the 60 s timer): 20 days on, Sync engine (ends Nov 6) is overdue.
      ok('basic: Sync engine is doing before the day changes', /cls-doing/.test(bar(W, 't3').className));
      W.GTDev.shift(20 * 864e5);
      s.view.tick();
      flush(W);
      ok('basic: after the day changes Sync engine is overdue', /cls-late/.test(bar(W, 't3').className), bar(W, 't3').className);
      ok('basic: ... and its name row says so', /^Overdue/.test(W.document.querySelector('.g-name[data-id="t3"] .g-nm').textContent));
      W.GTDev.shift(-20 * 864e5);
      s.view.tick();
      flush(W);
      // A height-only resize (the keyboard) keeps the rows and the camera x.
      var rows0 = s.view.rows(), sx0 = s.view.camera().sx, vs0 = s.view.viewSize();
      s.view.setSize(vs0.w, vs0.h - 200);
      flush(W);
      ok('basic: a height-only resize does not rebuild the rows', s.view.rows() === rows0);
      eq('basic: ... nor move the camera across', s.view.camera().sx, sx0);
      eq('basic: ... and sizes the grid to the new height', s.view.viewSize().bodyH, vs0.bodyH - 200);
      capsOk(W, 'basic after a keyboard resize');
      s.view.setSize(vs0.w, vs0.h);
      flush(W);
      capsOk(W, 'basic');
    });
  });
}

function median(a) { var b = a.slice().sort(function (x, y) { return x - y; }); return b[Math.floor(b.length / 2)]; }
function big() {
  return booted('big').then(function (W) {
    var s = S(W);
    return s.session.resolved.then(function () { return wait(30); }).then(function () {
      flush(W);
      var dom = W.document.querySelectorAll('.g-bar').length;
      ok('big: at most 160 bar elements exist (' + dom + ')', dom <= 160 && dom > 0);
      ok('big: at most 160 bars are live', liveBars(W).length <= 160);
      ok('big: fewer bars than tasks are live (virtualized)', liveBars(W).length < 100, String(liveBars(W).length));
      capsOk(W, 'big');
      s.view.setPreset('week');
      flush(W);
      // Work counter: a scripted 120-frame horizontal pan (§17.2).

        else nd.get = function () { reads++; return d.get.call(this); };
        Object.defineProperty(obj, name, Object.assign({}, d, nd));
        undo.push(function () { Object.defineProperty(obj, name, d); });
      }
      ['getBoundingClientRect', 'getClientRects', 'clientWidth', 'clientHeight', 'scrollTop', 'scrollLeft'].forEach(function (n) { wrap(E, n); });
      ['offsetWidth', 'offsetHeight', 'offsetTop', 'offsetLeft'].forEach(function (n) { wrap(HE, n); });

      W.getComputedStyle = function () { reads++; return gcs.apply(W, arguments); };

      eq('big: no layout reads during the pan', reads + c.layoutReads, 0);
      var bound = Math.ceil(travel / (0.75 * s.view.viewSize().bodyW));
      ok('big: syncWindow <= 1 per 0.75 viewport travelled (' + c.syncWindow + ' <= ' + bound + ')', c.syncWindow <= bound && c.syncWindow >= 1);
      ok('big: still at most 160 bars after the pan', W.document.querySelectorAll('.g-bar').length <= 160);
      // Vertical pan.

      for (var j = 0; j < 60; j++) {
        var b0 = s.view.counters().domWrites;
        g.dispatchEvent(new W.WheelEvent('wheel', { deltaX: 0, deltaY: 20, clientX: m.nameW + 100, clientY: 300, bubbles: true, cancelable: true }));

// A touch pointer event. Synthetic pointers cannot be captured, so moves and
// ups go to #gantt, where the gesture layer listens.
function touch(W, el, type, id, x, y) {
  var e = new W.PointerEvent(type, { bubbles: true, cancelable: true, pointerId: id, pointerType: 'touch', isPrimary: id === 11,
    button: 0, buttons: type === 'pointerup' || type === 'pointercancel' ? 0 : 1, clientX: x, clientY: y });
  el.dispatchEvent(e);
  return e;
}
function dayAtX(W, x) { var c = S(W).view.camera(); return W.GT.scale.dayAt(c, x); }
function near(a, b, eps) { return Math.abs(a - b) <= (eps || 1e-6); }

function nav() {
  return booted('nav').then(function (W) {
    var s = S(W), v = s.view, d = W.document, g = d.getElementById('gantt'), body = g.querySelector('.g-body');
    var nameW = function () { return v.viewSize().metrics.nameW; };
    return s.session.resolved.then(function () { return wait(30); }).then(function () {
      flush(W);
      v.setPreset('week');
      v.showDay(W.GT.dates.parse('2026-10-10'), 0);
      v.setCamera({ sx: v.camera().sx, sy: 0, ppd: v.camera().ppd });
      flush(W);
      eq('nav: the gesture layer is attached', s.gestures.state(), 'IDLE');

      // Touch pan with the slop: 5 px does nothing, then the camera follows.
      var c0 = v.camera(), x0 = nameW() + 200;
      touch(W, body, 'pointerdown', 11, x0, 300);
      touch(W, g, 'pointermove', 11, x0 - 5, 300);
      eq('nav: 5 px of touch is inside the slop', v.camera().sx, c0.sx);
      touch(W, g, 'pointermove', 11, x0 - 60, 300);
      eq('nav: past the slop the camera follows the finger', v.camera().sx - c0.sx, 60);
      ok('nav: #gantt is live during the pan', g.classList.contains('live'));

        ok('nav: live is off after the pan', !g.classList.contains('live'));
        eq('nav: the pan wrote no note', W.GTDev.mock.count('updateNotes'), 0);

        // A swipe over a bar pans (§13.2).
        flush(W);
        var b = bar(W, 't1') || bar(W, 't2') || bar(W, 't3'), c1 = v.camera();
        ok('nav: a bar is in view', !!b);
        touch(W, b, 'pointerdown', 12, x0, 300);
        eq('nav: down on a bar is a press', s.gestures.state(), 'PRESS_BAR');
        touch(W, g, 'pointermove', 12, x0 - 30, 300);
        eq('nav: a swipe over a bar is a pan', s.gestures.state() + ':' + (v.camera().sx - c1.sx), 'PAN:30');
        return wait(250);
      }).then(function () {
        touch(W, g, 'pointerup', 12, x0 - 30, 300);

            ok('nav: live is off after the fling', !g.classList.contains('live'));

      }).then(function () {
        // Review round 1: a toolbar action stops a running fling.
        var x = x0;
        touch(W, body, 'pointerdown', 13, x, 300);
        var chain = Promise.resolve();
        for (var i = 0; i < 10; i++) chain = chain.then(function () { return wait(16).then(function () { x -= 20; touch(W, g, 'pointermove', 13, x, 300); }); });
        return chain.then(function () {
          touch(W, g, 'pointerup', 13, x, 300);
          eq('nav: flinging before Today', s.gestures.state(), 'FLING');
          d.getElementById('btnToday').click();

            flush(W);
            ok('nav: ... and today stays at the left third', near(W.GT.scale.xOf(v.camera(), v.today()), v.viewSize().bodyW / 3, 1e-6));
            // A fling then + : the zoom animation is not cancelled by the fling.
            v.setPreset('week');
            var z0 = v.camera().ppd;
            x = x0;
            touch(W, body, 'pointerdown', 14, x, 300);
            var ch2 = Promise.resolve();
            for (var j = 0; j < 10; j++) ch2 = ch2.then(function () { return wait(16).then(function () { x -= 20; touch(W, g, 'pointermove', 14, x, 300); }); });
            return ch2.then(function () {

              touch(W, g, 'pointermove', 15, x0 - 30, 300);

// A touch pan over big.json: the same work budget as the wheel pan (§17.2).
function bigTouch() {
  return booted('big').then(function (W) {
    var s = S(W), v = s.view, g = W.document.getElementById('gantt'), body = g.querySelector('.g-body');
    v.setPreset('week');
    v.showDay(W.GT.dates.parse('2026-10-01'), 0);
    flush(W);
    var reads = 0, E = W.Element.prototype, HE = W.HTMLElement.prototype, undo = [];
    function wrap(obj, name) {
      var dd = Object.getOwnPropertyDescriptor(obj, name);
      if (!dd) return;
      var nd = {};
      if (typeof dd.value === 'function') nd.value = function () { reads++; return dd.value.apply(this, arguments); };
      else nd.get = function () { reads++; return dd.get.call(this); };
      Object.defineProperty(obj, name, Object.assign({}, dd, nd));
      undo.push(function () { Object.defineProperty(obj, name, dd); });
    }
    ['getBoundingClientRect', 'getClientRects', 'clientWidth', 'clientHeight', 'scrollTop', 'scrollLeft'].forEach(function (n) { wrap(E, n); });
    ['offsetWidth', 'offsetHeight', 'offsetTop', 'offsetLeft'].forEach(function (n) { wrap(HE, n); });
    var gcs = W.getComputedStyle, efp = W.document.elementFromPoint, efpN = 0;
    W.getComputedStyle = function () { reads++; return gcs.apply(W, arguments); };
    W.document.elementFromPoint = function () { efpN++; return efp.apply(W.document, arguments); };
    var timers = 0, st = W.setTimeout;
    W.setTimeout = function () { timers++; return st.apply(W, arguments); };
    v.resetCounters();
    var x = v.viewSize().metrics.nameW + 300, sx0 = v.camera().sx, writes = [];
    touch(W, body, 'pointerdown', 61, x, 300);
    for (var i = 0; i < 120; i++) {
      var before = v.counters().domWrites;
      x -= 12;
      touch(W, g, 'pointermove', 61, x, 300);
      flush(W);
      writes.push(v.counters().domWrites - before);
    }
    // Rest, then lift: no fling, one settle.
    return wait(200).then(function () {
      touch(W, g, 'pointerup', 61, x, 300);
      W.setTimeout = st;
      W.getComputedStyle = gcs;
      W.document.elementFromPoint = efp;
      undo.forEach(function (f) { f(); });
      var travel = v.camera().sx - sx0, c = v.counters();
      ok('bigTouch: the touch pan travelled (' + travel + ' px)', travel > 1000);
      ok('bigTouch: median DOM writes per touch-pan frame <= 3 (' + median(writes) + ')', median(writes) <= 3);
      eq('bigTouch: no layout reads during the touch pan', reads + c.layoutReads, 0);
      eq('bigTouch: no elementFromPoint during the touch pan', efpN, 0);
      var bound = Math.ceil(travel / (0.75 * v.viewSize().bodyW));
      ok('bigTouch: syncWindow <= 1 per 0.75 viewport travelled (' + c.syncWindow + ' <= ' + bound + ')', c.syncWindow <= bound);
      ok('bigTouch: the touch pan starts at most 2 timers (' + timers + ')', timers <= 2);
    });
  });
}

// Client coordinates of a bar's centre (#gantt's top from the page: tests may read layout).
function gTop(W) { return W.document.getElementById('gantt').getBoundingClientRect().top; }
function barAt(W, id) { var r = S(W).view.barRect(id); return r ? { x: r.x + Math.min(20, r.w / 2), y: gTop(W) + r.y + r.h / 2, r: r } : null; }
function idle(W) { return waitFor(function () { return S(W).gestures.state() === 'IDLE'; }, 4000, 'the gesture to end'); }
var PID = 200;
// A touch drag of `el` by (dx, dy) in `steps` moves; long: a 450 ms long press first.
function dragBy(W, el, x, y, dx, dy, o) {
  o = o || {};
  var g = W.document.getElementById('gantt'), id = ++PID, steps = o.steps || 6;
  touch(W, el, 'pointerdown', id, x, y);
  return wait(o.long ? 450 : 20).then(function () {
    var chain = Promise.resolve();
    for (var i = 1; i <= steps; i++) (function (k) {
      chain = chain.then(function () { touch(W, g, 'pointermove', id, x + dx * k / steps, y + dy * k / steps); return wait(18); });
    })(i);
    return chain;
  }).then(function () {
    if (o.before) return o.before(id);
  }).then(function () {
    if (o.noUp) return id;
    touch(W, g, 'pointerup', id, x + dx, y + dy);
    return id;
  });
}
function tapEl(W, el, x, y) { var id = ++PID; touch(W, el, 'pointerdown', id, x, y); touch(W, W.document.getElementById('gantt'), 'pointerup', id, x, y); }
function task(W, id) { return W.GT.model.task(S(W).session.live, id); }
function ymd(W, d) { return d === null ? 'null' : W.GT.dates.format(d); }
function saved(W) { return waitFor(function () { var s = S(W).session; return s && !s.busy; }, 8000, 'the save to end'); }
function ups(W) { return W.GTDev.mock.count('updateNotes'); }
function ready(k) {
  return booted(k).then(function (W) {
    var s = S(W).session;
    return Promise.all([s.resolved, s.checked]).then(function () { return wait(40); }).then(function () {
      var v = S(W).view;
      // 10 px a day (Week tier, day snapping): every bar and handle of the
      // example sits inside the view, clear of the autoscroll bands.
      v.setPpd(10);
      v.showDay(W.GT.dates.parse('2026-09-28'), 0);
      v.setCamera({ sx: v.camera().sx, sy: 0, ppd: v.camera().ppd });
      flush(W);
      return W;
    });
  });
}
function vis(el) { return !!el && !el.hidden && el.style.display !== 'none'; }

// An edit elsewhere: the note's JSON line for task `id` gets other dates.
function editElsewhere(W, id, start, end) {
  var c = W.GTDev.mock.content('chart-note');
  var re = new RegExp('("id":"' + id + '"[^\\n]*?"start":")[0-9-]+(","end":")[0-9-]+');
  var next = c.replace(re, '$1' + start + '$2' + end);
  if (next === c) throw new Error('editElsewhere: no match for ' + id);
  W.GTDev.mock.setNote('chart-note', next);
}
function noteDates(W, id) {
  var m = new RegExp('"id":"' + id + '"[^\\n]*?"start":"([0-9-]+)","end":"([0-9-]+)"').exec(W.GTDev.mock.content('chart-note'));
  return m ? m[1] + ' ' + m[2] : null;
}
function conflicts() {
  var W, s, d;
  function clash(theirs) {
    // Their change lands just before my save writes (M7 review round 1: an
    // edit made earlier could be picked up by a resume's silent reload,
    // §7.6, when a focus or visibility event fired under load, and then
    // nothing clashed). My move of the same task then clashes on save.
    W.GTDev.mock.outsideEdit(function () { editElsewhere(W, 't2', theirs[0], theirs[1]); }, 'beforeWrite');
    // Keep the bar clear of the autoscroll band, so the move is exactly 2 days.
    S(W).view.showDay(task(W, 't2').start - 3, 0);
    return moveBar(W, 't2', 2).then(function () { return saved(W); }).then(function () { return wait(20); });
  }
  return ready('conf').then(function (w) {
    W = w; s = S(W); d = W.document;
    return clash(['2026-10-20', '2026-10-29']);
  }).then(function () {
    eq('conflict: a clashing save opens the conflict sheet (FULL)', s.sheet.kind() + ':' + s.sheet.detent(), 'conflict:full');
    var rows = Array.prototype.map.call(d.querySelectorAll('#sheet .sh-ff-choice .sh-flab'), function (e) { return e.textContent; });
    eq('conflict: it lists each clashing field', rows.join(' | '), 'Competitive teardown · Start | Competitive teardown · End');
    ok('conflict: each row says mine and theirs', /^Mine: Oct 7 · Theirs: Oct 20$/.test(d.querySelector('#sheet .sh-detail').textContent), d.querySelector('#sheet .sh-detail').textContent);
    var n0 = ups(W);
    d.querySelector('#sheet [data-action="mine"]').click();
    return saved(W).then(function () {
      eq('conflict: Keep mine for these saves once', ups(W) - n0, 1);
      eq('conflict: ... and the note holds my dates', noteDates(W, 't2'), '2026-10-07 2026-10-16');

      return clash(['2026-10-21', '2026-10-30']);
    });
  }).then(function () {

      eq('conflict: ... and the chart shows them', ymd(W, task(W, 't2').start) + ' ' + ymd(W, task(W, 't2').end), '2026-10-21 2026-10-30');

    return clash(['2026-11-02', '2026-11-05']);
  }).then(function () {

function barsOf(W) { return liveBars(W).filter(function (b) { return !/\bms\b/.test(b.className) && !/\bghost\b/.test(b.className); }); }
// M8 review: the dots are background layers of one element (one radial-gradient each).
function visDots(b) { var e = b.querySelector('.g-dots'); return (e.style.backgroundImage.match(/radial-gradient/g) || []).length; }
// Chrome serialises each two-position stop (#000 0 x) as two stops, so a cell is two opaque stops.
function cellsOfMask(b) { var m = b.querySelector('.g-seg').style; return ((m.maskImage || m.webkitMaskImage || '').match(/rgb\(0, 0, 0\)|#000/g) || []).length / 2; }
function sheetBtn(W, field, value) { return W.document.querySelector('#sheet [data-field="' + field + '"] button[data-value="' + value + '"]'); }

// Each completion style x each colour mode renders (§12.4, §6.2), in both themes.
function styles() {
  var W, s, A, v, LY;
  return ready('sty').then(function (w) {
    W = w; s = S(W); A = W.GT.app; v = s.view; LY = W.GT.layout;
    A.dismissNotice();
    v.setPpd(22);
    v.showDay(W.GT.dates.parse('2026-09-29'), 0);
    flush(W);
    var chain = Promise.resolve();
    ['light', 'dark'].forEach(function (theme) {
      ['fill', 'segments', 'dots'].forEach(function (style) {
        ['status', 'group', 'task'].forEach(function (by) {
          chain = chain.then(function () {
            W.GT.theme.setOverride(theme);
            A.setSetting('progressStyle', style);
            A.setSetting('colorBy', by);
            flush(W);
            var k = 'sty ' + theme + ' ' + style + ' ' + by, c = s.session.live, bars = barsOf(W), segs = 0, bad = [];
            ok(k + ': bars render', bars.length === 3);
            bars.forEach(function (b) {
              var id = b.getAttribute('data-id'), inf = v.info(id), t = W.GT.model.task(c, id), w = parseFloat(b.style.width);
              var gi = -1;
              c.groups.forEach(function (g, i) { if (g.id === t.group) gi = i; });
              var hue = LY.colorFor(t, inf.sum, gi, c.settings, gi >= 0 ? c.groups[gi] : null);
              if (!new RegExp('\\bc-' + hue + '\\b').test(b.className)) bad.push(id + ' hue ' + hue + ' in ' + b.className);
              var fill = W.getComputedStyle(b).getPropertyValue('--h-fill').trim();
              if (fill !== W.GT.theme.PALETTE[hue][theme].fill) bad.push(id + ' --h-fill ' + fill + ' != palette ' + hue);
              if (style === 'fill' && !/\bpm-fill\b/.test(b.className)) bad.push(id + ' not pm-fill');
              if (style === 'segments') {
                if (inf.seg && LY.segFits(inf.seg.n, w)) {
                  segs++;
                  if (!/\bpm-segments\b/.test(b.className)) bad.push(id + ' not pm-segments');
                  if (b.querySelector('.g-seg').getAttribute('data-cells') !== String(inf.sum.bits.length)) bad.push(id + ' cells');
                  if (cellsOfMask(b) !== inf.sum.bits.length) bad.push(id + ' mask cells ' + cellsOfMask(b) + ' != ' + inf.sum.bits.length);
                  if (W.getComputedStyle(b.querySelector('.g-seg')).display === 'none') bad.push(id + ' seg hidden');
                } else if (!/\bpm-fill\b/.test(b.className)) bad.push(id + ' fallback not fill');
              }
              if (style === 'dots') {
                if (!/\bpm-dots\b/.test(b.className)) bad.push(id + ' not pm-dots');
                if (visDots(b) !== Math.min(12, inf.sum.total)) bad.push(id + ' dots ' + visDots(b) + ' != ' + inf.sum.total);
              }
            });
            if (style === 'segments') ok(k + ': at least two bars show segments', segs >= 2, String(segs));
            eq(k + ': classes, palette colours and cells', bad.join('; '), '');
          });
        });
      });
    });
    return chain;
  }).then(function () {
    // Segments fall back to fill when the cells get under 6 px (zoomed out).
    A.setSetting('progressStyle', 'segments');
    v.setPpd(2);
    flush(W);
    ok('sty: zoomed out, every bar falls back to fill', barsOf(W).every(function (b) { return /\bpm-fill\b/.test(b.className); }));
    // A late task's open cells are --warn-soft with a --warn top stripe; per-item colours follow the bits.
    v.setPpd(22);
    v.showDay(W.GT.dates.parse('2026-09-29'), 0);
    flush(W);
    var t1 = bar(W, 't1'), sg = t1.querySelector('.g-seg');
    var cs = W.getComputedStyle(sg);
    ok('sty: the late task\'s open cells: --warn-soft and a 2 px --warn stripe, no hatch', /\blate\b/.test(sg.className) && /var\(--warn\)/.test(sg.style.backgroundImage) &&
      !/repeating/.test(sg.style.backgroundImage) && /100% 2px/.test(cs.backgroundSize) && cs.backgroundColor === { light: 'rgba(180, 83, 9, 0.35)', dark: 'rgba(251, 191, 36, 0.35)' }[W.GT.theme.resolved()],
      cs.backgroundSize + ' ' + cs.backgroundColor);
    eq('sty: the done cells follow the bits (3 of 5 in fill)', (sg.style.backgroundImage.match(/var\(--h-fill\)/g) || []).length, 3);
    // Dots: late open dots in warn.
    A.setSetting('progressStyle', 'dots');
    flush(W);
    eq('sty: dots of the late task: 3 done, 2 late', bar(W, 't1').querySelector('.g-dots').getAttribute('data-dots'), 'dddll');
    ok('sty: ... one element, no span per dot', bar(W, 't1').querySelectorAll('.g-dots *').length === 0 && visDots(bar(W, 't1')) === 5);
    // Compact bars (22 px) put the dots under the bar.
    A.setPref('density', 'compact');
    flush(W);
    ok('sty: compact bars put the dots under the bar', /\bdots-under\b/.test(bar(W, 't3').className));
    A.setPref('density', 'comfortable');
    W.GT.theme.setOverride('light');
    flush(W);
  });
}

// Every visible control has an accessible name, in every view (§15.2).
function nameOf(W, el) {
  var l = el.getAttribute('aria-label');
  if (l && l.trim()) return l.trim();
  var lb = el.getAttribute('aria-labelledby');
  if (lb) {
    var t = lb.split(/\s+/).map(function (id) { var x = W.document.getElementById(id); return x ? x.textContent : ''; }).join(' ').trim();
    if (t) return t;
  }
  if (el.labels && el.labels.length) { var t2 = Array.prototype.map.call(el.labels, function (x) { return x.textContent; }).join(' ').trim(); if (t2) return t2; }
  if (!/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) { var tc = (el.textContent || '').trim(); if (tc) return tc; }
  return '';
}

function report() {
  var out = document.getElementById('out'), fails = 0;
  results.forEach(function (r) {
    if (!r.pass) fails++;
    var d = document.createElement('div');
    d.className = 'row ' + (r.pass ? 'pass' : 'fail');
    d.textContent = r.name;
    out.appendChild(d);
    if (!r.pass && r.detail) { var p = document.createElement('pre'); p.textContent = r.detail; out.appendChild(p); }
  });
  var sum = (results.length - fails) + '/' + results.length + ' assertions passed';
  document.getElementById('sum').textContent = sum;
  document.title = (fails ? 'APP SMOKE FAIL ' : 'APP SMOKE OK ') + sum;
  // Frames are removed so the dump carries only the report.
  Array.prototype.forEach.call(document.querySelectorAll('iframe'), function (f) { f.parentNode.removeChild(f); });
}
