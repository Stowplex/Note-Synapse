name: "Gantt"
uuid: aac1665f-3f18-425c-a2f5-6e6001d75326
app_type: normal
description: "Gantt charts made of your task notes. A chart is an ordinary note: one fenced synapse-gantt block lists the task notes by link, with their dates, groups and colours, above a readable task list you can tap. Bars are coloured by status, and their fill shows how many sub-items are done, counted from subnotes and linked child tasks or from the checkboxes under one heading. Works in light and dark, on phones and tablets, in English and Simplified Chinese."
i18n:
  zh-CN:
    name: "甘特图"
    description: "用任务笔记组成的甘特图。图表本身是一条普通笔记：一个 synapse-gantt 代码块按链接列出任务笔记及其日期、分组和颜色，上方附有可点击的任务列表。任务条按状态着色，填充显示子项完成度，可来自子笔记和关联的子任务，或某个标题下的复选框。支持浅色和深色主题、手机和平板、英文和简体中文。"
