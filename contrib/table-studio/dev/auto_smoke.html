<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table Studio auto smoke</title>
<style>#results { font-family: monospace; white-space: pre-wrap; }</style>
</head>
<body>
<div id="results">RUNNING</div>
<iframe id="frame" style="width:420px;height:800px"></iframe>
<script>
  var out = [];
  function log(name, pass, detail) {
    out.push((pass ? 'PASS ' : 'FAIL ') + name + (detail ? ' :: ' + detail : ''));
    document.getElementById('results').textContent = out.join('\n');
  }
  function sleep(ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  }
  async function waitFor(fn, timeoutMs, label) {
    var start = Date.now();
    for (;;) {
      var v;
      try { v = fn(); } catch (e) { v = null; }
      if (v) return v;
      if (Date.now() - start > timeoutMs) {
        throw new Error('timeout waiting for ' + label);
      }
      await sleep(120);
    }
  }
  function q(doc, sel) { return doc.querySelector(sel); }
  function qa(doc, sel) { return Array.prototype.slice.call(doc.querySelectorAll(sel)); }
  function tap(el2) {
    el2.dispatchEvent(new MouseEvent('click', { bubbles: true }));
  }

  Promise.all([
    fetch('../plugins/table_studio.html').then(function (r) { return r.text(); }),
    fetch('synapse_stub.js').then(function (r) { return r.text(); }),
  ]).then(async function (parts) {
    var html = parts[0]
      .replace('<script src="src/table_core.js">', '<script src="../plugins/src/table_core.js">')
      .replace('<script src="src/univer_bridge.js">', '<script src="../plugins/src/univer_bridge.js">')
      .replace('<script src="vendor/fflate-0.8.2.min.js">', '<script src="../plugins/vendor/fflate-0.8.2.min.js">')
      .replace('<script src="vendor/xlsx-0.20.3.full.min.js">', '<script src="../plugins/vendor/xlsx-0.20.3.full.min.js">');
    var inject = '<script>' + parts[1] + '<' + '/script>';
    html = html.replace('<div id="app">', inject + '<div id="app">');
    var frame = document.getElementById('frame');
    frame.srcdoc = html.replace('<head>', '<head><base href="' + new URL('.', location.href) + '">');
    await new Promise(function (r) { frame.onload = r; });
    await sleep(300);

    var win = frame.contentWindow;
    var doc = frame.contentDocument;

    // --- home renders sources
    var cards = qa(doc, '.card');
    log('home cards', cards.length === 4, 'found ' + cards.length);

    async function openAndWaitForSheet(card, label) {
      tap(card);
      // First open may show the engine download screen; the editor is up
      // once Univer has painted a canvas into the host.
      await waitFor(function () {
        return q(doc, '#univer-host canvas');
      }, 120000, label + ' univer canvas');
      await waitFor(function () {
        var d = win.__TS_DEBUG;
        return d && d.univerAPI && d.univerAPI.getActiveWorkbook();
      }, 30000, label + ' workbook');
      await sleep(800); // let load-time mutations & recalc settle
      return win.__TS_DEBUG;
    }

    function activeSheet(dbg) {
      return dbg.univerAPI.getActiveWorkbook().getActiveSheet();
    }
    async function saveAndWaitToast(text) {
      q(doc, '#toast').textContent = ''; // clear any stale toast first
      tap(q(doc, '#save-btn'));
      await waitFor(function () {
        return q(doc, '#toast').textContent === (text || 'Saved') &&
          q(doc, '#toast').classList.contains('show');
      }, 30000, 'toast ' + (text || 'Saved'));
    }

    // ============================================================
    // Markdown table
    // ============================================================
    var dbg = await openAndWaitForSheet(cards[0], 'block');
    var snap0 = dbg.univerAPI.getActiveWorkbook().save();
    var s0 = snap0.sheets[Object.keys(snap0.sheets)[0]];
    log('block header loaded', s0.cellData[0][0].v === 'Item', JSON.stringify(s0.cellData[0][0]));
    log('block escape decoded', s0.cellData[1][2].v === 'oat | soy', JSON.stringify(s0.cellData[1][2]));
    log('block right-align style', (function () {
      var st = s0.cellData[0][1] && s0.cellData[0][1].s;
      var resolved = typeof st === 'string' ? snap0.styles[st] : st;
      return resolved && resolved.ht === 3;
    })(), '');

    activeSheet(dbg).getRange(1, 0).setValue('Whole milk');
    await sleep(400);
    await saveAndWaitToast('Saved');
    var content = (await win.Synapse.runQuery('SELECT content')).data[0].content;
    log('save rewrote cell', content.indexOf('Whole milk') >= 0, '');
    log('save kept escape', content.indexOf('oat \\| soy') >= 0, '');
    log('save kept fence', content.indexOf('| not | a table |') >= 0, '');
    log('save kept second table', content.indexOf('| Co-op |') >= 0, '');
    log('save kept alignment row', content.indexOf('--:') >= 0, '');
    log('no dup table', content.split('| Eggs').length === 2, '');

    // --- back home (no discard prompt after a clean save)
    tap(qa(doc, '.topbar .icon-btn')[0]);
    await sleep(300);
    log('back home clean', qa(doc, '.card').length === 4 && !q(doc, '.backdrop'), '');

    // ============================================================
    // CSV attachment
    // ============================================================
    var csvCard = qa(doc, '.card').filter(function (c) {
      var n = c.querySelector('.name');
      return n && n.textContent === 'list.csv';
    })[0];
    dbg = await openAndWaitForSheet(csvCard, 'csv');
    var snapC = dbg.univerAPI.getActiveWorkbook().save();
    var sC = snapC.sheets[Object.keys(snapC.sheets)[0]];
    log('csv quoted cell', sC.cellData[2][0].v === 'Pears, ripe', JSON.stringify(sC.cellData[2][0]));
    log('csv number typed', sC.cellData[1][1].v === 4 && sC.cellData[1][1].t === 2, JSON.stringify(sC.cellData[1][1]));
    log('csv unstable decimal stays text', sC.cellData[2][2].v === '3.10', JSON.stringify(sC.cellData[2][2]));

    activeSheet(dbg).getRange(1, 0).setValue('Green apples, tart');
    await sleep(400);
    await saveAndWaitToast('Saved');
    var atts = (await win.Synapse.exportNotes(['note-1'])).notes[0].attachments;
    var last = atts[atts.length - 1];
    var read = await win.Synapse.readAttachment(last.path);
    var text = atob(read.data);
    log('csv content saved', text.indexOf('"Green apples, tart"') >= 0, JSON.stringify(text));
    log('csv fidelity', text.indexOf('"Pears, ripe"') >= 0 && text.indexOf('3.10') >= 0 && text.slice(-1) === '\n', JSON.stringify(text));

    // Second save must not accrete uuid suffixes and must replace the copy.
    activeSheet(dbg).getRange(2, 0).setValue('Ripe pears');
    await sleep(400);
    await saveAndWaitToast('Saved');
    var atts1b = (await win.Synapse.exportNotes(['note-1'])).notes[0].attachments;
    var csvs = atts1b.filter(function (a) { return /\.csv$/.test(a.fileName); });
    log('csv no duplicate copies', csvs.length === 1, JSON.stringify(csvs.map(function (a) { return a.fileName; })));
    log('csv name stable', /^list_[0-9a-f-]{36}\.csv$/.test(csvs[0].fileName), csvs[0].fileName);

    // Formula in a CSV: saving flattens to the computed value after confirm.
    activeSheet(dbg).getRange(3, 1).setValue('=2*3');
    await sleep(600);
    q(doc, '#toast').textContent = ''; // clear any stale toast first
    tap(q(doc, '#save-btn'));
    var okBtn = await waitFor(function () {
      return q(doc, '.dialog .dlg-btn.primary');
    }, 15000, 'flatten dialog');
    tap(okBtn);
    await waitFor(function () {
      return q(doc, '#toast').textContent === 'Saved';
    }, 30000, 'csv formula save');
    var atts1c = (await win.Synapse.exportNotes(['note-1'])).notes[0].attachments;
    var csv2 = atts1c.filter(function (a) { return /\.csv$/.test(a.fileName); })[0];
    var text2 = atob((await win.Synapse.readAttachment(csv2.path)).data);
    log('csv formula flattened', text2.indexOf('6') >= 0 && text2.indexOf('=2*3') < 0, JSON.stringify(text2));

    // ============================================================
    // XLSX attachment (multi-sheet, live formula, patch-preserving save)
    // ============================================================
    tap(qa(doc, '.topbar .icon-btn')[0]);
    await sleep(300);
    var xlsxCard = qa(doc, '.card').filter(function (c) {
      var n = c.querySelector('.name');
      return n && n.textContent === 'book.xlsx';
    })[0];
    dbg = await openAndWaitForSheet(xlsxCard, 'xlsx');
    var wbX = dbg.univerAPI.getActiveWorkbook();
    var snapX = wbX.save();
    log('xlsx two sheets', (snapX.sheetOrder || []).length === 2, JSON.stringify(snapX.sheetOrder));
    var salesSnap = snapX.sheets[snapX.sheetOrder[0]];
    log('xlsx formula live', salesSnap.cellData[1][1].f === '=21*2' && salesSnap.cellData[1][1].v === 42,
      JSON.stringify(salesSnap.cellData[1][1]));

    activeSheet(dbg).getRange(1, 0).setValue('Widget X');
    await sleep(400);
    await saveAndWaitToast('Saved');
    var atts2 = (await win.Synapse.exportNotes(['note-1'])).notes[0].attachments;
    var savedX = atts2.filter(function (a) { return /^book.*\.xlsx$/.test(a.fileName); });
    var readX = await win.Synapse.readAttachment(savedX[savedX.length - 1].path);
    var wb2 = win.XLSX.read(readX.data, { type: 'base64' });
    var sales = wb2.Sheets.Sales;
    log('xlsx edited cell saved', sales.A2 && sales.A2.v === 'Widget X', JSON.stringify(sales.A2 && sales.A2.v));
    log('xlsx untouched formula preserved', sales.B2 && sales.B2.f === '21*2', JSON.stringify(sales.B2 && sales.B2.f));
    log('xlsx number kept numeric', sales.B2 && sales.B2.t === 'n', JSON.stringify(sales.B2 && sales.B2.t));
    var info = wb2.Sheets.Info;
    log('xlsx untouched sheet kept', info && info.A2 && info.A2.v === 'keep me', '');

    // Structural edit: insert a row, save, expect a full rewrite that keeps
    // formulas at their shifted positions.
    var fsheet = activeSheet(dbg);
    var inserted = false;
    try {
      if (typeof fsheet.insertRowBefore === 'function') { fsheet.insertRowBefore(1); inserted = true; }
      else if (typeof fsheet.insertRows === 'function') { fsheet.insertRows(1, 1); inserted = true; }
    } catch (e) { /* facade shape changed */ }
    log('xlsx structural insert supported', inserted, '');
    if (inserted) {
      await sleep(600);
      await saveAndWaitToast('Saved');
      var atts3 = (await win.Synapse.exportNotes(['note-1'])).notes[0].attachments;
      var savedX2 = atts3.filter(function (a) { return /^book.*\.xlsx$/.test(a.fileName); });
      var wb3 = win.XLSX.read((await win.Synapse.readAttachment(savedX2[savedX2.length - 1].path)).data, { type: 'base64' });
      var sales3 = wb3.Sheets.Sales;
      log('xlsx row shifted', sales3.A3 && sales3.A3.v === 'Widget X', JSON.stringify(sales3.A3 && sales3.A3.v));
      log('xlsx formula survived shift', sales3.B3 && /21\*2/.test(sales3.B3.f || ''), JSON.stringify(sales3.B3 && sales3.B3.f));
    }

    // ============================================================
    // New table flow
    // ============================================================
    tap(qa(doc, '.topbar .icon-btn')[0]);
    await sleep(300);
    tap(qa(doc, '.ghost-btn')[0]);
    dbg = await openAndWaitForSheet({ dispatchEvent: function () {} }, 'new table');
    await saveAndWaitToast('Saved');
    var content2 = (await win.Synapse.runQuery('SELECT content')).data[0].content;
    log('new table appended', content2.indexOf('| Column 1 | Column 2 | Column 3 |') >= 0, '');

    // Sheet bar hidden for single-sheet sources, shown for workbooks.
    log('csv/block footer hidden', !q(doc, '[data-u-comp="sheet-bar"], .univer-sheet-bar'), '');

    out.push('DONE');
    document.getElementById('results').textContent = out.join('\n');
  }).catch(function (e) {
    out.push('ERROR ' + (e && e.stack ? e.stack : e));
    document.getElementById('results').textContent = out.join('\n');
  });
</script>
</body>
</html>
