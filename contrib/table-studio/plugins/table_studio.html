  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () {
      toastEl.classList.remove('show');
    }, 2400);
  }
  function busy(label) {
    busyLabelEl.textContent = label || 'Working…';
    busyEl.classList.add('show');
  }
  function unbusy() {
    busyEl.classList.remove('show');
  }

  // ------------------------------------------------------------------
  // Dialogs (promise-based, no native alert/confirm)
  // ------------------------------------------------------------------
  function openBackdrop(centered) {
    // Reentrancy guard: assistive-tech or simultaneous taps can activate a
    // second control while a modal is open; never stack modals.
    if (document.querySelector('.backdrop')) {
      return null;
    }
    var bd = el('div', 'backdrop' + (centered ? ' center' : ''));
    document.body.appendChild(bd);
    return bd;
  }
  function confirmDialog(title, message, confirmLabel, danger) {
    return new Promise(function (resolve) {
      var bd = openBackdrop(true);
      if (!bd) {
        resolve(false);
        return;
      }
      var dlg = el('div', 'dialog');
      dlg.appendChild(el('h2', null, title));
      if (message) dlg.appendChild(el('p', null, message));
      var row = el('div', 'row');
      var cancel = el('button', 'dlg-btn plain', 'Cancel');
      var okBtn = el('button', 'dlg-btn ' + (danger ? 'danger' : 'primary'), confirmLabel || 'OK');
      row.appendChild(cancel);
      row.appendChild(okBtn);
      dlg.appendChild(row);
      bd.appendChild(dlg);
      function done(v) {
        bd.remove();
        resolve(v);
      }
      cancel.addEventListener('click', function () { done(false); });
      okBtn.addEventListener('click', function () { done(true); });
      bd.addEventListener('click', function (e) {
        if (e.target === bd) done(false);
      });
    });
  }
  function infoDialog(title, message) {
    return new Promise(function (resolve) {
      var bd = openBackdrop(true);
      if (!bd) {
        resolve();
        return;
      }
      var dlg = el('div', 'dialog');
      dlg.appendChild(el('h2', null, title));
      if (message) dlg.appendChild(el('p', null, message));
      var row = el('div', 'row');
      var okBtn = el('button', 'dlg-btn primary', 'OK');
      row.appendChild(okBtn);
      dlg.appendChild(row);
      bd.appendChild(dlg);
      function done() {
        bd.remove();
        resolve();
      }
      okBtn.addEventListener('click', done);
      bd.addEventListener('click', function (e) {
        if (e.target === bd) done();
      });
    });
  }
  function promptDialog(title, message, initial, placeholder) {
    return new Promise(function (resolve) {
      var bd = openBackdrop(true);
      if (!bd) {
        resolve(null);
        return;
      }
      var dlg = el('div', 'dialog');
      dlg.appendChild(el('h2', null, title));
      if (message) dlg.appendChild(el('p', null, message));
      var input = el('input');
      input.value = initial || '';
      if (placeholder) input.placeholder = placeholder;
      dlg.appendChild(input);
      var row = el('div', 'row');
      var cancel = el('button', 'dlg-btn plain', 'Cancel');
      var okBtn = el('button', 'dlg-btn primary', 'Create');
      row.appendChild(cancel);
      row.appendChild(okBtn);
      dlg.appendChild(row);
      bd.appendChild(dlg);
      function done(v) {
        bd.remove();
        resolve(v);
      }
      cancel.addEventListener('click', function () { done(null); });
      okBtn.addEventListener('click', function () { done(input.value); });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') done(input.value);
      });
      bd.addEventListener('click', function (e) {
        if (e.target === bd) done(null);
      });
      setTimeout(function () { input.focus(); }, 60);
    });
  }
  // items: [{label, icon, value, danger, on}]
  function menuSheet(title, items) {
    return new Promise(function (resolve) {
      var bd = openBackdrop(false);
      if (!bd) {
        resolve(null);
        return;
      }
      var sheet = el('div', 'sheet');
      sheet.appendChild(el('div', 'handle'));
      if (title) sheet.appendChild(el('div', 'sheet-title', title));
      items.forEach(function (item) {
        var btn = el('button', 'sheet-item' + (item.danger ? ' danger' : '') + (item.on ? ' on' : ''));
        if (item.icon) btn.appendChild(svgIcon(ICONS[item.icon]));
        btn.appendChild(el('span', null, item.label));
        btn.addEventListener('click', function () {
          bd.remove();
          resolve(item.value);
        });
        sheet.appendChild(btn);
      });
      bd.appendChild(sheet);
      bd.addEventListener('click', function (e) {
        if (e.target === bd) {
          bd.remove();
          resolve(null);
        }
      });
    });
  }

  // ------------------------------------------------------------------
  // Bytes / base64 / utf8
  // ------------------------------------------------------------------
  function b64ToBytes(b64) {
    var clean = b64.indexOf(',') >= 0 ? b64.slice(b64.indexOf(',') + 1) : b64;
    var bin = atob(clean);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes;
  }
  function bytesToB64(bytes) {
    var out = '';
    var CHUNK = 0x8000;
    for (var i = 0; i < bytes.length; i += CHUNK) {
      out += String.fromCharCode.apply(null, bytes.subarray(i, i + CHUNK));
    }
    return btoa(out);
  }
  function decodeUtf8(bytes) {
    // fatal:true — a lossy decode would silently rewrite every non-UTF-8
    // character as U+FFFD when the file is saved back.
    try {
      return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
    } catch (e) {
      throw new Error(
        'This file is not UTF-8 encoded. Editing it here would corrupt its characters, so it was not opened.'
      );
    }
  }
  function encodeUtf8(text) {
    return new TextEncoder().encode(text);
  }
  function extOf(name) {
    var m = /\.([a-z0-9]+)$/i.exec(String(name || ''));
    return m ? m[1].toLowerCase() : '';
  }
  function baseName(path) {
    var s = String(path || '');
    var i = s.lastIndexOf('/');
    return i >= 0 ? s.slice(i + 1) : s;
  }
  function sqlQuote(s) {
    return "'" + String(s).replace(/'/g, "''") + "'";
  }

  // ------------------------------------------------------------------
  // Synapse access
  // ------------------------------------------------------------------
  function synapseReady() {
    var s = window.Synapse;
    return !!(
      s &&
      typeof s.updateNotes === 'function' &&
      typeof s.readAttachment === 'function' &&
      typeof s.exportNotes === 'function'
    );
  }

  /**
   * Freshest raw markdown for a note.
   *
   * In strict mode (the save path) a failing runQuery ABORTS instead of
   * falling back to the launch snapshot — replacing the note with stale
   * content would silently destroy edits made outside the plugin. The
   * snapshot fallback is only used for display refreshes, or when the host
   * has no runQuery at all (nothing fresher exists to read).
   */
  function fetchNoteContent(noteId, opts) {
    var strict = !!(opts && opts.strict);
    var local = findNote(noteId);
    var fallback = local ? local.content : null;
    var s = window.Synapse;
    if (!s || typeof s.runQuery !== 'function') {
      return Promise.resolve(fallback);
    }
    return s
      .runQuery('SELECT content FROM notes WHERE id = ' + sqlQuote(noteId) + ' LIMIT 1')
      .then(function (res) {
        if (res && res.success && Array.isArray(res.data) && res.data.length > 0) {
          var c = res.data[0].content;
          if (typeof c === 'string') return c;
        }
        if (strict) {
          throw new Error('Could not read the current note content. Please try again.');
        }
        return fallback;
      })
      .catch(function (e) {
        if (strict) {
          throw e instanceof Error ? e : new Error(String(e));
        }
        return fallback;
      });
  }

  /** Resolves true on success, false on failure (never rejects). */
  function refreshAttachmentLists() {
    var ids = state.notes.map(function (n) { return n.id; });
    if (ids.length === 0) return Promise.resolve(true);
    return window.Synapse
      .exportNotes(ids, { includeSubNotesAndLinkedNotes: false, includeAttachmentList: true })
      .then(function (res) {
        if (!res || !res.success || !Array.isArray(res.notes)) {
          state.attachmentsError = true;
          return false;
        }
        res.notes.forEach(function (exp) {
          var note = findNote(exp.id);
          if (note && Array.isArray(exp.attachments)) {
            note.attachments = exp.attachments;
          }
        });
        state.attachmentsLoaded = true;
        state.attachmentsError = false;
        return true;
      })
      .catch(function () {
        state.attachmentsError = true;
        return false;
      });
  }

  function findNote(id) {
    for (var i = 0; i < state.notes.length; i++) {
      if (state.notes[i].id === id) return state.notes[i];
    }
    return null;
  }

  function updateNoteContent(noteId, newContent) {
    return window.Synapse
      .updateNotes([
        { id: noteId, modification: { content: { action: 'replace', text: newContent } } },
      ])
      .then(interpretUpdateResult);
  }
  function appendNoteContent(noteId, text) {
    return window.Synapse
      .updateNotes([
        { id: noteId, modification: { content: { action: 'append', text: text } } },
      ])
      .then(interpretUpdateResult);
  }
  function interpretUpdateResult(res) {
    if (!res || res.success !== true || !(res.updatedCount > 0)) {
      var err = (res && res.error) || 'The update was not applied.';
      throw new Error(err);
    }
    return res;
  }

  // ------------------------------------------------------------------
  // Sources
  // ------------------------------------------------------------------
  var SIZE_LIMITS = { maxCols: MAX_COLS, maxCells: MAX_CELLS };

  /** Memoized markdown scan — re-parses only when the content changed. */
  function tablesOf(note) {
    if (!note.scanCache || note.scanCache.content !== note.content) {
      note.scanCache = {
        content: note.content,
        tables: CORE.scanTables(note.content, SIZE_LIMITS),
      };
    }
    return note.scanCache.tables;
  }

  function buildSources() {
    state.sources = [];
    state.notes.forEach(function (note) {
      var tables = tablesOf(note);
      tables.forEach(function (t, idx) {
        state.sources.push({
          kind: 'block',
          note: note,
          table: t,
          title: 'Table ' + (idx + 1),
        });
      });
      (note.attachments || []).forEach(function (att) {
        var ext = extOf(att.fileName);
        if (FORMATS[ext]) {
          state.sources.push({
            kind: 'file',
            note: note,
            att: att,
            ext: ext,
            mode: FORMATS[ext].mode,
          });
        }
      });
    });
  }

  // ------------------------------------------------------------------
  // Home screen
  // ------------------------------------------------------------------
  function renderGate(big, small) {
    clearChildren(appEl);
    var screen = el('div', 'screen');
    var gate = el('div', 'gate');
    gate.appendChild(svgIcon(ICONS.grid));
    gate.appendChild(el('div', 'big', big));
    gate.appendChild(el('div', null, small));
    screen.appendChild(gate);
    appEl.appendChild(screen);
  }

  function renderHome() {
    buildSources();
    clearChildren(appEl);
    var screen = el('div', 'screen');

    var bar = el('div', 'topbar');
    var mark = el('div', 'app-mark');
    mark.appendChild(svgIcon(ICONS.grid));
    bar.appendChild(mark);
    var titles = el('div', 'titles');
    titles.appendChild(el('h1', null, 'Table Studio'));
    var blockCount = 0;
    var fileCount = 0;
    state.sources.forEach(function (s) {
      if (s.kind === 'block') blockCount++;
      else fileCount++;
    });
    var attachmentHint = '';
    if (state.attachmentsError) {
      attachmentHint = ' — attachments unavailable, tap refresh';
    } else if (!state.attachmentsLoaded) {
      attachmentHint = ' (loading attachments…)';
    }
    titles.appendChild(
      el(
        'div',
        'subtitle',
        blockCount + (blockCount === 1 ? ' table' : ' tables') + ' · ' +
          fileCount + (fileCount === 1 ? ' sheet file' : ' sheet files') +
          attachmentHint
      )
    );
    bar.appendChild(titles);
    var refreshBtn = el('button', 'icon-btn');
    refreshBtn.setAttribute('aria-label', 'Refresh');
    refreshBtn.appendChild(svgIcon(ICONS.refresh));
    refreshBtn.addEventListener('click', refreshAll);
    bar.appendChild(refreshBtn);
    screen.appendChild(bar);

    if (state.sources.length === 0 && (state.attachmentsLoaded || state.attachmentsError)) {
      var empty = el('div', 'empty-state');
      empty.appendChild(svgIcon(ICONS.grid));
      if (state.attachmentsError) {
        empty.appendChild(el('div', 'big', 'Attachments unavailable'));
        empty.appendChild(
          el('div', null, 'The attachment list could not be loaded, and this note has no markdown tables. Tap refresh to try again.')
        );
      } else {
        empty.appendChild(el('div', 'big', 'No tables here yet'));
        empty.appendChild(
          el('div', null, 'This note has no markdown tables or spreadsheet attachments. Create one to get started.')
        );
      }
      var actions = el('div', 'actions');
      var newTableBtn = el('button', 'pill-btn');
      newTableBtn.appendChild(svgIcon(ICONS.plus));
      newTableBtn.appendChild(el('span', null, 'New table'));
      newTableBtn.addEventListener('click', function () { startNewBlock(null); });
      var newCsvBtn = el('button', 'pill-btn');
      newCsvBtn.appendChild(svgIcon(ICONS.plus));
      newCsvBtn.appendChild(el('span', null, 'New CSV'));
      newCsvBtn.addEventListener('click', function () { startNewCsv(null); });
      actions.appendChild(newTableBtn);
      actions.appendChild(newCsvBtn);
      empty.appendChild(actions);
      screen.appendChild(empty);
      appEl.appendChild(screen);
      return;
    }

    var scroll = el('div', 'home-scroll');
    state.notes.forEach(function (note) {
      var group = el('div', 'note-group');
      var head = el('div', 'note-group-head');
      head.appendChild(el('div', 'name', note.title || 'Untitled note'));
      var addTable = el('button', 'ghost-btn');
      addTable.appendChild(svgIcon(ICONS.plus));
      addTable.appendChild(el('span', null, 'Table'));
      addTable.addEventListener('click', function () { startNewBlock(note); });
      head.appendChild(addTable);
      var addCsv = el('button', 'ghost-btn');
      addCsv.appendChild(svgIcon(ICONS.plus));
      addCsv.appendChild(el('span', null, 'CSV'));
      addCsv.addEventListener('click', function () { startNewCsv(note); });
      head.appendChild(addCsv);
      group.appendChild(head);

      var any = false;
      state.sources.forEach(function (src) {
        if (src.note !== note) return;
        any = true;
        group.appendChild(src.kind === 'block' ? blockCard(src) : fileCard(src));
      });
      if (!any) {
        var none = el('div', 'card');
        none.appendChild(el('div', 'dims', 'No tables in this note yet.'));
        group.appendChild(none);
      }
      scroll.appendChild(group);
    });
    screen.appendChild(scroll);
    appEl.appendChild(screen);
  }

  function blockCard(src) {
    var card = el('button', 'card');
    var preview = el('table', 'preview');
    var grid = src.table.grid;
    var pr = Math.min(3, grid.length);
    var pc = Math.min(4, grid[0].length);
    for (var r = 0; r < pr; r++) {
      var tr = el('tr');
      for (var c = 0; c < pc; c++) {
        tr.appendChild(el('td', null, (grid[r][c] || '').split('\n')[0]));
      }
      preview.appendChild(tr);
    }
    card.appendChild(preview);
    var body = el('div', 'body');
    body.appendChild(el('div', 'name', src.title));
    var meta = el('div', 'meta');
    meta.appendChild(el('span', 'chip md', 'MARKDOWN'));
    meta.appendChild(
      el('span', 'dims', grid.length + ' × ' + grid[0].length)
    );
    body.appendChild(meta);
    card.appendChild(body);
    card.addEventListener('click', function () { openBlockEditor(src); });
    return card;
  }

  function fileCard(src) {
    var card = el('button', 'card');
    var badge = el('div', 'file-badge');
    badge.appendChild(svgIcon(ICONS.file));
    card.appendChild(badge);
    var body = el('div', 'body');
    body.appendChild(el('div', 'name', src.att.fileName));
    var meta = el('div', 'meta');
    meta.appendChild(el('span', 'chip ' + (src.mode === 'text' ? 'csv' : 'xlsx'), src.ext.toUpperCase()));
    if (src.mode === 'workbook-ro') {
      meta.appendChild(el('span', 'chip ro', 'READ-ONLY'));
    }
    meta.appendChild(el('span', 'dims', 'Attachment'));
    body.appendChild(meta);
    card.appendChild(body);
    card.addEventListener('click', function () { openFileEditor(src); });
    return card;
  }

  function refreshAll() {
    busy('Refreshing…');
    var contentFetches = state.notes.map(function (note) {
      return fetchNoteContent(note.id).then(function (c) {
        if (typeof c === 'string') note.content = c;
      });
    });
    Promise.all(contentFetches)
      .then(refreshAttachmentLists)
      .then(function (ok) {
        unbusy();
        renderHome();
        if (ok === false) toast('Could not load attachments');
      })
      .catch(function () {
        unbusy();
        renderHome();
      });
  }

  function chooseNote() {
    if (state.notes.length === 1) return Promise.resolve(state.notes[0]);
    return menuSheet(
      'Which note?',
      state.notes.map(function (n) {
        return { label: n.title || 'Untitled note', icon: 'file', value: n };
      })
    );
  }

  // ------------------------------------------------------------------
  // Editor state factory
  // ------------------------------------------------------------------
  function deepCopyGrid(grid) {
    return grid.map(function (r) { return r.slice(); });
  }

  function baseEditor() {
    return {
      dirty: false,
      undoStack: [],
      redoStack: [],
      sel: { r: 0, c: 0 },
      renderRows: ROW_CHUNK,
      editSnapTaken: false,
      readonly: false,
    };
  }

  function openBlockEditor(src) {
    var ed = baseEditor();
    ed.kind = 'block';
    ed.note = src.note;
    ed.title = src.title;
    ed.isNew = false;
    ed.raw = src.table.raw;
    ed.indent = src.table.indent;
    ed.contentAtOpen = src.note.content;
    ed.startLine = src.table.startLine;
    ed.endLine = src.table.endLine;
    ed.aligns = src.table.aligns.slice();
    ed.grid = deepCopyGrid(src.table.grid);
    state.editor = ed;
    renderEditor();
  }

  function startNewBlock(note) {
    var pick = note ? Promise.resolve(note) : chooseNote();
    pick.then(function (n) {
      if (!n) return;
      var ed = baseEditor();
      ed.kind = 'block';
      ed.note = n;
      ed.title = 'New table';
      ed.isNew = true;
      ed.indent = '';
      ed.aligns = [null, null, null];
      ed.grid = [
        ['Column 1', 'Column 2', 'Column 3'],
        ['', '', ''],
        ['', '', ''],
      ];
      ed.dirty = true;
      state.editor = ed;
      renderEditor();
    });
  }

  function startNewCsv(note) {
    var pick = note ? Promise.resolve(note) : chooseNote();
    pick
      .then(function (n) {
        if (!n) return null;
        return promptDialog('New CSV attachment', 'File name for the new sheet.', 'sheet.csv').then(function (name) {
          return name === null ? null : { note: n, name: name };
        });
      })
      .then(function (res) {
        if (!res) return;
        var name = res.name.trim() || 'sheet.csv';
        name = name.replace(/[\\/:*?"<>|]/g, '_');
        if (!/\.(csv|tsv)$/i.test(name)) name += '.csv';
        // ".csv" alone would be an extension-only dotfile.
        if (/^\.(csv|tsv)$/i.test(name)) name = 'sheet' + name;
        var ed = baseEditor();
        ed.kind = 'file';
        ed.note = res.note;
        ed.isNew = true;
        ed.format = 'text';
        ed.saveName = name;
        ed.title = name;
        ed.meta = {
          delim: extOf(name) === 'tsv' ? '\t' : ',',
          lineEnding: '\n',
          hadBom: false,
          trailingNewline: true,
        };
        ed.sheets = [{ name: name, grid: [['', '', ''], ['', '', ''], ['', '', '']], dirty: true }];
        ed.active = 0;
        ed.dirty = true;
        state.editor = ed;
        renderEditor();
      });
  }

  function totalCells(grids) {
    var n = 0;
    grids.forEach(function (g) {
      n += g.length * (g[0] ? g[0].length : 0);
    });
    return n;
  }

  // Invalidates in-flight editor opens when the screen has moved on.
  var openToken = 0;

  function openFileEditor(src) {
    var token = ++openToken;
    busy('Opening ' + src.att.fileName + '…');
    window.Synapse.readAttachment(src.att.path)
      .then(function (res) {
        unbusy();
        if (token !== openToken) return;
        if (!res || !res.success || typeof res.data !== 'string') {
          throw new Error((res && res.error) || 'Could not read the attachment.');
        }
        // base64 is ~4/3 of the byte size; quick pre-check before decoding.
        if (res.data.length > (MAX_ATTACHMENT_BYTES / 3) * 4 + 4) {
          throw new Error('This file is too large to edit here (limit ' + Math.round(MAX_ATTACHMENT_BYTES / 1024 / 1024) + ' MB).');
        }
        var ed = baseEditor();
        ed.kind = 'file';
        ed.note = src.note;
        ed.att = src.att;
        ed.ext = src.ext;
        ed.saveName = src.att.fileName;
        ed.title = src.att.fileName;
        ed.isNew = false;

        if (src.mode === 'text') {
          var bytes = b64ToBytes(res.data);
          var text = decodeUtf8(bytes);
          var delim = CORE.sniffDelimiter(text, src.ext);
          var parsed = CORE.parseDelimited(text, delim, SIZE_LIMITS);
          ed.format = 'text';
          ed.meta = parsed;
          ed.sheets = [{
            name: src.att.fileName,
            grid: parsed.rows,
            arities: parsed.arities,
            dirty: false,
          }];
          ed.active = 0;
        } else {
          if (typeof window.XLSX === 'undefined') {
            throw new Error('The spreadsheet engine failed to load.');
          }
          var wb = XLSX.read(res.data, { type: 'base64', cellStyles: false });
          // Refuse oversized declared ranges BEFORE sheet_to_json expands
          // them into rows x cols arrays of empty cells.
          var declaredCells = 0;
          wb.SheetNames.forEach(function (name) {
            var ref = wb.Sheets[name] && wb.Sheets[name]['!ref'];
            if (!ref) return;
            var range = XLSX.utils.decode_range(ref);
            // Measured from A1, because sheet_to_json below is forced to
            // expand from A1 — a far-offset !ref must not sneak past.
            var sheetRows = range.e.r + 1;
            var sheetCols = range.e.c + 1;
            if (sheetCols > MAX_COLS) {
              throw new Error('This workbook is too wide to edit here.');
            }
            declaredCells += sheetRows * sheetCols;
          });
          if (declaredCells > MAX_CELLS) {
            throw new Error('This workbook is too large to edit here.');
          }
          var sheets = [];
          var hasFormulas = false;
          wb.SheetNames.forEach(function (name) {
            var ws = wb.Sheets[name];
            var aoa;
            if (ws && ws['!ref']) {
              // Force the range to start at A1 so aoa[r][c] always maps to
              // spreadsheet cell (r, c) — required for cell-level patching
              // at save time.
              var range = XLSX.utils.decode_range(ws['!ref']);
              aoa = XLSX.utils.sheet_to_json(ws, {
                header: 1,
                raw: false,
                defval: '',
                range: XLSX.utils.encode_range({ s: { r: 0, c: 0 }, e: range.e }),
              });
            } else {
              aoa = [['']];
            }
            if (aoa.length === 0) aoa = [['']];
            aoa = aoa.map(function (row) {
              return row.map(function (v) { return v == null ? '' : String(v); });
            });
            CORE.normalizeGrid(aoa);
            if (!hasFormulas) {
              for (var key in ws) {
                if (key[0] !== '!' && ws[key] && ws[key].f) {
                  hasFormulas = true;
                  break;
                }
              }
            }
            sheets.push({
              name: name,
              grid: aoa,
              // Baseline for cell-diff patching: untouched cells are never
              // rewritten, preserving their formulas/types/formats.
              original: deepCopyGrid(aoa),
              structured: false,
              dirty: false,
            });
          });
          if (sheets.length === 0) {
            sheets.push({ name: 'Sheet1', grid: [['']], original: [['']], structured: false, dirty: false });
          }
          if (totalCells(sheets.map(function (s) { return s.grid; })) > MAX_CELLS) {
            throw new Error('This workbook is too large to edit here.');
          }
          for (var i = 0; i < sheets.length; i++) {
            if (sheets[i].grid[0].length > MAX_COLS) {
              throw new Error('This workbook is too wide to edit here.');
            }
          }
          ed.format = 'workbook';
          ed.wb = wb;
          ed.bookType = src.mode === 'workbook' ? FORMATS[src.ext].bookType : 'xlsx';
          ed.readonly = src.mode === 'workbook-ro';
          ed.hasFormulas = hasFormulas;
          ed.sheets = sheets;
          ed.active = 0;
        }
        state.editor = ed;
        renderEditor();
      })
      .catch(function (e) {
        unbusy();
        infoDialog('Could not open', String(e && e.message ? e.message : e));
      });
  }

  // ------------------------------------------------------------------
  // Editor rendering
  // ------------------------------------------------------------------
  function activeGrid() {
    var ed = state.editor;
    return ed.kind === 'block' ? ed.grid : ed.sheets[ed.active].grid;
  }
  function markSheetDirty() {
    var ed = state.editor;
    ed.dirty = true;
    // Edit generation: lets an async save detect edits that landed while it
    // was in flight, so they are never silently marked clean.
    ed.editGen = (ed.editGen || 0) + 1;
    if (ed.sheets) ed.sheets[ed.active].dirty = true;
    var save = document.getElementById('save-btn');
    if (save) save.disabled = !canSave();
  }
  function canSave() {
    var ed = state.editor;
    return !!ed && ed.dirty && !ed.readonly && !state.saving;
  }

  function renderEditor() {
    var ed = state.editor;
    clearChildren(appEl);
    var screen = el('div', 'screen');

    // --- top bar
    var bar = el('div', 'topbar');
    var backBtn = el('button', 'icon-btn');
    backBtn.setAttribute('aria-label', 'Back');
    backBtn.appendChild(svgIcon(ICONS.back));
    backBtn.addEventListener('click', requestClose);
    bar.appendChild(backBtn);
    var titles = el('div', 'titles');
    titles.appendChild(el('h1', null, ed.title));
    titles.appendChild(el('div', 'subtitle', ed.note.title || 'Untitled note'));
    bar.appendChild(titles);
    var saveBtn = el('button', 'pill-btn');
    saveBtn.id = 'save-btn';
    saveBtn.appendChild(svgIcon(ICONS.check));
    saveBtn.appendChild(el('span', null, 'Save'));
    saveBtn.disabled = !canSave();
    saveBtn.addEventListener('click', saveEditor);
    bar.appendChild(saveBtn);
    screen.appendChild(bar);

    // --- banners
    if (ed.readonly) {
      var roBanner = el('div', 'banner');
      roBanner.appendChild(svgIcon(ICONS.alert));
      roBanner.appendChild(
        el('div', 'grow', '.' + ed.ext + ' files open read-only so macros and legacy formatting are never damaged.')
      );
      var copyBtn = el('button', 'banner-action', 'Save copy as .xlsx');
      copyBtn.addEventListener('click', saveReadonlyCopy);
      roBanner.appendChild(copyBtn);
      screen.appendChild(roBanner);
    } else if (ed.format === 'workbook' && ed.hasFormulas) {
      var fBanner = el('div', 'banner');
      fBanner.appendChild(svgIcon(ICONS.alert));
      fBanner.appendChild(
        el('div', 'grow', 'This workbook contains formulas. Untouched cells are kept intact, but edited formulas become plain values, and row/column changes rewrite the whole sheet.')
      );
      screen.appendChild(fBanner);
    }

    // --- sheet tabs
    if (ed.sheets && ed.sheets.length > 1) {
      var tabs = el('div', 'tabs');
      ed.sheets.forEach(function (sheet, i) {
        var tab = el('button', 'tab' + (i === ed.active ? ' active' : ''));
        var nm = el('span', 'tab-name', sheet.name);
        tab.appendChild(nm);
        if (sheet.dirty) tab.appendChild(el('span', 'dot'));
        tab.addEventListener('click', function () {
          if (ed.active === i) return;
          ed.active = i;
          ed.sel = { r: 0, c: 0 };
          ed.renderRows = ROW_CHUNK;
          ed.editSnapTaken = false;
          ed.undoStack = [];
          ed.redoStack = [];
          renderEditor();
        });
        tabs.appendChild(tab);
      });
      screen.appendChild(tabs);
    }

    // --- grid
    var wrap = el('div', 'grid-wrap');
    wrap.id = 'grid-wrap';
    wrap.appendChild(buildGridTable());
    screen.appendChild(wrap);

    // --- bottom dock
    var dock = el('div', 'bottom-dock');
    if (ed.readonly) {
      dock.appendChild(el('div', 'ro-note', 'Browsing only — use “Save copy as .xlsx” to edit a copy.'));
    } else {
      var toolbar = el('div', 'toolbar');
      function tool(iconName, label, handler, id) {
        var b = el('button', 'tool-btn');
        if (id) b.id = id;
        b.appendChild(svgIcon(ICONS[iconName]));
        b.appendChild(el('span', 'lbl', label));
        b.addEventListener('click', handler);
        toolbar.appendChild(b);
        return b;
      }
      tool('undo', 'Undo', doUndo, 'undo-btn').disabled = ed.undoStack.length === 0;
      tool('redo', 'Redo', doRedo, 'redo-btn').disabled = ed.redoStack.length === 0;
      toolbar.appendChild(el('span', 'spacer'));
      tool('rowPlus', 'Row', insertMenu.bind(null, 'row'));
      tool('colPlus', 'Column', insertMenu.bind(null, 'col'));
      if (ed.kind === 'block') tool('alignCenter', 'Align', alignMenu);
      tool('trash', 'Delete', deleteMenu);
      dock.appendChild(toolbar);

      var editRow = el('div', 'edit-row');
      var ref = el('div', 'cell-ref', 'A1');
      ref.id = 'cell-ref';
      editRow.appendChild(ref);
      var input = el('textarea');
      input.id = 'cell-input';
      input.rows = 1;
      input.placeholder = 'Cell value';
      input.setAttribute('autocapitalize', 'off');
      input.setAttribute('autocomplete', 'off');
      input.addEventListener('input', onCellInput);
      input.addEventListener('keydown', onCellKeydown);
      editRow.appendChild(input);
      var commit = el('button', 'commit');
      commit.setAttribute('aria-label', 'Done');
      commit.appendChild(svgIcon(ICONS.check));
      commit.addEventListener('click', function () {
        input.blur();
      });
      editRow.appendChild(commit);
      dock.appendChild(editRow);
    }
    screen.appendChild(dock);

    appEl.appendChild(screen);
    applySelection(false);
  }

  function buildGridTable() {
    var ed = state.editor;
    var grid = activeGrid();
    var isBlock = ed.kind === 'block';
    var frag = document.createDocumentFragment();
    var table = el('table', 'grid');
    table.id = 'grid-table';

    var thead = el('thead');
    var headRow = el('tr');
    headRow.appendChild(el('th', 'corner', ''));
    for (var c = 0; c < grid[0].length; c++) {
      var th = el('th', 'col-head', CORE.colLabel(c));
      th.dataset.c = String(c);
      headRow.appendChild(th);
    }
    thead.appendChild(headRow);
    table.appendChild(thead);

    var tbody = el('tbody');
    var limit = Math.min(grid.length, ed.renderRows);
    for (var r = 0; r < limit; r++) {
      var tr = el('tr');
      if (isBlock && r === 0) tr.className = 'md-header';
      var rowLabel = isBlock ? (r === 0 ? 'H' : String(r)) : String(r + 1);
      var rh = el('th', 'row-head', rowLabel);
      rh.dataset.r = String(r);
      tr.appendChild(rh);
      for (var cc = 0; cc < grid[0].length; cc++) {
        var td = el('td');
        var alignCls = alignClass(cc);
        if (alignCls) td.className = alignCls;
        td.dataset.r = String(r);
        td.dataset.c = String(cc);
        var span = el('span', 'clamp', grid[r][cc]);
        td.appendChild(span);
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    table.addEventListener('click', onGridTap);
    frag.appendChild(table);

    if (grid.length > limit) {
      var more = el('button', 'more-rows', 'Show ' + Math.min(ROW_CHUNK, grid.length - limit) + ' more rows (' + (grid.length - limit) + ' hidden)');
      more.addEventListener('click', function () {
        ed.renderRows += ROW_CHUNK;
        var wrap = document.getElementById('grid-wrap');
        var top = wrap ? wrap.scrollTop : 0;
        var left = wrap ? wrap.scrollLeft : 0;
        refreshGridDom();
        var wrap2 = document.getElementById('grid-wrap');
        if (wrap2) {
          wrap2.scrollTop = top;
          wrap2.scrollLeft = left;
        }
      });
      frag.appendChild(more);
    }
    return frag;
  }

  function alignClass(c) {
    var ed = state.editor;
    if (ed.kind !== 'block') return '';
    var a = ed.aligns[c];
    if (a === 'center') return 'align-center';
    if (a === 'right') return 'align-right';
    return '';
  }

  function refreshGridDom() {
    var wrap = document.getElementById('grid-wrap');
    if (!wrap) return;
    clearChildren(wrap);
    wrap.appendChild(buildGridTable());
    applySelection(false);
  }

  // ------------------------------------------------------------------
  // Selection & editing
  // ------------------------------------------------------------------
  function cellRefLabel() {
    var ed = state.editor;
    var isBlock = ed.kind === 'block';
    var rowLabel = isBlock
      ? ed.sel.r === 0
        ? 'H'
        : String(ed.sel.r)
      : String(ed.sel.r + 1);
    return CORE.colLabel(ed.sel.c) + rowLabel;
  }

  function applySelection(focusInput) {
    var ed = state.editor;
    var grid = activeGrid();
    ed.sel.r = Math.min(Math.max(0, ed.sel.r), grid.length - 1);
    ed.sel.c = Math.min(Math.max(0, ed.sel.c), grid[0].length - 1);

    var table = document.getElementById('grid-table');
    if (table) {
      var prev = table.querySelectorAll('.sel, .sel-line, .head-sel');
      for (var i = 0; i < prev.length; i++) {
        prev[i].classList.remove('sel');
        prev[i].classList.remove('sel-line');
        prev[i].classList.remove('head-sel');
      }
      var rows = table.tBodies[0] ? table.tBodies[0].rows : [];
      if (ed.sel.r < rows.length) {
        var rowEl = rows[ed.sel.r];
        for (var j = 1; j < rowEl.cells.length; j++) rowEl.cells[j].classList.add('sel-line');
        rowEl.cells[0].classList.add('head-sel');
        var td = rowEl.cells[ed.sel.c + 1];
        if (td) {
          td.classList.remove('sel-line');
          td.classList.add('sel');
        }
      }
      for (var k = 0; k < rows.length; k++) {
        var colTd = rows[k].cells[ed.sel.c + 1];
        if (colTd && !colTd.classList.contains('sel')) colTd.classList.add('sel-line');
      }
      var headCells = table.tHead.rows[0].cells;
      if (headCells[ed.sel.c + 1]) headCells[ed.sel.c + 1].classList.add('head-sel');
    }

    var refEl = document.getElementById('cell-ref');
    if (refEl) refEl.textContent = cellRefLabel();
    var input = document.getElementById('cell-input');
    if (input) {
      input.value = grid[ed.sel.r][ed.sel.c];
      autoGrow(input);
      if (focusInput) input.focus();
    }
  }

  function onGridTap(e) {
    var ed = state.editor;
    var target = e.target;
    while (target && target !== e.currentTarget && !target.dataset.r && !target.dataset.c) {
      target = target.parentElement;
    }
    if (!target || target === e.currentTarget) return;
    if (target.tagName === 'TH') {
      // Row/column header: select first cell of that line.
      if (target.classList.contains('row-head')) {
        ed.sel.r = parseInt(target.dataset.r, 10);
      } else if (target.classList.contains('col-head')) {
        ed.sel.c = parseInt(target.dataset.c, 10);
      }
      ed.editSnapTaken = false;
      applySelection(false);
      return;
    }
    var r = parseInt(target.dataset.r, 10);
    var c = parseInt(target.dataset.c, 10);
    if (isNaN(r) || isNaN(c)) return;
    var again = ed.sel.r === r && ed.sel.c === c;
    ed.sel = { r: r, c: c };
    ed.editSnapTaken = false;
    applySelection(again && !ed.readonly);
  }

  function autoGrow(textarea) {
    textarea.style.height = 'auto';
    textarea.style.height = Math.min(76, textarea.scrollHeight) + 'px';
  }

  function onCellInput(e) {
    var ed = state.editor;
    if (ed.readonly) return;
    var grid = activeGrid();
    if (!ed.editSnapTaken) {
      pushUndoCell(ed.sel.r, ed.sel.c);
      ed.editSnapTaken = true;
    }
    grid[ed.sel.r][ed.sel.c] = e.target.value;
    markSheetDirty();
    autoGrow(e.target);
    var table = document.getElementById('grid-table');
    if (table && table.tBodies[0] && ed.sel.r < table.tBodies[0].rows.length) {
      var td = table.tBodies[0].rows[ed.sel.r].cells[ed.sel.c + 1];
      if (td && td.firstChild) td.firstChild.textContent = e.target.value;
    }
  }

  function onCellKeydown(e) {
    if (e.key !== 'Enter' || e.shiftKey) return;
    e.preventDefault();
    var ed = state.editor;
    if (ed.readonly) return;
    var grid = activeGrid();
    var needRefresh = false;
    if (ed.sel.r >= grid.length - 1) {
      // Fluid entry: Enter on the last row appends a fresh row. The sheet
      // only becomes dirty once something is actually typed into it, so
      // walking down a sheet never triggers a rewrite on save.
      pushUndo();
      grid.push(new Array(grid[0].length).fill(''));
      needRefresh = true;
    }
    ed.sel.r += 1;
    ed.editSnapTaken = false;
    if (ed.sel.r >= ed.renderRows) {
      // Never move the selection into the unrendered (windowed) region —
      // the user must always see the cell they are editing.
      ed.renderRows += ROW_CHUNK;
      needRefresh = true;
    }
    if (needRefresh) refreshGridDom();
    applySelection(true);
    scrollSelectionIntoView();
  }

  function scrollSelectionIntoView() {
    var ed = state.editor;
    var table = document.getElementById('grid-table');
    if (!table || !table.tBodies[0]) return;
    var rows = table.tBodies[0].rows;
    if (ed.sel.r < rows.length) {
      var td = rows[ed.sel.r].cells[ed.sel.c + 1];
      if (td && td.scrollIntoView) {
        td.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      }
    }
  }

  // ------------------------------------------------------------------
  // Undo / redo
  // ------------------------------------------------------------------
  function snapshot() {
    var ed = state.editor;
    var sheet = ed.sheets ? ed.sheets[ed.active] : null;
    return {
      grid: deepCopyGrid(activeGrid()),
      aligns: ed.aligns ? ed.aligns.slice() : null,
      sel: { r: ed.sel.r, c: ed.sel.c },
      sheetIndex: ed.sheets ? ed.active : -1,
      arities: sheet && sheet.arities ? sheet.arities.slice() : null,
      structured: sheet ? sheet.structured === true : false,
    };
  }
  function restore(snap) {
    var ed = state.editor;
    if (ed.sheets && snap.sheetIndex >= 0) {
      ed.active = snap.sheetIndex;
      var sheet = ed.sheets[ed.active];
      sheet.grid = deepCopyGrid(snap.grid);
      sheet.arities = snap.arities ? snap.arities.slice() : null;
      sheet.structured = snap.structured;
    } else {
      ed.grid = deepCopyGrid(snap.grid);
    }
    if (snap.aligns) ed.aligns = snap.aligns.slice();
    ed.sel = { r: snap.sel.r, c: snap.sel.c };
  }
  function pushUndo() {
    var ed = state.editor;
    ed.undoStack.push(snapshot());
    if (ed.undoStack.length > UNDO_LIMIT) ed.undoStack.shift();
    ed.redoStack = [];
    updateUndoButtons();
  }
  /**
   * Cheap undo entry for a single-cell edit — avoids a full-grid deep copy
   * on every first keystroke. Structural ops still take full snapshots, so
   * a cell record is always replayed against the geometry it was recorded
   * in (tab switches clear the stacks, so the active sheet always matches).
   */
  function pushUndoCell(r, c) {
    var ed = state.editor;
    ed.undoStack.push({ type: 'cell', r: r, c: c, value: activeGrid()[r][c] });
    if (ed.undoStack.length > UNDO_LIMIT) ed.undoStack.shift();
    ed.redoStack = [];
    updateUndoButtons();
  }
  function applyCellRecord(entry, intoStack) {
    var ed = state.editor;
    var grid = activeGrid();
    if (entry.r >= grid.length || entry.c >= grid[0].length) return;
    intoStack.push({ type: 'cell', r: entry.r, c: entry.c, value: grid[entry.r][entry.c] });
    grid[entry.r][entry.c] = entry.value;
    ed.sel = { r: entry.r, c: entry.c };
  }
  function updateUndoButtons() {
    var ed = state.editor;
    var u = document.getElementById('undo-btn');
    var r = document.getElementById('redo-btn');
    if (u) u.disabled = ed.undoStack.length === 0;
    if (r) r.disabled = ed.redoStack.length === 0;
  }
  function doUndo() {
    var ed = state.editor;
    if (ed.undoStack.length === 0) return;
    var entry = ed.undoStack.pop();
    if (entry.type === 'cell') {
      applyCellRecord(entry, ed.redoStack);
    } else {
      ed.redoStack.push(snapshot());
      restore(entry);
    }
    ed.editSnapTaken = false;
    markSheetDirty();
    refreshGridDom();
    updateUndoButtons();
  }
  function doRedo() {
    var ed = state.editor;
    if (ed.redoStack.length === 0) return;
    var entry = ed.redoStack.pop();
    if (entry.type === 'cell') {
      applyCellRecord(entry, ed.undoStack);
    } else {
      ed.undoStack.push(snapshot());
      restore(entry);
    }
    ed.editSnapTaken = false;
    markSheetDirty();
    refreshGridDom();
    updateUndoButtons();
  }

  // ------------------------------------------------------------------
  // Structure operations
  // ------------------------------------------------------------------
  function insertMenu(kind) {
    var ed = state.editor;
    var items;
    if (kind === 'row') {
      items = [
        { label: 'Insert row above', icon: 'rowPlus', value: 'above' },
        { label: 'Insert row below', icon: 'rowPlus', value: 'below' },
      ];
    } else {
      items = [
        { label: 'Insert column left', icon: 'colPlus', value: 'left' },
        { label: 'Insert column right', icon: 'colPlus', value: 'right' },
      ];
    }
    menuSheet(null, items).then(function (v) {
      if (!v || state.editor !== ed) return;
      var grid = activeGrid();
      pushUndo();
      if (kind === 'row') {
        var at = v === 'above' ? ed.sel.r : ed.sel.r + 1;
        // A markdown table's header row must stay row 0.
        if (ed.kind === 'block' && at === 0) at = 1;
        grid.splice(at, 0, new Array(grid[0].length).fill(''));
        noteRowChange('insert', at);
        ed.sel.r = at;
      } else {
        var atC = v === 'left' ? ed.sel.c : ed.sel.c + 1;
        for (var r = 0; r < grid.length; r++) grid[r].splice(atC, 0, '');
        if (ed.aligns) ed.aligns.splice(atC, 0, null);
        noteColumnChange();
        ed.sel.c = atC;
      }
      ed.editSnapTaken = false;
      markSheetDirty();
      refreshGridDom();
    });
  }

  /** Bookkeeping for row insert/delete on the active sheet. */
  function noteRowChange(op, at) {
    var ed = state.editor;
    var sheet = ed.sheets ? ed.sheets[ed.active] : null;
    if (!sheet) return;
    if (sheet.arities) {
      // -1 marks a row with no original arity (serialize at full width).
      if (op === 'insert') sheet.arities.splice(at, 0, -1);
      else sheet.arities.splice(at, 1);
    }
    noteSheetRestructured(sheet);
  }

  /** Bookkeeping for column insert/delete on the active sheet. */
  function noteColumnChange() {
    var ed = state.editor;
    var sheet = ed.sheets ? ed.sheets[ed.active] : null;
    if (!sheet) return;
    // Original per-row arities no longer describe these columns.
    sheet.arities = null;
    noteSheetRestructured(sheet);
  }

  function noteSheetRestructured(sheet) {
    var ed = state.editor;
    if (ed.format !== 'workbook' || sheet.structured) return;
    sheet.structured = true;
    toast('Row/column changes rewrite this sheet on save');
  }

  function canDeleteRowNow() {
    var ed = state.editor;
    var grid = activeGrid();
    // The markdown header row must stay; any grid keeps at least one row.
    return ed.kind === 'block' ? ed.sel.r > 0 : grid.length > 1;
  }

  function deleteMenu() {
    var ed = state.editor;
    var grid = activeGrid();
    var isBlock = ed.kind === 'block';
    var rowLabel = isBlock ? (ed.sel.r === 0 ? 'header row' : 'row ' + ed.sel.r) : 'row ' + (ed.sel.r + 1);
    var items = [];
    if (canDeleteRowNow()) {
      items.push({ label: 'Delete ' + rowLabel, icon: 'trash', value: 'row', danger: true });
    }
    if (grid[0].length > 1) {
      items.push({ label: 'Delete column ' + CORE.colLabel(ed.sel.c), icon: 'trash', value: 'col', danger: true });
    }
    items.push({ label: 'Clear cell', icon: 'close', value: 'clear' });
    menuSheet(null, items).then(function (v) {
      if (!v || state.editor !== ed) return;
      // Re-validate against the CURRENT grid — it may have changed while
      // the menu was open.
      var g = activeGrid();
      if (v === 'row') {
        if (!canDeleteRowNow()) return;
        pushUndo();
        g.splice(ed.sel.r, 1);
        noteRowChange('delete', ed.sel.r);
        ed.sel.r = Math.min(ed.sel.r, g.length - 1);
      } else if (v === 'col') {
        if (g[0].length <= 1) return;
        pushUndo();
        for (var r = 0; r < g.length; r++) g[r].splice(ed.sel.c, 1);
        if (ed.aligns) ed.aligns.splice(ed.sel.c, 1);
        noteColumnChange();
        ed.sel.c = Math.min(ed.sel.c, g[0].length - 1);
      } else if (v === 'clear') {
        pushUndo();
        g[ed.sel.r][ed.sel.c] = '';
      }
      ed.editSnapTaken = false;
      markSheetDirty();
      refreshGridDom();
    });
  }

  function alignMenu() {
    var ed = state.editor;
    var current = ed.aligns[ed.sel.c] || 'default';
    var items = [
      { label: 'Default', icon: 'alignLeft', value: 'default', on: current === 'default' },
      { label: 'Left', icon: 'alignLeft', value: 'left', on: current === 'left' },
      { label: 'Center', icon: 'alignCenter', value: 'center', on: current === 'center' },
      { label: 'Right', icon: 'alignRight', value: 'right', on: current === 'right' },
    ];
    menuSheet('Column ' + CORE.colLabel(ed.sel.c) + ' alignment', items).then(function (v) {
      if (!v || v === current || state.editor !== ed) return;
      pushUndo();
      ed.aligns[ed.sel.c] = v === 'default' ? null : v;
      ed.editSnapTaken = false;
      markSheetDirty();
      refreshGridDom();
    });
  }

  // ------------------------------------------------------------------
  // Saving
  // ------------------------------------------------------------------
  function requestClose() {
    var ed = state.editor;
    if (ed && ed.dirty && !ed.readonly) {
      confirmDialog('Discard changes?', 'Your unsaved edits to “' + ed.title + '” will be lost.', 'Discard', true).then(function (yes) {
        if (yes) closeEditor();
      });
    } else {
      closeEditor();
    }
  }
  function closeEditor() {
    openToken++;
    state.editor = null;
    renderHome();
  }

  function saveEditor() {
    if (!canSave()) return;
    var ed = state.editor;
    state.saving = true;
    var genAtStart = ed.editGen || 0;
    var saveBtn = document.getElementById('save-btn');
    if (saveBtn) saveBtn.disabled = true;
    busy('Saving…');

    // Serialization can throw synchronously (e.g. SheetJS refuses cells
    // over 32,767 chars); it must never leave the busy overlay stuck.
    var task;
    try {
      if (ed.kind === 'block') {
        task = ed.isNew ? saveNewBlock(ed) : saveExistingBlock(ed);
      } else {
        task = saveFile(ed);
      }
    } catch (e) {
      task = Promise.reject(e);
    }
    task
      .then(function (result) {
        state.saving = false;
        unbusy();
        if (result && result.noop) {
          if ((ed.editGen || 0) === genAtStart) {
            ed.dirty = false;
            if (ed.sheets) {
              ed.sheets.forEach(function (s) { s.dirty = false; });
            }
          }
          var noopBtn = document.getElementById('save-btn');
          if (noopBtn) noopBtn.disabled = !canSave();
          toast('No changes to save');
          return;
        }
        if (result && result.reopen) {
          // Saved, but the stored file could not be re-identified; further
          // saves from this editor could act on stale paths.
          infoDialog(
            'Saved',
            'The file was saved, but it must be reopened from the list before further edits.'
          ).then(function () {
            closeEditor();
            refreshAll();
          });
          return;
        }
        // Only mark clean if no edits landed while the save was in flight.
        if ((ed.editGen || 0) === genAtStart) {
          ed.dirty = false;
          if (ed.sheets) {
            ed.sheets.forEach(function (s) { s.dirty = false; });
          }
        }
        var btn = document.getElementById('save-btn');
        if (btn) btn.disabled = !canSave();
        toast('Saved');
      })
      .catch(function (e) {
        state.saving = false;
        unbusy();
        var btn = document.getElementById('save-btn');
        if (btn) btn.disabled = !canSave();
        infoDialog('Save failed', String(e && e.message ? e.message : e));
      });
  }

  /** Counts lines before a character offset. */
  function lineOfOffset(text, offset) {
    var n = 0;
    for (var i = 0; i < offset; i++) {
      if (text.charCodeAt(i) === 10) n++;
    }
    return n;
  }

  function locateBlock(content, ed) {
    // 1. Position-stable: content unchanged since we opened the editor.
    if (content === ed.contentAtOpen) {
      var lines = content.split('\n');
      var before = lines.slice(0, ed.startLine).join('\n');
      var after = lines.slice(ed.endLine).join('\n');
      return {
        before: ed.startLine > 0 ? before + '\n' : '',
        after: ed.endLine < lines.length ? '\n' + after : '',
      };
    }
    // 2. The exact original block text still appears exactly once, aligned
    // to line boundaries (a mid-line match would glue text onto the table).
    var found = -1;
    var count = 0;
    var from = 0;
    while (count < 2) {
      var idx = content.indexOf(ed.raw, from);
      if (idx < 0) break;
      var end = idx + ed.raw.length;
      var startsLine = idx === 0 || content.charCodeAt(idx - 1) === 10;
      var endsLine = end === content.length || content.charCodeAt(end) === 10;
      if (startsLine && endsLine) {
        count++;
        found = idx;
      }
      from = idx + 1;
    }
    if (count === 1) {
      return {
        before: content.slice(0, found),
        after: content.slice(found + ed.raw.length),
      };
    }
    return null;
  }

  /** The dominant line ending of the surrounding note content. */
  function eolOf(content) {
    return content.indexOf('\r\n') >= 0 ? '\r\n' : '\n';
  }

  function saveExistingBlock(ed) {
    return fetchNoteContent(ed.note.id, { strict: true }).then(function (content) {
      if (typeof content !== 'string') {
        throw new Error('Could not load the current note content.');
      }
      var loc = locateBlock(content, ed);
      if (!loc) {
        throw new Error('The note changed since this table was opened and the original table could not be found. Go back, refresh, and reopen the table.');
      }
      var eol = eolOf(content);
      var block = CORE.serializeTable(ed.grid, ed.aligns, ed.indent, eol);
      // In a CRLF note the char after the block is '\n'; the block's last
      // line must carry the matching '\r'.
      var glue = eol === '\r\n' && loc.after.charCodeAt(0) === 10 ? '\r' : '';
      var newContent = loc.before + block + glue + loc.after;
      return updateNoteContent(ed.note.id, newContent).then(function () {
        ed.note.content = newContent;
        ed.contentAtOpen = newContent;
        ed.raw = block + glue;
        ed.startLine = lineOfOffset(newContent, loc.before.length);
        ed.endLine = ed.startLine + block.split('\n').length;
      });
    });
  }

  function saveNewBlock(ed) {
    var eol = eolOf(ed.note.content);
    var block = CORE.serializeTable(ed.grid, ed.aligns, '', eol);
    var text = eol + block;
    return appendNoteContent(ed.note.id, text).then(function () {
      // Prefer re-reading the stored content so our local copy can never
      // drift from the host's append semantics; fall back to mirroring
      // the host's "content" + "\n" + text when the read fails.
      return fetchNoteContent(ed.note.id).then(function (fresh) {
        // Accept the re-read only when it visibly contains our append at
        // the end — a stale snapshot that merely contains an identical
        // table elsewhere would poison contentAtOpen.
        var newContent =
          typeof fresh === 'string' && fresh.endsWith(block)
            ? fresh
            : ed.note.content + '\n' + text;
        ed.note.content = newContent;
        ed.contentAtOpen = newContent;
        ed.isNew = false;
        ed.raw = block;
        // Our freshly appended block is the last occurrence.
        var idx = newContent.lastIndexOf(block);
        ed.startLine = lineOfOffset(newContent, idx);
        ed.endLine = ed.startLine + block.split('\n').length;
        ed.title = 'Table ' + tablesOf(ed.note).length;
        var h1 = appEl.querySelector('.topbar h1');
        if (h1) h1.textContent = ed.title;
      });
    });
  }

  function mimeFor(ext, bookType) {
    if (ext === 'tsv' || ext === 'tab') return 'text/tab-separated-values';
    if (ext === 'csv') return 'text/csv';
    if (bookType === 'ods') return 'application/vnd.oasis.opendocument.spreadsheet';
    return 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet';
  }

  /** Converts a display string to the value stored in a worksheet cell. */
  function typedCellValue(v) {
    return CORE.looksNumeric(v) ? Number(v) : v;
  }

  function rebuiltWorksheet(sheet) {
    var typed = CORE.trimTrailingEmptyRows(sheet.grid).map(function (row) {
      return row.map(typedCellValue);
    });
    return XLSX.utils.aoa_to_sheet(typed);
  }

  /**
   * Returns a copy of the worksheet with the grid's edits applied cell by
   * cell against the loaded baseline (copy-on-write: the original ws object
   * is never mutated, so a failed upload leaves the workbook pristine).
   * Untouched cells — their formulas, types, and number formats — are
   * carried through unchanged.
   */
  function patchedWorksheetCopy(ws, sheet) {
    var copy = Object.assign({}, ws);
    var grid = sheet.grid;
    var orig = sheet.original || [];
    var changed = false;
    var maxR = -1;
    var maxC = -1;
    var minR = Infinity;
    var minC = Infinity;
    var rowCount = Math.max(grid.length, orig.length);
    for (var r = 0; r < rowCount; r++) {
      var newRow = grid[r] || [];
      var oldRow = orig[r] || [];
      var colCount = Math.max(newRow.length, oldRow.length);
      for (var c = 0; c < colCount; c++) {
        var nv = newRow[c] == null ? '' : newRow[c];
        var ov = oldRow[c] == null ? '' : oldRow[c];
        if (nv === ov) continue;
        changed = true;
        var addr = XLSX.utils.encode_cell({ r: r, c: c });
        if (nv === '') {
          delete copy[addr];
        } else {
          var val = typedCellValue(nv);
          copy[addr] = typeof val === 'number' ? { t: 'n', v: val } : { t: 's', v: val };
          maxR = Math.max(maxR, r);
          maxC = Math.max(maxC, c);
          minR = Math.min(minR, r);
          minC = Math.min(minC, c);
        }
      }
    }
    if (maxR >= 0) {
      // Grow !ref at BOTH ends: the grid is A1-anchored, so an edit can
      // land before a non-A1 range start — a cell outside !ref would be
      // silently dropped by the writer.
      var ref = copy['!ref']
        ? XLSX.utils.decode_range(copy['!ref'])
        : { s: { r: minR, c: minC }, e: { r: maxR, c: maxC } };
      ref.s.r = Math.min(ref.s.r, minR);
      ref.s.c = Math.min(ref.s.c, minC);
      ref.e.r = Math.max(ref.e.r, maxR);
      ref.e.c = Math.max(ref.e.c, maxC);
      copy['!ref'] = XLSX.utils.encode_range(ref);
    }
    return { ws: copy, changed: changed };
  }

  /**
   * Serializes the editor's file. Returns null when nothing actually
   * changed (e.g. an edit was typed and reverted). For workbooks the
   * result carries a commit() that must be called only after a successful
   * upload — it adopts the candidate worksheets and re-baselines
   * sheet.original so later reverts diff correctly against what is now
   * stored.
   */
  function serializeEditorFile(ed) {
    if (ed.format === 'text') {
      var sheet0 = ed.sheets[0];
      var meta = {
        delim: ed.meta.delim,
        lineEnding: ed.meta.lineEnding,
        hadBom: ed.meta.hadBom,
        trailingNewline: ed.meta.trailingNewline,
        arities: sheet0.arities,
      };
      var text = CORE.serializeDelimited(sheet0.grid, meta);
      return {
        base64: bytesToB64(encodeUtf8(text)),
        mime: mimeFor(extOf(ed.saveName)),
        commit: function () {},
      };
    }
    var wb = ed.wb;
    var candidates = [];
    ed.sheets.forEach(function (sheet) {
      if (!sheet.dirty) return;
      var entry = null;
      if (sheet.structured || !wb.Sheets[sheet.name]) {
        entry = { sheet: sheet, ws: rebuiltWorksheet(sheet) };
      } else {
        var res = patchedWorksheetCopy(wb.Sheets[sheet.name], sheet);
        if (res.changed) entry = { sheet: sheet, ws: res.ws };
      }
      if (entry) {
        // The commit baseline must be the grid AS SERIALIZED — an edit
        // typed while the upload is in flight must still diff against
        // what was actually stored, not be absorbed into the baseline.
        entry.baseline = deepCopyGrid(sheet.grid);
        candidates.push(entry);
      }
    });
    if (candidates.length === 0) {
      return null;
    }
    // Swap the candidates in only for the write, so the in-memory workbook
    // stays pristine unless the upload later succeeds.
    var previous = candidates.map(function (c) {
      return { name: c.sheet.name, ws: wb.Sheets[c.sheet.name] };
    });
    candidates.forEach(function (c) {
      wb.Sheets[c.sheet.name] = c.ws;
    });
    var b64;
    try {
      b64 = XLSX.write(wb, { bookType: ed.bookType, type: 'base64' });
    } finally {
      previous.forEach(function (p) {
        wb.Sheets[p.name] = p.ws;
      });
    }
    return {
      base64: b64,
      mime: mimeFor(extOf(ed.saveName), ed.bookType),
      commit: function () {
        candidates.forEach(function (c) {
          wb.Sheets[c.sheet.name] = c.ws;
          c.sheet.original = c.baseline;
          c.sheet.structured = false;
        });
      },
    };
  }

  /** RegExp-escapes a literal string. */
  function escapeRe(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function saveFile(ed) {
    var out = serializeEditorFile(ed);
    if (out === null) {
      return Promise.resolve({ noop: true });
    }
    var payload = {
      type: 'base64',
      data: 'data:' + out.mime + ';base64,' + out.base64,
      // Always the ORIGINAL name: the store appends a uuid on every save,
      // so feeding back the stored name would grow it without bound.
      fileName: ed.saveName,
    };
    var modification = { attachments: { added: [payload], removed: [] } };
    if (!ed.isNew && ed.att) {
      var removed = [ed.att.path];
      // Only guess the relative spelling when the file actually lives in
      // the attachments folder — for a legacy absolute path elsewhere the
      // guess could name a DIFFERENT attachment with the same basename.
      if (/\/attachments\/[^/]+$/.test(ed.att.path)) {
        var rel = 'attachments/' + baseName(ed.att.path);
        if (removed.indexOf(rel) === -1) removed.push(rel);
      }
      modification.attachments.removed = removed;
    }
    var prevIds = {};
    (ed.note.attachments || []).forEach(function (a) {
      prevIds[a.id] = true;
    });
    return window.Synapse
      .updateNotes([{ id: ed.note.id, modification: modification }])
      .then(interpretUpdateResult)
      .then(function () {
        out.commit();
        return refreshAttachmentLists();
      })
      .then(function () {
        var ext = extOf(ed.saveName);
        var stem = ed.saveName.slice(0, ed.saveName.length - ext.length - 1);
        // The host stores our upload as "<stem>_<uuid>.<ext>"; accept an
        // exact name too in case renaming ever stops.
        var namePattern = new RegExp(
          '^' + escapeRe(stem) + '_[0-9a-f-]{36}\\.' + escapeRe(ext) + '$',
          'i'
        );
        var fresh = (ed.note.attachments || []).filter(function (a) {
          return !prevIds[a.id] &&
            (a.fileName === ed.saveName || namePattern.test(a.fileName));
        });
        var picked = fresh[fresh.length - 1];
        if (picked) {
          ed.att = picked;
          ed.title = picked.fileName;
          ed.isNew = false;
          var h1 = appEl.querySelector('.topbar h1');
          if (h1) h1.textContent = ed.title;
          return {};
        }
        // Refresh failed or the new file was not found: the save DID apply,
        // but this editor no longer knows the stored path. Force a reopen
        // so a later save can't remove a stale path or add a duplicate.
        return { reopen: true };
      });
  }

  function saveReadonlyCopy() {
    var ed = state.editor;
    if (!ed || state.saving) return;
    state.saving = true;
    busy('Saving copy…');
    var b64;
    var name;
    try {
      var copyWb = XLSX.utils.book_new();
      var usedNames = {};
      ed.sheets.forEach(function (sheet, idx) {
        // Excel caps sheet names at 31 chars; keep truncated names unique.
        var sheetName = sheet.name.slice(0, 31);
        if (usedNames[sheetName]) {
          sheetName = sheetName.slice(0, 27) + '~' + (idx + 1);
        }
        usedNames[sheetName] = true;
        XLSX.utils.book_append_sheet(copyWb, rebuiltWorksheet(sheet), sheetName);
      });
      b64 = XLSX.write(copyWb, { bookType: 'xlsx', type: 'base64' });
      name = ed.saveName.replace(/\.[a-z0-9]+$/i, '') + '.xlsx';
    } catch (e) {
      state.saving = false;
      unbusy();
      infoDialog('Save failed', String(e && e.message ? e.message : e));
      return;
    }
    window.Synapse
      .updateNotes([
        {
          id: ed.note.id,
          modification: {
            attachments: {
              added: [
                {
                  type: 'base64',
                  data: 'data:' + mimeFor('xlsx', 'xlsx') + ';base64,' + b64,
                  fileName: name,
                },
              ],
              removed: [],
            },
          },
        },
      ])
      .then(interpretUpdateResult)
      .then(function () {
        return refreshAttachmentLists();
      })
      .then(function () {
        state.saving = false;
        unbusy();
        toast('Copy saved as ' + name);
      })
      .catch(function (e) {
        state.saving = false;
        unbusy();
        infoDialog('Save failed', String(e && e.message ? e.message : e));
      });
  }

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  function init() {
    if (!CORE) {
      renderGate('Something went wrong', 'The table engine failed to load.');
      return;
    }
    if (!synapseReady()) {
      renderGate(
        'Open inside Note Synapse',
        'Table Studio is a note action. Select a note in Note Synapse and launch it from the app menu.'
      );
      return;
    }
    var notes = window.Synapse.Notes;
    if (typeof notes === 'string') {
      try {
        notes = JSON.parse(notes);
      } catch (e) {
        notes = [];
      }
    }
    if (!Array.isArray(notes) || notes.length === 0) {
      renderGate('No note selected', 'Launch Table Studio on one or more notes to edit their tables.');
      return;
    }
    state.notes = notes.map(function (n) {
      return {
        id: String(n.id),
        title: n.title || 'Untitled note',
        content: typeof n.content === 'string' ? n.content : '',
        attachments: [],
      };
    });
    renderHome();
    refreshAttachmentLists().then(function () {
      if (!state.editor) renderHome();
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
  </script>
</body>
</html>
