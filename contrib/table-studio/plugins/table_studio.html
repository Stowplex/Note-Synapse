<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Table Studio</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #eef0f4;
    --text: #191c22;
    --muted: #6b7280;
    --border: #e2e5ea;
    --accent: #4f6ef7;
    --accent-soft: rgba(79, 110, 247, 0.12);
    --accent-ink: #ffffff;
    --danger: #dc2626;
    --danger-soft: rgba(220, 38, 38, 0.1);
    --good: #059669;
    --good-soft: rgba(5, 150, 105, 0.12);
    --warn: #b45309;
    --warn-soft: rgba(180, 83, 9, 0.12);
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 4px 14px rgba(16, 24, 40, 0.06);
    --sel-cell: rgba(79, 110, 247, 0.16);
    --sel-line: rgba(79, 110, 247, 0.07);
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1013;
      --surface: #171a20;
      --surface-2: #1f232c;
      --text: #e8eaf0;
      --muted: #8b93a5;
      --border: #262b36;
      --accent: #7d90ff;
      --accent-soft: rgba(125, 144, 255, 0.16);
      --accent-ink: #10131c;
      --danger: #f87171;
      --danger-soft: rgba(248, 113, 113, 0.14);
      --good: #34d399;
      --good-soft: rgba(52, 211, 153, 0.14);
      --warn: #fbbf24;
      --warn-soft: rgba(251, 191, 36, 0.14);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.4);
      --sel-cell: rgba(125, 144, 255, 0.22);
      --sel-line: rgba(125, 144, 255, 0.09);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    font-size: 15px;
    touch-action: manipulation;
    overscroll-behavior: none;
  }
  body { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
  #app { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  button {
    font: inherit;
    color: inherit;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:disabled { opacity: 0.38; cursor: default; }
  .screen { flex: 1; display: flex; flex-direction: column; min-height: 0; animation: screen-in 0.22s ease; }
  @keyframes screen-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  /* ---------- top bars ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px 10px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    flex: none;
  }
  .topbar .titles { flex: 1; min-width: 0; }
  .topbar h1 {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .topbar .subtitle {
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 1px;
  }
  .icon-btn {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    flex: none;
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .icon-btn:active { background: var(--surface-2); transform: scale(0.94); }
  .icon-btn svg { width: 21px; height: 21px; }
  .pill-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 9px 16px;
    border-radius: 999px;
    background: var(--accent);
    color: var(--accent-ink);
    font-weight: 600;
    font-size: 14px;
    flex: none;
    transition: transform 0.1s ease, opacity 0.15s ease;
  }
  .pill-btn:active { transform: scale(0.96); }
  .pill-btn svg { width: 16px; height: 16px; }
  .app-mark {
    width: 38px;
    height: 38px;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), #9f7bff);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    flex: none;
  }
  .app-mark svg { width: 20px; height: 20px; }

  /* ---------- home ---------- */
  .home-scroll { flex: 1; overflow-y: auto; padding: 14px 14px calc(env(safe-area-inset-bottom, 0px) + 24px); }
  .note-group { margin-bottom: 22px; }
  .note-group-head { display: flex; align-items: center; gap: 8px; margin: 0 2px 10px; }
  .note-group-head .name {
    flex: 1;
    min-width: 0;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    text-transform: none;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ghost-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 999px;
    padding: 6px 11px;
    flex: none;
    transition: transform 0.1s ease;
  }
  .ghost-btn:active { transform: scale(0.95); }
  .ghost-btn svg { width: 14px; height: 14px; }
  .card {
    width: 100%;
    text-align: left;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 13px 14px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    transition: transform 0.12s ease;
  }
  .card:active { transform: scale(0.985); }
  .card .body { flex: 1; min-width: 0; }
  .card .name {
    font-weight: 600;
    font-size: 14.5px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .card .meta { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .chip {
    font-size: 10.5px;
    font-weight: 700;
    letter-spacing: 0.04em;
    border-radius: 6px;
    padding: 2.5px 7px;
  }
  .chip.md { background: var(--accent-soft); color: var(--accent); }
  .chip.csv { background: var(--good-soft); color: var(--good); }
  .chip.xlsx { background: var(--good-soft); color: var(--good); }
  .chip.ro { background: var(--warn-soft); color: var(--warn); }
  .card .dims { font-size: 12px; color: var(--muted); }
  .file-badge {
    width: 42px;
    height: 42px;
    border-radius: 12px;
    background: var(--surface-2);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    flex: none;
  }
  .file-badge svg { width: 20px; height: 20px; }
  .preview {
    border-collapse: collapse;
    flex: none;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .preview td {
    border: 1px solid var(--border);
    font-size: 9px;
    color: var(--muted);
    padding: 2px 5px;
    max-width: 44px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    height: 13px;
  }
  .preview tr:first-child td { background: var(--surface-2); font-weight: 700; color: var(--text); }
  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: var(--muted);
    padding: 40px 30px;
    gap: 8px;
  }
  .empty-state svg { width: 46px; height: 46px; opacity: 0.5; margin-bottom: 6px; }
  .empty-state .big { font-size: 16px; font-weight: 700; color: var(--text); }
  .empty-state .actions { display: flex; gap: 10px; margin-top: 16px; }

  /* ---------- editor ---------- */
  .banner {
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12.5px;
    padding: 9px 14px;
    background: var(--warn-soft);
    color: var(--warn);
    flex: none;
  }
  .banner svg { width: 16px; height: 16px; flex: none; }
  .banner .grow { flex: 1; min-width: 0; }
  .banner .banner-action { font-weight: 700; color: inherit; text-decoration: underline; flex: none; }
  .tabs {
    display: flex;
    gap: 8px;
    padding: 10px 14px 4px;
    overflow-x: auto;
    background: var(--bg);
    flex: none;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .tab {
    flex: none;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 7px 14px;
    border-radius: 999px;
    max-width: 180px;
    transition: transform 0.1s ease;
  }
  .tab:active { transform: scale(0.95); }
  .tab .tab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab.active { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }
  .tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); flex: none; }
  .grid-wrap {
    flex: 1;
    overflow: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    padding-bottom: 10px;
    background: var(--bg);
  }
  table.grid { border-collapse: separate; border-spacing: 0; user-select: none; -webkit-user-select: none; }
  table.grid th, table.grid td {
    border-right: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: var(--surface);
    font-weight: 400;
    text-align: left;
    vertical-align: top;
  }
  table.grid td {
    min-width: 92px;
    max-width: 230px;
    padding: 8px 10px;
    font-size: 13.5px;
    line-height: 1.35;
    white-space: pre-wrap;
    word-break: break-word;
  }
  table.grid td .clamp {
    display: -webkit-box;
    -webkit-line-clamp: 4;
    -webkit-box-orient: vertical;
    overflow: hidden;
    min-height: 18px;
    pointer-events: none;
  }
  table.grid th.col-head, table.grid th.corner {
    position: sticky;
    top: 0;
    z-index: 3;
    background: var(--surface-2);
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
    padding: 7px 6px;
    min-width: 92px;
  }
  table.grid th.row-head, table.grid th.corner {
    position: sticky;
    left: 0;
    min-width: 40px;
    width: 40px;
    background: var(--surface-2);
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    text-align: center;
    padding: 8px 4px;
  }
  table.grid th.row-head { z-index: 2; }
  table.grid th.corner { z-index: 4; }
  table.grid tr.md-header td { background: var(--surface-2); font-weight: 700; }
  table.grid td.sel-line, table.grid tr.md-header td.sel-line { background: var(--sel-line); }
  table.grid td.sel {
    background: var(--sel-cell);
    box-shadow: inset 0 0 0 2px var(--accent);
    border-radius: 2px;
  }
  table.grid th.head-sel { color: var(--accent); background: var(--accent-soft); }
  table.grid td.align-center { text-align: center; }
  table.grid td.align-right { text-align: right; }
  .more-rows {
    margin: 10px 14px;
    padding: 10px;
    width: calc(100% - 28px);
    border-radius: 12px;
    background: var(--surface);
    border: 1px dashed var(--border);
    color: var(--accent);
    font-weight: 600;
    font-size: 13px;
  }
  .bottom-dock {
    flex: none;
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .toolbar { display: flex; align-items: center; padding: 4px 8px 0; gap: 2px; }
  .toolbar .spacer { flex: 1; }
  .tool-btn {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    min-width: 52px;
    padding: 7px 6px 5px;
    border-radius: 10px;
    color: var(--text);
    transition: background 0.15s ease, transform 0.1s ease;
  }
  .tool-btn:active { background: var(--surface-2); transform: scale(0.94); }
  .tool-btn svg { width: 19px; height: 19px; }
  .tool-btn .lbl { font-size: 10px; color: var(--muted); font-weight: 600; }
  .edit-row { display: flex; align-items: flex-end; gap: 8px; padding: 7px 12px 9px; }
  .cell-ref {
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 8px 9px;
    min-width: 42px;
    text-align: center;
    flex: none;
    margin-bottom: 1px;
  }
  .edit-row textarea {
    flex: 1;
    resize: none;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 11px;
    font: inherit;
    font-size: 14px;
    line-height: 1.35;
    padding: 8px 12px;
    max-height: 76px;
    outline: none;
    -webkit-user-select: text;
    user-select: text;
  }
  .edit-row textarea:focus { border-color: var(--accent); }
  .edit-row .commit {
    width: 38px;
    height: 38px;
    border-radius: 11px;
    background: var(--accent);
    color: var(--accent-ink);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    flex: none;
    margin-bottom: 1px;
  }
  .edit-row .commit svg { width: 18px; height: 18px; }
  .ro-note { padding: 10px 14px 12px; font-size: 12.5px; color: var(--muted); text-align: center; }

  /* ---------- overlays ---------- */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 18, 0.45);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 50;
    animation: fade-in 0.18s ease;
  }
  .backdrop.center { align-items: center; padding: 24px; }
  @keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
  .dialog {
    background: var(--surface);
    border-radius: 18px;
    padding: 20px 18px 14px;
    width: 100%;
    max-width: 340px;
    box-shadow: var(--shadow);
    animation: pop-in 0.2s ease;
  }
  @keyframes pop-in { from { opacity: 0; transform: scale(0.94); } to { opacity: 1; transform: none; } }
  .dialog h2 { margin: 0 0 6px; font-size: 16px; }
  .dialog p { margin: 0 0 14px; font-size: 13.5px; color: var(--muted); line-height: 1.45; word-break: break-word; }
  .dialog input {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    border-radius: 11px;
    font: inherit;
    padding: 10px 12px;
    outline: none;
    margin-bottom: 14px;
    -webkit-user-select: text;
    user-select: text;
  }
  .dialog input:focus { border-color: var(--accent); }
  .dialog .row { display: flex; gap: 8px; justify-content: flex-end; }
  .dlg-btn { font-weight: 600; font-size: 14px; padding: 9px 15px; border-radius: 11px; transition: transform 0.1s ease; }
  .dlg-btn:active { transform: scale(0.95); }
  .dlg-btn.plain { color: var(--muted); }
  .dlg-btn.primary { background: var(--accent); color: var(--accent-ink); }
  .dlg-btn.danger { background: var(--danger); color: #fff; }
  .sheet {
    background: var(--surface);
    border-radius: 18px 18px 0 0;
    width: 100%;
    max-width: 480px;
    padding: 8px 10px calc(env(safe-area-inset-bottom, 0px) + 10px);
    animation: sheet-in 0.22s cubic-bezier(0.2, 0.9, 0.3, 1);
  }
  @keyframes sheet-in { from { transform: translateY(40%); opacity: 0.5; } to { transform: none; opacity: 1; } }
  .sheet .handle { width: 36px; height: 4px; border-radius: 2px; background: var(--border); margin: 4px auto 10px; }
  .sheet .sheet-title { font-size: 12px; font-weight: 700; color: var(--muted); padding: 2px 12px 8px; }
  .sheet-item {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    text-align: left;
    padding: 13px 12px;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 500;
    transition: background 0.12s ease;
  }
  .sheet-item:active { background: var(--surface-2); }
  .sheet-item svg { width: 19px; height: 19px; color: var(--muted); flex: none; }
  .sheet-item.danger, .sheet-item.danger svg { color: var(--danger); }
  .sheet-item.on { color: var(--accent); font-weight: 700; }
  .sheet-item.on svg { color: var(--accent); }
  #toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 96px);
    transform: translateX(-50%) translateY(16px);
    background: var(--text);
    color: var(--bg);
    font-size: 13.5px;
    font-weight: 600;
    padding: 10px 18px;
    border-radius: 999px;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 60;
    max-width: 86vw;
    text-align: center;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #busy {
    position: fixed;
    inset: 0;
    background: rgba(10, 12, 18, 0.35);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 70;
  }
  #busy.show { display: flex; }
  #busy .box {
    background: var(--surface);
    border-radius: 16px;
    padding: 20px 26px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    box-shadow: var(--shadow);
  }
  #busy .label { font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .spinner {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 3px solid var(--surface-2);
    border-top-color: var(--accent);
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gate {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 32px;
    gap: 10px;
    color: var(--muted);
  }
  .gate svg { width: 48px; height: 48px; opacity: 0.5; }
  .gate .big { font-size: 17px; font-weight: 700; color: var(--text); }
</style>
</head>
<body>
  <div id="app"></div>
  <div id="toast" role="status"></div>
  <div id="busy" aria-hidden="true">
    <div class="box"><div class="spinner"></div><div class="label" id="busy-label">Working…</div></div>
  </div>

  <script src="src/table_core.js"></script>
  <script src="vendor/xlsx-0.20.3.full.min.js"></script>
  <script>
'use strict';
(function () {
  var CORE = window.TableCore;

  // ------------------------------------------------------------------
  // Limits & format policy
  // ------------------------------------------------------------------
  var MAX_ATTACHMENT_BYTES = 15 * 1024 * 1024;
  var MAX_CELLS = 200000;
  var MAX_COLS = 512;
  var ROW_CHUNK = 250;
  var UNDO_LIMIT = 80;

  // ext -> how we handle it. 'text' = CSV-style, 'workbook' = SheetJS
  // read/write, 'workbook-ro' = SheetJS read-only (saving would risk losing
  // macros / legacy fidelity, so we only offer "save a copy as .xlsx").
  var FORMATS = {
    csv: { mode: 'text' },
    tsv: { mode: 'text' },
    tab: { mode: 'text' },
    xlsx: { mode: 'workbook', bookType: 'xlsx' },
    ods: { mode: 'workbook', bookType: 'ods' },
    xls: { mode: 'workbook-ro' },
    xlsm: { mode: 'workbook-ro' },
  };

  var state = {
    notes: [], // { id, title, content, attachments: [{id, path, fileName, mimeType}] }
    sources: [],
    editor: null,
    saving: false,
    attachmentsLoaded: false,
  };

  var appEl = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var busyEl = document.getElementById('busy');
  var busyLabelEl = document.getElementById('busy-label');
  var toastTimer = null;

  // ------------------------------------------------------------------
  // Tiny DOM + SVG helpers — all content is set via textContent, so note
  // data can never be interpreted as markup.
  // ------------------------------------------------------------------
  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }
  function clearChildren(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }
  var SVG_NS = 'http://www.w3.org/2000/svg';
  function svgIcon(paths) {
    var svg = document.createElementNS(SVG_NS, 'svg');
    svg.setAttribute('viewBox', '0 0 24 24');
    svg.setAttribute('fill', 'none');
    svg.setAttribute('stroke', 'currentColor');
    svg.setAttribute('stroke-width', '2');
    svg.setAttribute('stroke-linecap', 'round');
    svg.setAttribute('stroke-linejoin', 'round');
    (Array.isArray(paths) ? paths : [paths]).forEach(function (d) {
      var p = document.createElementNS(SVG_NS, 'path');
      p.setAttribute('d', d);
      svg.appendChild(p);
    });
    return svg;
  }
  var ICONS = {
    back: 'M15 18l-6-6 6-6',
