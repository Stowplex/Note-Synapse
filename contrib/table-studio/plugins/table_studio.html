        if (name !== meta.origName) changed = true;
      } else if (meta && base && origWs && !ed.allStructural && !ed.structural[sheetId]) {
        var patched = BRIDGE.patchWorksheet(origWs, base, cur, XLSX);
        ws = patched.ws;
        if (patched.changed || name !== meta.origName) changed = true;
      } else {
        ws = BRIDGE.normalizedToWorksheet(cur, XLSX);
        changed = true;
      }
      outNames.push(name);
      outSheets[name] = ws;
      newMeta.push({ id: sheetId, origName: name, univerName: name });
      newNorms[sheetId] = cur;
    });
    if (outNames.length === 0) {
      throw new Error('The workbook has no sheets left to save.');
    }
    // A sheet removed in Univer must count as a change even if the rest
    // is untouched.
    if ((ed.sheetMeta || []).length !== outNames.length) changed = true;
    if (!changed) return null;

    var writeWb = { SheetNames: outNames, Sheets: outSheets };
    if (ed.wb.Workbook) writeWb.Workbook = ed.wb.Workbook;
    var b64 = XLSX.write(writeWb, { bookType: ed.bookType, type: 'base64' });
    return {
      base64: b64,
      mime: mimeFor(extOf(ed.saveName), ed.bookType),
      commit: function () {
        ed.wb = writeWb;
        ed.sheetMeta = newMeta;
        ed.baseNorms = newNorms;
      },
    };
  }

  /** RegExp-escapes a literal string. */
  function escapeRe(s) {
    return s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  }

  function saveFile(ed, input) {
    var out = serializeEditorFile(ed, input.snap);
    if (out === null) {
      return Promise.resolve({ noop: true });
    }
    var payload = {
      type: 'base64',
      data: 'data:' + out.mime + ';base64,' + out.base64,
      // Always the ORIGINAL name: the store appends a uuid on every save,
      // so feeding back the stored name would grow it without bound.
      fileName: ed.saveName,
    };
    var modification = { attachments: { added: [payload], removed: [] } };
    if (!ed.isNew && ed.att) {
      var removed = [ed.att.path];
      // Only guess the relative spelling when the file actually lives in
      // the attachments folder — for a legacy absolute path elsewhere the
      // guess could name a DIFFERENT attachment with the same basename.
      if (/\/attachments\/[^/]+$/.test(ed.att.path)) {
        var rel = 'attachments/' + baseName(ed.att.path);
        if (removed.indexOf(rel) === -1) removed.push(rel);
      }
      modification.attachments.removed = removed;
    }
    var prevIds = {};
    (ed.note.attachments || []).forEach(function (a) {
      prevIds[a.id] = true;
    });
    return window.Synapse
      .updateNotes([{ id: ed.note.id, modification: modification }])
      .then(interpretUpdateResult)
      .then(function () {
        out.commit();
        return refreshAttachmentLists();
      })
      .then(function () {
        var ext = extOf(ed.saveName);
        var stem = ed.saveName.slice(0, ed.saveName.length - ext.length - 1);
        // The host stores our upload as "<stem>_<uuid>.<ext>"; accept an
        // exact name too in case renaming ever stops.
        var namePattern = new RegExp(
          '^' + escapeRe(stem) + '_[0-9a-f-]{36}\\.' + escapeRe(ext) + '$',
          'i'
        );
        var fresh = (ed.note.attachments || []).filter(function (a) {
          return !prevIds[a.id] &&
            (a.fileName === ed.saveName || namePattern.test(a.fileName));
        });
        var picked = fresh[fresh.length - 1];
        if (picked) {
          ed.att = picked;
          ed.title = picked.fileName;
          ed.isNew = false;
          var h1 = appEl.querySelector('.topbar h1');
          if (h1) h1.textContent = ed.title;
          return {};
        }
        // Refresh failed or the new file was not found: the save DID apply,
        // but this editor no longer knows the stored path. Force a reopen
        // so a later save can't remove a stale path or add a duplicate.
        return { reopen: true };
      });
  }

  function saveReadonlyCopy() {
    var ed = state.editor;
    if (!ed || state.saving) return;
    var snap = snapshotNow();
    if (!snap) {
      infoDialog('Save failed', 'The spreadsheet is not available.');
      return;
    }
    state.saving = true;
    busy('Saving copy…');
    var b64;
    var name;
    try {
      var outNames = [];
      var outSheets = {};
      var usedNames = {};
      (snap.sheetOrder || []).forEach(function (sheetId, idx) {
        var sheetSnap = snap.sheets[sheetId];
        if (!sheetSnap) return;
        var sheetName = BRIDGE.uniqueSheetName(usedNames, sheetSnap.name, 'Sheet' + (idx + 1));
        var norm = BRIDGE.normalizeSheet(sheetSnap, snap.styles);
        outNames.push(sheetName);
        outSheets[sheetName] = BRIDGE.normalizedToWorksheet(norm, XLSX);
      });
      if (outNames.length === 0) {
        throw new Error('There are no sheets to save.');
      }
      b64 = XLSX.write({ SheetNames: outNames, Sheets: outSheets }, { bookType: 'xlsx', type: 'base64' });
      name = ed.saveName.replace(/\.[a-z0-9]+$/i, '') + '.xlsx';
    } catch (e) {
      state.saving = false;
      unbusy();
      infoDialog('Save failed', String(e && e.message ? e.message : e));
      return;
    }
    window.Synapse
      .updateNotes([
        {
          id: ed.note.id,
          modification: {
            attachments: {
              added: [
                {
                  type: 'base64',
                  data: 'data:' + mimeFor('xlsx', 'xlsx') + ';base64,' + b64,
                  fileName: name,
                },
              ],
              removed: [],
            },
          },
        },
      ])
      .then(interpretUpdateResult)
      .then(function () {
        return refreshAttachmentLists();
      })
      .then(function () {
        state.saving = false;
        unbusy();
        toast('Copy saved as ' + name);
      })
      .catch(function (e) {
        state.saving = false;
        unbusy();
        infoDialog('Save failed', String(e && e.message ? e.message : e));
      });
  }

  // ------------------------------------------------------------------
  // Boot
  // ------------------------------------------------------------------
  function init() {
    if (!CORE || !BRIDGE || typeof fflate === 'undefined') {
      renderGate('Something went wrong', 'The table engine failed to load.');
      return;
    }
    if (!synapseReady()) {
      renderGate(
        'Open inside Note Synapse',
        'Table Studio is a note action. Select a note in Note Synapse and launch it from the app menu.'
      );
      return;
    }
    var notes = window.Synapse.Notes;
    if (typeof notes === 'string') {
      try {
        notes = JSON.parse(notes);
      } catch (e) {
        notes = [];
      }
    }
    if (!Array.isArray(notes) || notes.length === 0) {
      renderGate('No note selected', 'Launch Table Studio on one or more notes to edit their tables.');
      return;
    }
    state.notes = notes.map(function (n) {
      return {
        id: String(n.id),
        title: n.title || 'Untitled note',
        content: typeof n.content === 'string' ? n.content : '',
        attachments: [],
      };
    });
    renderHome();
    refreshAttachmentLists().then(function () {
      if (!state.editor) renderHome();
    });
    // Warm the engine from the local cache while the user is still on the
    // home screen. This never downloads — the one-time ~12 MB download only
    // starts after the user explicitly consents on the engine screen.
    ensureEngineFromCache();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
  </script>
</body>
</html>
