         * already DRAWN when their board lands - and their board reuses these
         * ids for entirely different notes. A proposal that survived would be
         * a dashed line between two cards nobody asked about, and Apply would
         * WRITE it: applySuggestions only re-checks that the ids resolve and
         * are not already linked, which over there they do and are not.
         */
        var theirs2 = W.BB.board.parse('```synapse-bigbang\n' + JSON.stringify({
          v: 1, items: {
            n1: { k: 'note', id: 'i1', p: [0, 0], w: 200 },
            n2: { k: 'note', id: 'i2', p: [300, 0], w: 200 }
          }
        }) + '\n```\n');
        var genBefore = S.gen;
        app.ops.adopt({ theirs: theirs2, key: 'theirs-again' });
        return settle();
      }).then(function () {
        eq('a preview does not survive their board being taken', (S.proposals || []).length, 0);
        eq('and no dashed line is left on the glass', edgeProps().length, 0);
        eq('nor a handle to apply it with', handleProps().length, 0);
        ok('and the bar is the board\'s again rather than the preview\'s',
          !btnAt(W, '#bottombar', 'Apply'), barText(W));
        eq('applying now draws nothing', app.ops.applySuggestions(), false);
        eq('so their board is exactly as it arrived', S.store.board.links.length, 0);
        return settle();
      });

    /* ---------------- a note that dies under a card ---------------- */

    }).then(function () {
      /*
       * A card can become a TOMBSTONE between the request and Apply: the note
       * behind it is deleted somewhere else in the app while the preview
       * stands. The card is still there, so "does this id resolve" says yes -
       * but a tombstone was never offered to the model as a candidate, and a
       * relationship suggested with a note that is gone is not one.
       */
      W.__BB_AI__ = 'n1 | n2 | while they were both here';
      return suggest();
    }).then(function () {
      W.__BB_AI__ = null;
      eq('one is proposed', props().length, 1);
      var gone = W.BB.model.item(S.store.board, 'n2').id;
      delete mock.notes[gone];
      return Promise.resolve(app.ops.resolve(true)).then(settle);
    }).then(function () {
      ok('the card became a tombstone', S.tombstones > 0, String(S.tombstones));
      eq('and the suggestion went with the note', props().length, 0);
      eq('with its line', edgeProps().length, 0);
      eq('applying draws nothing', app.ops.applySuggestions(), false);
      eq('and nothing was drawn on the board', S.store.board.links.length, 0);
    });
  });
}

/* ===================================================================== */
/* milestone 7: a picture of the board                                    */
/* ===================================================================== */

/*
 * The whole board, always light and opaque, rasterised on the phone and
 * attached to the board note - replacing the last one rather than piling up.
 *
 * The strongest assertion in here is on the BYTES: the base64 that reaches
 * updateNotes has to start with a PNG's own signature, which is the only way
 * to tell "the canvas drew the board" from "the canvas produced a blank of the
 * right size", which is exactly what an over-large canvas silently does.
 */
function exportPhase() {
  return booted('f17').then(function (W) {
    var app = W.BB.app, S = app.S, ex = W.BB.export;
    var board = S.store.board;
    var mock = W.Synapse.__mock;
    var noteId = S.session.noteId;
    var STEM = 'Sprint planning — board';

    function files() { return mock.filesOn(noteId); }
    function lastAdded() {
      var u = mock.updates[mock.updates.length - 1];
      return u[0].modification.attachments.added[0];
    }
    function pictures() { return files().filter(function (f) { return ex.isPreviousExport(f, '.png'); }); }

    /*
     * FILES OF THE USER'S OWN, on the board note before anything is exported.
     *
     * The export takes files off the note in the same call that adds one, and
     * what it takes off is decided by a filter. Replace that filter with
     * "everything already here" and the whole suite stays green - while every
     * attachment on the board note, including these, is silently deleted on
     * the next export. Nothing defended that, so nothing was.
     *
     * Two of the three are deliberately close to the export's own name: a file
     * that STARTS the same, and one that ENDS in the same word.
     */
    var FOREIGN = [
      mock.attach(noteId, 'Vendor quote.pdf', 'application/pdf'),
      mock.attach(noteId, 'Sprint planning notes.png', 'image/png'),
      mock.attach(noteId, 'whiteboard.png', 'image/png')
    ];
    function foreignStill() {
      var have = files().map(function (f) { return f.path; });
      return FOREIGN.every(function (f) { return have.indexOf(f.path) >= 0; });
    }
    function doExport() {
      return Promise.resolve(app.ops.exportBoard('png')).then(function (v) {
        return settle().then(function () { return v; });
      });
    }

    var startContent = mock.notes[noteId].content;

    return settle().then(function () {
      eq('the board loaded', Object.keys(board.items).length, 5);
      ok('the board bar offers Export', !!btnAt(W, '#bottombar', 'Export'), barText(W));
      btnAt(W, '#bottombar', 'Export').click();
      return settle();
    }).then(function () {
      ok('which opens a bar listing the formats there are', !!btnAt(W, '#bottombar', 'PNG image'), barText(W));
      eq('one button per registered writer, plus the way back',
        W.document.querySelectorAll('#bottombar button').length, ex.formats.length + 1);
      ok('with a way back', !!btnAt(W, '#bottombar', 'Back'), barText(W));
      ok('and a sentence saying where it lands',
        /attached to this note/i.test(barText(W)), barText(W));
      btnAt(W, '#bottombar', 'PNG image').click();
      return waitFor(function () { return S.exporting === false && mock.updates.length; }, 20000, 'the export');
    }).then(function () {

    /* ---------------- what was written ---------------- */

      eq('exactly one write went out', mock.updates.length, 1);
      var u = mock.updates[0][0];
      eq('to the board note', u.id, noteId);
      ok('as an attachment modification', !!(u.modification && u.modification.attachments), json(u));
      ok('and nothing else at all', !u.content && !u.title && !u.modification.content, json(u));
      var add = lastAdded();
      eq('the file is named for the board', add.fileName, STEM + '.png');
      eq('and declares what it is', add.mimeType, 'image/png');

      // A canvas past the ceiling draws NOTHING and reports no error, so the
      // only honest test of "a picture was made" is the picture's own bytes.
      ok('the bytes really are a PNG', /^iVBORw0KGgo/.test(add.data), String(add.data).slice(0, 24));
      ok('and there are enough of them to be a board', add.data.length > 2000, add.data.length + '');

      eq('one picture is on the note', pictures().length, 1);
      ok('stored under a name the host chose', pictures()[0].fileName !== add.fileName, pictures()[0].fileName);
      ok('which the board still recognises', ex.isPreviousExport(pictures()[0], '.png'), json(pictures()[0]));
      ok('and every file that was already on the note is still on it',
        foreignStill(), json(files().map(function (f) { return f.fileName; })));
      eq('so the note holds the three it had, plus the picture', files().length, 4);

      ok('the toast says what landed', /Attached Sprint planning — board\.png/.test(bannerText(W)), bannerText(W));
      ok('and how big it is', /\(\d+×\d+\)/.test(bannerText(W)), bannerText(W));

    /* ---------------- the note's own text is not an export ---------------- */

    }).then(function () {
      return wait(1200).then(function () {
        eq('the board block is byte for byte what it was', mock.notes[noteId].content, startContent);
        ok('and nothing about the board is unsaved', S.dirty === false);
        eq('there is nothing to undo', S.store.undo.length, 0);
      });

    /* ---------------- the whole board, whatever is on screen ------------- */

    }).then(function () {
      // A picture of the SCREEN would be a picture of one card.
      app.ops.focus('n1');
      return settle().then(function () {
        ok('a focus is on', !!S.lit);
        var sc = ex.scene(board, { faceOf: function (id) { return W.BB.notes.face(board, id, S.cache); } });
        eq('the scene still holds every card', sc.cards.length, Object.keys(board.items).length);
        eq('and every link', sc.links.length, board.links.length);
        eq('and every group', sc.groups.length, board.groups.length);
        app.ops.unfocus();
        return app.ops.search('nothing on this board matches this');
      });
    }).then(function () {
      return settle().then(function () {
        var sc = ex.scene(board, { faceOf: function (id) { return W.BB.notes.face(board, id, S.cache); } });
        eq('a search that dims everything changes nothing about the picture',
          sc.cards.length, Object.keys(board.items).length);
        var svg = ex.svg(sc);
        ok('and the card text is all in it',
          svg.indexOf('Pricing') >= 0 && svg.indexOf('Roadmap') >= 0 && svg.indexOf('Vendor call') >= 0, svg.slice(0, 400));
        ok('the tombstone included, under the last title anybody saw',
          svg.indexOf('Vanished') >= 0, svg.slice(0, 400));
        ok('and the annotation', svg.indexOf('needs a source') >= 0);
        ok('and the group\'s name', svg.indexOf('Q3 planning') >= 0);
        ok('and the link\'s label', svg.indexOf('feeds') >= 0);
        ok('with nothing dimmed', svg.indexOf('opacity="0.2') < 0);
        app.ops.endSearch();
        return settle();
      });

    /* ---------------- exporting again replaces the file ---------------- */

    }).then(function () {
      var was = pictures()[0].path;
      return doExport().then(function () {
        return waitFor(function () { return S.exporting === false && mock.updates.length === 2; }, 20000, 'the second export');
      }).then(function () {
        var mod = mock.updates[1][0].modification.attachments;
        eq('the second export sends the ORIGINAL name again, not the stored one',
          mod.added[0].fileName, STEM + '.png');
        eq('and removes the previous file in the same call', (mod.removed || []).join(','), was);
        eq('so the note still holds exactly one picture', pictures().length, 1);
        ok('a new one', pictures()[0].path !== was, pictures()[0].path);
        ok('and the toast says it replaced rather than added', /^Replaced /.test(bannerText(W)), bannerText(W));
        /*
         * The guard nothing was defending. One file came off the note, and it
         * was the one this board wrote - not "everything that was here".
         */
        eq('exactly one file was taken off', (mod.removed || []).length, 1);
        ok('and the user\'s own files were not among them',
          FOREIGN.every(function (f) { return (mod.removed || []).indexOf(f.path) < 0; }), json(mod.removed));
        ok('so they are all still on the note', foreignStill(), json(files().map(function (f) { return f.fileName; })));
        eq('which holds four files, as it did before', files().length, 4);
      });

    /* ---------------- and after the note is RENAMED ---------------- */

    }).then(function () {
      /*
       * The stem is built from the note's title, so an export recognised by
       * this board's CURRENT stem finds nothing once the note is renamed: the
       * old picture stays, a second lands beside it, and every later rename
       * adds another. What identifies a picture is the suffix every one of
       * them carries, not the name of the note on the day it was written.
       */
      var was = pictures()[0].path;
      var before = mock.updates.length;
      S.note = { id: noteId, title: 'Q3 planning board' };
      W.document.getElementById('title').textContent = 'Q3 planning board';
      return doExport().then(function () {
        return waitFor(function () { return S.exporting === false && mock.updates.length > before; }, 20000, 'the export after the rename');
      }).then(function () {
        var mod = mock.updates[mock.updates.length - 1][0].modification.attachments;
        eq('the new picture is named for the new title',
          mod.added[0].fileName, 'Q3 planning board — board.png');
        eq('and the one written under the OLD title is taken off', (mod.removed || []).join(','), was);
        eq('so the note still holds exactly one picture', pictures().length, 1);
        ok('under the name it has now', pictures()[0].fileName.indexOf('Q3 planning board — board') === 0,
          pictures()[0].fileName);
        ok('the toast says it replaced', /^Replaced /.test(bannerText(W)), bannerText(W));
        ok('and the user\'s own files came through the rename too', foreignStill(),
          json(files().map(function (f) { return f.fileName; })));
        S.note = { id: noteId, title: 'Sprint planning' };
        W.document.getElementById('title').textContent = 'Sprint planning';
      });

    /* ---------------- two exports of ONE note ---------------- */

    }).then(function () {
      /*
       * S.exporting is about the board that is OPEN, and leaving a board
       * clears it - which it must, or the next board would refuse to export
       * for ever. But leaving and coming straight back mid-rasterise would
       * then start a SECOND export of the same note, and the two
       * attachmentsOf -> attachFile pairs race: the later read misses the
       * earlier file and both are kept, or the earlier write names a path the
       * later has already removed.
       */
      var before = mock.updates.length;
      var p = doExport();
      eq('the first export is out', S.exporting, true);
      // Tapped twice on the same board, which is the ordinary way to ask for
      // two at once - and the board that is drawing is what answers.
      return Promise.resolve(app.ops.exportBoard('png')).then(function (v) {
        eq('a second tap while it is drawing is refused', v, false);
        ok('by the board that is drawing', /last export is still going/i.test(bannerText(W)), bannerText(W));
        // And now what LEAVING and coming straight back does to that flag: it
        // clears it, because it belongs to the board rather than to the note.
        S.exporting = false;
        return Promise.resolve(app.ops.exportBoard('png'));
      }).then(function (v) {
        eq('a second export of the same note is refused even so', v, false);
        ok('and says why', /still being made/i.test(bannerText(W)), bannerText(W));
        return p;
      }).then(function () {
        return waitFor(function () { return mock.updates.length > before; }, 20000, 'the picture to land');
      }).then(function () { return wait(200); }).then(function () {
        eq('exactly one write went out for the two attempts', mock.updates.length - before, 1);
        eq('and the note still holds one picture', pictures().length, 1);
        ok('with the user\'s files beside it', foreignStill(), json(files().length));
        // The note is free again the moment its own export finished.
        return doExport();
      }).then(function () {
        ok('once it has finished, the note can be exported again',
          /^Replaced /.test(bannerText(W)), bannerText(W));
        eq('and still holds exactly one picture', pictures().length, 1);
      });

    /* ---------------- a note whose files cannot be read ---------------- */

    }).then(function () {
      /*
       * A failed read is not a note with no files on it. Treated as one, the
       * previous picture is never named for removal and the note grows another
       * copy - every time, silently, for as long as the database is busy.
       */
      var before = mock.updates.length;
      var had = pictures().length;
      W.__BB_QUERY__ = function (sql) {
        return /from attachments/i.test(sql) ? { success: false, error: 'database is locked' } : null;
      };
      return doExport().then(function (v) {
        W.__BB_QUERY__ = null;
        eq('an export that cannot read the note\'s files writes nothing', mock.updates.length, before);
        eq('and says it failed', v, false);
        ok('naming what went wrong', /could not be read/.test(bannerText(W)), bannerText(W));
        eq('so nothing piled up', pictures().length, had);
        ok('and the export is not still held open', S.exporting === false, 'exporting');
      });

    /* ---------------- the canvas ceiling ---------------- */

    }).then(function () {
      var keep = ex.MAX_PIXELS;
      var before = mock.updates.length;
      // Small enough that this board cannot be drawn at 2x - which on a phone
      // is what a very large board looks like.
      ex.MAX_PIXELS = 200000;
      return doExport().then(function () {
        return waitFor(function () { return S.exporting === false && mock.updates.length > before; }, 20000, 'the capped export');
      }).then(function () {
        ex.MAX_PIXELS = keep;
        var add = lastAdded();
        ok('a board too big for the canvas is still a PNG', /^iVBORw0KGgo/.test(add.data), String(add.data).slice(0, 24));
        ok('rather than a blank of the right size', add.data.length > 500, add.data.length + '');
        ok('and the toast says it was scaled', /scaled down to fit/.test(bannerText(W)), bannerText(W));
      });

    /* ---------------- what is refused, and why ---------------- */

    }).then(function () {
      W.__BB_AI__ = 'n1 | n4 | same quarter';
      return Promise.resolve(app.ops.suggest()).then(settle);
    }).then(function () {
      W.__BB_AI__ = null;
      eq('a suggestion is standing', (S.proposals || []).length, 1);
      var before = mock.updates.length;
      return doExport().then(function () {
        eq('exporting is refused while it is', mock.updates.length, before);
        ok('because a suggestion is not part of the board',
          /Apply or discard/.test(bannerText(W)), bannerText(W));
        app.ops.discardSuggestions();
        return settle();
      });
    }).then(function () {
      var before = mock.updates.length;
      app.ops.remove(Object.keys(board.items));
      return settle().then(function () {
        eq('the board is empty', Object.keys(board.items).length, 0);
        return doExport();
      }).then(function () {
        eq('an empty board writes nothing', mock.updates.length, before);
        // In the board's own words. The scene refuses an empty board too, but
        // that refusal arrives as "the board could not be drawn (...)", which
        // reads as a fault rather than as an empty board.
        ok('and says so plainly', /nothing on this board to draw yet/.test(bannerText(W)), bannerText(W));
        ok('rather than as something going wrong',
          bannerText(W).indexOf('could not be drawn') < 0, bannerText(W));
        app.ops.undo();
        return settle();
      });

    /* ---------------- the board can be left while it is drawing ---------- */

    }).then(function () {
      /*
       * The picture goes where it was always going - the note it is OF - but a
       * toast about it must not land on whatever board the user opened while
       * it was being drawn.
       */
      var was = files().length;
      var before = mock.updates.length;
      var mine = S.session, myGen = S.gen;
      var p = doExport();
      // Exactly what leaving a board does: swap the session, bump the
      // generation, and release the flag. The generation is the half that
      // matters - adopting another session's board keeps the session object.
      S.session = { noteId: 'somewhere-else', key: '' };
      S.gen++;
      S.exporting = false;
      // And as if the board that is open NOW had an export of its own out, so
      // the one still finishing has a live flag to get wrong.
      S.exporting = true;
      return p.then(function () {
        return waitFor(function () { return mock.updates.length > before; }, 20000, 'the picture to land');
      }).then(function () { return wait(200); }).then(function () {
        ok('the earlier export did not release the flag the new board is holding',
          S.exporting === true, 'exporting');
        S.exporting = false;
        S.session = mine;
        S.gen = myGen;
        eq('the picture still landed on the board it is of', files().length, was);
        var last = mock.updates[mock.updates.length - 1][0];
        eq('addressed to that note', last.id, noteId);
        ok('and nothing was said on the board that is open now',
          bannerText(W).indexOf('Attached') < 0 && bannerText(W).indexOf('Replaced') < 0, bannerText(W));
      });

    /* ---------------- ... and their board taken while it is drawing ------- */

    }).then(function () {
      /*
       * The case the test above cannot see, and the one the code's own comment
       * says is the reason the scoping is `S.gen` rather than `S.session`:
       * *Open theirs* on a conflict banner. It KEEPS the session object and
       * replaces every card under it, so a test that swaps the session as well
       * passes with the scoping reverted to an identity check on `S.session`.
       *
       * The equivalent case for a suggestion is exercised at the end of the AI
       * phase; this is the export's half of it.
       */
      var before = mock.updates.length;
      var mine = S.session, myGen = S.gen;
      var p = doExport();
      // The adopt, in the two lines that matter: same session object, new
      // generation, and the flag released by the board that took it over.
      S.gen++;
      S.exporting = false;
      S.exporting = true;                        // their board has one out now
      return p.then(function () {
        return waitFor(function () { return mock.updates.length > before; }, 20000, 'the picture to land');
      }).then(function () { return wait(200); }).then(function () {
        ok('the session object is the same one it always was', S.session === mine);
        ok('so only the generation can tell the boards apart', S.gen !== myGen);
        ok('and the earlier export did not release the flag their board is holding',
          S.exporting === true, 'exporting');
        S.exporting = false;
        S.gen = myGen;
        var last = mock.updates[mock.updates.length - 1][0];
        eq('the picture still landed on the note it is of', last.id, noteId);
        ok('and said nothing on the board that is open now',
          bannerText(W).indexOf('Attached') < 0 && bannerText(W).indexOf('Replaced') < 0, bannerText(W));
      });

    /* ---------------- the rasteriser's own safety net ---------------- */

    }).then(function () {
      /*
       * An <img> given a data: URI normally fires load or error. An engine
       * that fires NEITHER would leave the promise outstanding for ever, and
       * with it the flag that says an export is in flight - so every later
       * export of this board would be refused for the life of it.
       *
       * The suite asserted only that ex.TIMEOUT was a number. This is the
       * watchdog actually firing, with an Image that never answers.
       */
      var realImage = W.Image;
      W.Image = function () { this.onload = null; this.onerror = null; };
      var t0 = Date.now();
      return ex.png('<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40"></svg>', { timeout: 60 })
        .then(function () { ok('the watchdog fired', false, 'the png resolved with an Image that never answers'); },
          function (e) {
            ok('an image that never answers is given up on',
              /took too long/.test(String(e && e.message)), String(e && e.message));
            ok('after the bound it was given, not for ever', Date.now() - t0 < 5000, (Date.now() - t0) + 'ms');
          })
        .then(function () { W.Image = realImage; }, function () { W.Image = realImage; });

    }).then(function () {
      /*
       * The PNG is OPAQUE, whatever the drawing was. A picture with an alpha
       * channel reads as a hole in a chat that draws it on a dark ground, and
       * the canvas is transparent until something fills it - so this is
       * asserted with a drawing that paints NOTHING, which is the only way to
       * tell the canvas's own fill from the ground the SVG happens to carry.
       */
      return ex.png('<svg xmlns="http://www.w3.org/2000/svg" width="8" height="8"></svg>', {})
        .then(function (out) {
          ok('an empty drawing still rasterises', /^iVBORw0KGgo/.test(out.base64), String(out.base64).slice(0, 24));
          return new W.Promise(function (res, rej) {
            var img = new W.Image();
            img.onload = function () { res(img); };
            img.onerror = function () { rej(new Error('the png would not load back')); };
            img.src = 'data:image/png;base64,' + out.base64;
          });
        }).then(function (img) {
          var c = W.document.createElement('canvas');
          c.width = img.width; c.height = img.height;
          var ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0);
          var px = ctx.getImageData(0, 0, 1, 1).data;
          eq('and every pixel of it is opaque', px[3], 255);
          var hex = '#' + [px[0], px[1], px[2]].map(function (n) {
            return (n < 16 ? '0' : '') + n.toString(16);
          }).join('');
          eq('on the light ground the palette names', hex, ex.PALETTE.bg);
        });

    /* ---------------- the picture and the screen, side by side ---------- */

    }).then(function () {
      /*
       * The one thing the export and the renderer genuinely share is the
       * geometry, and until M7 they shared it by having a copy each. They now
       * call the same function; this is what says so, from the outside.
       */
      var sc = ex.scene(board, { faceOf: function (id) { return W.BB.notes.face(board, id, S.cache); } });
      var link = board.links[0];
      var onScreen = S.r.geomOf(board, link.i);
      ok('the renderer can say where the line is', !!onScreen, 'no geometry from the renderer');
      if (onScreen) {
        var drawn = sc.links[0];
        // The scene is shifted to a top-left origin, so the two are compared
        // as SHAPES: the vector from one end of the line to the other, and to
        // the point its handle sits on.
        near('the picture bows the line exactly as the screen does',
          drawn.c[0] - drawn.a[0], onScreen.c[0] - onScreen.a[0], 0.6);
        near('on both axes', drawn.c[1] - drawn.a[1], onScreen.c[1] - onScreen.a[1], 0.6);
        near('and puts the handle on the same point of it',
          drawn.mid[0] - drawn.a[0], onScreen.mid[0] - onScreen.a[0], 0.6);
        near('on both axes too', drawn.mid[1] - drawn.a[1], onScreen.mid[1] - onScreen.a[1], 0.6);
      }
      return settle();

    }).then(function () {
      ok('the cards are back', Object.keys(board.items).length > 0);
      // Read-only is about the BLOCK, and a picture is not a write to it.
      S.readOnly = true;
      S.why = 'This note holds two board blocks.';
      app.ops.select(null);
      return settle().then(function () {
        ok('a board that cannot be saved can still be pictured',
          !!btnAt(W, '#bottombar', 'Export'), barText(W));
        // Not the same thing as showing the button: the export has to run and
        // the file has to land. Every other write on this board is refused.
        var before = mock.updates.length;
        return doExport().then(function () {
          return waitFor(function () { return S.exporting === false && mock.updates.length > before; }, 20000, 'the read-only export');
        }).then(function () {
          var add = lastAdded();
          ok('and really is pictured', /^iVBORw0KGgo/.test(add.data), String(add.data).slice(0, 24));
          eq('replacing the last one as usual', pictures().length, 1);
          ok('with the user\'s own files untouched', foreignStill(), json(files().length));
          // A picture is not a write to the block, which is the thing the
          // board is read-only ABOUT.
          var last = mock.updates[mock.updates.length - 1][0];
          ok('and the write it made touched nothing but the attachments',
            !last.content && !last.title && !last.modification.content, json(last));
          S.readOnly = false;
          S.why = '';
          return settle();
        });
      });
    });
  });
}

function json(v) { try { return JSON.stringify(v); } catch (e) { return String(v); } }

function report() {
  var out = document.getElementById('out');
  var fails = 0;
  results.forEach(function (r) {
    if (!r.pass) fails++;
    var d = document.createElement('div');
    d.className = 'row ' + (r.pass ? 'pass' : 'fail');
    d.textContent = r.name;
    out.appendChild(d);
    if (!r.pass && r.detail) { var p = document.createElement('pre'); p.textContent = r.detail; out.appendChild(p); }
  });
  var sum = (results.length - fails) + '/' + results.length + ' app assertions passed';
  document.getElementById('sum').textContent = sum;
  document.title = fails ? 'APP FAIL ' + sum : 'APP OK ' + sum;
  window.__APP_SMOKE__ = { total: results.length, fails: fails, results: results };
}
</script>
