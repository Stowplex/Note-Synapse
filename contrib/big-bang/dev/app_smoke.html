<script>
/*
 * Milestone 3 in a real browser: the canvas, its gestures and the wiring that
 * loads a board and saves it. dev/run.js covers everything that needs no DOM.
 *
 * The rule that shapes every assertion here: NEVER getBoundingClientRect() for
 * where something ended up. Under headless Chrome with --virtual-time-budget a
 * CSS transition never advances, so a painted rect can sit frozen at the start
 * of a transform that has already been applied. Positions come from the app's
 * own geometry - BB.app.itemScreenRect() - and from the model. The one thing
 * measured from the DOM is the BIN, which is deliberately built to fade rather
 * than move so that its rectangle is honest the instant a drag begins.
 */
var results = [];
function ok(name, cond, detail) { results.push({ name: name, pass: !!cond, detail: cond ? '' : (detail || '') }); }
function eq(name, a, b) { ok(name, a === b, a === b ? '' : 'expected ' + JSON.stringify(b) + ', got ' + JSON.stringify(a)); }
function near(name, a, b, tol, detail) { ok(name, Math.abs(a - b) <= tol, Math.abs(a - b) <= tol ? '' : (detail || '') + ' expected ~' + b + ', got ' + a); }

/* ------------------------------------------------------------- fixtures */

var BLOCK = {
  v: 1, view: { p: [0, 0], z: 1 },
  items: {
    n1: { k: 'note', id: 'mock-note-2', p: [0, 0], w: 220 },
    n2: { k: 'note', id: 'mock-note-3', p: [320, 0] },
    n3: { k: 'note', id: 'mock-note-9', p: [0, 260], t: 'Interview script' },
    s1: { k: 'sticky', t: 'call the vendor', p: [320, 260] }
  }
};
var BODY_LINE = 'We agreed to cut scope on the importer.';
var NOTE = '# Sprint planning\n\n' + BODY_LINE + '\n\n```synapse-bigbang\n' + JSON.stringify(BLOCK) + '\n```\n';
var SEED = [
  // Tagged, so the chips the plan asks for have something to draw.
  { id: 'mock-note-2', title: 'Pricing', content: '# Pricing\n\n- **Three** tiers, annual only.\n\n```js\nconst hidden = 1;\n```\n',
    tags: [{ name: 'pricing', color: '#4f6ef7' }, { name: 'q3', color: 'not-a-colour' }] },
  // A title that would be markup if anything here ever built markup.
  // The closing tag is written <\/script> because an HTML parser ends this
  // very script element at a literal one, however deep inside a string it is.
  // It is also a TASK, which is the other half of the card face.
  { id: 'mock-note-3', title: 'Interview <script>alert(1)<\/script>', content: 'Tell me about your week.\n',
    type: 'task', status: 'todo' }
];
// mock-note-9 is deliberately absent: it is the tombstone.

var FUTURE = '# Later\n\nbody text\n\n```synapse-bigbang\n{"v":2,"items":{"n1":{"k":"note","id":"mock-note-1","p":[0,0]}}}\n```\n';

/*
 * A read-only board WITH cards on it. A future block yields an empty board by
 * construction, so a read-only fixture built on one has nothing to try to drag,
 * resize or remove - and "a save writes nothing" passes because there was never
 * anything to save. Two board blocks is the read-only state that still loads
 * every card in the first one.
 */
var RO_BLOCK = {
  // A zoom board.js is perfectly happy with (its range is 0.1 to 10) and a
  // finger cannot reach (the gesture range stops at 0.15).
  v: 1, view: { p: [0, 0], z: 0.1 },
  items: {
    n1: { k: 'note', id: 'mock-note-2', p: [0, 0], w: 220 },
    n2: { k: 'note', id: 'mock-note-3', p: [320, 0] },
    // A sticky and a group, because beginEdit refuses a NOTE card whatever the
    // board is - so a read-only board made of note cards alone cannot tell
    // "editing is refused because the board is read-only" from "editing is
    // refused because that is a note card". These two it would otherwise open.
    s1: { k: 'sticky', t: 'a sticky nobody may type into', p: [0, 320] }
  },
  groups: [{ i: 'g1', m: ['n1', 'n2'], t: 'Frame' }]
};
var TWO = '# Two boards\n\nkeep this line\n\n```synapse-bigbang\n' + JSON.stringify(RO_BLOCK) + '\n```\n\n' +
  'Somebody pasted a second board below.\n\n' +
  '```synapse-bigbang\n{"v":1,"items":{"s9":{"k":"sticky","t":"the other board","p":[5,5]}}}\n```\n';

/*
 * Milestone 4's own board: three cards, far enough apart that a link dropped
 * on one of them is unambiguously on that one, and nothing else. It is a
 * separate frame because the structure phase creates and destroys objects all
 * the way through, and sharing a board with the gesture phase would make every
 * assertion depend on what the phase before it left behind.
 */
var M4_SEED = [
  { id: 'm1', title: 'Alpha', content: 'the first body' },
  { id: 'm2', title: 'Beta', content: 'the second body' },
  { id: 'm3', title: 'Gamma', content: 'the third body' }
];
var M4_BLOCK = {
  v: 1, view: { p: [60, 60], z: 1 },
  items: {
    n1: { k: 'note', id: 'm1', p: [0, 0], w: 200 },
    n2: { k: 'note', id: 'm2', p: [340, 0], w: 200 },
    n3: { k: 'note', id: 'm3', p: [0, 300], w: 200 }
  }
};
var M4_LINE = 'Structure lives between the notes, not in them.';
var M4_NOTE = '# Structure\n\n' + M4_LINE + '\n\n```synapse-bigbang\n' + JSON.stringify(M4_BLOCK) + '\n```\n';

/*
 * A board made entirely of hostile strings.
 *
 * Every fixture above is friendly - `pricing`, `q3`, `Alpha`, `Pricing` - so an
 * innerHTML written where a textContent belongs had nothing to prove itself on,
 * and a colour class that stopped stripping non-letters had no colour that
 * needed stripping. Four separate mutations survived both suites for exactly
 * that reason. This frame is the one place every one of those strings is a
 * string somebody would use to attack the page.
 *
 * The excerpt's markup is deliberately built so that notes.js's inline
 * stripper leaves it ALONE: the stripper drops `<tag ...>` only when there are
 * at most 120 characters inside the angle brackets, so a long padding
 * attribute carries the tag through to the card face intact - which is the
 * only way to test what the card face does with markup.
 */
var HOSTILE_NAME = '<img src=x onerror=1>';
var HOSTILE_PAD = new Array(131).join('a');
var HOSTILE_MARKUP = '<img src=x onerror=1 data-pad="' + HOSTILE_PAD + '">';
// A `c` that is a whole style declaration. board.js keeps any non-empty string
// in `c`, so this is what reaches the class attribute.
var HOSTILE_COLOUR = 'red;background:url(https://example.invalid/x.png)';
var HOSTILE_SEED = [
  { id: 'x1', title: 'Ordinary title', content: HOSTILE_MARKUP + '\n',
    tags: [{ name: HOSTILE_NAME, color: '#3355ff' }] }
];
var HOSTILE_BLOCK = {
  v: 1, view: { p: [40, 40], z: 1 },
  items: {
    n1: { k: 'note', id: 'x1', p: [0, 0], w: 220, c: HOSTILE_COLOUR },
    s1: { k: 'sticky', t: HOSTILE_NAME, p: [320, 0] }
  },
  groups: [{ i: 'g1', m: ['n1', 's1'], t: HOSTILE_NAME, c: HOSTILE_COLOUR }]
};
var HOSTILE_NOTE = '# Hostile\n\nbody\n\n```synapse-bigbang\n' + JSON.stringify(HOSTILE_BLOCK) + '\n```\n';

/*
 * Milestone 5, part one: the merge board.
 *
 * Four notes far enough apart that a card dropped on one of them is
 * unambiguously on that one, a card whose note is gone (nothing to merge with)
 * and a sticky (not a note at all). The link and the group exist so that the
 * substitution can be watched: after a merge they must point at the card that
 * survived, not at one that has left the board.
 */
var MERGE_SEED = [
  { id: 'p1', title: 'Alpha', content: 'the first body' },
  { id: 'p2', title: 'Beta', content: 'the second body' },
  { id: 'p3', title: 'Gamma', content: 'the third body' },
  { id: 'p4', title: 'Delta', content: 'the fourth body' }
];
var MERGE_BLOCK = {
  v: 1, view: { p: [40, 40], z: 1 },
  items: {
    n1: { k: 'note', id: 'p1', p: [0, 0], w: 200 },
    n2: { k: 'note', id: 'p2', p: [360, 0], w: 200 },
    n3: { k: 'note', id: 'p3', p: [0, 320], w: 200 },
    n4: { k: 'note', id: 'p4', p: [360, 320], w: 200 },
    // Its note is not in the seed, so it resolves to a tombstone.
    n9: { k: 'note', id: 'p9', p: [720, 0], w: 200, t: 'Vanished' },
    s1: { k: 'sticky', t: 'not a note', p: [720, 320] }
  },
  links: [{ i: 'l1', a: 'n3', b: 'n4' }],
  groups: [{ i: 'g1', m: ['n3', 'n4'], t: 'Pricing' }]
};
var MERGE_LINE = 'The merge screen owns what happens to the notes.';
var MERGE_NOTE = '# Merging\n\n' + MERGE_LINE + '\n\n```synapse-bigbang\n' + JSON.stringify(MERGE_BLOCK) + '\n```\n';

/*
 * Milestone 5, part two: the board that writes other people's notes.
 *
 * Two ordinary notes joined by a line, a task, and a sticky. Everything this
 * phase does - promoting, linking, tagging, ticking - lands on the notes in
 * the mock store, so the assertions can look at what was written rather than
 * at what the app says it wrote.
 */
var WRITE_SEED = [
  { id: 'w1', title: 'Alpha', content: 'the first body' },
  { id: 'w2', title: 'Beta', content: 'the second body' },
  { id: 'w3', title: 'Ship it', content: 'the task body', type: 'task', status: 'todo' }
];
var WRITE_BLOCK = {
  v: 1, view: { p: [40, 40], z: 1 },
  items: {
    n1: { k: 'note', id: 'w1', p: [0, 0], w: 200 },
    n2: { k: 'note', id: 'w2', p: [360, 0], w: 200 },
    n3: { k: 'note', id: 'w3', p: [0, 320], w: 200 },
    // More than one line, because a note's TITLE is the first of them and its
    // body is all of them: a promotion that titled the note with the whole
    // sticky would be indistinguishable on a one-line box.
    s1: { k: 'sticky', t: 'call the vendor\nabout the October invoice', p: [360, 320] }
  },
  links: [{ i: 'l1', a: 'n1', b: 'n2' }],
  groups: [{ i: 'g1', m: ['n1', 'n2'], t: 'Pricing' }]
};
var WRITE_STICKY = 'call the vendor\nabout the October invoice';
var WRITE_LINE = 'A write to somebody else\'s note is asked for first.';
var WRITE_NOTE = '# Writing\n\n' + WRITE_LINE + '\n\n```synapse-bigbang\n' + JSON.stringify(WRITE_BLOCK) + '\n```\n';

/*
 * Milestone 6, part one: the board home.
 *
 * A store with two boards in it, one of them archived, and some notes that are
 * not boards at all - which is what the home has to tell apart. The dates are
 * far enough apart that "newest first" cannot come out right by accident.
 */
function blockOf(o) { return '```synapse-bigbang\n' + JSON.stringify(o) + '\n```\n'; }

var HOME_A = {
  v: 1, view: { p: [0, 0], z: 1 },
  items: {
    n1: { k: 'note', id: 'h1', p: [0, 0], w: 200 },
    n2: { k: 'note', id: 'h2', p: [340, 0], w: 200 },
    s1: { k: 'sticky', t: 'note to self', p: [0, 300] }
  }
};
var HOME_B = { v: 1, view: { p: [0, 0], z: 1 }, items: { n1: { k: 'note', id: 'h3', p: [0, 0], w: 200 } } };
var HOME_A_LINE = 'The prose above the block is nobody\'s business but the note\'s.';
var HOME_A_NOTE = '# Alpha board\n\n' + HOME_A_LINE + '\n\n' + blockOf(HOME_A);
var HOME_B_NOTE = '# Beta board\n\n' + blockOf(HOME_B);
var HOME_SEED = [
  { id: 'ba', title: 'Alpha board', content: HOME_A_NOTE, updatedAt: '2026-02-01T10:00:00Z' },
  { id: 'bb', title: 'Beta board', content: HOME_B_NOTE, updatedAt: '2026-03-01T10:00:00Z' },
  // Archived, and more recent than either: if the filter is not in the SQL it
  // arrives at the top of the list.
  { id: 'bz', title: 'Archived board', content: '# Archived\n\n' + blockOf(HOME_B), updatedAt: '2026-04-01T10:00:00Z', isArchived: true },
  { id: 'h1', title: 'Pricing', content: 'Three tiers, annual only.\n' },
  { id: 'h2', title: 'Interview script', content: 'Tell me about your week.\n' },
  { id: 'h3', title: 'Roadmap', content: 'The importer slipped again.\n' },
  { id: 'h4', title: 'Loose note', content: 'This one has never been a board.\n' }
];

/*
 * Milestone 6, part two: search, focus and the picker, on a board with enough
 * structure that dimming has something to be wrong about - a link with a
 * label, a group with a name, a sticky, and two notes that are NOT on the
 * board for the picker to add.
 */
var SEARCH_SEED = [
  { id: 's1', title: 'Pricing', content: 'Three tiers, annual only.\n' },
  { id: 's2', title: 'Interview script', content: 'Tell me about your week.\n' },
  { id: 's3', title: 'Roadmap', content: 'The importer slipped again.\n' },
  { id: 's4', title: 'Vendor call', content: 'They said no.\n' },
  { id: 's5', title: 'Retro', content: 'What went wrong.\n' }
];
var SEARCH_BLOCK = {
  v: 1, view: { p: [40, 40], z: 1 },
  items: {
    n1: { k: 'note', id: 's1', p: [0, 0], w: 200 },
    n2: { k: 'note', id: 's2', p: [360, 0], w: 200 },
    n3: { k: 'note', id: 's3', p: [0, 320], w: 200 },
    k1: { k: 'sticky', t: 'call the vendor', p: [360, 320] },
    /*
     * An annotation, so that the LEADER - the dotted line joining it to what
     * it points at - has something to be dimmed about. Every other dimmable
     * thing on this board is either a card or lives in #handles; the leader
     * is drawn into #edges and was the half of "a search can never leave a
     * bright line hanging off a dim card" that nothing looked at.
     */
    a1: { k: 'annot', t: 'needs a source', p: [24, -80], at: [{ i: 'n2' }], q: [384, -80] }
  },
  links: [{ i: 'l1', a: 'n1', b: 'n2', t: 'feeds' }],
  groups: [{ i: 'g1', m: ['n1', 'n3'], t: 'Money' }]
};
var SEARCH_LINE = 'Search is a way of looking at a board, not a change to one.';
var SEARCH_NOTE = '# Searching\n\n' + SEARCH_LINE + '\n\n' + blockOf(SEARCH_BLOCK);

/* Milestone 6, part three: the embed. An ordinary board, opened read-mostly. */
var EMBED_BLOCK = {
  v: 1, view: { p: [40, 40], z: 1 },
  items: {
    n1: { k: 'note', id: 'e1', p: [0, 0], w: 200 },
    n2: { k: 'note', id: 'e2', p: [360, 0], w: 200 }
  },
  links: [{ i: 'l1', a: 'n1', b: 'n2' }]
};
var EMBED_LINE = 'An embed is a picture of a board inside its own note.';
var EMBED_NOTE = '# Embedded\n\n' + EMBED_LINE + '\n\n' + blockOf(EMBED_BLOCK);
var EMBED_SEED = [
  { id: 'e1', title: 'Pricing', content: 'Three tiers.\n' },
  { id: 'e2', title: 'Roadmap', content: 'The importer slipped.\n' }
];

/*
 * Milestone 7, part one: the AI board.
 *
 * Three note cards and a sticky. The sticky is there because "all note cards"
 * has to mean something: a suggestion is about notes, and a board whose cards
 * were all notes could not show that the sticky was left out.
 */
var AI_SEED = [
  { id: 'i1', title: 'Pricing', content: 'Three tiers, annual only.\n' },
  { id: 'i2', title: 'Roadmap', content: 'The importer slipped again.\n' },
  { id: 'i3', title: 'Vendor call', content: 'They said no.\n' }
];
var AI_BLOCK = {
  v: 1, view: { p: [40, 40], z: 1 },
  items: {
    n1: { k: 'note', id: 'i1', p: [0, 0], w: 200 },
    n2: { k: 'note', id: 'i2', p: [360, 0], w: 200 },
    n3: { k: 'note', id: 'i3', p: [0, 320], w: 200 },
    s1: { k: 'sticky', t: 'not a note', p: [360, 320] }
  }
};
var AI_LINE = 'A suggestion is not a link until somebody says so.';
var AI_NOTE = '# Suggesting\n\n' + AI_LINE + '\n\n' + blockOf(AI_BLOCK);

/*
 * Milestone 7, part two: the board that gets its picture taken.
 *
 * One of everything the scene has to draw - a task card, a tombstone, a
 * sticky, an annotation, a labelled link and a group - so that "the whole
 * board" has a whole board to be about.
 */
var EX_SEED = [
  { id: 'x1', title: 'Pricing', content: 'Three tiers, annual only.\n', type: 'task', status: 'complete',
    tags: [{ name: 'money', color: '#0d9488' }] },
  { id: 'x2', title: 'Roadmap', content: 'The importer slipped again.\n' },
  { id: 'x3', title: 'Vendor call', content: 'They said no.\n' }
];
var EX_BLOCK = {
  v: 1, view: { p: [40, 40], z: 1 },
  items: {
    n1: { k: 'note', id: 'x1', p: [0, 0], w: 200, c: 'teal' },
    n2: { k: 'note', id: 'x2', p: [400, 0], w: 200 },
    n3: { k: 'note', id: 'x9', p: [0, 340], w: 200, t: 'Vanished' },
    n4: { k: 'note', id: 'x3', p: [400, 340], w: 200 },
    a1: { k: 'annot', t: 'needs a source', p: [24, -90], at: [{ i: 'n1' }], q: [124, -90] }
  },
  links: [{ i: 'l1', a: 'n1', b: 'n2', t: 'feeds', h: 'arrow', d: 'dashed', c: 'amber' }],
  groups: [{ i: 'g1', m: ['n1', 'n2'], t: 'Q3 planning', c: 'green' }]
};
var EX_LINE = 'A picture of the board is not the board.';
var EX_NOTE = '# Sprint planning\n\n' + EX_LINE + '\n\n' + blockOf(EX_BLOCK);

function url(md, seed) {
  return '../plugins/big-bang.html?board=' + encodeURIComponent(md) +
    (seed ? '&seed=' + encodeURIComponent(JSON.stringify(seed)) : '');
}

// A launch with no note at all, which is what a `normal` launch is. The seed
// is the library the home has to make a list out of.
function homeUrl(seed) {
  return '../plugins/big-bang.html?standalone=1&seed=' + encodeURIComponent(JSON.stringify(seed));
}

/*
 * A note-action launch on a MULTI-SELECTION - the case that makes a new board
 * out of all of them. `?notes=` is the harness's way of arriving with several
 * notes selected, since a browser has no note list to select in.
 */
function launchUrl(seed, ids) {
  return '../plugins/big-bang.html?seed=' + encodeURIComponent(JSON.stringify(seed)) +
    '&notes=' + encodeURIComponent(ids.join(','));
}

/*
 * ?board=<noteId> as the APP reads it - Synapse.Params.board, which is how an
 * embed URL delivers one. The harness spells it ?boardId= because ?board= is
 * already the markdown of the note to seed (see host.js).
 */
function boardIdUrl(seed, id) {
  return '../plugins/big-bang.html?standalone=1&seed=' + encodeURIComponent(JSON.stringify(seed)) +
    '&boardId=' + encodeURIComponent(id);
}

var LAUNCH_SEED = [
  { id: 'g1n', title: 'Alpha', content: 'the first body\n' },
  { id: 'g2n', title: 'Beta', content: 'the second body\n' },
  { id: 'g3n', title: 'Gamma', content: 'the third body\n' }
];

/*
 * Both boards are written into the page while it parses, rather than by
 * assigning iframe.src later. Headless Chrome under --virtual-time-budget
 * deadlocks on a frame navigation started from script: virtual time pauses for
 * the navigation, the navigation waits for virtual time, and the run never
 * ends. A src that is part of the initial parse has neither problem.
 */
document.write('<iframe id="f" src="' + url(NOTE, SEED) + '"></iframe>' +
               '<iframe id="f2" src="' + url(FUTURE) + '"></iframe>' +
               '<iframe id="f3" src="' + url(TWO, SEED) + '"></iframe>' +
               '<iframe id="f4" src="' + url(NOTE, SEED) + '"></iframe>' +
               '<iframe id="f5" src="' + url(M4_NOTE, M4_SEED) + '"></iframe>' +
               '<iframe id="f6" src="' + url(HOSTILE_NOTE, HOSTILE_SEED) + '"></iframe>' +
               '<iframe id="f7" src="' + url(MERGE_NOTE, MERGE_SEED) + '"></iframe>' +
               '<iframe id="f8" src="' + url(WRITE_NOTE, WRITE_SEED) + '"></iframe>' +
               '<iframe id="f9" src="' + homeUrl(HOME_SEED) + '"></iframe>' +
               '<iframe id="f10" src="' + url(EMBED_NOTE, EMBED_SEED) + '&mode=embed"></iframe>' +
               '<iframe id="f11" src="' + url(SEARCH_NOTE, SEARCH_SEED) + '"></iframe>' +
               '<iframe id="f12" src="' + launchUrl(LAUNCH_SEED, ['g1n', 'g2n', 'g3n']) + '"></iframe>' +
               '<iframe id="f13" src="' + boardIdUrl(HOME_SEED, 'ba') + '"></iframe>' +
               // A note in hand AND ?standalone=1: the home wins.
               '<iframe id="f14" src="' + launchUrl(HOME_SEED, ['ba']) + '&standalone=1"></iframe>' +
               /*
                * A SECOND home on the same library. Leaving a board, switching
                * between boards and paging the list all move the app between
                * two boards and back, and every one of them has to be able to
                * assert what each note ended up holding - which is not
                * possible on a frame another phase has already navigated
                * around. It is the last frame, and the phases that use it run
                * in order: leave, then switch-away, then the guards, then the
                * paging (which replaces its library outright).
                */
               '<iframe id="f15" src="' + homeUrl(HOME_SEED) + '"></iframe>' +
               '<iframe id="f16" src="' + url(AI_NOTE, AI_SEED) + '"></iframe>' +
               '<iframe id="f17" src="' + url(EX_NOTE, EX_SEED) + '"></iframe>');

// When the page began. The quiet board is asserted on well after every
// debounce window has come and gone, which is the only way to tell "it did not
// save" from "it has not saved yet".
var T0 = Date.now();

/* -------------------------------------------------------------- helpers */

/*
 * Wait for a condition, and be honest about what the deadline measures.
 *
 * Under --virtual-time-budget, Date.now() is Chrome's VIRTUAL clock. It is not
 * a wall clock and it is not a fiction either: it pauses outright for pending
 * loads (a subframe the server held for 2000 real ms arrived after 10 virtual
 * ms), and it charges a task's own real CPU time against itself roughly 1:1.
 * So the deadline is neither real seconds nor pure poll count, and on a busy
 * machine the same 5000 "ms" can buy noticeably fewer polls.
 *
 * Hence both: the wait gives up only when it has run out of virtual time AND
 * taken at least 200 polls, so a loaded machine cannot shorten it into a
 * spurious failure. And the rejection says WHAT it was waiting for - the
 * message used to be the bare word "timeout", which told the reader nothing
 * about which of the hundreds of waits in this file had given up.
 */
function waitFor(test, ms, what) {
  return new Promise(function (res, rej) {
    var t0 = Date.now(), polls = 0, limit = Math.max(200, Math.ceil((ms || 5000) / 25));
    (function poll() {
      var v;
      try { v = test(); } catch (e) { v = null; }
      if (v) return res(v);
      if (++polls > limit && Date.now() - t0 > (ms || 5000)) {
        return rej(new Error('timed out waiting for ' +
          (what || String(test).replace(/\s+/g, ' ').slice(0, 160)) +
          ' (' + polls + ' polls, ' + (Date.now() - t0) + 'ms of virtual time)'));
      }
      setTimeout(poll, 25);
    })();
  });
}
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function settle() { return wait(40); }

// The frame is already navigating; wait for the app inside it to be up.
function booted(frameId) {
  var frame = document.getElementById(frameId);
  return waitFor(function () {
    var W = frame.contentWindow;
    return W && W.BB && W.BB.app && W.BB.app.S.booted && W.BB.app.S.store ? W : null;
  }).then(function (W) { return settle().then(function () { return W; }); });
}

function card(W, id) { return W.document.querySelector('.bb-card[data-id="' + id + '"]'); }
function stageOf(W) { return W.document.getElementById('stage'); }
function barText(W) { return (W.document.getElementById('bottombar') || {}).textContent || ''; }
function bannerText(W) { return (W.document.getElementById('banner') || {}).textContent || ''; }
function badgeText(W) { return (W.document.getElementById('badge') || {}).textContent || ''; }
/*
 * What a CSS custom property actually resolves to, as the computed colour a
 * stroke would be compared against. The variable's own text is a hex string
 * and a computed stroke is an rgb() triple, so one of them has to be put
 * through the engine before they can be compared at all.
 */
function rgbVar(W, name) {
  var d = W.document.createElement('div');
  d.style.color = W.getComputedStyle(W.document.documentElement).getPropertyValue(name).trim();
  W.document.body.appendChild(d);
  var c = W.getComputedStyle(d).color;
  d.parentNode.removeChild(d);
  return c;
}
/*
 * A button by its EXACT label. `btn` below matches a substring, which is right
 * for most of the bar and wrong wherever one label contains another: with a
 * note link recorded, the link bar carries both "Unlink the notes" and
 * "Unlink", and a substring match presses the first one it finds.
 */
function btnAt(W, root, text) {
  var all = Array.prototype.slice.call(W.document.querySelectorAll(root + ' button'));
  for (var i = 0; i < all.length; i++) if ((all[i].textContent || '').trim() === text) return all[i];
  return null;
}
function btn(W, root, text) {
  var all = Array.prototype.slice.call(W.document.querySelectorAll(root + ' button'));
  for (var i = 0; i < all.length; i++) if ((all[i].textContent || '').indexOf(text) >= 0) return all[i];
  return null;
}

function P(W, type, target, x, y, id) {
  target.dispatchEvent(new W.PointerEvent(type, {
    bubbles: true, cancelable: true, pointerId: id || 1, pointerType: 'touch', isPrimary: (id || 1) === 1,
    clientX: x, clientY: y, buttons: (type === 'pointerup' || type === 'pointercancel') ? 0 : 1
  }));
}

function pointOn(W, id, dx, dy) {
  var r = W.BB.app.itemScreenRect(id);
  return { x: r.left + (dx == null ? 24 : dx), y: r.top + (dy == null ? 20 : dy) };
}

function tapCard(W, id) {
  var p = pointOn(W, id);
  P(W, 'pointerdown', card(W, id), p.x, p.y);
  P(W, 'pointerup', stageOf(W), p.x, p.y);
  return settle();
}

function tapBackground(W, x, y) {
  var st = stageOf(W), r = st.getBoundingClientRect();
  P(W, 'pointerdown', st, x == null ? r.left + 12 : x, y == null ? r.top + 12 : y);
  P(W, 'pointerup', st, x == null ? r.left + 12 : x, y == null ? r.top + 12 : y);
  return settle();
}

function dragCard(W, id, dx, dy) {
  var st = stageOf(W), p = pointOn(W, id);
  P(W, 'pointerdown', card(W, id), p.x, p.y);
  P(W, 'pointermove', st, p.x + 14, p.y);           // past the slop: now a drag
  P(W, 'pointermove', st, p.x + dx, p.y + dy);
  P(W, 'pointerup', st, p.x + dx, p.y + dy);
  return settle();
}

function dragCardToBin(W, id) {
  var st = stageOf(W), p = pointOn(W, id);
  P(W, 'pointerdown', card(W, id), p.x, p.y);
  P(W, 'pointermove', st, p.x + 14, p.y);
  var bin = W.document.getElementById('bin');
  var r = bin.getBoundingClientRect();             // the bin fades, never moves
  var cx = r.left + r.width / 2, cy = r.top + r.height / 2;
  P(W, 'pointermove', st, cx, cy);
  P(W, 'pointerup', st, cx, cy);
  return settle();
}

function longPressCard(W, id) {
  var p = pointOn(W, id);
  P(W, 'pointerdown', card(W, id), p.x, p.y);
  return wait(W.BB.gestures.LONG_MS + 90).then(function () {
    P(W, 'pointerup', stageOf(W), p.x, p.y);
    return settle();
  });
}

function pinch(W, x1, x2, nx1, nx2, y) {
  var st = stageOf(W), r = st.getBoundingClientRect();
  var yy = y == null ? r.top + r.height / 2 : y;
  P(W, 'pointerdown', st, x1, yy, 1);
  P(W, 'pointerdown', st, x2, yy, 2);
  P(W, 'pointermove', st, nx1, yy, 1);
  P(W, 'pointermove', st, nx2, yy, 2);
  P(W, 'pointerup', st, nx1, yy, 1);
  P(W, 'pointerup', st, nx2, yy, 2);
  return settle();
}

// Where a point on the glass sits on the BOARD, from the app's own camera.
// A pinch is supposed to leave this unchanged for the point between the
// fingers: that is what "zooms about the midpoint" means, and the ratio the
// zoom came out at says nothing about it.
function toBoard(W, x, y) {
  var S = W.BB.app.S, r = stageOf(W).getBoundingClientRect();
  return { x: (x - r.left - S.tx) / S.k, y: (y - r.top - S.ty) / S.k };
}

/*
 * Which pointers the gesture layer tried to capture.
 *
 * Capture is the whole of the fix for a finger that lifts over a bar: an up
 * delivered to a sibling of the stage never bubbles here, and a captured
 * pointer's up is retargeted to the stage instead. It cannot be observed from
 * its effect in a test - a synthetic pointer is not an active one, so the
 * browser refuses to capture it - so what is asserted is that the call was
 * MADE, for every pointer and not only the first. The real call still runs
 * underneath, and still fails, exactly as it does in the app.
 */
/* ------------------------------------------------ milestone 4 helpers */

// A point on the BOARD, in screen coordinates, from the app's own camera.
// The inverse of toBoard, and used for the same reason: nothing here reads a
// painted rectangle.
function screenAt(W, bx, by) {
  var S = W.BB.app.S, r = stageOf(W).getBoundingClientRect();
  return { x: r.left + S.tx + bx * S.k, y: r.top + S.ty + by * S.k };
}

function longPressBg(W, x, y) {
  var st = stageOf(W);
  P(W, 'pointerdown', st, x, y);
  return wait(W.BB.gestures.LONG_MS + 90).then(function () {
    P(W, 'pointerup', st, x, y);
    return settle();
  });
}

/*
 * The one live field, whichever spelling of contenteditable it wears. A field
 * the app opened as `plaintext-only` - which is how it keeps pasted markup out
 * of a card - is every bit as live as a `true` one, and a selector that saw
 * only the second would report no caret anywhere.
 */
var LIVE = '[contenteditable="true"],[contenteditable="plaintext-only"]';
function editingField(W) {
  var id = W.BB.app.S.editing;
  if (!id) return null;
  return W.document.querySelector(LIVE);
}

function key(W, el, name) {
  el.dispatchEvent(new W.KeyboardEvent('keydown', { key: name, bubbles: true, cancelable: true }));
}

/*
 * Put text in the box that has the caret and let it go.
 *
 * The blur is DISPATCHED rather than produced by field.blur(): a headless
 * iframe may never have been given focus in the first place, in which case
 * blur() is a no-op and the handler this is here to exercise never runs. The
 * handler is a property, so a dispatched event reaches it exactly as a real
 * one would.
 */
function typeInto(W, text) {
  var field = editingField(W);
  if (!field) return Promise.resolve(null);
  // null means "commit whatever is in there already", which is how a test can
  // put something in the field by hand and still let go of it the real way.
  if (text !== null) field.textContent = text;
  field.dispatchEvent(new W.Event('input', { bubbles: true }));
  field.dispatchEvent(new W.FocusEvent('blur'));
  return settle().then(function () { return field; });
}

function dragPortTo(W, fromId, x, y) {
  var st = stageOf(W);
  var port = card(W, fromId).querySelector('.port');
  var a = W.BB.app.itemScreenRect(fromId);
  P(W, 'pointerdown', port, a.left + a.width / 2, a.bottom - 2);
  P(W, 'pointermove', st, x, y);
  P(W, 'pointerup', st, x, y);
  return settle();
}

function dragPortToCard(W, fromId, toId) {
  var t = W.BB.app.itemScreenRect(toId);
  return dragPortTo(W, fromId, t.left + t.width / 2, t.top + t.height / 2);
}

function dragGroupHandleTo(W, fromId, x, y) {
  var st = stageOf(W);
  var handle = card(W, fromId).querySelector('.group-port');
  var a = W.BB.app.itemScreenRect(fromId);
  P(W, 'pointerdown', handle, a.left + a.width / 2, a.top - 2);
  P(W, 'pointermove', st, a.left + a.width / 2 + 14, a.top - 2);
  P(W, 'pointermove', st, x, y);
  P(W, 'pointerup', st, x, y);
  return settle();
}

function dragGroupHandleToCard(W, fromId, toId) {
  var t = W.BB.app.itemScreenRect(toId);
  return dragGroupHandleTo(W, fromId, t.left + t.width / 2, t.top + t.height / 2);
}

// Tap a thing in the handles layer - a link's handle, a group's tab. The
// coordinates come from the app's geometry; only the TARGET decides what was
// tapped, which is the point of dataset ids on every one of them.
function tapHandle(W, sel, at) {
  var e = W.document.querySelector(sel);
  if (!e) return Promise.resolve(false);
  var p = screenAt(W, at[0], at[1]);
  P(W, 'pointerdown', e, p.x, p.y);
  P(W, 'pointerup', stageOf(W), p.x, p.y);
  return settle().then(function () { return true; });
}

// The board point an affordance was placed at, read out of the transform the
// renderer wrote rather than out of a painted rectangle.
function translateOf(e) {
  var m = /translate\((-?[0-9.]+)px,\s*(-?[0-9.]+)px\)/.exec((e && e.style.transform) || '');
  return m ? [parseFloat(m[1]), parseFloat(m[2])] : null;
}

// 'M ax,ay Qcx,cy bx,by' pulled apart, so a test can work out where a curve
// goes without asking the code that drew it.
function quadOf(d) {
  var m = /^M(-?[0-9.]+),(-?[0-9.]+)\s*Q(-?[0-9.]+),(-?[0-9.]+)\s+(-?[0-9.]+),(-?[0-9.]+)$/.exec(String(d || '').trim());
  if (!m) return null;
  return {
    a: [parseFloat(m[1]), parseFloat(m[2])],
    c: [parseFloat(m[3]), parseFloat(m[4])],
    b: [parseFloat(m[5]), parseFloat(m[6])]
  };
}

function edgePaths(W) {
  return Array.prototype.slice.call(W.document.querySelectorAll('#edges path'));
}
function pathsOfClass(W, cls) {
  return edgePaths(W).filter(function (p) {
    return (p.getAttribute('class') || '').split(' ').indexOf(cls) >= 0;
  });
}

function captureSpy(W) {
  var st = stageOf(W), asked = [];
  var real = st.setPointerCapture;
  st.setPointerCapture = function (id) {
    asked.push(id);
    return real.call(st, id);
  };
  return { asked: asked, restore: function () { delete st.setPointerCapture; } };
}

/* ------------------------------------------------------------------ run */

/*
 * One phase, and its failure kept to itself.
 *
 * The chain used to be a bare `.then` per phase over a single top-level catch,
 * so ONE rejected wait anywhere took every phase after it with it: the page
 * reported however many assertions had accumulated, plus a single row saying
 * the harness did not run to the end, and gave no clue which phase or which
 * wait. That is not a smaller pass - it is a whole suite deleted from the
 * report by one broken condition, and it is exactly the shape a milestone
 * appending to this file trips over.
 *
 * Now a phase that throws says so as itself, names the wait that gave up, and
 * the phases after it still run. The count therefore stays honest, which is
 * what dev/chrome.js's floor is comparing against.
 */
function phase(name, fn) {
  return function (v) {
    return Promise.resolve().then(function () { return fn(v); })
      .catch(function (e) {
        ok(name + ' ran to the end', false, String((e && e.stack) || e));
        return v;
      });
  };
}

booted('f')
  .then(phase('run', run))
  .then(phase('pointerPhase', pointerPhase))
  .then(phase('readOnlyPhase', readOnlyPhase))
  .then(phase('readOnlyWithCardsPhase', readOnlyWithCardsPhase))
  .then(phase('stickyPhase', stickyPhase))
  .then(phase('linkPhase', linkPhase))
  .then(phase('annotationPhase', annotationPhase))
  .then(phase('groupPhase', groupPhase))
  .then(phase('mixedPhase', mixedPhase))
  .then(phase('hostilePhase', hostilePhase))
  .then(phase('mergePhase', mergePhase))
  .then(phase('writePhase', writePhase))
  .then(phase('quietPhase', quietPhase))
  .then(phase('launchPhase', launchPhase))
  .then(phase('boardParamPhase', boardParamPhase))
  .then(phase('forcedHomePhase', forcedHomePhase))
  .then(phase('homePhase', homePhase))
  .then(phase('switchPhase', switchPhase))
  .then(phase('pickPhase', pickPhase))
  .then(phase('searchPhase', searchPhase))
  .then(phase('focusPhase', focusPhase))
  .then(phase('hostileSearchPhase', hostileSearchPhase))
  .then(phase('embedPhase', embedPhase))
  // f15's own phases, in order: they navigate one library between two boards
  // and back, and the last of them replaces that library outright.
  .then(phase('leavePhase', leavePhase))
  .then(phase('leaveMorePhase', leaveMorePhase))
  .then(phase('switchAwayPhase', switchAwayPhase))
  .then(phase('guardPhase', guardPhase))
  .then(phase('answerPhase', answerPhase))
  .then(phase('pagingPhase', pagingPhase))
  .then(phase('aiPhase', aiPhase))
  .then(phase('exportPhase', exportPhase))
  .then(report)
  // Still here, for anything the per-phase catch cannot reach: a boot that
  // never comes up, and report() itself.
  .catch(function (e) {
    ok('the harness ran to the end', false, String((e && e.stack) || e));
    report();
  });

function run(W) {
  var app = W.BB.app, S = app.S, model = W.BB.model, boardMod = W.BB.board;
  var mock = W.Synapse.__mock;

  /* ---------------- what came up ---------------- */

  ok('the board loaded from the note', Object.keys(S.store.board.items).length === 4,
    JSON.stringify(Object.keys(S.store.board.items)));
  ok('it is not read-only', S.readOnly === false, S.why);
  eq('a card was drawn for every item', W.document.querySelectorAll('.bb-card').length, 4);

  var excerptQueries = mock.queries.filter(function (q) { return /substr\(content/.test(q); });
  eq('every card resolved in ONE query', excerptQueries.length, 1);
  ok('and that query was bounded in SQL', /substr\(content, 1, 400\)/.test(excerptQueries[0]), excerptQueries[0]);

  /* ---------------- the card face ---------------- */

  var c1 = card(W, 'n1');
  eq('a live card shows the note title', c1.querySelector('.ct').textContent, 'Pricing');
  eq('and an excerpt stripped of markdown', c1.querySelector('.cx').textContent, 'Three tiers, annual only.');
  ok('with no code fence in it', c1.textContent.indexOf('const hidden') < 0, c1.textContent);

  var c2 = card(W, 'n2');
  eq('a title that looks like markup is text', c2.querySelector('.ct').textContent, 'Interview <script>alert(1)<\/script>');
  ok('and nothing built markup out of it', c2.innerHTML.indexOf('<script') < 0, c2.innerHTML);
  eq('no script element reached the document', W.document.querySelectorAll('#cards script').length, 0);

  /* ---------------- tag chips and the task marker ---------------- */

  var chips1 = Array.prototype.map.call(c1.querySelectorAll('.cc .chip.tag'), function (e) { return e.textContent; });
  eq('a card shows its note\'s tags as chips', chips1.join(','), 'pricing,q3');
  eq('a tag with a usable colour wears it',
    c1.querySelector('.cc .chip.tag').style.getPropertyValue('--chip'), '#4f6ef7');
  eq('one whose colour is not a colour does not', 
    c1.querySelectorAll('.cc .chip.tag')[1].style.getPropertyValue('--chip'), '');
  ok('and the chip is text, not markup', c1.querySelector('.cc').innerHTML.indexOf('<script') < 0);
  var tagQueries = mock.queries.filter(function (q) { return /from\s+note_tags/i.test(q); });
  eq('the tags took ONE query for the whole board', tagQueries.length, 1);
  ok('joined to the tags table', /note_tags[\s\S]*join[\s\S]*tags/i.test(tagQueries[0]), tagQueries[0]);
  ok('and paged like everything else that can exceed the row cap', /limit\s+100/i.test(tagQueries[0]), tagQueries[0]);

  ok('a task card carries a checkbox', c2.className.indexOf('task') >= 0, c2.className);
  ok('drawn as its own element, not inside the title',
    !!c2.querySelector('.tk') && c2.querySelector('.tk').hidden === false);
  ok('and it is not ticked, the task not being done', c2.className.indexOf('done') < 0, c2.className);
  ok('a note that is not a task has no checkbox', c1.className.indexOf('task') < 0, c1.className);
  ok('and the box is hidden on it', card(W, 'n1').querySelector('.tk').hidden === true);
  /*
   * The checkbox is a control from M5 on, and it is the CARD's own element -
   * no <input>, no <button>, because everything on this canvas is driven by
   * the one pointer layer and a native control would take the gesture away
   * from it. What makes it a target is the id it carries.
   */
  eq('nothing native is nested inside the checkbox',
    c2.querySelectorAll('.tk input, .tk button').length, 0);
  eq('and it carries its own card\'s id, so a press on it lands somewhere',
    c2.querySelector('.tk').dataset.tick, 'n2');
  ok('a card with no tags shows no tag chips', c2.querySelectorAll('.cc .chip.tag').length === 0);

  /* ---------------- tombstones ---------------- */

  var c3 = card(W, 'n3');
  ok('a note that no longer resolves is a tombstone', c3.className.indexOf('tomb') >= 0, c3.className);
  eq('labelled with the last title it had', c3.querySelector('.ct').textContent, 'Interview script');
  ok('and it is still on the board', !!model.item(S.store.board, 'n3'));
  eq('the app counts it', S.tombstones, 1);

  /* ---------------- items M3 does not own ---------------- */

  var s1 = card(W, 's1');
  ok('a sticky is drawn as a sticky, not as a card', s1.className.indexOf('k-sticky') >= 0, s1.className);
  eq('holding its own text', s1.querySelector('.ct').textContent, 'call the vendor');
  ok('with no chip row explaining what it is', s1.querySelector('.cc').hidden === true);
  ok('and it did not take the renderer down', W.document.querySelectorAll('.bb-card').length === 4);

  /* ---------------- selection ---------------- */

  return tapCard(W, 'n1').then(function () {
    eq('a tap selects one card', Object.keys(S.sel).join(','), 'n1');
    ok('the bar names it', barText(W).indexOf('Pricing') >= 0, barText(W));
    ok('and offers to open the actions', !!btn(W, '#bottombar', 'Actions'), barText(W));
    ok('but does not offer to remove it yet', !btn(W, '#bottombar', 'Remove'), barText(W));
    return tapCard(W, 'n1');
  }).then(function () {
    ok('tapping again opens the action bar', S.barOpen === true);
    ok('which offers the note itself', !!btn(W, '#bottombar', 'Open note'), barText(W));
    ok('and removing the card from the board', !!btn(W, '#bottombar', 'Remove from board'), barText(W));
    return tapCard(W, 'n3');
  }).then(function () {
    ok('a tombstone can be selected', !!S.sel.n3);
    return tapCard(W, 'n3');
  }).then(function () {
    ok('its bar says the note is gone', barText(W).indexOf('This note is gone') >= 0, barText(W));
    ok('and still offers Remove from board', !!btn(W, '#bottombar', 'Remove from board'), barText(W));
    return tapBackground(W);
  }).then(function () {
    eq('tapping the background clears the selection', Object.keys(S.sel).length, 0);

    /* ---------------- dragging one card ---------------- */

    var before = S.store.board.items.n1.p.slice();
    var screenBefore = app.itemScreenRect('n1');
    var undos = S.store.undo.length;
    return dragCard(W, 'n1', 120, 60).then(function () {
      var after = S.store.board.items.n1.p;
      near('a drag moves the card in board units', after[0] - before[0], 120 / S.k, 2);
      near('on both axes', after[1] - before[1], 60 / S.k, 2);
      var screenAfter = app.itemScreenRect('n1');
      near('and it moved that far on screen', screenAfter.left - screenBefore.left, 120, 2, 'screen x');
      near('vertically too', screenAfter.top - screenBefore.top, 60, 2, 'screen y');
      eq('the whole drag is one undo step', S.store.undo.length - undos, 1);
      eq('and the step says what it was', S.store.undo[S.store.undo.length - 1].label, 'move a card');
      return settle();
    });
  }).then(function () {
    var p = S.store.board.items.n1.p.slice();
    app.ops.undo();
    return settle().then(function () {
      ok('undo puts it back', S.store.board.items.n1.p.join(',') !== p.join(','), S.store.board.items.n1.p.join(','));
      app.ops.redo();
      return settle();
    }).then(function () {
      eq('and redo moves it again', S.store.board.items.n1.p.join(','), p.join(','));
    });

    /* ---------------- multi-selection ---------------- */

  }).then(function () {
    // Something is already selected, from an ordinary tap made for an ordinary
    // reason. STARTING a multi-selection has to start with one card - the one
    // under the finger - or "select several" begins with two in it, one of them
    // chosen minutes ago.
    return tapCard(W, 'n2');
  }).then(function () {
    ok('a card is selected before the long press', !!S.sel.n2 && Object.keys(S.sel).length === 1);
    return longPressCard(W, 'n1');
  }).then(function () {
    ok('a long press starts a multi-selection', S.selectMode === true);
    ok('with the pressed card in it', !!S.sel.n1);
    eq('and ONLY the pressed card', Object.keys(S.sel).join(','), 'n1');
    ok('the card selected before it is not swept in', !S.sel.n2, Object.keys(S.sel).join(','));
    ok('and the bar counts it', barText(W).indexOf('1 selected') >= 0, barText(W));
    return tapCard(W, 'n2');
  }).then(function () {
    eq('tapping adds to the selection', Object.keys(S.sel).sort().join(','), 'n1,n2');
    ok('the bar counts both', barText(W).indexOf('2 selected') >= 0, barText(W));

    var a0 = S.store.board.items.n1.p.slice(), b0 = S.store.board.items.n2.p.slice();
    var undos = S.store.undo.length;
    return dragCard(W, 'n1', -80, 40).then(function () {

  }).then(function () {
