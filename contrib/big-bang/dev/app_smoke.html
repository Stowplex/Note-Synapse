/*
 * A `normal` launch: no note, so the board home. Everything here is about the
 * LIST - which notes are boards, in what order, and what a row says.
 */
function homePhase() {
  return booted('f9').then(function (W) {
    var app = W.BB.app, S = app.S, mock = W.Synapse.__mock;

    ok('a launch with no note opens the home', S.mode === 'home', S.mode);
    ok('and knows it has one to go back to', S.standalone === true);
    ok('the home is on screen', shows(W, 'home'));
    ok('and the canvas is not', W.getComputedStyle(W.document.getElementById('stage')).display === 'none');
    ok('the Home button is not offered ON the home', W.document.getElementById('btnHome').hidden === true);

    return waitFor(function () { return S.home && !S.home.loading; }, 5000, 'the board list').then(function () {
      var titles = homeRowTitles(W);
      ok('New board is offered', titles.indexOf('New board') >= 0, titles.join('|'));
      ok('so is opening another note as a board',
        titles.indexOf('Open another note as a board') >= 0, titles.join('|'));

      var boards = S.home.boards.map(function (b) { return b.id; });
      eq('the boards are the notes holding a block', boards.join(','), 'bb,ba');
      ok('most recently changed first', boards[0] === 'bb', boards.join(','));
      ok('a note that has never been a board is not listed', titles.indexOf('Loose note') < 0, titles.join('|'));
      ok('an archived note is not listed either', titles.indexOf('Archived board') < 0, titles.join('|'));

      var alpha = homeRowByTitle(W, 'Alpha board');
      ok('a board is a row you can press', !!alpha, titles.join('|'));
      ok('the row says how many cards are on it', /3 cards/.test(subOf(alpha)), subOf(alpha));
      ok('and when it was last changed', /ago/.test(subOf(alpha)), subOf(alpha));
      ok('a board of one card says so in the singular',
        /\b1 card\b/.test(subOf(homeRowByTitle(W, 'Beta board'))), subOf(homeRowByTitle(W, 'Beta board')));

      /*
       * How long ago, in the roughest unit that is still true. Asserted on
       * fixed pairs of dates rather than on "now", so it cannot pass by
       * agreeing with the clock it was computed from.
       */
      var t = Date.parse('2026-06-01T12:00:00Z');
      eq('a minute ago', app.ago('2026-06-01T11:59:00Z', t), '1 minute ago');
      eq('half an hour ago', app.ago('2026-06-01T11:30:00Z', t), '30 minutes ago');
      eq('two hours ago', app.ago('2026-06-01T10:00:00Z', t), '2 hours ago');
      eq('three days ago', app.ago('2026-05-29T12:00:00Z', t), '3 days ago');
      eq('a fortnight ago', app.ago('2026-05-18T12:00:00Z', t), '2 weeks ago');
      eq('months ago', app.ago('2026-01-01T12:00:00Z', t), '5 months ago');
      eq('a moment ago is not a count of zero', app.ago('2026-06-01T11:59:45Z', t), 'just now');
      eq('a date nothing can parse says nothing at all', app.ago('not a date', t), '');
      eq('and neither does a missing one', app.ago(null, t), '');
      eq('a board with no count shows only when it changed',
        app.boardSub({ updatedAt: '2026-06-01T11:00:00Z', cards: null }).indexOf('card'), -1);

      /*
       * And the shape the column really has ON A PHONE. `notes.updatedAt` is
       * declared INTEGER NOT NULL and written as millisecondsSinceEpoch, and
       * runQuery passes column values through as they are - so on a device
       * every row arrives here as a NUMBER. Date.parse cannot read one
       * ('1780012800000' is not a date), so the home showed no time at all
       * under any of its rows; the harness could not see it, because the mock
       * is the one place the ISO string is real.
       */
      eq('a date in milliseconds is read as one',
        app.ago(Date.parse('2026-06-01T10:00:00Z'), t), '2 hours ago');
      eq('and one in days too',
        app.ago(Date.parse('2026-05-29T12:00:00Z'), t), '3 days ago');
      ok('so a row whose host answered with a number still says when',
        /ago/.test(app.boardSub({ updatedAt: Date.parse('2026-06-01T10:00:00Z'), cards: 3 })),
        app.boardSub({ updatedAt: Date.parse('2026-06-01T10:00:00Z'), cards: 3 }));
      // Both shapes, same answer: that is the whole of the contract.
      eq('a number and a string say the same thing',
        app.ago(Date.parse('2026-06-01T10:00:00Z'), t), app.ago('2026-06-01T10:00:00Z', t));

      var lists = mock.queries.filter(function (q) { return /content like/i.test(q); });
      eq('the whole list took ONE query', lists.length, 1);
      ok('and no note body came with it', !/substr\(content/i.test(lists[0]), lists[0]);
      eq('nothing was written to open the home', mock.updates.length, 0);
      return W;
    });
  });
}

/*
 * Board switching, which is where an edit gets lost.
 *
 * The M3 reviewer called it in advance: a pending debounce timer, a session
 * swapped underneath it, and the timer wakes up and writes the NEW board into
 * the new note - dropping the old board's edit silently. So the edit here is
 * made and the switch is immediate, and what is asserted is what ended up in
 * each of the two notes.
 */
function switchPhase() {
  return booted('f9').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model, mock = W.Synapse.__mock;
    var before = mock.updates.length;

    return Promise.resolve(app.ops.open('ba', 'Alpha board')).then(function () {
      return settle();
    }).then(function () {
      ok('the board opened', S.mode === 'board', S.mode);
      eq('with its cards', Object.keys(S.store.board.items).length, 3);
      eq('and its name in the bar', W.document.getElementById('title').textContent, 'Alpha board');
      ok('the canvas is back', shows(W, 'stage'));
      ok('and the home is gone', W.document.getElementById('home').hidden === true);
      ok('the way back is offered', W.document.getElementById('btnHome').hidden === false);
      eq('opening it wrote nothing', mock.updates.length, before);
      ok('and left nothing pending', S.saveTimer === null && S.dirty === false, String(S.saveTimer));

      /* ---- an edit, and a switch before the debounce fires ---- */

      app.ops.colour('n1', 'teal');
      ok('the edit is pending', S.dirty === true);
      ok('on a timer that has not fired', S.saveTimer !== null);
      return Promise.resolve(app.ops.goHome());
    }).then(function () {
      return waitFor(function () { return S.mode === 'home'; }, 5000, 'the home to come back');
    }).then(function () {
      var alpha = W.BB.board.read(mock.notes.ba.content);
      eq('leaving the board wrote the edit that was still on the timer',
        alpha.board.items.n1.c, 'teal');
      ok('the prose around it survived', mock.notes.ba.content.indexOf(HOME_A_LINE) >= 0);
      ok('nothing is left dirty', S.dirty === false);
      ok('and no timer is left armed', S.saveTimer === null, String(S.saveTimer));
      eq('exactly one write went out', mock.updates.length, before + 1);

      /* ---- and the OTHER board is untouched by any of it ---- */

      return Promise.resolve(app.ops.open('bb', 'Beta board'));
    }).then(function () {
      return wait(1400);                       // well past the edit debounce
    }).then(function () {
      eq('the second board opened as itself', Object.keys(S.store.board.items).length, 1);
      eq('and the first board\'s edit did not follow it into this note',
        mock.notes.bb.content, HOME_B_NOTE);
      eq('no further write went out', mock.updates.length, before + 1);
      var beta = W.BB.board.read(mock.notes.bb.content);
      eq('the second note still holds its own single card', Object.keys(beta.board.items).length, 1);
      ok('and no card of the first board', !beta.board.items.n2, JSON.stringify(Object.keys(beta.board.items)));

      /* ---- New board: a note of its own, said out loud ---- */

      var saves = mock.saves.length;
      return Promise.resolve(app.ops.goHome()).then(function () {
        return Promise.resolve(app.ops.newBoard());
      }).then(function () {
        return settle();
      }).then(function () {
        eq('a new board created exactly one note', mock.saves.length, saves + 1);
        ok('and opened it', S.mode === 'board' && S.session !== null);
        eq('as an empty board', Object.keys(S.store.board.items).length, 0);
        ok('the new note is named for what it is', /Big Bang board/.test(W.document.getElementById('title').textContent),
          W.document.getElementById('title').textContent);
        ok('and the user is told a note was made', /new note/i.test(bannerText(W)), bannerText(W));
        var made = S.session.noteId;
        ok('an empty board writes no block at all', mock.notes[made].content.indexOf('synapse-bigbang') < 0,
          mock.notes[made].content);
        return Promise.resolve(app.ops.goHome());
      }).then(function () {
        return waitFor(function () { return S.home && !S.home.loading; }, 5000, 'the list again');
      }).then(function () {
        eq('so it is not in the list of boards yet', S.home.boards.length, 2);
      });

      /* ---- opening any note as a board, from the picker ---- */

    }).then(function () {
      var updates = mock.updates.length;
      W.__BB_PICK__ = function () { return ['h4']; };
      return Promise.resolve(app.ops.openPicked()).then(function () {
        return waitFor(function () { return S.mode === 'board' && S.session && S.session.noteId === 'h4'; },
          5000, 'the picked note to open as a board');
      }).then(function () {
        W.__BB_PICK__ = null;
        eq('a note that was never a board opens as an empty one', Object.keys(S.store.board.items).length, 0);
        eq('and its own text is untouched', mock.notes.h4.content, 'This one has never been a board.\n');
        eq('nothing was written to open it', mock.updates.length, updates);
        return W;
      });
    });
  });
}

/*
 * The + button: the native picker, and the cards it drops on the board.
 */
function pickPhase() {
  return booted('f11').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model, mock = W.Synapse.__mock;
    var board = S.store.board;

    function plus() { return btn(W, '#bottombar', 'Add notes'); }

    ok('the board bar offers a way to add notes', !!plus(), barText(W));

    /* ---- a note already on the board is not added twice ---- */

    var n0 = Object.keys(board.items).length;
    W.__BB_PICK__ = function () { return ['s1']; };
    plus().click();
    return waitFor(function () { return S.picking === false; }, 5000, 'the picker to answer').then(function () {
      return settle();
    }).then(function () {
      eq('a note that is already on the board is not added again', Object.keys(board.items).length, n0);
      ok('and it says so', /already on this board/.test(bannerText(W)), bannerText(W));
      eq('so there is still exactly one card for it', model.cardsForNote(board, 's1').length, 1);

      /* ---- two new notes, one undo step ---- */

      var undos = S.store.undo.length;
      W.__BB_PICK__ = function () { return ['s4', 's5']; };
      plus().click();
      return waitFor(function () { return S.picking === false; }, 5000, 'the second pick').then(function () {
        return waitFor(function () { return model.cardsForNote(board, 's5').length === 1; }, 5000, 'the cards to land');
      }).then(function () {
        eq('both notes are on the board', Object.keys(board.items).length, n0 + 2);
        eq('as one undo step', S.store.undo.length - undos, 1);
        eq('and one card each', model.cardsForNote(board, 's4').length, 1);
        var id = model.cardsForNote(board, 's4')[0];
        ok('the new card is selected', S.sel[id] === true, JSON.stringify(Object.keys(S.sel)));
        ok('the board is dirty, because a card was really added', S.dirty === true);

        // Dropped where the user is looking, not off the edge of the plane.
        var r = app.itemScreenRect(id), st = stageOf(W).getBoundingClientRect();
        ok('and it landed inside the visible canvas',
          r.left >= st.left - 40 && r.right <= st.right + 40 && r.top >= st.top - 40 && r.bottom <= st.bottom + 40,
          JSON.stringify(r) + ' in ' + JSON.stringify({ l: st.left, t: st.top, r: st.right, b: st.bottom }));

        return waitFor(function () {
          var c = card(W, id);
          return c && c.querySelector('.ct').textContent === 'Vendor call';
        }, 5000, 'the new card to resolve').then(function () {
          ok('and the card shows the note it points at', true);
        });
      });
    }).then(function () {
      /* ---- undo takes both of them off again ---- */
      app.ops.undo();
      return settle();
    }).then(function () {
      eq('undo removes the whole batch', Object.keys(board.items).length, n0);
      app.ops.redo();
      return settle();
    }).then(function () {
      eq('and redo puts it back', Object.keys(board.items).length, n0 + 2);

      /* ---- cancelling adds nothing ---- */

      var items = Object.keys(board.items).length;
      var undos = S.store.undo.length;
      W.__BB_PICK__ = function () { return { success: true, cancelled: true, notes: [] }; };
      plus().click();
      return waitFor(function () { return S.picking === false; }, 5000, 'the cancelled pick').then(settle).then(function () {
        eq('a cancelled pick adds nothing', Object.keys(board.items).length, items);
        eq('and leaves no undo step behind', S.store.undo.length, undos);

        /* ---- a context with no picker says so ---- */
        W.__BB_PICK__ = function () { return { success: false, error: 'no_ui' }; };
        plus().click();
        return waitFor(function () { return S.picking === false; }, 5000, 'the refused pick');
      }).then(settle).then(function () {
        eq('a host with no picker changes nothing', Object.keys(board.items).length, items);
        ok('and says why', /no screen here/i.test(bannerText(W)), bannerText(W));
        W.__BB_PICK__ = null;
        return W;
      });
    });
  });
}

/*
 * Get whatever an earlier phase left pending out of the way, so that "this
 * wrote nothing" is about THIS phase. The phases share a frame on purpose -
 * the picker's cards are what the search then searches - and a debounce armed
 * two phases ago would otherwise be counted against the one asserting.
 */
function settleBoard(W) {
  var S = W.BB.app.S;
  return Promise.resolve(W.BB.app.ops.save())
    .then(function () { return waitFor(function () { return !S.dirty && !S.saving; }, 5000, 'the board to settle'); })
    .then(settle);
}

/*
 * Search: matching cards stay lit, everything else dims - and the board is not
 * changed by any of it. The last part is the point: a search that dirtied the
 * note would rewrite it, and reorder the home list, for having been read.
 */
function searchPhase() {
  return booted('f11').then(function (W) { return settleBoard(W).then(function () { return W; }); }).then(function (W) {
    var app = W.BB.app, S = app.S, mock = W.Synapse.__mock;
    var q = W.document.getElementById('q');

    function type(text) {
      q.value = text;
      q.dispatchEvent(new W.Event('input', { bubbles: true }));
      return settle();
    }
    function isDim(id) {
      var e = card(W, id) || W.document.querySelector('#handles [data-id="' + id + '"]') ||
        W.document.querySelector('#groups [data-id="' + id + '"]');
      return (' ' + classOf(e) + ' ').indexOf(' dim ') >= 0;
    }
    /*
     * isDim resolves an id through #handles FIRST, so `l1` is the link's
     * midpoint handle and `g1` is the group's tab - and the four other things
     * that carry a dim class were never asked about at all: the LINE itself,
     * the group FRAME, an annotation's leader, and a link's label. Each of
     * those could drop its dimmed() term on its own and the whole suite stayed
     * green, which is exactly the half of "a search can never leave a bright
     * line hanging off a dim card" that matters. So they are addressed by
     * where they are drawn instead.
     */
    function isDimEl(e) { return (' ' + classOf(e) + ' ').indexOf(' dim ') >= 0; }
    function edge() { return W.document.querySelector('#edges path.bb-edge'); }
    function leader() { return W.document.querySelector('#edges path.bb-lead'); }
    function label() { return W.document.querySelector('#handles .bb-label'); }
    function frame() { return W.document.querySelector('#groups [data-id="g1"]'); }

    ok('the search box is not showing until it is asked for', W.document.getElementById('searchbar').hidden === true);
    W.document.getElementById('btnSearch').click();
    return settle().then(function () {
      ok('the search box opens', shows(W, 'searchbar'));
      ok('and nothing is dimmed by an empty query', !isDim('n1') && !isDim('n2'), classOf(card(W, 'n1')));
      ok('the board really does draw all four of the other dimmable things',
        !!edge() && !!leader() && !!label() && !!frame(),
        [!!edge(), !!leader(), !!label(), !!frame()].join(','));
      ok('and none of them is dimmed by an empty query either',
        !isDimEl(edge()) && !isDimEl(leader()) && !isDimEl(label()) && !isDimEl(frame()),
        [classOf(edge()), classOf(leader()), classOf(label()), classOf(frame())].join(' | '));
      var updates = mock.updates.length;
      var dirty = S.dirty;

      return type('pricing').then(function () {
        ok('a card whose TITLE matches stays lit', !isDim('n1'), classOf(card(W, 'n1')));
        ok('one that does not match is dimmed', isDim('n2'), classOf(card(W, 'n2')));
        ok('and so is the sticky', isDim('k1'), classOf(card(W, 'k1')));

        /*
         * The other four. Only n1 matched, so the line hanging off it (its far
         * end is the dim n2), that line's label, the frame of a group that was
         * not named, and the leader of an annotation nobody searched for are
         * all part of what did NOT match - and a bright one of any of them is
         * a line, a word or a box left hanging off a dimmed card.
         */
        ok('the LINE out of the lit card dims with the card at its far end',
          isDimEl(edge()), classOf(edge()));
        ok('and so does the label written on it', isDimEl(label()), classOf(label()));
        ok('the group FRAME dims when its name is not what matched',
          isDimEl(frame()), classOf(frame()));
        ok('and an annotation\'s leader dims with the annotation',
          isDimEl(leader()) && isDim('a1'), classOf(leader()) + ' | ' + classOf(card(W, 'a1')));
        ok('the box says how many matched', /1 of /.test(W.document.getElementById('qcount').textContent),
          W.document.getElementById('qcount').textContent);
        eq('and searching wrote nothing', mock.updates.length, updates);
        eq('nor did it dirty the board', S.dirty, dirty);
        ok('and armed no save', S.saveTimer === null, String(S.saveTimer));
        return type('importer');
      }).then(function () {
        ok('an EXCERPT matches too', !isDim('n3'), classOf(card(W, 'n3')));
        ok('while the others dim', isDim('n1') && isDim('n2'));
        return type('call the vendor');
      }).then(function () {
        ok('a sticky is matched on its own text', !isDim('k1'), classOf(card(W, 'k1')));
        ok('and the note cards dim', isDim('n1') && isDim('n3'));
        return type('feeds');
      }).then(function () {
        ok('a link label matches', !isDim('l1'), classOf(W.document.querySelector('.bb-link')));
        ok('and brings both its ends with it', !isDim('n1') && !isDim('n2'),
          classOf(card(W, 'n1')) + ' / ' + classOf(card(W, 'n2')));
        ok('a card at neither end still dims', isDim('n3'), classOf(card(W, 'n3')));
        var line = W.document.querySelector('#edges path.bb-edge');
        ok('the line itself is drawn lit', (' ' + classOf(line) + ' ').indexOf(' dim ') < 0, classOf(line));
        ok('and the label that matched is lit with it', !isDimEl(label()), classOf(label()));
        ok('while the frame of a group nobody named is still dim',
          isDimEl(frame()), classOf(frame()));
        ok('and so is the leader of an annotation nobody named',
          isDimEl(leader()), classOf(leader()));
        return type('needs a source');
      }).then(function () {
        ok('an annotation is matched on its own text', !isDim('a1'), classOf(card(W, 'a1')));
        ok('and its leader is drawn lit', !isDimEl(leader()), classOf(leader()));
        ok('while the line it does not point at dims', isDimEl(edge()), classOf(edge()));
        return type('money');
      }).then(function () {
        ok('a group name matches', !isDim('g1'), classOf(W.document.querySelector('.bb-gtab')));
        ok('and the FRAME it names is lit, not only its tab', !isDimEl(frame()), classOf(frame()));
        ok('while a line whose far end is outside it dims', isDimEl(edge()), classOf(edge()));
        ok('and its members stay lit', !isDim('n1') && !isDim('n3'));
        ok('while a card outside it dims', isDim('n2'), classOf(card(W, 'n2')));
        return type('zzzz');
      }).then(function () {
        ok('a query that matches nothing dims everything',
          isDim('n1') && isDim('n2') && isDim('n3') && isDim('k1'));
        eq('and says so in words', W.document.getElementById('qcount').textContent, 'nothing');
        return type('');
      }).then(function () {
        ok('an empty query lights the board again', !isDim('n1') && !isDim('n2') && !isDim('n3'));
        // Every query above, and not one of them changed the board. The
        // assertion is here rather than at the end of the phase because what
        // follows makes a real edit on purpose.
        ok('none of that searching touched the board',
          S.dirty === dirty && mock.updates.length === updates && S.saveTimer === null,
          S.dirty + ' / ' + mock.updates.length + ' / ' + S.saveTimer);

        /*
         * A card that arrives WHILE a search is up has to be judged by it.
         * The board moves under the dimming - this is the case where a stale
         * match set would draw a brand new card as if it had been considered
         * and rejected.
         */
        return type('vendor').then(function () {
          var st = stageOf(W).getBoundingClientRect();
          return longPressBg(W, st.left + 100, st.top + 220);
        }).then(function () {
          return typeInto(W, 'ring the vendor back');
        }).then(function () {
          var made = Object.keys(S.store.board.items).filter(function (id) {
            var it = S.store.board.items[id];
            return it.k === 'sticky' && it.t === 'ring the vendor back';
          })[0];
          ok('a sticky written while a search is up exists', !!made, JSON.stringify(Object.keys(S.store.board.items)));
          ok('and is judged by that search rather than left over from before',
            !isDim(made), classOf(card(W, made)));
          ok('while what did not match is still dimmed', isDim('n1'), classOf(card(W, 'n1')));
          app.ops.remove([made]);
          return settleBoard(W);
        });
      }).then(function () {
        return type('');
      }).then(function () {
        var settled = mock.updates.length;
        W.document.getElementById('qdone').click();
        return settle().then(function () {
          ok('Done closes the box', W.document.getElementById('searchbar').hidden === true);
          ok('and leaves nothing dimmed', !isDim('n1') && !isDim('n2'));
          ok('closing it writes nothing either', S.dirty === false && mock.updates.length === settled,
            S.dirty + ' / ' + mock.updates.length);
          return W;
        });
      });
    });
  });
}

/*
 * Focus: this card's neighbourhood, brought into view. The camera moves - and
 * that move is SOFT, so a board that was only looked at is not rewritten.
 */
function focusPhase() {
  return booted('f11').then(function (W) { return settleBoard(W).then(function () { return W; }); }).then(function (W) {
    var app = W.BB.app, S = app.S, mock = W.Synapse.__mock;
    function isDim(id) {
      var e = card(W, id) || W.document.querySelector('#handles [data-id="' + id + '"]');
      return (' ' + classOf(e) + ' ').indexOf(' dim ') >= 0;
    }
    var updates = mock.updates.length;
    var cam = { tx: S.tx, ty: S.ty, k: S.k };

    // Through the bar, the way a thumb reaches it: tap to select, tap again
    // for the actions.
    return tapCard(W, 'n1').then(function () { return tapCard(W, 'n1'); }).then(function () {
      var b = btnAt(W, '#bottombar', 'Focus');
      ok('a card\'s bar offers Focus', !!b, barText(W));
      b.click();
      return settle();
    }).then(function () {
      ok('the card is focused', S.focus === 'n1');
      ok('it stays lit', !isDim('n1'), classOf(card(W, 'n1')));
      ok('so does what it is linked to', !isDim('n2'), classOf(card(W, 'n2')));
      ok('and the link between them', !isDim('l1'));
      ok('a card that only shares a group frame is dimmed', isDim('n3'), classOf(card(W, 'n3')));
      ok('and an unrelated sticky is too', isDim('k1'), classOf(card(W, 'k1')));
      ok('the camera moved to bring the neighbourhood in',
        S.tx !== cam.tx || S.ty !== cam.ty || S.k !== cam.k,
        [S.tx, S.ty, S.k].join(',') + ' was ' + [cam.tx, cam.ty, cam.k].join(','));
      ok('but the board is not dirty for it', S.dirty === false);
      ok('it is owed, not owing', S.soft === true);
      ok('and no save was scheduled', S.saveTimer === null, String(S.saveTimer));

      return wait(1400);
    }).then(function () {
      eq('so nothing was written, however long you look', mock.updates.length, updates);
      var b = btnAt(W, '#bottombar', 'Unfocus');
      ok('the bar offers the way out', !!b, barText(W));
      b.click();
      return settle();
    }).then(function () {
      ok('unfocusing lights the board again', S.focus === null && S.lit === null);
      ok('and every card is drawn plainly', !isDim('n1') && !isDim('n3'));

      /* ---- searching and focusing are one state, not two ---- */

      app.ops.focus('n1');
      return settle().then(function () {
        W.document.getElementById('btnSearch').click();
        return settle();
      }).then(function () {
        ok('opening the search box drops the focus', S.focus === null, String(S.focus));
        W.document.getElementById('qdone').click();
        return settle();
      }).then(function () {
        eq('and nothing was written by any of it', mock.updates.length, updates);
        return W;
      });
    });
  });
}

/*
 * The hostile board again, this time for search: matching runs on TEXT, and a
 * card whose title and excerpt are markup is matched as the characters it is
 * made of. If anything anywhere built a node out of a note's text, this is
 * where a search for part of a tag would find it.
 */
function hostileSearchPhase() {
  return booted('f6').then(function (W) {
    var app = W.BB.app, S = app.S;
    function isDim(id) { return (' ' + classOf(card(W, id)) + ' ').indexOf(' dim ') >= 0; }

    W.document.getElementById('btnSearch').click();
    var q = W.document.getElementById('q');
    q.value = 'onerror';
    q.dispatchEvent(new W.Event('input', { bubbles: true }));
    return settle().then(function () {
      ok('a sticky whose text is markup is matched on it', !isDim('s1'), classOf(card(W, 's1')));
      ok('and so is a card whose excerpt is', !isDim('n1'), classOf(card(W, 'n1')));
      eq('no element was made out of any of it', W.document.querySelectorAll('#cards script, #cards img').length, 0);
      eq('the sticky is still a single text node',
        card(W, 's1').querySelector('.ct').childNodes.length, 1);
      q.value = 'nothing here at all';
      q.dispatchEvent(new W.Event('input', { bubbles: true }));
      return settle();
    }).then(function () {
      ok('and a query that matches neither dims both', isDim('s1') && isDim('n1'));
      W.document.getElementById('qdone').click();
      return settle().then(function () { return W; });
    });
  });
}

/*
 * The embed: compact, read-mostly, and refusing for real.
 *
 * Hiding the buttons is not a refusal. Every assertion below goes at the
 * ACTION rather than at the affordance - the ops are called directly, the
 * gestures are performed - and then at the note, which must not have been
 * written to at all.
 */
function embedPhase() {
  return booted('f10').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model, mock = W.Synapse.__mock;
    var board = S.store.board;

    ok('the embed knows what it is', S.embed === true);
    ok('and is read-only underneath', S.readOnly === true);
    eq('the board is drawn', W.document.querySelectorAll('.bb-card').length, 2);
    ok('there is no top bar', !shows(W, 'topbar'));
    ok('and no bottom bar', !shows(W, 'bottombar'));
    ok('nor a banner', !shows(W, 'banner'));
    ok('nor a bin', !shows(W, 'bin'));

    /* ---- a tap opens the note ---- */

    var opened = [];
    var realOpen = W.Synapse.openNote;
    W.Synapse.openNote = function (id) { opened.push(id); return realOpen.call(W.Synapse, id); };

    return tapCard(W, 'n1').then(function () {
      eq('tapping a card opens its note', opened.join(','), 'e1');
      eq('and selects nothing', Object.keys(S.sel).length, 0);
      ok('so no bar appears', !shows(W, 'bottombar'));

      /* ---- and every edit is refused, not merely unreachable ---- */

      var items = Object.keys(board.items).length;
      var pos = model.item(board, 'n1').p.slice();
      ok('a new sticky is refused', app.ops.newSticky(10, 10) === null);
      ok('so is removing a card', app.ops.remove(['n1']) === false);
      ok('so is drawing a link', app.ops.link('n1', 'n2') === null);
      ok('and so is grouping', app.ops.group(['n1', 'n2']) === null);
      ok('and recolouring', app.ops.colour('n1', 'teal') === false);
      eq('the board is exactly as it was', Object.keys(board.items).length, items);
      eq('and the card has not moved', model.item(board, 'n1').p.join(','), pos.join(','));

      return longPressBg(W, stageOf(W).getBoundingClientRect().left + 120,
        stageOf(W).getBoundingClientRect().top + 300);
    }).then(function () {
      eq('a long press leaves no sticky', Object.keys(board.items).length, 2);
      ok('and nothing is being edited', S.editing === null);
      /*
       * And an export. An embed is a picture of a board drawn INSIDE its own
       * note; making a second picture and attaching it to that note is not
       * something an embed does - and it is the one thing on this list that
       * writes to a note rather than to the block, so no other refusal covers
       * it.
       */
      var writes = mock.updates.length;
      return Promise.resolve(app.ops.exportBoard('png')).then(function (v) {
        eq('an embed will not export', v, false);
        eq('and wrote nothing', mock.updates.length, writes);
        eq('nor attached anything', mock.filesOn(S.session.noteId).length, 0);
        ok('and it is not left holding the flag', S.exporting === false, 'exporting');
      });
    }).then(function () {
      return dragCard(W, 'n2', 60, 40);
    }).then(function () {
      eq('a drag moves nothing', model.item(board, 'n2').p.join(','), '360,0');
      eq('and pushes no undo step', S.store.undo.length, 0);

      /* ---- and the three ops that got out from under the guarantee ---- */

      /*
       * "An embed cannot write by a route somebody forgot to hide a button
       * on" is the whole claim, and three ops walked out from under it. None
       * is reachable through an embed's chrome, because an embed draws none -
       * which is a reason to state the refusal rather than to leave the only
       * thing standing between a read-only view and a new row in the library
       * to a CSS rule.
       */
      var saves = mock.saves.length, updates = mock.updates.length, picks = mock.picks.length;
      var note = S.session && S.session.noteId;
      return Promise.resolve(app.ops.newBoard()).then(function (r) {
        eq('a new board is refused', r, false);
        eq('so no note was created for it', mock.saves.length, saves);
        ok('and the embed is still on its own board', S.session && S.session.noteId === note,
          S.session && S.session.noteId);
        // force() is the one write that does not answer to S.readOnly - it
        // clears it - so it is the one write an embed could still reach.
        return Promise.resolve(app.ops.force('conflict'));
      }).then(function (r) {
        ok('forcing a save is refused', r === null, JSON.stringify(r));
        eq('and wrote nothing', mock.updates.length, updates);
        ok('the embed is still read-only afterwards', S.readOnly === true);
        return Promise.resolve(app.ops.open('e1', 'Pricing'));
      }).then(function (r) {
        eq('an embed does not navigate to another board', r, false);
        ok('and is still showing the board it was embedded for',
          S.session && S.session.noteId === note, S.session && S.session.noteId);
        W.__BB_PICK__ = function () { return ['e2']; };
        return Promise.resolve(app.ops.openPicked());
      }).then(function (r) {
        W.__BB_PICK__ = null;
        eq('nor through the picker', r, false);
        eq('which was never even opened', mock.picks.length, picks);
        ok('the board is unchanged by all of it',
          Object.keys(board.items).length === 2 && S.dirty === false);
      }).then(function () {

        /* ---- but it is still a board you can look around ---- */

        var tx = S.tx;
        var st = stageOf(W), r = st.getBoundingClientRect();
        P(W, 'pointerdown', st, r.left + 200, r.top + 400);
        P(W, 'pointermove', st, r.left + 260, r.top + 400);
        P(W, 'pointerup', st, r.left + 260, r.top + 400);
        return settle().then(function () {
          ok('panning works', S.tx !== tx, S.tx + ' was ' + tx);
          return wait(3200);                      // past every debounce there is
        });
      });
    }).then(function () {
      W.Synapse.openNote = realOpen;
      eq('and after all that, the note was never written', mock.updates.length, 0);
      eq('byte for byte', mock.notes['mock-note-1'].content, EMBED_NOTE);
      ok('nothing is dirty', S.dirty === false && S.soft === false);
      ok('and no save is pending', S.saveTimer === null, String(S.saveTimer));
      return Promise.resolve(app.ops.save()).then(function (r) {
        eq('even asking for a save outright writes nothing', mock.updates.length, 0);
        ok('and it answers with nothing to report', r === null, JSON.stringify(r));
        return W;
      });
    });
  });
}

/*
 * Leaving a board, which is the one thing in this app that can silently lose
 * an edit - and the one thing no test looked at while a save was OUT.
 *
 * A save clears `dirty` when it STARTS, so for as long as it is in flight the
 * board looks clean. A leave that only asked about `dirty` therefore walked
 * straight past a live save, swapped the session, and the answer - a conflict
 * banner, a transient failure that would have retried - was declined by
 * save()'s own session guard and thrown away without a word, along with the
 * edit that provoked it. Every case here starts a real save, holds it open at
 * the bridge, and taps Home while it is out.
 */
function leavePhase() {
  return booted('f15').then(function (W) {
    var app = W.BB.app, S = app.S, mock = W.Synapse.__mock;

    // Hold the WRITE. Everything up to it has already happened: the note was
    // re-read, no conflict was found, the text was spliced.
    var releaseWrite = null;
    function holdWrite(answer) {
      releaseWrite = null;
      W.__BB_UPDATE__ = function () {
        return new W.Promise(function (res) { releaseWrite = function () { res(answer); }; });
      };
    }
    /*
     * Hold the READ, which is where a conflict is found: another session's
     * save lands in exactly this window, and the answer that comes back is
     * "the note holds a different board than the one you loaded".
     */
    var releaseRead = null;
    function holdReadThenConflict(noteId, theirs) {
      releaseRead = null;
      W.__BB_QUERY__ = function (sql) {
        if (sql.indexOf('clen') < 0 || sql.indexOf("id = '" + noteId + "'") < 0) return null;
        return new W.Promise(function (res) {
          releaseRead = function () {
            mock.notes[noteId].content = theirs;
            W.__BB_QUERY__ = null;
            res(W.Synapse.runQuery(sql));
          };
        });
      };
    }

    return Promise.resolve(app.ops.open('ba', 'Alpha board')).then(settle).then(function () {

      /* ---- a transient failure, answered while Home was tapped ---- */

      ok('the board is open', S.mode === 'board' && S.session.noteId === 'ba', S.mode);
      app.ops.colour('n1', 'sky');
      ok('something is waiting to be written', S.dirty === true);
      holdWrite({ success: false, error: 'database is locked' });
      var saving = app.ops.save();
      ok('the save is OUT', S.inflight !== null && S.saving === true);
      ok('and the board already looks clean, which is the whole trap',
        S.dirty === false, String(S.dirty));

      var home = app.ops.goHome();
      return settle().then(function () {
        ok('leaving has not finished while the save is still out',
          S.mode === 'board', S.mode);
        releaseWrite();
        return Promise.all([home, saving]);
      }).then(function (r) {
        W.__BB_UPDATE__ = null;
        ok('the board is still open', S.mode === 'board' && S.session !== null, S.mode);
        eq('and going home said so', r[0], false);
        ok('the edit was put back, not dropped', S.dirty === true, String(S.dirty));
        ok('the card still has the colour that was typed',
          W.BB.model.item(S.store.board, 'n1').c === 'sky');
        ok('the navigation says why it did not happen',
          /could not be saved/i.test(bannerText(W)) && /still open/i.test(bannerText(W)), bannerText(W));
        // The toast is standing in front of the banner the refusal wrote; the
        // banner is what is left when it goes.
        ok('and behind it the board says it will try again',
          !!S.hold && /try again/i.test(S.hold.text), JSON.stringify(S.hold));
        // The retry is armed on a timer; it would fire mid-phase otherwise.
        if (S.saveTimer) { W.clearTimeout(S.saveTimer); S.saveTimer = null; }
      });

      /* ---- and a conflict, which is the case that said nothing at all ---- */

    }).then(function () {
      var theirs = '# Alpha board\n\n' + HOME_A_LINE + '\n\n' + blockOf({
        v: 1, items: { z9: { k: 'sticky', t: 'the other session', p: [0, 0] } }
      });
      holdReadThenConflict('ba', theirs);
      S.dirty = true;                       // the colour above is still unsaved
      var saving = app.ops.save();
      ok('a second save is out', S.inflight !== null);
      var home = app.ops.goHome();
      return settle().then(function () {
        releaseRead();
        return Promise.all([home, saving]);
      }).then(function (r) {
        return settle().then(function () { return r; });
      }).then(function (r) {
        eq('going home is refused', r[0], false);
        ok('the board is still open', S.mode === 'board' && S.session !== null, S.mode);
        ok('the navigation says it did not happen',
          /could not be saved/i.test(bannerText(W)), bannerText(W));
        ok('the board went read-only, as a conflicted board does', S.readOnly === true);
        // The toast about the navigation stands in front of the banner for a
        // few seconds; the banner underneath it is the conflict itself.
        ok('and the conflict was really raised rather than swallowed',
          !!S.hold && /Another Big Bang session/.test(S.hold.text), JSON.stringify(S.hold));
        return wait(3800);                     // past TOAST_MS
      }).then(settle).then(function () {
        ok('when the toast goes, the conflict is what is on the screen',
          /Another Big Bang session/.test(bannerText(W)), bannerText(W));
        ok('with both ways out of it standing on it',
          !!btnAt(W, '#banner', 'Keep mine') && !!btnAt(W, '#banner', 'Open theirs'),
          bannerText(W));
      });

      /* ---- said once. A second tap leaves, and takes the state with it ---- */

    }).then(function () {
      return Promise.resolve(app.ops.goHome());
    }).then(function () {
      return waitFor(function () { return S.mode === 'home'; }, 5000, 'the home after a conflict');
    }).then(function () {
      ok('a second Home leaves, so a conflicted board is not a trap', S.mode === 'home');
      /*
       * And nothing of that board came with it. closeBoard clears these two,
       * and until this assertion existed nothing did: leave a damaged board,
       * open a healthy one, and it opened read-only quoting the reason the
       * PREVIOUS board could not be saved and refusing every edit.
       */
      ok('the read-only state did not come to the home with it', S.readOnly === false, String(S.readOnly));
      eq('nor the reason for it', S.why, '');
      eq('nor the error', S.lastSaveError, '');
      ok('nor the banner', S.banner === null && S.hold === null,
        JSON.stringify(S.banner) + ' / ' + JSON.stringify(S.hold));
      // The conflict was the other session writing over this note, and it is
      // still in the note. Put the fixture back for the phases that follow.
      mock.notes.ba.content = HOME_A_NOTE;
    });
  });
}

/*
 * The rest of what leaving is made of: the caret, the search box, and the one
 * case where leaving is a question.
 */
function leaveMorePhase() {
  return booted('f15').then(function (W) {
    var app = W.BB.app, S = app.S, mock = W.Synapse.__mock;

    /* ---- a box being typed into holds text the board does not have ---- */

    return Promise.resolve(app.ops.open('ba', 'Alpha board')).then(settle).then(function () {
      ok('the sticky is there to type into', !!W.BB.model.item(S.store.board, 's1'));
      ok('and it opens for editing', app.ops.edit('s1') === true);
      var field = editingField(W);
      ok('with a live field', !!field);
      // Typed, and NOT let go of: no blur, no Done. This is a thumb on Home
      // in the middle of a word.
      field.textContent = 'ring the vendor back';
      field.dispatchEvent(new W.Event('input', { bubbles: true }));
      eq('the board still says the old text', W.BB.model.item(S.store.board, 's1').t, 'note to self');
      return Promise.resolve(app.ops.goHome());
    }).then(function () {
      return waitFor(function () { return S.mode === 'home'; }, 5000, 'the home after typing');
    }).then(function () {
      var re = W.BB.board.read(mock.notes.ba.content);
      eq('leaving commits what was being typed rather than discarding it',
        re.board.items.s1.t, 'ring the vendor back');
      ok('and the prose around the block survived it',
        mock.notes.ba.content.indexOf(HOME_A_LINE) >= 0);

      /* ---- a search does not follow you to the next board ---- */

      return Promise.resolve(app.ops.open('ba', 'Alpha board'));
    }).then(settle).then(function () {
      app.ops.search('vendor');
      ok('a search is up', S.searching === true && S.query === 'vendor');
      ok('and something is dimmed by it', S.lit !== null);
      return Promise.resolve(app.ops.open('bb', 'Beta board'));
    }).then(settle).then(function () {
      eq('the next board opens as itself', Object.keys(S.store.board.items).length, 1);
      ok('with no search running', S.searching === false, String(S.searching));
      eq('no query text left in the box', S.query, '');
      ok('nothing dimmed by the last board\'s search', S.lit === null, JSON.stringify(S.lit));
      ok('and the box itself is not showing', W.document.getElementById('searchbar').hidden === true);

      /* ---- searching and focusing are one state, not two ---- */

      app.ops.search('roadmap');
      ok('a search is up again', S.searching === true);
      app.ops.focus('n1');
      ok('focusing drops the search', S.searching === false && S.query === '', S.query);
      ok('and it really is a focus now', S.focus === 'n1');
      app.ops.search('roadmap');
      ok('and searching drops the focus', S.focus === null, String(S.focus));
      app.ops.endSearch();

      /* ---- a board holding an unsaved note write ASKS before it closes ---- */

      /*
       * S.stranded is set by hand, exactly as the merge phase sets it: what is
       * under test is the question confirmLeave asks about it, and getting
       * there for real means holding a merge screen open across a refused
       * save, which that phase already does. Without the question, leaving is
       * silent and the board's only account of a note write that really
       * happened goes with it.
       */
      S.stranded = true;
      var left = app.ops.goHome();
      return settle().then(function () {
        ok('the board did not simply close', S.mode === 'board', S.mode);
        ok('it asked', /could not save/i.test(bannerText(W)), bannerText(W));
        ok('naming what leaving would lose', /loses the board/i.test(bannerText(W)), bannerText(W));
        ok('and saying the notes themselves are unaffected',
          /notes themselves stay as they are/i.test(bannerText(W)), bannerText(W));
        ok('with a way to say no', !!btnAt(W, '#banner', 'Cancel'), bannerText(W));
        btnAt(W, '#banner', 'Cancel').click();
        return left;
      }).then(function (r) {
        return settle().then(function () { return r; });
      }).then(function (r) {
        eq('saying no keeps the board', r, false);
        ok('and it is still open', S.mode === 'board' && S.session !== null, S.mode);
        ok('with nothing shouted about a save that was never refused',
          !/could not be saved/i.test(bannerText(W)), bannerText(W));
        ok('the board is still holding the record', S.stranded === true);

        var again = app.ops.goHome();
        return settle().then(function () {
          ok('and asks again rather than remembering the no', !!btnAt(W, '#banner', 'Leave it anyway'),
            bannerText(W));
          btnAt(W, '#banner', 'Leave it anyway').click();
          return again;
        });
      }).then(function () {
        return waitFor(function () { return S.mode === 'home'; }, 5000, 'the home after leaving anyway');
      }).then(function () {
        ok('saying yes leaves', S.mode === 'home');
        ok('and the flag went with the board it belonged to', S.stranded === false);
      });
    });
  });
}

/*
 * A screen the user drives, answering into a board that is no longer there.
 *
 * The picker and the merge screen are both pushed routes: the user can go
 * Home and open another board while one is up, and the answer arrives with a
 * different board loaded. It is the same shape as M5's applyMerge identity
 * bug, one level up - the SESSION, not the ids - and on the desktop harness it
 * is not even hypothetical, because neither screen is modal here.
 */
function switchAwayPhase() {
  return booted('f15').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model, mock = W.Synapse.__mock;

    /* ---- the note picker ---- */

    /*
     * A picker that stays open until the test says so. Every outstanding one
     * is answered, not only the last: a board that opened a second picker
     * would otherwise leave the first unanswered for ever, and the suite would
     * hang instead of saying what went wrong.
     */
    var waiting = [];
    W.__BB_PICK__ = function () {
      return new W.Promise(function (res) { waiting.push(function () { res(['h4']); }); });
    };
    function releasePick() {
      var all = waiting;
      waiting = [];
      all.forEach(function (f) { f(); });
    }

    return Promise.resolve(app.ops.open('ba', 'Alpha board')).then(settle).then(function () {
      var adding = app.ops.addNotes([0, 0]);
      ok('the picker is up, over board A', S.picking === true && S.session.noteId === 'ba');
      return Promise.resolve(app.ops.goHome()).then(function () {
        return Promise.resolve(app.ops.open('bb', 'Beta board'));
      }).then(settle).then(function () {
        ok('board B is what is open now', S.session.noteId === 'bb', S.session.noteId);
        eq('with its own single card', Object.keys(S.store.board.items).length, 1);
        var before = mock.notes.bb.content;
        releasePick();
        return adding.then(settle).then(function () {
          eq('the notes chosen for board A are not added to board B',
            Object.keys(S.store.board.items).length, 1);
          eq('and no card for one of them exists here', model.cardsForNote(S.store.board, 'h4').length, 0);
          ok('board B is not dirty for a pick it never made', S.dirty === false, String(S.dirty));
          ok('and it says what became of the answer',
            /no longer the board that asked/i.test(bannerText(W)), bannerText(W));
          return wait(1400).then(function () {
            eq('so board B\'s note is byte for byte as it was', mock.notes.bb.content, before);
          });
        });
      });
    }).then(function () {

      /* ---- the same board, gone read-only while the picker was up ---- */

      /*
       * The other half of the same await. The board did not change, so the
       * session guard says nothing about this one - what changed is whether
       * the board may be written at all, and a refused save turning it
       * read-only mid-pick is the ordinary way that happens.
       */
      return Promise.resolve(app.ops.open('ba', 'Alpha board')).then(settle).then(function () {
        var items = Object.keys(S.store.board.items).length;
        var undos = S.store.undo.length;
        var picks = mock.picks.length;
        var adding = app.ops.addNotes([0, 0]);
        return settle().then(function () {
          ok('the picker is up again', S.picking === true);
          eq('one picker was asked for', mock.picks.length, picks + 1);
          // A second + while it is up is not a second picker.
          var second = app.ops.addNotes([0, 0]);
          return settle().then(function () {
            eq('and the host was asked for no second picker', mock.picks.length, picks + 1);
            ok('and it says the picker is already open',
              /already open/i.test(bannerText(W)), bannerText(W));
            S.readOnly = true;
            S.why = 'Another Big Bang session saved this board while it was open.';
            releasePick();
            return Promise.all([adding, second]);
          }).then(function (r) {
            eq('a second ask while it is open adds nothing', r[1], false);
          });
        }).then(settle).then(function () {
          eq('nothing is added to a board that went read-only across the pick',
            Object.keys(S.store.board.items).length, items);
          eq('and no undo step was pushed for it', S.store.undo.length, undos);
          ok('the board is not dirty for it', S.dirty === false, String(S.dirty));
          S.readOnly = false;
          S.why = '';
        });
      });
    }).then(function () {
      W.__BB_PICK__ = null;

      /* ---- and the merge screen ---- */

      var releaseMerge = null;
      var merged = mock.put({ title: 'Merged elsewhere', content: 'both bodies' }).id;
      W.__BB_MERGE__ = function () {
        return new W.Promise(function (res) {
          releaseMerge = function () { res({ success: true, mergedNoteId: merged }); };
        });
      };
      return Promise.resolve(app.ops.open('ba', 'Alpha board')).then(settle).then(function () {
        var merging = app.ops.merge(['n1', 'n2']);
        return settle().then(function () {
          ok('the merge screen is up, over board A', S.merging === true);
          eq('asked for board A\'s two notes', mock.merges[mock.merges.length - 1].join(','), 'h1,h2');
          return Promise.resolve(app.ops.goHome());
        }).then(function () {
          return Promise.resolve(app.ops.open('bb', 'Beta board'));
        }).then(settle).then(function () {
          var before = mock.notes.bb.content;
          var items = Object.keys(S.store.board.items).length;
          releaseMerge();
          return merging.then(settle).then(function () {
            W.__BB_MERGE__ = null;
            eq('the merged note gets no card on a board that never asked',
              model.cardsForNote(S.store.board, merged).length, 0);
            eq('and nothing else was added or taken away', Object.keys(S.store.board.items).length, items);
            ok('board B is not dirty for it', S.dirty === false, String(S.dirty));
            ok('nor holding a record it has no business holding', S.stranded === false);
            ok('the guard is released either way', S.merging === false);
            ok('and the user is told the notes really were merged',
              /were merged/i.test(bannerText(W)), bannerText(W));
            return wait(1400).then(function () {
              eq('board B\'s note is untouched', mock.notes.bb.content, before);
            });
          });
        });
      });
    });
  });
}

/*
 * The guards themselves: a flag that gets stuck, and a board that inherits the
 * last one's state. Both are latent - nothing reaches them through the UI
 * today - and both are one added caller away from being live, which is the
 * whole argument for making the invariant real rather than incidental.
 */
function guardPhase() {
  return booted('f15').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model, mock = W.Synapse.__mock;

    return Promise.resolve(app.ops.open('ba', 'Alpha board')).then(settle).then(function () {

      /* ---- a throw on the SYNCHRONOUS part of leaving ---- */

      /*
       * leaveBoard runs commitEdit() and dropFresh() before it returns a
       * promise at all, so a throw in either escapes past a .then(ok, err)
       * pair - and S.switching was left true, after which open, goHome and
       * newBoard all silently answer false for the life of the session. The
       * throw is injected at model.kindOf, which is the first thing
       * commitEdit reaches; what is under test is the release, not the fault.
       */
      var realKind = model.kindOf;
      model.kindOf = function () { throw new W.Error('boom on the way out'); };
      S.editing = 's1';
      var threw = null, out = null;
      try { out = app.ops.open('bb', 'Beta board'); } catch (e) { threw = e; }
      return Promise.resolve(out).then(function () { return null; }, function (e) { return e; })
        .then(function (rej) {
          model.kindOf = realKind;
          S.editing = null;
          ok('the throw came back as an answer, not off the stack',
            threw === null && !!rej, String(threw || rej));
          ok('and the switching guard was released', S.switching === false, String(S.switching));
          // The proof that it was released is that the app still works.
          return Promise.resolve(app.ops.open('bb', 'Beta board'));
        }).then(function (r) {
          return settle().then(function () { return r; });
        }).then(function (r) {
          eq('so the next board switch is not silently refused', r, true);
          ok('and it really opened', S.session && S.session.noteId === 'bb', S.session && S.session.noteId);
        });

      /* ---- a board never inherits the last one's state ---- */

    }).then(function () {
      /*
       * openBoard is where every way in lands, and two of them - the new board
       * from the home, and the launch - reach it with no closeBoard anywhere.
       * Nothing leaks through them today only because of who happens to call
       * what.
       */
      S.readOnly = true;
      S.why = 'the PREVIOUS board could not be saved';
      S.lastSaveError = 'stale';
      S.stranded = true;
      S.merging = true;
      S.writing = true;
      S.sel.n1 = true;
      S.selectMode = true;
      return Promise.resolve(app.ops.openBoard('ba', { title: 'Alpha board' })).then(settle);
    }).then(function () {
      ok('the board that opened is not read-only', S.readOnly === false, S.why);
      eq('and quotes no reason from the board before it', S.why, '');
      eq('nor its error', S.lastSaveError, '');
      ok('it is not holding somebody else\'s unsaved record', S.stranded === false);
      ok('no merge screen is believed to be open', S.merging === false);
      ok('no note write is believed to be in flight', S.writing === false);
      eq('and nothing is selected on it', Object.keys(S.sel).length, 0);
      ok('nor is it in multi-select', S.selectMode === false);
      // And it really is editable, which is what the leak costs the user.
      ok('an edit on it is accepted', app.ops.colour('n1', 'green') === true);
      // This phase set those flags by hand. If the reset above is ever broken,
      // the assertions have already said so - and the phases after this one
      // must still be able to run, or a mutation here reads as a hung page
      // rather than as the failures it really is.
      S.readOnly = false;
      S.why = '';
      S.stranded = false;
      S.merging = false;
      S.writing = false;
      S.lastSaveError = '';
      S.sel = {};
      S.selectMode = false;
      return settleBoard(W);
    });
  });
}

/*
 * An answer that arrives for a board nobody is looking at any more.
 *
 * leaveBoard now waits for a save that is out, so this is the case it cannot
 * cover: a save whose session is swapped underneath it by something that is
 * not a leave at all. Both halves of save() decline it - the answer and the
 * throw - and until now neither guard could be made to fail: deleting either
 * one left the whole suite green, and the thing they are protecting is a
 * DIFFERENT board being marked unsaved, banner-ed and rewritten on the way
 * out, which is the loudest possible way for a board nobody edited to climb
 * the recents list.
 *
 * The session is swapped by hand here, because there is nothing else left that
 * can do it. That is the point of the guards: they are what makes the swap
 * safe, and a guard nothing can falsify is not yet a guard.
 */
function answerPhase() {
  return booted('f15').then(function (W) {
    var app = W.BB.app, S = app.S, mock = W.Synapse.__mock;
    function badgeText() { return (W.document.getElementById('badge') || {}).textContent || ''; }
    var other = { noteId: 'bb', key: '', readOnly: false, status: 'ok' };

    return Promise.resolve(app.ops.open('ba', 'Alpha board')).then(settle).then(function () {

      /* ---- the ANSWER: a refusal belonging to a board that is gone ---- */

      var release = null;
      W.__BB_UPDATE__ = function () {
        return new W.Promise(function (res) {
          release = function () { res({ success: false, error: 'database is locked' }); };
        });
      };
      app.ops.colour('n1', 'rose');
      var saving = app.ops.save();
      var mine = S.session;
      ok('the save is out for this board', S.inflight !== null && S.saving === true);
      S.session = other;                 // something else moved the app on
      // The write is reached across a re-read, so it is not being held yet.
      return settle().then(function () {
        release();
        return saving;
      }).then(settle).then(function () {
        W.__BB_UPDATE__ = null;
        ok('the refusal was not applied to the board that is open now',
          S.dirty === false, String(S.dirty));
        ok('which is therefore not claiming to hold unsaved work',
          badgeText().indexOf('unsaved') < 0, badgeText());
        ok('no banner about somebody else\'s save appeared on it',
          !/could not be saved just now/i.test(bannerText(W)), bannerText(W));
        ok('and no retry was armed against it', S.saveTimer === null, String(S.saveTimer));
        S.session = mine;
        S.saving = false;
        S.dirty = false;
      });

      /* ---- and the THROW, which had no guard at all ---- */

    }).then(function () {
      /*
       * A save that rejects rather than answering. The throw is injected at
       * board.splice, which saveOnce reaches after its re-read - so the window
       * is real: the read is held open, the session is swapped across it, and
       * the rejection lands on a board that never asked for anything.
       */
      var realSplice = W.BB.board.splice;
      var releaseRead = null;
      W.__BB_QUERY__ = function (sql) {
        if (sql.indexOf('clen') < 0 || sql.indexOf("id = 'ba'") < 0) return null;
        return new W.Promise(function (res) {
          releaseRead = function () {
            W.__BB_QUERY__ = null;
            res(W.Synapse.runQuery(sql));
          };
        });
      };
      W.BB.board.splice = function () { throw new W.Error('the bridge fell over'); };
      app.ops.colour('n1', 'amber');
      var saving = app.ops.save();
      var mine = S.session;
      ok('the second save is out', S.inflight !== null);
      S.session = other;
      return settle().then(function () {
        releaseRead();
        return saving;
      }).then(settle).then(function () {
        W.BB.board.splice = realSplice;
        ok('a save that fell over does not dirty the board that is open now',
          S.dirty === false, String(S.dirty));
        eq('nor hang its error on it', S.lastSaveError, '');
        ok('nor make it claim unsaved work', badgeText().indexOf('unsaved') < 0, badgeText());
        S.session = mine;
        S.saving = false;
        S.dirty = false;
        S.lastSaveError = '';
        if (S.saveTimer) { W.clearTimeout(S.saveTimer); S.saveTimer = null; }
      });
    });
  });
}

/*
 * The home past the row cap.
 *
 * runQuery stops at 100 rows and findBoards asks for one more than it shows,
 * so a single read can never return more than 99 boards. Show more used to
 * re-ask with a bigger limit, which meant the list climbed 24, 48, 72, 96, 99
 * - and then stuck there for ever, still offering a button that promised
 * eleven boards it could not reach. This phase replaces the frame's library
 * outright, so it goes last.
 */
function pagingPhase() {
  return booted('f15').then(function (W) {
    var app = W.BB.app, S = app.S, host = W.BB.host;

    function two(n) { return (n < 10 ? '0' : '') + n; }
    var many = [];
    for (var i = 0; i < 110; i++) {
      many.push({
        id: 'pg' + (i < 10 ? '00' : i < 100 ? '0' : '') + i,
        title: 'Board ' + i,
        content: '# Board ' + i + '\n\n' + blockOf({ v: 1, items: {} }),
        updatedAt: '2026-01-01T00:' + two(Math.floor(i / 60)) + ':' + two(i % 60) + 'Z'
      });
    }
    function loaded() {
      return waitFor(function () { return S.home && !S.home.loading; }, 5000, 'a page of the board list');
    }
    function showMore() { return homeRowByTitle(W, 'Show more boards'); }
    function ids() { return S.home.boards.map(function (b) { return b.id; }); }

    var mock = null;
    // The home is the only screen this phase is about, and loadHome refuses to
    // answer into any other one.
    return Promise.resolve(app.ops.goHome()).then(function () {
      return waitFor(function () { return S.mode === 'home'; }, 5000, 'the home');
    }).then(function () {
      mock = host.installMock(many);
      S.home = null;
      return Promise.resolve(app.ops.loadHome());
    }).then(loaded).then(function () {
      eq('the first page is one read', S.home.boards.length, 24);
      eq('newest first', ids()[0], 'pg109');
      ok('and it says there are more', S.home.more === true);
      ok('with a button offering them', !!showMore(), homeRowTitles(W).join('|'));

      // 24 -> 48 -> 72 -> 96 -> 110. The fourth of these is the one that used
      // to arrive at 99 and stop.
      var want = [48, 72, 96, 110];
      return want.reduce(function (p, n, i) {
        return p.then(function () {
          ok('page ' + (i + 2) + ' is offered', !!showMore(), homeRowTitles(W).join('|'));
          showMore().click();
          return loaded().then(function () {
            eq('showing more really shows more (' + n + ')', S.home.boards.length, n);
          });
        });
      }, Promise.resolve());
    }).then(function () {
      eq('every board in the library is reachable', S.home.boards.length, 110);
      ok('past the 99 a single read can return', S.home.boards.length > host.PAGE - 1, S.home.boards.length);
      ok('the list says it is finished', S.home.more === false, json(S.home));
      ok('and stops offering to show more', !showMore(), homeRowTitles(W).join('|'));
      eq('the oldest board is on it', ids()[109], 'pg000');
      ok('the eleven past the cap are there', ids().indexOf('pg010') >= 0 && ids().indexOf('pg000') >= 0);

      var seen = Object.create(null), dupes = 0;
      ids().forEach(function (id) { if (seen[id]) dupes++; seen[id] = 1; });
      eq('and no board is listed twice', dupes, 0);

      var lists = mock.queries.filter(function (q) { return /content like/i.test(q); });
      eq('it took one read per page, not one per board', lists.length, 5);
      eq('and each one asked for the page after the last',
        lists.map(function (q) { return (/offset\s+(\d+)/i.exec(q) || [])[1]; }).join(','),
        '0,24,48,72,96');
      ok('never asking the host for more rows than it can return',
        lists.every(function (q) { return parseInt((/limit\s+(\d+)/i.exec(q) || [0, '0'])[1], 10) <= host.PAGE; }),
        lists.join(' | '));

      /* ---- a page that fails keeps the boards already on screen ---- */

      W.__BB_QUERY__ = function (sql) {
        return /content like/i.test(sql) ? { success: false, error: 'database is locked' } : null;
      };
      return Promise.resolve(app.ops.loadHome({ append: true })).then(loaded).then(function () {
        W.__BB_QUERY__ = null;
        eq('the boards already listed are still listed', S.home.boards.length, 110);
        ok('and the failure is said under them rather than instead of them',
          /next page of boards could not be read/i.test(W.document.getElementById('home').textContent),
          W.document.getElementById('home').textContent.slice(-200));
        ok('with a way to ask again', !!homeRowByTitle(W, 'Try again'), homeRowTitles(W).join('|'));
      });
