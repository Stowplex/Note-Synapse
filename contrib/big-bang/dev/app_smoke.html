/*
 * Read-only WITH something on the board.
 *
 * This is the half the future-block fixture cannot test: it opens empty, so
 * "a save writes nothing" is true of a board that had nothing to write, and no
 * refusal in the app is exercised at all. Two board blocks is a read-only state
 * that still draws every card in the first one, so a drag, a resize and Remove
 * all have something to fail on.
 */
function readOnlyWithCardsPhase() {
  return booted('f3').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model, mock = W.Synapse.__mock;
    var st = stageOf(W);
    // The CONTENT of the board. The view is left out on purpose: a read-only
    // board still pans and zooms, and where the user is standing is not
    // something a refusal is supposed to prevent.
    function content() {
      var b = S.store.board;
      return JSON.stringify({ items: b.items, links: b.links, groups: b.groups });
    }
    var before = content();

    ok('a note holding two board blocks opens read-only', S.readOnly === true, S.why);
    ok('and says how many there are', /2 board blocks/.test(bannerText(W)), bannerText(W));
    eq('the first block\'s cards are all drawn', W.document.querySelectorAll('.bb-card').length, 3);
    ok('so there is something here to refuse to change', !!model.item(S.store.board, 'n1'));
    eq('nothing has been written', mock.updates.length, 0);
    ok('and the board is not dirty', S.dirty === false);

    /*
     * A view the format allows and the fingers cannot. Opened as written, the
     * board would sit at a zoom no pinch can undo, with every affordance pinned
     * at the counter-scale cap.
     */
    ok('the block asked for a zoom below the gesture floor',
      W.BB.board.coerceZoom(0.1) < W.BB.gestures.MIN_Z, String(W.BB.board.coerceZoom(0.1)));
    eq('and the board opened at the floor instead', S.k, W.BB.gestures.MIN_Z);
    ok('which is a zoom a finger can get back out of', S.k >= W.BB.gestures.MIN_Z && S.k <= W.BB.gestures.MAX_Z);

    // A drag.
    var p = pointOn(W, 'n1');
    P(W, 'pointerdown', card(W, 'n1'), p.x, p.y);
    P(W, 'pointermove', st, p.x + 14, p.y);          // past the slop
    P(W, 'pointermove', st, p.x + 40, p.y + 40);     // and a real move after it
    P(W, 'pointerup', st, p.x + 40, p.y + 40);
    return settle().then(function () {
      eq('a drag on a read-only board moves nothing', content(), before);
      ok('it pans instead, so the board is not frozen', S.tx !== 0 || S.ty !== 0);
      ok('and nothing is marked dirty', S.dirty === false);

      // A resize. The grip is hidden on a read-only board, but the gesture
      // layer is asked directly: a refusal that only exists in CSS is not one.
      var w0 = S.store.board.items.n1.w;
      var grip = card(W, 'n1').querySelector('.grip');
      ok('the grip is not offered at all', W.getComputedStyle(grip).display === 'none');
      P(W, 'pointerdown', grip, p.x, p.y);
      P(W, 'pointermove', st, p.x + 80, p.y);
      P(W, 'pointerup', st, p.x + 80, p.y);
      return settle();
    }).then(function () {
      eq('a resize on a read-only board changes no width', S.store.board.items.n1.w, RO_W());
      ok('Remove from board is not offered', !btn(W, '#bottombar', 'Remove'), barText(W));

      /*
       * Every M4 edit, refused. Each is called directly rather than through a
       * button, because a refusal that exists only in what the bar chooses to
       * draw is not a refusal - it is a hidden button.
       *
       * These run BEFORE the removal check on purpose. `link`, `group` and
       * `annotate` all refuse an id that is not on the board too, so a removal
       * that had wrongly succeeded would make every one of them pass for the
       * wrong reason - and a refusal test that passes because there is nothing
       * left to refuse is no test at all.
       */
      ok('no link may be drawn', app.ops.link('n1', 'n2') === null);
      ok('no group may be made', app.ops.group(['n1', 'n2']) === null);
      ok('no annotation may be left', app.ops.annotate([{ i: 'n1' }]) === null);
      ok('no sticky may be created', app.ops.newSticky(10, 10) === null);
      ok('nothing may be recoloured', app.ops.colour('n1', 'amber') === false);
      ok('nothing may be typed into', app.ops.edit('n1') === false);
      /*
       * The three kinds beginEdit would ACCEPT on a writable board. `n1` above
       * is a note card, which it refuses anyway - so on its own it proves only
       * that note cards are not editable, and a beginEdit that had forgotten
       * the board was read-only would pass it.
       */
      ok('nor may a sticky be typed into', app.ops.edit('s1') === false);
      ok('nor a group renamed', app.ops.edit('g1') === false);
      ok('nothing has the caret', S.editing === null, String(S.editing));
      eq('and no element on the page became editable',
        W.document.querySelectorAll(LIVE).length, 0);
      ok('nothing may be aligned', app.ops.align('left') === false);
      ok('the ports are not offered either',
        W.getComputedStyle(card(W, 'n1').querySelector('.port')).display === 'none');
      ok('and neither is the card-on-card group handle',
        W.getComputedStyle(card(W, 'n1').querySelector('.group-port')).display === 'none');

      /*
       * And every M5 action, which is the harder half: these write to notes
       * that are NOT this board's, so a refusal that only stopped the board
       * from changing would still have let them through.
       */
      var tk = card(W, 'n2').querySelector('.tk');
      ok('the card that is a task still draws its checkbox', tk.hidden === false);
      eq('but it takes no taps at all', W.getComputedStyle(tk).pointerEvents, 'none');
      ok('and asking to tick it directly is refused', app.ops.tick('n2') === false);
      ok('no sticky may be promoted', app.ops.promote('s1') === false);
      ok('no group\'s notes may be tagged', app.ops.tagNotes('g1') === false);
      eq('and none of that wrote to a single note', mock.updates.length, 0);
      eq('nor created one', mock.saves.length, 0);

      eq('and none of that put anything on the undo stack', S.store.undo.length, 0);
      eq('the board is byte for byte what it was', content(), before);

      eq('nor may a card be removed', app.ops.remove(['n1']), false);
      ok('and it is still there', !!model.item(S.store.board, 'n1'));
      eq('still nothing written', mock.updates.length, 0);

      // The port gesture itself, not just the button that would start it.
      var pr = card(W, 'n1').querySelector('.port');
      var ra = app.itemScreenRect('n1'), rb = app.itemScreenRect('n2');
      P(W, 'pointerdown', pr, ra.left + ra.width / 2, ra.bottom - 2);
      P(W, 'pointermove', st, rb.left + rb.width / 2, rb.top + rb.height / 2);
      ok('a port press on a read-only board starts no link at all', S.link === null, JSON.stringify(S.link));
      eq('and trails no line behind the finger', W.document.querySelectorAll('#edges .bb-rubber').length, 0);
      P(W, 'pointerup', st, rb.left + rb.width / 2, rb.top + rb.height / 2);
      return settle().then(function () {
        eq('and dragging a port on a read-only board draws nothing', S.store.board.links.length, 0);
        eq('leaving the board as it was', content(), before);
        return Promise.resolve(app.ops.save()).then(settle);
      });
    }).then(function () {
      eq('and a save writes nothing, having nothing to write', mock.updates.length, 0);
      return Promise.resolve(app.ops.merge(['n1', 'n2'])).then(function (r) {
        eq('no merge screen may be opened either', r, false);
        eq('and nothing asked for one', mock.merges.length, 0);
        // ... and a save refuses even when something has marked the board
        // dirty behind the app's back, so the guard is the app's and not only
        // host.js's.
        S.dirty = true;
        return Promise.resolve(app.ops.save()).then(settle);
      });
    }).then(function () {
      eq('a save on a read-only board writes nothing even when it is dirty', mock.updates.length, 0);
      S.dirty = false;
      eq('the note is exactly as it was', W.Synapse.__mock.notes['mock-note-1'].content.split('synapse-bigbang').length - 1, 2);

      /* ---- the escape hatch, and how many yesses it takes ---- */

      var force = btn(W, '#banner', 'Keep only the first block');
      ok('the refusal offers a way out', !!force, bannerText(W));
      force.click();
      return settle();
    }).then(function () {
      ok('which asks again before doing it', /Keep only the first board block\?/.test(bannerText(W)), bannerText(W));
      eq('nothing written on the first yes', W.Synapse.__mock.updates.length, 0);
      ok('and Cancel is offered beside it', !!btn(W, '#banner', 'Cancel'));
      btn(W, '#banner', 'Cancel').click();
      return settle();
    }).then(function () {
      eq('cancelling writes nothing', W.Synapse.__mock.updates.length, 0);
      ok('and puts the refusal back', /2 board blocks/.test(bannerText(W)), bannerText(W));
      btn(W, '#banner', 'Keep only the first block').click();
      return settle().then(function () {
        btn(W, '#banner', 'Yes, do it').click();
        return wait(120);
      });
    }).then(function () {
      var text = W.Synapse.__mock.notes['mock-note-1'].content;
      eq('the second yes writes it', W.BB.board.findAll(text).length, 1);
      ok('keeping the prose', text.indexOf('keep this line') >= 0, text.slice(0, 120));
      ok('and the board is writable again', S.readOnly === false, S.why);
    });

    function RO_W() { return JSON.parse(before).items.n1.w; }
  });
}

/*
 * A board nobody touched.
 *
 * Opening one used to write its note twice over: the camera fit a default view
 * gets, and a title stamp that counts every card lacking `t` - which is every
 * card in a hand-written block - as renamed. Both are real changes to the
 * block and both belong in it; neither is a reason to rewrite the note. It
 * matters because updatedAt is the ordering key the board home will sort on,
 * so LOOKING at a board moved it to the top of the list, and because a second
 * session with the same board open saw a conflict raised by nobody.
 *
 * This frame booted when the page did and has been sitting there ever since,
 * so every debounce window - 900ms for an edit, 2600ms for the camera - has
 * come and gone.
 */
function quietPhase() {
  return booted('f4').then(function (W) {
    return wait(Math.max(0, 4200 - (Date.now() - T0))).then(function () {
      var S = W.BB.app.S, mock = W.Synapse.__mock;
      eq('opening a board issues no updateNotes at all', mock.updates.length, 0);
      eq('the note is byte for byte what it was', mock.notes['mock-note-1'].content, NOTE);
      ok('the board is not sitting dirty either', S.dirty === false);
      ok('nor is a save pending', S.saveTimer === null, String(S.saveTimer));
      ok('the badge does not claim unsaved work', W.document.getElementById('badge').textContent !== 'unsaved',
        W.document.getElementById('badge').textContent);

      // The changes are still THERE - they were made, they just did not go out
      // on their own. The next real edit carries them.
      ok('the camera fit is in the board', S.store.board.view.z !== 1 || S.store.board.view.p.join(',') !== '0,0',
        JSON.stringify(S.store.board.view));
      eq('and the titles read live are stamped on the cards', S.store.board.items.n1.t, 'Pricing');
      ok('marked as owed rather than as the user\'s own work', S.soft === true);

      return dragCard(W, 'n1', 30, 30).then(function () {
        return Promise.resolve(W.BB.app.ops.save()).then(settle);
      }).then(function () {
        eq('the first real edit writes once', mock.updates.length, 1);
        var re = W.BB.board.read(mock.notes['mock-note-1'].content);
        eq('carrying the fit that was waiting for it', re.board.view.z, W.BB.board.coerceZoom(S.k));
        eq('and the title stamp with it', re.board.items.n1.t, 'Pricing');
      });
    });
  });
}

/* ===================================================================== */
/* milestone 4: stickies                                                  */
/* ===================================================================== */

/*
 * The rule this phase exists for: an empty sticky is never written.
 *
 * A box created by a long press has to be drawable and typeable before it is
 * anything the board owns, so it goes into the board object with no
 * transaction and nothing marked dirty. Abandoning it must therefore leave the
 * note byte for byte as it was AND leave no step on the undo stack - a stray
 * tap that dirties somebody's note is worse than no sticky at all.
 */
function stickyPhase() {
  return booted('f5').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model, mock = W.Synapse.__mock;

    eq('the structure board loaded three cards', Object.keys(S.store.board.items).length, 3);
    ok('and is writable', S.readOnly === false, S.why);
    eq('with nothing written yet', mock.updates.length, 0);
    var noteBefore = mock.notes['mock-note-1'].content;
    var undos0 = S.store.undo.length;

    var spot = screenAt(W, 250, 450);
    return longPressBg(W, spot.x, spot.y).then(function () {
      var ids = model.itemsOfKind(S.store.board, 'sticky');
      eq('a long press on empty canvas leaves a sticky', ids.length, 1);
      var id = ids[0];
      eq('the caret is already in it', S.editing, id);
      eq('and it is marked as never having held anything', S.fresh, id);
      var field = editingField(W);
      ok('its own text element is what became editable', !!field && field.className === 'ct', field && field.className);
      ok('the card says it is being edited', card(W, id).className.indexOf('editing') >= 0, card(W, id).className);
      ok('and is drawn as a sticky', card(W, id).className.indexOf('k-sticky') >= 0);

      eq('creating it pushed NO undo step', S.store.undo.length - undos0, 0);
      ok('the board is not dirty', S.dirty === false);
      ok('and no save is pending', S.saveTimer === null, String(S.saveTimer));
      ok('a save right now would not carry it', !W.BB.model.item(app.boardToWrite(), id),
        JSON.stringify(Object.keys(app.boardToWrite().items)));
      ok('the board in memory does hold it, or it could not be drawn', !!model.item(S.store.board, id));

      // Abandoned: nothing was typed.
      return typeInto(W, '   ');
    }).then(function () {
      eq('an abandoned sticky leaves no item behind', model.itemsOfKind(S.store.board, 'sticky').length, 0);
      eq('and no undo step', S.store.undo.length - undos0, 0);
      ok('nothing is marked dirty', S.dirty === false);
      ok('nor is anything scheduled', S.saveTimer === null, String(S.saveTimer));
      eq('and the note is byte for byte what it was', mock.notes['mock-note-1'].content, noteBefore);
      eq('nothing was written at all', mock.updates.length, 0);
      ok('the fresh marker is spent', S.fresh === null);
      ok('and nothing is being edited', S.editing === null);

      /* ---- the other way out of a fresh box: Escape ---- */

      var spotE = screenAt(W, 250, 450);
      return longPressBg(W, spotE.x, spotE.y);
    }).then(function () {
      /*
       * cancelEdit, which nothing used to reach: neither suite called it and
       * neither dispatched an Escape, so the whole exit path was untested and
       * an Escape that stopped dropping the fresh box left a permanent empty
       * sticky with nothing to say so.
       */
      var id = model.itemsOfKind(S.store.board, 'sticky')[0];
      var field = editingField(W);
      ok('a long press left a box with the caret in it', !!field && S.fresh === id, String(S.fresh));
      field.textContent = 'half a thought';
      key(W, field, 'Escape');
      return settle().then(function () {
        eq('Escape takes the fresh box back off the board', model.itemsOfKind(S.store.board, 'sticky').length, 0);
        eq('and its card with it', W.document.querySelectorAll('.bb-card.k-sticky').length, 0);
        eq('leaving no undo step', S.store.undo.length - undos0, 0);
        ok('nothing is marked dirty', S.dirty === false);
        ok('nor scheduled', S.saveTimer === null, String(S.saveTimer));
        ok('the fresh marker is spent', S.fresh === null);
        ok('and nothing is being edited', S.editing === null);
        eq('no element was left editable', W.document.querySelectorAll(LIVE).length, 0);
        eq('and the note is byte for byte what it was', mock.notes['mock-note-1'].content, noteBefore);
      });
    }).then(function () {
      var spot2 = screenAt(W, 250, 450);
      return longPressBg(W, spot2.x, spot2.y);
    }).then(function () {
      /*
       * Half-typed, and then something else redraws the board - a resolve
       * coming back, a title refreshing, anything at all. Assigning
       * textContent under a live caret puts the caret at the front and eats
       * the character that triggered the render, so the renderer leaves the
       * box being edited completely alone.
       */
      var field = editingField(W);
      field.textContent = 'call the ven';
      return Promise.resolve(app.ops.resolve(true)).then(settle).then(function () {
        eq('a redraw while typing does not touch the box with the caret in it',
          editingField(W).textContent, 'call the ven');
        ok('and it is still the same element', editingField(W) === field);

        /* ---- a tap inside live text belongs to the browser ---- */

        /*
         * Capturing it would put the caret nowhere and leave the user with a
         * box they cannot get into the middle of. It is the ONE pointerdown
         * this layer walks away from, and walking away must also leak nothing:
         * an id left in the map is a pinch nobody is holding.
         */
        var ptrs0 = S.gest.pointers();
        var fr = field.getBoundingClientRect();
        P(W, 'pointerdown', field, fr.left + 6, fr.top + 6, 7);
        eq('a pointerdown inside live text starts no gesture', S.gest.active(), null);
        eq('and leaves no pointer behind it', S.gest.pointers(), ptrs0);
        eq('the caret is still in the same box', S.editing, model.itemsOfKind(S.store.board, 'sticky')[0]);
        P(W, 'pointerup', field, fr.left + 6, fr.top + 6, 7);

        /* ---- and a paste into it is plain text ---- */

        /*
         * Rich HTML pasted into a contentEditable becomes real markup inside
         * the card - a <b>, an <img> with a remote src - and it STAYS there,
         * because paint() rewrites textContent only when it differs from the
         * model's text and inline markup reads back as the same text.
         */
        eq('the field takes plain text only', field.contentEditable, 'plaintext-only');
        var ev = new W.Event('paste', { bubbles: true, cancelable: true });
        ev.clipboardData = {
          getData: function (t) {
            return t === 'text/plain' ? 'from the clipboard'
              : 'ab<b>cd</b><img src="https://example.invalid/x.png">';
          }
        };
        field.dispatchEvent(ev);
        ok('a paste is handled rather than left to the browser', ev.defaultPrevented === true);
        ok('and what lands is the plain-text flavour',
          field.textContent.indexOf('from the clipboard') >= 0, field.textContent);
        eq('no markup entered the field', field.innerHTML.indexOf('<b>'), -1);
        eq('and no image element reached the document',
          W.document.querySelectorAll('#cards img').length, 0);

        return typeInto(W, 'call the vendor');
      });
    }).then(function () {
      var ids = model.itemsOfKind(S.store.board, 'sticky');
      eq('a sticky that was written in stays', ids.length, 1);
      var id = ids[0];
      eq('holding what was typed', model.item(S.store.board, id).t, 'call the vendor');
      eq('appearing AND saying it is one undo step', S.store.undo.length - undos0, 1);
      eq('named for what it was', S.store.undo[S.store.undo.length - 1].label, 'add a sticky');
      ok('now the board is dirty', S.dirty === true);
      ok('and a save would carry it', !!W.BB.model.item(app.boardToWrite(), id));
      eq('the card shows the text', card(W, id).querySelector('.ct').textContent, 'call the vendor');
      ok('and is no longer flagged blank', card(W, id).className.indexOf('blank') < 0, card(W, id).className);
      /*
       * The bar opens with it, on the action that turns it into a note. That
       * is what makes "leave a note here" one flow - a press, some words, one
       * button - rather than two steps that happen to end somewhere useful.
       */
      ok('its bar is open, offering to make it a note',
        !!btn(W, '#bottombar', 'Make it a note'), barText(W));

      return Promise.resolve(app.ops.save()).then(settle).then(function () {
        var re = W.BB.board.read(mock.notes['mock-note-1'].content);
        eq('the block on the note holds it', re.board.items[id].t, 'call the vendor');
        ok('and the prose around it is untouched', mock.notes['mock-note-1'].content.indexOf(M4_LINE) >= 0);

        /*
         * The belt for an engine that honours neither plaintext-only nor the
         * paste handler: markup forced straight into the element must not
         * survive the field being handed back. Without that, paint() leaves it
         * alone for ever - `ab<b>cd</b>` and `abcd` are the same textContent -
         * and a pasted tracking pixel keeps its remote src all session.
         */
        app.ops.edit(id);
        return settle();
      }).then(function () {
        var field = editingField(W);
        field.innerHTML = 'ab<b>cd</b><img src="https://example.invalid/x.png">';
        return typeInto(W, null);
      }).then(function () {
        var ct = card(W, id).querySelector('.ct');
        eq('committing keeps the text', model.item(S.store.board, id).t, 'abcd');
        eq('and nothing else', ct.textContent, 'abcd');
        eq('the markup is gone from the card', ct.innerHTML.indexOf('<b>'), -1);
        eq('and the remote image never reached the document',
          W.document.querySelectorAll('#cards img').length, 0);
        app.ops.undo();                       // the markup edit
        app.ops.undo();                       // the sticky itself
        return settle();
      });
    }).then(function () {
      eq('one undo takes the whole sticky back out', model.itemsOfKind(S.store.board, 'sticky').length, 0);
      eq('and its card with it', W.document.querySelectorAll('.bb-card.k-sticky').length, 0);

    /* ---- S.editing nulled means the field was RELEASED ---- */

    }).then(function () {
      var sp = screenAt(W, 250, 480);
      return longPressBg(W, sp.x, sp.y).then(function () { return typeInto(W, 'briefly'); });
    }).then(function () {
      var sid = model.itemsOfKind(S.store.board, 'sticky')[0];
      ok('there is a committed sticky', !!sid);
      app.ops.edit(sid);
      return settle().then(function () {
        var field = editingField(W);
        ok('with the caret in it', !!field && S.editing === sid, String(S.editing));
        /*
         * Now the item goes away from somewhere else entirely - an undo, here;
         * another session's board adopted whole, in the other case. prune()
         * notices and clears S.editing, and by then the MODEL can no longer say
         * which element the caret was in. Clearing the flag without taking the
         * field back leaves contenteditable on an element the renderer goes on
         * reusing: gestures.js then hands every pointerdown on it to the
         * browser, and the card is permanently untappable.
         */
        app.ops.undo();
        return settle().then(function () {
          ok('the sticky is gone', !model.item(S.store.board, sid));
          eq('nothing is being edited', S.editing, null);
          eq('and the field was RELEASED, not merely forgotten', field.contentEditable, 'false');
          eq('so no live field is left anywhere on the page',
            W.document.querySelectorAll(LIVE).length, 0);
          ok('and the app is not still holding one', !S.field, String(S.field));
        });
      });

    /* ---- what a save is handed cannot change under it ---- */

    }).then(function () {
      /*
       * host.js re-reads the note before it splices, which is a real bridge
       * call with a real await in the middle of it - and the user goes on using
       * the board across that window. A save handed the LIVE board serialises
       * whatever the board has become by the time the read comes back,
       * including an empty sticky long-pressed into being and abandoned in that
       * window; and it then sits in the note for ever, because nothing is dirty
       * so nothing rewrites it.
       *
       * mock.pending runs INSIDE that read, which is exactly the window.
       */
      app.ops.colour('n1', 'sky');                     // something real to save
      var snap = app.boardToWrite();
      ok('a save is handed a copy, never the board itself', snap !== S.store.board);
      mock.pending = function () { app.ops.newSticky(250, 520); };
      return Promise.resolve(app.ops.save()).then(settle);
    }).then(function () {
      ok('the long press really did leave a box on the live board', !!S.fresh, String(S.fresh));
      var re = W.BB.board.read(mock.notes['mock-note-1'].content);
      eq('but a box abandoned while the save was reading the note is not in what was written',
        Object.keys(re.board.items).filter(function (id) { return re.board.items[id].k === 'sticky'; }).length, 0);
      ok('and the edit that started the save did land',
        re.board.items.n1 && re.board.items.n1.c === 'sky', JSON.stringify(re.board.items.n1));
      app.ops.cancelEdit();
      return settle();

    /* ---- undo and redo must not photograph the fresh box ---- */

    }).then(function () {
      eq('the abandoned box is off the board again', model.itemsOfKind(S.store.board, 'sticky').length, 0);
      app.ops.colour('n1', 'teal');                    // a step to undo
      return settle();
    }).then(function () {
      var sp = screenAt(W, 250, 560);
      return longPressBg(W, sp.x, sp.y);
    }).then(function () {
      eq('a fresh box is on the board', model.itemsOfKind(S.store.board, 'sticky').length, 1);
      ok('and nothing owns it but S.fresh', !!S.fresh);
      app.ops.undo();
      return settle();
    }).then(function () {
      eq('undo takes the fresh box off with it', model.itemsOfKind(S.store.board, 'sticky').length, 0);
      eq('and undoes the edit that was actually on the stack', model.item(S.store.board, 'n1').c, 'sky');
      ok('there is something to redo', S.store.canRedo());
      app.ops.redo();
      return settle();
    }).then(function () {
      /*
       * undoStep and redoStep each snapshot the board AS IT IS onto the
       * opposite stack. A fresh box caught in that snapshot comes back on redo
       * owned by nobody - prune() has cleared S.fresh by then - and is an
       * ordinary empty card from that moment on, written into the note. Two
       * taps reached it: recolour, long-press, Undo, Redo.
       */
      eq('redo does not resurrect a box nobody ever wrote in',
        model.itemsOfKind(S.store.board, 'sticky').length, 0);
      eq('it redoes what was really on the stack', model.item(S.store.board, 'n1').c, 'teal');
      ok('and the fresh marker is still spent', S.fresh === null);
      eq('so a save would carry no sticky either',
        model.itemsOfKind(app.boardToWrite(), 'sticky').length, 0);

    /* ---- a fresh box caught in a multi-selection ---- */

    }).then(function () {
      var sp = screenAt(W, 250, 600);
      return longPressBg(W, sp.x, sp.y);
    }).then(function () {
      var fid = S.fresh;
      ok('there is a fresh box again', !!fid);
      var undos = S.store.undo.length;
      /*
       * No gesture reaches this today - a long press clears the selection
       * before it makes the box - but the shortcut used to be guarded by "and
       * it is the ONLY id", so the first gesture that did would put an empty
       * sticky through a transaction, and undo would put it back permanently.
       */
      app.ops.remove([fid, 'n1']);
      return settle().then(function () {
        ok('the fresh box is gone', !model.item(S.store.board, fid));
        ok('and so is the card that was really being removed', !model.item(S.store.board, 'n1'));
        eq('as one undo step, for the card alone', S.store.undo.length - undos, 1);
        eq('named for the one card it removed',
          S.store.undo[S.store.undo.length - 1].label, 'remove 1 card');
        app.ops.undo();
        return settle();
      }).then(function () {
        ok('undo brings the card back', !!model.item(S.store.board, 'n1'));
        ok('and does not bring back the box nobody ever wrote in', !model.item(S.store.board, fid));
        eq('leaving no sticky on the board at all', model.itemsOfKind(S.store.board, 'sticky').length, 0);
      });
    }).then(function () { return W; });
  });
}

/* ===================================================================== */
/* milestone 4: links                                                     */
/* ===================================================================== */

function linkPhase() {
  return booted('f5').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model;
    var board = S.store.board;
    function edge() { return pathsOfClass(W, 'bb-edge')[0]; }
    function hit() { return pathsOfClass(W, 'bb-hit')[0]; }
    var lid = null;

    return tapCard(W, 'n1').then(function () {
      ok('a selected card offers a port to drag a link out of',
        W.getComputedStyle(card(W, 'n1').querySelector('.port')).display !== 'none');
      ok('and an unselected one does not',
        W.getComputedStyle(card(W, 'n2').querySelector('.port')).display === 'none');

      /* ---- a link dragged nowhere ---- */
      var undos = S.store.undo.length;
      var empty = screenAt(W, 700, 600);
      return dragPortTo(W, 'n1', empty.x, empty.y).then(function () {
        eq('a link dropped on nothing draws nothing', board.links.length, 0);
        eq('and leaves no undo step', S.store.undo.length - undos, 0);
        ok('but it says why rather than doing nothing quietly',
          /needs somewhere to land/.test(bannerText(W)), bannerText(W));
      });

    /* ---- a link dragged onto a card ---- */

    }).then(function () {
      var undos = S.store.undo.length;
      return dragPortToCard(W, 'n1', 'n2').then(function () {
        eq('dragging from a port onto another card draws a link', board.links.length, 1);
        lid = board.links[0].i;
        eq('joining the two of them', [board.links[0].a, board.links[0].b].sort().join(','), 'n1,n2');
        eq('as one undo step', S.store.undo.length - undos, 1);
        eq('named for what it was', S.store.undo[S.store.undo.length - 1].label, 'draw a link');
        ok('the board is dirty', S.dirty === true);
        eq('the new link is what the bar is about', S.linkSel, lid);
        eq('and BOTH its ends are selected', Object.keys(S.sel).sort().join(','), 'n1,n2');
      });

    /* ---- what got drawn ---- */

    }).then(function () {
      var g = S.r.geomOf(board, lid);
      ok('the link has geometry', !!g);
      ok('a line was drawn for it', !!edge(), String(edgePaths(W).length));
      eq('and a fattened copy of it for the finger', hit().getAttribute('d'), edge().getAttribute('d'));
      ok('which is far fatter than the line it shadows',
        parseFloat(hit().getAttribute('stroke-width')) >= 8 * parseFloat(edge().getAttribute('stroke-width')),
        hit().getAttribute('stroke-width') + ' vs ' + edge().getAttribute('stroke-width'));
      eq('and carries the link\'s id, so a tap on it lands somewhere', hit().dataset.id, lid);
      eq('the visible line takes no pointer events', W.getComputedStyle(edge()).pointerEvents, 'none');
      eq('and the invisible one takes them on its stroke', W.getComputedStyle(hit()).pointerEvents, 'stroke');

      /*
       * The handle sits where the curve REALLY is. For a bowed quadratic that
       * is (A + 2C + B) / 4, which is not the average of the endpoints - and
       * putting it on the average is the mistake that leaves the handle
       * floating beside the line it belongs to.
       */
      /*
       * Where the curve is, worked out from the PATH THAT WAS DRAWN rather
       * than from geomOf - comparing the handle against the renderer's own
       * formula would pass however wrong that formula was, which is exactly
       * the tautology that let a broken counter-scale through in M3.
       */
      var q = quadOf(edge().getAttribute('d'));
      ok('the line really is a bowed quadratic', !!q, edge().getAttribute('d'));

      /*
       * Where the line STARTS. A link runs edge to edge, not centre to centre:
       * a curve that begins at a card's middle spends its first hundred units
       * underneath the card, so the arrowhead points out of a box rather than
       * at one - and nothing here asserted it, so edgePoint could return the
       * centre and every other assertion still held.
       */
      var ba = S.r.box(board, 'n1'), bbx = S.r.box(board, 'n2');
      function onEdgeOf(bx, pt) {
        var e = 0.75;
        var inside = pt[0] >= bx.x - e && pt[0] <= bx.x + bx.w + e &&
          pt[1] >= bx.y - e && pt[1] <= bx.y + bx.h + e;
        var onSide = Math.abs(pt[0] - bx.x) <= e || Math.abs(pt[0] - (bx.x + bx.w)) <= e ||
          Math.abs(pt[1] - bx.y) <= e || Math.abs(pt[1] - (bx.y + bx.h)) <= e;
        return inside && onSide;
      }
      function centreOf(bx) { return [bx.x + bx.w / 2, bx.y + bx.h / 2]; }
      ok('the line starts on the boundary of the card it leaves', onEdgeOf(ba, q.a),
        JSON.stringify({ start: q.a, box: ba }));
      ok('and ends on the boundary of the one it reaches', onEdgeOf(bbx, q.b),
        JSON.stringify({ end: q.b, box: bbx }));
      ok('not at the centre, which is under the card and invisible',
        Math.hypot(q.a[0] - centreOf(ba)[0], q.a[1] - centreOf(ba)[1]) > 8,
        JSON.stringify({ start: q.a, centre: centreOf(ba) }));
      ok('at neither end', Math.hypot(q.b[0] - centreOf(bbx)[0], q.b[1] - centreOf(bbx)[1]) > 8,
        JSON.stringify({ end: q.b, centre: centreOf(bbx) }));
      var onCurve = [(q.a[0] + 2 * q.c[0] + q.b[0]) / 4, (q.a[1] + 2 * q.c[1] + q.b[1]) / 4];
      var avg = [(q.a[0] + q.b[0]) / 2, (q.a[1] + q.b[1]) / 2];
      ok('the curve bows, so the point it passes through is not the average of its ends',
        Math.hypot(onCurve[0] - avg[0], onCurve[1] - avg[1]) > 3,
        JSON.stringify({ onCurve: onCurve, avg: avg }));
      var h = W.document.querySelector('.bb-link[data-id="' + lid + '"]');
      ok('a handle was drawn', !!h);
      var t = translateOf(h);
      near('and it sits on the curve', t[0], onCurve[0], 0.6, 'handle x');
      near('on both axes', t[1], onCurve[1], 0.6, 'handle y');
      ok('which is not where the average of the endpoints is',
        Math.hypot(t[0] - avg[0], t[1] - avg[1]) > 3, JSON.stringify({ handle: t, avg: avg }));
      ok('the handle counter-scales, so it is a target at any zoom',
        /scale\(var\(--inv/.test(h.style.transform), h.style.transform);

    /* ---- lines hold their width on screen ---- */

    }).then(function () {
      var k0 = S.k, w0 = parseFloat(edge().getAttribute('stroke-width'));
      // Fingers coming together: the board zooms out.
      return pinch(W, 140, 300, 190, 250).then(function () {
        var w1 = parseFloat(edge().getAttribute('stroke-width'));
        ok('zooming out really did zoom out', S.k < k0, S.k + ' vs ' + k0);
        ok('and the line grew in board units to compensate', w1 > w0, w1 + ' vs ' + w0);
        near('so its width on screen did not change', w1 * S.k, w0 * k0, 0.12, 'screen stroke width');
        return pinch(W, 190, 250, 140, 300);
      }).then(function () {
        near('and it comes back', S.k, k0, 0.02, 'zoom');
      });

    /* ---- refusals ---- */

    }).then(function () {
      var undos = S.store.undo.length;
      return dragPortToCard(W, 'n1', 'n2').then(function () {
        eq('two cards are not linked twice', board.links.length, 1);
        eq('and nothing was pushed onto the stack', S.store.undo.length - undos, 0);
        ok('it says they already are', /already linked/.test(bannerText(W)), bannerText(W));
        eq('showing the link they have', S.linkSel, lid);
        ok('linking a card to itself is refused', app.ops.link('n1', 'n1') === null);
        ok('and says why', /two different cards/.test(bannerText(W)), bannerText(W));
        eq('still one link', board.links.length, 1);
        ok('a group of one is refused', app.ops.group(['n1']) === null);
        ok('and says why', /at least two cards/.test(bannerText(W)), bannerText(W));
        eq('and made no group', board.groups.length, 0);
      });

    /* ---- the bar: four style axes ---- */

    }).then(function () {
      return tapBackground(W).then(function () {
        var g = S.r.geomOf(board, lid);
        return tapHandle(W, '.bb-link[data-id="' + lid + '"]', g.mid);
      });
    }).then(function () {
      eq('tapping the handle opens the link\'s bar', S.linkSel, lid);
      eq('and selects both its ends', Object.keys(S.sel).sort().join(','), 'n1,n2');
      ok('the bar offers the head', !!btn(W, '#bottombar', 'Ends'), barText(W));
      ok('the dash', !!btn(W, '#bottombar', 'Line'), barText(W));
      ok('the colour', !!btn(W, '#bottombar', 'Colour'), barText(W));
      ok('the label', !!btn(W, '#bottombar', 'Label'), barText(W));
      ok('and Unlink where Link would be', !!btn(W, '#bottombar', 'Unlink'), barText(W));

      btn(W, '#bottombar', 'Ends').click();
      return settle();
    }).then(function () {
      btn(W, '#bottombar', 'Arrow').click();
      return settle();
    }).then(function () {
      eq('a head can be set from the bar', model.link(board, lid).h, 'arrow');
      eq('and an arrowhead was drawn beside the line', pathsOfClass(W, 'bb-edge').length, 2);
      btn(W, '#bottombar', 'Back').click();
      return settle();
    }).then(function () {
      btn(W, '#bottombar', 'Line').click();
      return settle();
    }).then(function () {
      btn(W, '#bottombar', 'Dotted').click();
      return settle();
    }).then(function () {
      eq('a dash can be set from the bar', model.link(board, lid).d, 'dotted');
      ok('and the line is drawn dotted', !!edge().getAttribute('stroke-dasharray'),
        String(edge().getAttribute('stroke-dasharray')));
      btn(W, '#bottombar', 'Back').click();
      return settle();
    }).then(function () {
      btn(W, '#bottombar', 'Colour').click();
      return settle();
    }).then(function () {
      var sw = W.document.querySelectorAll('#bottombar .bb.sw');
      eq('the colour bar offers the board\'s palette', sw.length, W.BB.app.COLOURS.length);
      sw[4].click();                       // amber
      return settle();
    }).then(function () {
      eq('a colour can be set from the bar', model.link(board, lid).c, 'amber');
      ok('and the line wears it', /c-amber/.test(edge().getAttribute('class')), edge().getAttribute('class'));
      btn(W, '#bottombar', 'Back').click();
      return settle();
    }).then(function () {
      btn(W, '#bottombar', 'Label').click();
      return settle();
    }).then(function () {
      eq('Label puts the caret in the link\'s own label', S.editing, lid);
      var field = editingField(W);
      ok('a label element appeared for a link that had none', !!field && field.className.indexOf('bb-label') === 0,
        field && field.className);
      field.textContent = 'fee';
      return Promise.resolve(app.ops.resolve(true)).then(settle).then(function () {
        eq('a redraw does not touch a label being typed into', editingField(W).textContent, 'fee');
        return typeInto(W, 'feeds');
      });
    }).then(function () {
      eq('a link takes a label', model.link(board, lid).t, 'feeds');
      var lab = W.document.querySelector('.bb-label[data-id="' + lid + '"]');
      ok('which is drawn on the board', !!lab && lab.textContent === 'feeds', lab && lab.textContent);
      ok('counter-scaled like the handle it sits on',
        /scale\(var\(--inv/.test(lab.style.transform), lab.style.transform);

      // All four axes survive the note.
      return Promise.resolve(app.ops.save()).then(settle);
    }).then(function () {
      var re = W.BB.board.read(W.Synapse.__mock.notes['mock-note-1'].content);
      var l = re.board.links[0];
      eq('the head survives the block', l.h, 'arrow');
      eq('the dash survives', l.d, 'dotted');
      eq('the colour survives', l.c, 'amber');
      eq('and the label survives', l.t, 'feeds');

    /* ---- unlink ---- */

    }).then(function () {
      // Labelling left the link's bar open, and a tap on the handle TOGGLES -
      // which is the behaviour, so the test asks for the bar rather than
      // assuming a tap will produce one.
      var g = S.r.geomOf(board, lid);
      var open = S.linkSel === lid ? Promise.resolve(true)
        : tapHandle(W, '.bb-link[data-id="' + lid + '"]', g.mid);
      return open.then(function () {
        eq('the link\'s bar is open', S.linkSel, lid);
        var undos = S.store.undo.length;
        btn(W, '#bottombar', 'Unlink').click();
        return settle().then(function () {
          eq('Unlink removes the line', board.links.length, 0);
          eq('as one undo step', S.store.undo.length - undos, 1);
          eq('taking its handle with it', W.document.querySelectorAll('.bb-link').length, 0);
          eq('and its label', W.document.querySelectorAll('.bb-label').length, 0);
          eq('and every path it drew', pathsOfClass(W, 'bb-edge').length, 0);
          ok('nothing is selected any more', S.linkSel === null && !Object.keys(S.sel).length);
          app.ops.undo();
          return settle();
        });
      });
    }).then(function () {
      eq('and one undo puts the whole link back', board.links.length, 1);
      eq('with all four of its axes', [board.links[0].h, board.links[0].d, board.links[0].c, board.links[0].t].join('/'),
        'arrow/dotted/amber/feeds');
      return W;
    });
  });
}

function annotationPhase() {
  return booted('f5').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model;
    var board = S.store.board;
    var aid = null;

    return tapBackground(W).then(function () {
      return tapCard(W, 'n3');
    }).then(function () {
      return tapCard(W, 'n3');                   // second tap opens the bar
    }).then(function () {
      ok('a card\'s bar offers to annotate it', !!btn(W, '#bottombar', 'Annotate'), barText(W));
      btn(W, '#bottombar', 'Annotate').click();
      return settle();
    }).then(function () {
      var ids = model.itemsOfKind(board, 'annot');
      eq('Annotate leaves an annotation', ids.length, 1);
      aid = ids[0];
      eq('anchored to the card it was asked about', board.items[aid].at[0].i, 'n3');
      eq('with the caret in it', S.editing, aid);
      ok('drawn as an annotation, not as a card', card(W, aid).className.indexOf('k-annot') >= 0,
        card(W, aid).className);
      return typeInto(W, 'needs a source');
    }).then(function () {
      eq('holding what was typed', model.item(board, aid).t, 'needs a source');
      eq('named as its own kind of step', S.store.undo[S.store.undo.length - 1].label, 'add an annotation');

      /*
       * The whole of what makes an annotation an annotation: its `p` is an
       * OFFSET from what it points at, not a place on the plane.
       */
      var anchor = S.r.box(board, 'n3');
      var centre = [anchor.x + anchor.w / 2, anchor.y + anchor.h / 2];
      var abs = S.r.absOf(board, aid);
      var p = model.item(board, aid).p;
      near('its position is measured from its anchor', abs[0], centre[0] + p[0], 0.6, 'x');
      near('on both axes', abs[1], centre[1] + p[1], 0.6, 'y');
      ok('and the stored offset is nothing like an absolute spot',
        Math.abs(p[0] - abs[0]) > 10 || Math.abs(p[1] - abs[1]) > 10, JSON.stringify({ p: p, abs: abs }));

      var leads = pathsOfClass(W, 'bb-lead');
      eq('a leader line joins it to its anchor', leads.length, 1);
      ok('drawn dotted, unlike a link\'s curve', !!leads[0].getAttribute('stroke-dasharray'),
        String(leads[0].getAttribute('stroke-dasharray')));
      ok('and straight, unlike one too', leads[0].getAttribute('d').indexOf('Q') < 0, leads[0].getAttribute('d'));
      var lhit = edgePaths(W).filter(function (x) { return x.dataset.hit === 'annot'; });
      eq('with a fattened copy for the finger', lhit.length, 1);
      eq('carrying the annotation\'s id', lhit[0].dataset.id, aid);
      ok('far fatter than the leader itself',
        parseFloat(lhit[0].getAttribute('stroke-width')) >= 8 * parseFloat(leads[0].getAttribute('stroke-width')));

    /* ---- the anchor moves; the annotation goes with it ---- */

    }).then(function () {
      return tapBackground(W).then(function () {
        var p0 = model.item(board, aid).p.slice();
        var abs0 = S.r.absOf(board, aid);
        return dragCard(W, 'n3', 60, 40).then(function () {
          var p1 = model.item(board, aid).p;
          var abs1 = S.r.absOf(board, aid);
          eq('moving what an annotation points at does not change its offset', p1.join(','), p0.join(','));
          near('but it travels the same distance', abs1[0] - abs0[0], 60 / S.k, 2, 'x');
          near('on both axes', abs1[1] - abs0[1], 40 / S.k, 2, 'y');
        });
      });

    /* ---- the anchor goes away; the annotation stays where it was ---- */

    }).then(function () {
      var abs = S.r.absOf(board, aid);
      app.ops.remove(['n3']);
      return settle().then(function () {
        ok('removing the card leaves the annotation on the board', !!model.item(board, aid));
        eq('pointing at nothing', model.item(board, aid).at.length, 0);
        var now = S.r.absOf(board, aid);
        near('and exactly where it was last drawn', now[0], abs[0], 1.5, 'x');
        near('on both axes', now[1], abs[1], 1.5, 'y');
        eq('its leader is gone with its anchor', pathsOfClass(W, 'bb-lead').length, 0);
        app.ops.undo();
        return settle();
      });
    }).then(function () {
      ok('and undo brings the card back', !!model.item(board, 'n3'));
      eq('re-anchoring the annotation to it', model.item(board, aid).at.length, 1);
      eq('and the leader with it', pathsOfClass(W, 'bb-lead').length, 1);
      return W;
    });
  });
}

function groupPhase() {
  return booted('f5').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model;
    var board = S.store.board;
    var gid = null;

    return tapBackground(W).then(function () {
      return longPressCard(W, 'n1');
    }).then(function () {
      return tapCard(W, 'n2');
    }).then(function () {
      eq('two cards are selected', Object.keys(S.sel).sort().join(','), 'n1,n2');
      ok('the selection bar offers Group', !!btn(W, '#bottombar', 'Group'), barText(W));
      ok('and Align', !!btn(W, '#bottombar', 'Align'), barText(W));
      ok('and Annotate', !!btn(W, '#bottombar', 'Annotate'), barText(W));
      var undos = S.store.undo.length;
      btn(W, '#bottombar', 'Group').click();
      return settle().then(function () {
        eq('Group makes a frame', board.groups.length, 1);
        gid = board.groups[0].i;
        eq('holding both cards', board.groups[0].m.slice().sort().join(','), 'n1,n2');
        eq('as one undo step', S.store.undo.length - undos, 1);
        eq('and the group is what the bar is about now', S.groupSel, gid);
      });

    /* ---- what got drawn ---- */

    }).then(function () {
      var frame = W.document.querySelector('.bb-group[data-id="' + gid + '"]');
      ok('a frame element was drawn', !!frame);
      var r = S.r.rectOf(board, gid);
      var b1 = S.r.box(board, 'n1'), b2 = S.r.box(board, 'n2');
      ok('enclosing both its members', r.x < Math.min(b1.x, b2.x) && r.y < Math.min(b1.y, b2.y) &&
        r.x + r.w > Math.max(b1.x + b1.w, b2.x + b2.w) && r.y + r.h > Math.max(b1.y + b1.h, b2.y + b2.h),
        JSON.stringify({ r: r, b1: b1, b2: b2 }));
      /*
       * A frame is mostly empty canvas. If it took pointer events, the space
       * inside it would be the one place on the board a sticky could not be
       * long-pressed into being.
       */
      eq('the frame itself takes no pointer events', W.getComputedStyle(frame).pointerEvents, 'none');
      var tab = W.document.querySelector('.bb-gtab[data-id="' + gid + '"]');
      ok('its tab does', !!tab && W.getComputedStyle(tab).pointerEvents === 'auto');
      ok('and counter-scales', /scale\(var\(--inv/.test(tab.style.transform), tab.style.transform);

    /* ---- dragging the frame moves the members ---- */

    }).then(function () {
      var a0 = S.r.absOf(board, 'n1').slice(), b0 = S.r.absOf(board, 'n2').slice();
      var c0 = S.r.absOf(board, 'n3').slice();
      var undos = S.store.undo.length;
      var r = S.r.rectOf(board, gid);
      var p = screenAt(W, r.x + 10, r.y + 6);
      var st = stageOf(W);
      var tab = W.document.querySelector('.bb-gtab[data-id="' + gid + '"]');
      P(W, 'pointerdown', tab, p.x + 8, p.y + 8);
      P(W, 'pointermove', st, p.x + 8 + 14, p.y + 8);
      ok('the bin is not offered while a frame is being dragged',
        W.document.getElementById('bin').hidden === true);
      P(W, 'pointermove', st, p.x + 8 + 70, p.y + 8 + 50);
      P(W, 'pointerup', st, p.x + 8 + 70, p.y + 8 + 50);
      return settle().then(function () {
        var a1 = S.r.absOf(board, 'n1'), b1 = S.r.absOf(board, 'n2');
        near('dragging the frame moves a member', a1[0] - a0[0], 70 / S.k, 2, 'n1 x');
        near('on both axes', a1[1] - a0[1], 50 / S.k, 2, 'n1 y');
        near('and the other one with it', b1[0] - b0[0], 70 / S.k, 2, 'n2 x');
        eq('a card that is not in the group stays where it was', S.r.absOf(board, 'n3').join(','), c0.join(','));
        eq('the whole drag is one undo step', S.store.undo.length - undos, 1);
        eq('named for what it moved', S.store.undo[S.store.undo.length - 1].label, 'move a group');
        app.ops.undo();
        return settle();
      });
    }).then(function () {
      eq('and one undo puts every member back', S.r.absOf(board, 'n1').join(','), S.r.absOf(board, 'n1').join(','));

    /* ---- align ---- */

    }).then(function () {
      // Put n3 somewhere of its own first, so that aligning genuinely moves
      // TWO cards. The old case aligned two where only one of them was out of
      // line, and one transaction for the whole alignment and one transaction
      // per card push exactly one step each when only one card moves.
      return tapBackground(W).then(function () { return dragCard(W, 'n3', 90, 0); });
    }).then(function () {
      return tapBackground(W).then(function () { return longPressCard(W, 'n1'); });
    }).then(function () {
      return tapCard(W, 'n2');
    }).then(function () {
      return tapCard(W, 'n3');
    }).then(function () {
      eq('three cards are selected', Object.keys(S.sel).length, 3);
      var undos = S.store.undo.length;
      btn(W, '#bottombar', 'Align').click();
      return settle().then(function () {
        ok('Align opens its own bar', !!btn(W, '#bottombar', 'Left'), barText(W));
        ok('offering a row', !!btn(W, '#bottombar', 'Row'), barText(W));
        var was = { n1: S.r.box(board, 'n1').x, n2: S.r.box(board, 'n2').x, n3: S.r.box(board, 'n3').x };
        var x0 = Math.min(was.n1, was.n2, was.n3);
        var movers = ['n1', 'n2', 'n3'].filter(function (id) { return Math.abs(was[id] - x0) > 0.5; });
        ok('at least two of them are out of line, so per-card steps would be two or more',
          movers.length >= 2, JSON.stringify(was));
        btn(W, '#bottombar', 'Left').click();
        return settle().then(function () {
          eq('aligning left puts them all on one edge',
            [S.r.box(board, 'n1').x, S.r.box(board, 'n2').x, S.r.box(board, 'n3').x].join(','),
            [x0, x0, x0].join(','));
          eq('as one undo step, however many cards moved', S.store.undo.length - undos, 1);
          eq('named for what it did', S.store.undo[S.store.undo.length - 1].label, 'align 3 cards');
        });
      });

    /* ---- ungroup ---- */

    }).then(function () {
      return tapBackground(W).then(function () {
        var r = S.r.rectOf(board, gid);
        return tapHandle(W, '.bb-gtab[data-id="' + gid + '"]', [r.x + 10, r.y + 6]);
      });
    }).then(function () {
      eq('tapping the tab opens the group\'s bar', S.groupSel, gid);
      ok('which offers to rename it', !!btn(W, '#bottombar', 'Rename'), barText(W));
      btn(W, '#bottombar', 'Rename').click();
      return settle();
    }).then(function () {
      eq('Rename puts the caret in the tab', S.editing, gid);
      return typeInto(W, 'Pricing');
    }).then(function () {
      eq('a group takes a name', model.group(board, gid).t, 'Pricing');
      eq('and its tab shows it', W.document.querySelector('.bb-gtab[data-id="' + gid + '"]').textContent, 'Pricing');
      var r = S.r.rectOf(board, gid);
      return tapHandle(W, '.bb-gtab[data-id="' + gid + '"]', [r.x + 10, r.y + 6]).then(function () {
        // The first tap toggled the bar shut; open it again.
        var rr = S.r.rectOf(board, gid);
        if (!S.groupSel) return tapHandle(W, '.bb-gtab[data-id="' + gid + '"]', [rr.x + 10, rr.y + 6]);
        return null;
      });
    }).then(function () {
      var undos = S.store.undo.length;
      btn(W, '#bottombar', 'Ungroup').click();
      return settle().then(function () {
        eq('Ungroup removes the frame', board.groups.length, 0);
        eq('and its tab', W.document.querySelectorAll('.bb-gtab').length, 0);
        ok('leaving both cards on the board', !!model.item(board, 'n1') && !!model.item(board, 'n2'));
        eq('as one undo step', S.store.undo.length - undos, 1);
      });
    }).then(function () { return W; });
  });
}

/* ===================================================================== */
/* milestone 4: any kind of thing, at either end                          */
/* ===================================================================== */

/*
 * Two claims the plan makes that nothing above tests: a link's endpoints may
 * be ANY item kind, so a sticky can sit in the middle of a relationship
 * between two notes; and an annotation may point at several things at once.
 */
function mixedPhase() {
  return booted('f5').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model;
    var board = S.store.board;
    var sid = null, aid = null;

    return tapBackground(W).then(function () {
      var spot = screenAt(W, 620, 460);
      return longPressBg(W, spot.x, spot.y);
    }).then(function () {
      return typeInto(W, 'why these two');
    }).then(function () {
      sid = model.itemsOfKind(board, 'sticky')[0];
      ok('there is a sticky to link', !!sid);
      return tapCard(W, sid);
    }).then(function () {
      /*
       * n3, not n1: aligning left in the phase before deliberately stacked n1
       * and n2 on the same edge with the same y, and a link dropped on a pile
       * of two cards is a test of which one happens to be on top.
       */
      var before = board.links.length;
      return dragPortToCard(W, sid, 'n3').then(function () {
        eq('a sticky can be one end of a link', board.links.length, before + 1);
        var l = board.links[board.links.length - 1];
        eq('joining it to a note card', [l.a, l.b].sort().join(','), [sid, 'n3'].sort().join(','));
      });

    /* ---- an annotation pointing at several things ---- */

    }).then(function () {
      return tapBackground(W).then(function () { return longPressCard(W, 'n3'); });
    }).then(function () {
      return tapCard(W, sid);
    }).then(function () {
      eq('two things of different kinds are selected', Object.keys(S.sel).length, 2);
      var was = model.itemsOfKind(board, 'annot').length;
      btn(W, '#bottombar', 'Annotate').click();
      return settle().then(function () {
        var ids = model.itemsOfKind(board, 'annot');
        eq('Annotate on a selection leaves one annotation', ids.length, was + 1);
        aid = ids[ids.length - 1];
        eq('pointing at both of them', model.item(board, aid).at.length, 2);
        return typeInto(W, 'these belong together');
      });
    }).then(function () {
      var mine = edgePaths(W).filter(function (p) {
        return (p.getAttribute('class') || '').indexOf('bb-lead') === 0 && p.dataset.hit !== 'annot';
      });
      ok('a leader is drawn to each of them', mine.length >= 2, String(mine.length));
      var hits = edgePaths(W).filter(function (p) { return p.dataset.hit === 'annot' && p.dataset.id === aid; });
      eq('with a fattened copy of each for the finger', hits.length, 2);

      /*
       * Re-pointing it. `p` is an offset from the FIRST anchor, so changing
       * what that is changes the meaning of every number in it - and the
       * annotation must not move on screen while its meaning is rewritten
       * underneath it.
       */
      var abs0 = S.r.absOf(board, aid).slice();
      var p0 = model.item(board, aid).p.slice();
      app.ops.setAnchors(aid, [{ i: 'n2' }]);
      return settle().then(function () {
        eq('an annotation can be re-pointed', model.item(board, aid).at.length, 1);
        eq('at something else entirely', model.item(board, aid).at[0].i, 'n2');
        var now = S.r.absOf(board, aid);
        near('and it does not move while that happens', now[0], abs0[0], 1.5, 'x');
        near('on both axes', now[1], abs0[1], 1.5, 'y');
        ok('its offset was re-measured against the new anchor',
          model.item(board, aid).p.join(',') !== p0.join(','),
          JSON.stringify({ was: p0, now: model.item(board, aid).p }));
      });

    // Detaching leaves the annotation where it is, pointing at nothing.
    }).then(function () {
      var abs = S.r.absOf(board, aid);
      app.ops.setAnchors(aid, []);
      return settle().then(function () {
        eq('detaching leaves it pointing at nothing', model.item(board, aid).at.length, 0);
        var now = S.r.absOf(board, aid);
        near('and exactly where it was', now[0], abs[0], 1.5, 'x');
        near('on both axes', now[1], abs[1], 1.5, 'y');
        ok('with no leaders left', !edgePaths(W).some(function (p) { return p.dataset.id === aid; }));
      });

    /* ---- what the finger is over is what is on TOP ---- */

    }).then(function () {
      /*
       * paintCards draws annotations LAST, so an annotation is above everything
       * it overlaps. hitItem walked Object.keys, which is INSERTION order - and
       * the two diverge the moment anything is added after an annotation. A
       * link dropped on an annotation the user can plainly see linked the card
       * underneath it instead.
       */
      var box = S.r.box(board, aid);
      var probe = [box.x + box.w / 2, box.y + box.h / 2];
      app.ops.newSticky(probe[0], probe[1] + 14);      // created AFTER the annotation
      return typeInto(W, 'underneath').then(function () {
        var sid2 = model.itemsOfKind(board, 'sticky').filter(function (id) { return id !== sid; })[0];
        ok('a second sticky was made', !!sid2, model.itemsOfKind(board, 'sticky').join(','));
        var keys = Object.keys(board.items);
        ok('its key comes AFTER the annotation\'s, so key order is not stack order',
          keys.indexOf(sid2) > keys.indexOf(aid), keys.join(','));
        // Elements are created once and reused, so DOM order is the order
        // things were first drawn and says nothing about what covers what.
        // A z-index is what actually puts an annotation above its subject.
        var za = W.getComputedStyle(card(W, aid)).zIndex;
        var zs = W.getComputedStyle(card(W, sid2)).zIndex;
        ok('the annotation is stacked above the sticky, whatever order they were made in',
          parseInt(za, 10) > (zs === 'auto' ? 0 : parseInt(zs, 10)), za + ' vs ' + zs);
        var sb = S.r.box(board, sid2), ab = S.r.box(board, aid);
        function inside(bx) {
          return probe[0] >= bx.x && probe[0] <= bx.x + bx.w &&
            probe[1] >= bx.y && probe[1] <= bx.y + bx.h;
        }
        ok('the probe point really is inside both of them', inside(sb) && inside(ab),
          JSON.stringify({ probe: probe, annot: ab, sticky: sb }));
        eq('and a hit test answers with the one the user can see',
          S.r.hitItem(board, probe[0], probe[1]), aid);
      });
    }).then(function () { return W; });
  });
}

/* ===================================================================== */
/* strings that would be markup                                           */
/* ===================================================================== */

function hostilePhase() {
  return booted('f6').then(function (W) {
    var app = W.BB.app, S = app.S, R = W.BB.render;
    var board = S.store.board;
    var doc = W.document;

    // A single text node, and nothing else. This is the shape assertion that
    // an innerHTML cannot fake: markup written with innerHTML becomes element
    // nodes, whatever the resulting textContent happens to read back as.
    function textOnly(name, e, want) {
      ok(name, !!e && e.childNodes.length <= 1 &&
        (!e.firstChild || e.firstChild.nodeType === 3),
        e ? String(e.innerHTML).slice(0, 160) : 'no element');
      if (want != null) eq(name + ' - and says what it should', e ? e.textContent : null, want);
    }

    var c1 = card(W, 'n1');

    /* ---------------- the excerpt ---------------- */

    var cx = c1.querySelector('.cx');
    ok('the excerpt really does carry markup, or this proves nothing',
      cx.textContent.indexOf('<img') === 0, cx.textContent.slice(0, 60));
    textOnly('a note excerpt is text, not markup', cx);
    eq('so no image element was built from it', doc.querySelectorAll('#cards img').length, 0);

    /* ---------------- a tag chip ---------------- */

    var chip = c1.querySelector('.cc .chip.tag');
    ok('the card has a tag chip', !!chip, c1.querySelector('.cc').innerHTML.slice(0, 160));
    textOnly('a tag chip\'s name is text, not markup', chip, HOSTILE_NAME);
    eq('and its colour still parses, so the chip is not just broken',
      chip.style.getPropertyValue('--chip'), '#3355ff');

    /* ---------------- a group tab ---------------- */

    var tab = doc.querySelector('.bb-gtab[data-id="g1"]');
    ok('the group drew a tab', !!tab);
    textOnly('a group tab\'s name is text, not markup', tab.firstChild, HOSTILE_NAME);
    eq('and nothing in the handles layer became an image',
      doc.querySelectorAll('#handles img').length, 0);

    /* ---------------- a sticky's own text ---------------- */

    textOnly('a sticky\'s text is text', card(W, 's1').querySelector('.ct'), HOSTILE_NAME);

    /* ---------------- nothing anywhere ---------------- */

    // The scene layers, not the document: the page's own <script> tags are the
    // app, and counting those would make this pass or fail for the wrong reason.
    eq('no image element reached the scene at all',
      doc.querySelectorAll('#groups img, #edges img, #cards img, #handles img').length, 0);
    eq('and no script element did either',
      doc.querySelectorAll('#groups script, #edges script, #cards script, #handles script').length, 0);

    /* ---------------- a colour that is a style declaration ---------------- */

    /*
     * `c` is free text in the format, so it is the one value from a board that
     * reaches CSS rather than textContent. Everything that is not a plain word
     * is DROPPED rather than escaped, which is why a class attribute built from
     * it can never carry a semicolon, a bracket or a quote out into the
     * stylesheet's world.
     */
    var cls = R.colourClass(HOSTILE_COLOUR);
    ok('a hostile colour still yields a class', !!cls, cls);
    ok('made of nothing but letters and the two class names',
      /^col c-[a-z]+$/.test(cls), cls);
    ['(', ')', ';', ':', '/', '.', '"', "'", ' url'].forEach(function (ch) {
      eq('and carries no ' + JSON.stringify(ch), cls.indexOf(ch), -1);
    });
    ok('the card wears it', c1.className.indexOf('col ') >= 0 || / col$/.test(c1.className), c1.className);
    ok('and its class attribute is letters, spaces and hyphens only',
      /^[a-zA-Z0-9 _-]+$/.test(c1.className), c1.className);
    ok('so is the frame\'s', /^[a-zA-Z0-9 _-]+$/.test(doc.querySelector('.bb-group[data-id="g1"]').className),
      doc.querySelector('.bb-group[data-id="g1"]').className);
    eq('an empty colour is no class at all', R.colourClass(''), '');
    eq('and one with no letters in it is none either', R.colourClass('1234;:'), '');

    /* ---------------- a group tab is a 44px target ---------------- */

    /*
     * The frame takes no pointer events, so the tab is a group's ONLY target.
     * At 30px it was the one affordance on the board a thumb could miss, and
     * the grip is asserted at 44px a few hundred lines above.
     */
    var tr = tab.getBoundingClientRect();
    ok('a group tab is at least 44px tall', tr.height >= 43.5, JSON.stringify({ w: tr.width, h: tr.height }));
    ok('and at least 44px wide', tr.width >= 43.5, JSON.stringify({ w: tr.width, h: tr.height }));
    eq('and it is the group\'s only target, so it has to be',
      W.getComputedStyle(doc.querySelector('.bb-group[data-id="g1"]')).pointerEvents, 'none');

    /* ---------------- a frame is visible at the zoom floor ---------------- */

    /*
     * Everything else counter-scales; the frame's border did not, so at the
     * smallest zoom a finger can reach a 1.5px dashed line measured a fifth of
     * a device pixel and the group all but disappeared - at exactly the zoom
     * where a frame is the only thing saying which cards belong together.
     */
    var frame = doc.querySelector('.bb-group[data-id="g1"]');
    var keep = { tx: S.tx, ty: S.ty, k: S.k };
    var bw1 = parseFloat(W.getComputedStyle(frame).borderTopWidth);
    S.k = W.BB.gestures.MIN_Z;
    S.r.setCamera(S.tx, S.ty, S.k);
    var bw = parseFloat(W.getComputedStyle(frame).borderTopWidth);
    /*
     * Chrome floors a border to whole device pixels, so the number at an
     * ordinary zoom is 1 either way and proves nothing. What the counter-scale
     * has to deliver is the number at the FLOOR: the border must grow in board
     * units by 1/zoom, so that what lands on the glass is still the 1.5px it
     * was drawn as. Uncompensated it measured 1 board unit there - 0.15 device
     * pixels - and the frame vanished.
     */
    near('a group frame holds its 1.5px on screen at the zoom floor', bw * S.k, 1.5, 0.35,
      'border ' + bw + ' board units at k=' + S.k);
    ok('which is many times what an uncompensated border would have measured',
      bw >= bw1 * 4, 'floor ' + bw + ' vs ordinary ' + bw1);
    S.tx = keep.tx; S.ty = keep.ty; S.k = keep.k;
    S.r.setCamera(S.tx, S.ty, S.k);
    ok('and it is still a visible border at an ordinary zoom',
      parseFloat(W.getComputedStyle(frame).borderTopWidth) >= 1,
      W.getComputedStyle(frame).borderTopWidth);

    return W;
  });
}

/* ===================================================================== */
/* milestone 5: merging                                                   */
/* ===================================================================== */

/*
 * The one behaviour this phase exists for: a merge result is an UPSERT.
 *
 * The merge screen has two save modes. Replace mode rewrites the first source
 * in place and hands back that source's own id, so a board that treated every
 * answer as a new card would draw two cards for one note - and the next merge
 * would be that note against itself.
 *
 * Everything is scripted through window.__BB_MERGE__, which is what makes both
 * modes reachable with no Flutter anywhere: the mock's own default creates a
 * note, and the interesting case is the one where it does not.
 */
function mergePhase() {
  return booted('f7').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model, mock = W.Synapse.__mock;
    var board = S.store.board;

    function merges() { return mock.merges.length; }
    function cardsFor(noteId) { return model.cardsForNote(board, noteId); }
    function pos(id) { var it = model.item(board, id); return it ? it.p.join(',') : null; }
    // The merge is a promise the gesture layer does not return, so a drop is
    // followed by waiting for the screen to have been asked and answered.
    function afterMerge(n) {
      return waitFor(function () { return merges() >= n && S.merging === false; }).then(settle);
    }
    function dragOnto(fromId, toId) {
      var st = stageOf(W), p = pointOn(W, fromId);
      var t = W.BB.app.itemScreenRect(toId);
      P(W, 'pointerdown', card(W, fromId), p.x, p.y);
      P(W, 'pointermove', st, p.x + 14, p.y);
      P(W, 'pointermove', st, t.left + t.width / 2, t.top + t.height / 2);
      P(W, 'pointerup', st, t.left + t.width / 2, t.top + t.height / 2);
      return settle();
    }

    eq('the merge board loaded six cards', Object.keys(board.items).length, 6);
    eq('with nothing merged yet', merges(), 0);
    ok('and it is writable', S.readOnly === false, S.why);

    /* -------- the group affordance disambiguates the same drop -------- */

    return Promise.resolve().then(function () {
      app.ops.select('n1');
      return settle();
    }).then(function () {
      var handle = card(W, 'n1').querySelector('.group-port');
      var css = W.getComputedStyle(handle);
      ok('a selected card exposes a separate group-drop handle', css.display !== 'none');
      eq('the group handle names the card it will drag', handle.dataset.groupPort, 'n1');
      near('it is a 44px target on its unscaled axis', parseFloat(css.width), 44, 0.1, css.width);
      var keepK = S.k;
      S.k = W.BB.gestures.MIN_Z;
      S.r.setCamera(S.tx, S.ty, S.k);
      var tr = W.getComputedStyle(handle).transform;
      var matrix = /^matrix\(([-0-9.]+)/.exec(tr);
      ok('the group handle has its own scale transform', !!matrix, tr);
      if (matrix) near('and stays a thumb-sized target at the zoom floor', parseFloat(matrix[1]) * S.k, 1, 0.03, tr);
      S.k = keepK;
      S.r.setCamera(S.tx, S.ty, S.k);
      var groups = board.groups.length, undos = S.store.undo.length, before = pos('n1');
      return dragGroupHandleToCard(W, 'n1', 's1').then(function () {
        eq('dropping that handle on another card opens no merge screen', merges(), 0);
        eq('and creates one visual group', board.groups.length - groups, 1);
        var made = board.groups[board.groups.length - 1];
        eq('holding exactly the two cards named by the drop', made.m.slice().sort().join(','), 'n1,s1');
        eq('as one undo step', S.store.undo.length - undos, 1);
        eq('without moving the dragged card underneath the finger', pos('n1'), before);
        app.ops.undo();
        return settle();
      }).then(function () {
        eq('one undo removes the group', board.groups.length, groups);
      });
    }).then(function () {
      // Missing the target is an abandoned group gesture, never a move.
      app.ops.select('n1');
      var undos = S.store.undo.length, before = pos('n1');
      var far = screenAt(W, 5000, 5000);
      return dragGroupHandleTo(W, 'n1', far.x, far.y).then(function () {
        eq('a group-handle drop on empty space opens no merge screen', merges(), 0);
        eq('and adds no undo step', S.store.undo.length - undos, 0);
        eq('putting the card back where it started', pos('n1'), before);
        ok('while saying what the handle needs', /needs another card/.test(bannerText(W)), bannerText(W));
      });

    /* ---------------- a drop that is not a merge ---------------- */

    }).then(function () {
      /*
       * A sticky is a canvas object that lives wherever it is put, so a note
       * card dropped on one is an ordinary move. Only note-on-note is a merge.
       */
      var undos = S.store.undo.length;
      return dragOnto('n1', 's1').then(function () {
        eq('a card dropped on a sticky opens no merge screen', merges(), 0);
        eq('it is a move, and one undo step', S.store.undo.length - undos, 1);
        ok('the card really moved', pos('n1') !== '0,0', pos('n1'));
        app.ops.undo();
        return settle();
      }).then(function () {
        eq('and undo puts it back', pos('n1'), '0,0');
      });

    /* ---------------- refusals, all of them stated ---------------- */

    }).then(function () {
      var undos = S.store.undo.length;
      // A tombstone: the note behind it is gone, so there is nothing to merge.
      return dragOnto('n1', 'n9').then(function () {
        eq('dropping a card on a tombstone opens no merge screen', merges(), 0);
        ok('it says why', /no note behind it/.test(bannerText(W)), bannerText(W));
        eq('and the dragged card is back where it started, not left on top of it', pos('n1'), '0,0');
        eq('with nothing on the undo stack for it', S.store.undo.length - undos, 0);
      });
    }).then(function () {
      // A sticky in a SELECTION is a refusal rather than a move: the user
      // pressed Merge and meant it.
      app.ops.select('n1');
      S.sel.s1 = true;
      S.selectMode = true;
      return Promise.resolve(app.ops.merge(['n1', 's1'])).then(settle);
    }).then(function () {
      eq('Merge on a selection holding a sticky opens no merge screen', merges(), 0);
      ok('and says a sticky is not a note', /sticky/.test(bannerText(W)), bannerText(W));
      return Promise.resolve(app.ops.merge(['n1'])).then(settle);
    }).then(function () {
      eq('one card is not a merge', merges(), 0);
      ok('and it says two are needed', /two note cards/.test(bannerText(W)), bannerText(W));

      /*
       * Two cards for ONE note. The format allows it and a merge must not: it
       * would be a note merged with itself, which is the shape a mishandled
       * upsert leaves behind.
       */
      var twin = S.store.mutate('a second card for one note', function (b) {
        return model.addItem(b, { k: 'note', id: 'p1', p: [720, 620] });
      });
      return Promise.resolve(app.ops.merge(['n1', twin])).then(settle).then(function () {
        eq('two cards for one note are not two notes', merges(), 0);
        ok('and it says so', /same note/.test(bannerText(W)), bannerText(W));
        app.ops.remove([twin]);
        // Out of the multi-selection: a card dragged as part of one moves the
        // whole selection, which is a move and never a merge.
        return tapBackground(W);
      }).then(function () {
        eq('nothing is selected any more', Object.keys(S.sel).length, 0);
        ok('and the mode is off', S.selectMode === false);
      });

    /* ---------------- cancel changes nothing at all ---------------- */

    }).then(function () {
      W.__BB_MERGE__ = [{ success: true, cancelled: true }];
      var undos = S.store.undo.length;
      var before = pos('n1'), items = Object.keys(board.items).length;
      return dragOnto('n1', 'n2').then(function () { return afterMerge(1); }).then(function () {
        eq('the merge screen was opened once', merges(), 1);
        eq('and asked for both notes', mock.merges[0].slice().sort().join(','), 'p1,p2');
        eq('a cancelled merge leaves the card exactly where it was', pos('n1'), before);
        eq('every card is still there', Object.keys(board.items).length, items);
        eq('with nothing on the undo stack', S.store.undo.length - undos, 0);
        ok('and it says nothing came back', /Nothing came back/.test(bannerText(W)), bannerText(W));
        return wait(120);
      }).then(function () {
        // `cancelled` is not a retry signal: a merge can save and report
        // nothing, and asking again would make a second merged note.
        eq('and nothing asked the merge screen again', merges(), 1);
      });

    /* ---------------- the upsert: the merged id is a source ---------------- */

    }).then(function () {
      /*
       * Replace mode. The id that comes back is the FIRST note passed in,
       * which for a drop is the card that was dropped ON - so its card stays
       * exactly where it is and only the other one leaves.
       */
      W.__BB_MERGE__ = function (ids) { return { success: true, mergedNoteId: ids[0] }; };
      var keptAt = pos('n2'), undos = S.store.undo.length;
      return dragOnto('n1', 'n2').then(function () { return afterMerge(2); }).then(function () {
        eq('the card dropped ON is the first source, so replace mode rewrites it',
          mock.merges[1][0], 'p2');
        eq('and the dragged one is the second', mock.merges[1][1], 'p1');
        eq('there is exactly ONE card for the merged note', cardsFor('p2').length, 1);
        eq('and it is the card that was already here', cardsFor('p2')[0], 'n2');
        eq('which has not moved', pos('n2'), keptAt);
        ok('the source card is gone', !model.item(board, 'n1'));
        eq('no card is left for the note that went into it', cardsFor('p1').length, 0);
        eq('all of it is one undo step', S.store.undo.length - undos, 1);
        ok('the board is dirty', S.dirty === true);
        ok('and it says the notes stay merged', /stay merged/.test(bannerText(W)), bannerText(W));
        app.ops.undo();
        return settle();
      }).then(function () {
        eq('undo puts the source card back', cardsFor('p1').length, 1);
        eq('and the survivor is still there', cardsFor('p2').length, 1);
        app.ops.redo();
        return settle();
      }).then(function () {
        eq('redo takes it away again', cardsFor('p1').length, 0);
      });

    /* ---------------- one note, one card, whatever was there before ------- */

    }).then(function () {
      /*
       * A board can hold two cards for one note - the format allows it, and a
       * board written by hand may. A merge whose result is that note must end
       * with ONE card for it, not with the survivor beside a twin that the
       * next merge would offer to merge with itself.
       */
      var twin = S.store.mutate('a twin card for the survivor\'s note', function (b) {
        return model.addItem(b, { k: 'note', id: 'p2', p: [720, 620] });
      });
      eq('the board really does hold two cards for that note', cardsFor('p2').length, 2);
      W.__BB_MERGE__ = function (ids) { return { success: true, mergedNoteId: ids[0] }; };
      return Promise.resolve(app.ops.merge(['n2', 'n3'])).then(function () {
        return afterMerge(3);
      }).then(function () {
        eq('the merge leaves one card for the merged note', cardsFor('p2').length, 1);
        ok('and the twin is the one that went', !model.item(board, twin));
        ok('the card that was already the survivor stayed', !!model.item(board, 'n2'));
        app.ops.undo();
        return settle();
      }).then(function () {
        eq('one undo puts both of them back', cardsFor('p2').length, 2);
        eq('and the source card too', cardsFor('p3').length, 1);
        S.store.mutate('take the twin away again', function (b) { return model.removeItem(b, twin).removed; });
        return settle();
      });

    /* ---------------- a merged note that is new ---------------- */

    }).then(function () {
      /*
       * The other save mode: a NEW note. There is no card for it, so one is
       * placed at the drop point and every source leaves - and everything
       * that pointed at a source points at the new card.
       */
