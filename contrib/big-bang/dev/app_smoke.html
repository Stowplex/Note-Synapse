      var annot = S.store.mutate('an annotation on a source', function (b) {
        return model.addItem(b, { k: 'annot', t: 'about Gamma', p: [20, -60], at: [{ i: 'n3' }] });
      });
      W.__BB_MERGE__ = function () { return { success: true, mergedNoteId: 'p-new' }; };
      mock.put({ id: 'p-new', title: 'Gamma + Delta', content: 'both bodies' });
      var undos = S.store.undo.length;
      return dragOnto('n3', 'n4').then(function () { return afterMerge(4); }).then(function () {
        var made = cardsFor('p-new');
        eq('one card was placed for the merged note', made.length, 1);
        ok('neither source is on the board', !model.item(board, 'n3') && !model.item(board, 'n4'));
        eq('as one undo step', S.store.undo.length - undos, 1);
        eq('the link that joined the two sources is gone rather than joining the card to itself',
          board.links.length, 0);
        var g = model.group(board, 'g1');
        ok('the group survives, holding the one card that replaced its members',
          !!g && g.m.join(',') === made[0], g && JSON.stringify(g.m));
        eq('and the annotation now points at that card',
          model.item(board, annot).at.map(function (a) { return a.i; }).join(','), made[0]);
        // The drop point: the card is where the finger left it, not where
        // either source used to be.
        var p = model.item(board, made[0]).p;
        ok('the new card sits where the drop happened, not at the origin',
          p[0] !== 0 || p[1] !== 0, JSON.stringify(p));
        ok('the merged note\'s own title is read from the note, not guessed',
          card(W, made[0]).querySelector('.ct').textContent === 'Gamma + Delta',
          card(W, made[0]).querySelector('.ct').textContent);
        return Promise.resolve(app.ops.save()).then(settle);
      }).then(function () {
        var re = W.BB.board.read(mock.notes['mock-note-1'].content);
        var ids = Object.keys(re.board.items).filter(function (id) {
          return re.board.items[id].k === 'note' && re.board.items[id].id === 'p-new';
        });
        eq('the block on the note holds exactly one card for the merged note', ids.length, 1);
        ok('and the prose around it survived', mock.notes['mock-note-1'].content.indexOf(MERGE_LINE) >= 0);
      });

    /* ---------------- a card for the merged note somewhere else ---------------- */

    }).then(function () {
      /*
       * The merged id belongs to a note that already has a card, and that card
       * was not one of the sources. It is still an upsert: the board ends with
       * one card for the note, and it is the one that was already drawn.
       */
      var a = S.store.mutate('two more cards', function (b) {
        return model.addItem(b, { k: 'note', id: 'p3', p: [0, 700] });
      });
      var bId = S.store.mutate('and another', function (b) {
        return model.addItem(b, { k: 'note', id: 'p4', p: [360, 700] });
      });
      var kept = cardsFor('p-new')[0];
      var keptAt = pos(kept);
      W.__BB_MERGE__ = function () { return { success: true, mergedNoteId: 'p-new' }; };
      return Promise.resolve(app.ops.merge([a, bId])).then(function () { return afterMerge(5); }).then(function () {
        eq('still one card for the merged note', cardsFor('p-new').length, 1);
        eq('and it is the one that was already on the board', cardsFor('p-new')[0], kept);
        eq('which did not move', pos(kept), keptAt);
        ok('both sources left', !model.item(board, a) && !model.item(board, bId));
      });

    /* ---------------- one merge at a time ---------------- */

    }).then(function () {
      /*
       * The host has no re-entrancy guard - it was left to the plugin - and
       * two overlapping merges of the same cards would make two merged notes.
       */
      /*
       * Every scripted answer is held, not just the last one. Releasing only
       * the most recent resolver would leave the FIRST merge pending for ever
       * if the guard were gone, and a harness that hangs reports nothing at
       * all - which is a mutation surviving for want of an assertion.
       */
      var waiting = [];
      W.__BB_MERGE__ = function () {
        return new W.Promise(function (res) { waiting.push(function () { res({ success: true, cancelled: true }); }); });
      };
      var first = app.ops.merge(['n2', cardsFor('p-new')[0]]);
      return settle().then(function () {
        ok('the first merge is in flight', S.merging === true);
        eq('the badge says so', (W.document.getElementById('badge') || {}).textContent, 'merging…');
        /*
         * The second call is NOT awaited. A guard that has gone leaves it
         * waiting on the merge screen exactly as the first one is, and a test
         * that awaited it would deadlock - reporting nothing at all, which is
         * how this mutation survived its first application.
         */
        var refused = 'still waiting';
        Promise.resolve(app.ops.merge(['n2', cardsFor('p-new')[0]])).then(function (r) { refused = r; });
        return settle().then(function () {
          eq('and the screen was asked once, not twice', merges(), 6);
          eq('so only one answer is outstanding', waiting.length, 1);
          eq('a second merge while one is open is refused there and then', refused, false);
          ok('it says why', /already open/.test(bannerText(W)), bannerText(W));
          // And so is a write to a note, which would put a second question on
          // the screen behind the merge screen the user is already looking at.
          ok('a note write is refused while the merge screen is up', app.ops.promote('s1') === false);
          ok('saying which screen is in the way', /merge screen is open/i.test(bannerText(W)), bannerText(W));
          eq('and nothing was created', mock.saves.length, 0);
          waiting.forEach(function (release) { release(); });
          return first;
        });
      }).then(function () {
        return waitFor(function () { return S.merging === false; });
      }).then(function () {
        ok('and when it comes back the guard is off again', S.merging === false);
        W.__BB_MERGE__ = null;
        return W;
      });

    /* ---------------- a merge screen that could not open ---------------- */

    }).then(function () {
      W.__BB_MERGE__ = [{ success: false, error: 'openMerge not supported in this context' }];
      var items = Object.keys(board.items).length;
      return Promise.resolve(app.ops.merge(['n2', cardsFor('p-new')[0]])).then(settle).then(function () {
        W.__BB_MERGE__ = null;
        eq('a refused merge changes nothing on the board', Object.keys(board.items).length, items);
        ok('and reports what the host said',
          /not supported in this context/.test(bannerText(W)), bannerText(W));
      });

    /* ------------- what the board is when the answer comes back ------------- */

    }).then(function () {
      return mergeAcrossTheAwait(W);
    }).then(function () {
      return W;
    });
  });
}

/*
 * The merge screen is a SEPARATE SCREEN the user drives, and in the browser it
 * is not even modal. Everything below is about the window that opens while it
 * is up: the board can be replaced by another session's, it can go read-only
 * under a refused save, and the answer can arrive to find neither the board
 * nor the permission that were there when the screen opened.
 *
 * Each case builds its own board and asserts against S.store.board rather than
 * anything captured earlier.
 */
function mergeAcrossTheAwait(W) {
  var app = W.BB.app, S = app.S, model = W.BB.model, mock = W.Synapse.__mock;

  function bd() { return S.store.board; }
  function item(id) { return model.item(bd(), id); }
  function noteOf(id) { var it = item(id); return it ? it.id : null; }
  function badgeText() { return (W.document.getElementById('badge') || {}).textContent || ''; }
  function merges() { return mock.merges.length; }
  function boardOf(spec) {
    return W.BB.board.read('```synapse-bigbang\n' + JSON.stringify(spec) + '\n```\n').board;
  }
  /*
   * Two note cards, a line between them, a group holding both and an
   * annotation hanging off the first - one of everything a substitution
   * repoints, so that a substitution aimed at the wrong cards shows up as
   * damage rather than as nothing.
   */
  function twoCards(a, b) {
    return {
      v: 1, view: { p: [0, 0], z: 1 },
      items: {
        n1: { k: 'note', id: a, p: [0, 0], w: 200 },
        n2: { k: 'note', id: b, p: [360, 0], w: 200 },
        a1: { k: 'annot', t: 'about the first', p: [10, 10], at: [{ i: 'n1' }] }
      },
      links: [{ i: 'l1', a: 'n1', b: 'n2' }],
      groups: [{ i: 'g1', m: ['n1', 'n2'], t: 'Pricing' }]
    };
  }
  /*
   * A fresh board and a clean slate. The pending save is dropped along with
   * the board it belonged to: every case here replaces the whole board, so a
   * debounce left running from the previous one would land on this one, and
   * "is anything queued to save" is a thing these cases assert about.
   */
  function setUp(a, b) {
    if (S.saveTimer) { W.clearTimeout(S.saveTimer); S.saveTimer = null; }
    S.store.reset(boardOf(twoCards(a || 'p1', b || 'p2')));
    S.dirty = false;
    S.readOnly = false;
    S.stranded = false;
    S.merging = false;
    S.writing = false;
    return bd();
  }
  // A merge screen that stays open until the test says otherwise.
  var release = null;
  function heldMerge(answer) {
    release = null;
    W.__BB_MERGE__ = function () {
      return new W.Promise(function (res) { release = function () { res(answer()); }; });
    };
  }

  return Promise.resolve().then(function () {

    /* ---- the board was REPLACED while the screen was up ---- */

    /*
     * Open theirs, on a conflict banner, calls store.reset with another
     * session's board - which reuses this board's ids for entirely different
     * notes. An answer that trusted "the id is still there" would delete two
     * cards nobody merged, repoint their line, their group and their
     * annotation onto a card for the merged note, and mark it dirty.
     */
    setUp('p1', 'p2');
    ok('the fixture parsed whole', !!item('a1') && bd().links.length === 1 && bd().groups.length === 1);
    var late = mock.put({ title: 'Merged late', content: 'both bodies' }).id;
    heldMerge(function () { return { success: true, mergedNoteId: late }; });
    var open = app.ops.merge(['n1', 'n2']);
    return settle().then(function () {
      ok('the merge screen is open on p1 and p2', S.merging === true);
      eq('and it was asked for those two notes', mock.merges[mock.merges.length - 1].join(','), 'p1,p2');
      // Their board, adopted whole. Same ids, different notes.
      S.store.reset(boardOf(twoCards('p3', 'p4')));
      release();
      return open;
    }).then(settle).then(function () {
      ok('the answer is taken and the guard released', S.merging === false);
      ok('the card called n1 is still there', !!item('n1'));
      eq('and still points at THEIR note, not at the merge', noteOf('n1'), 'p3');
      ok('the card called n2 is still there', !!item('n2'));
      eq('and so does that one', noteOf('n2'), 'p4');
      eq('their line was not repointed onto the merged card', bd().links.length, 1);
      eq('and still joins their two cards', bd().links[0].a + ',' + bd().links[0].b, 'n1,n2');
      eq('their group still holds both', bd().groups[0].m.slice().sort().join(','), 'n1,n2');
      eq('their annotation still hangs off the card it named', item('a1').at[0].i, 'n1');
      eq('and the merged note got a card of its own, because the merge really happened',
        model.cardsForNote(bd(), late).length, 1);
    });

  }).then(function () {

    /* ---- the board went READ-ONLY while the screen was up ---- */

    /*
     * The merge cannot be undone: replace mode has already rewritten a source
     * in place. So the board must record it whatever the board's own state
     * has become - a substitution dropped here would leave two cards for one
     * note, one of them stale, under a toast saying "Merged into one card".
     */
    setUp('p1', 'p2');
    var merged = mock.put({ title: 'Merged under a conflict', content: 'both' }).id;
    var conflict = 'Another Big Bang session saved this board while it was open.';
    heldMerge(function () { return { success: true, mergedNoteId: merged }; });
    var open = app.ops.merge(['n1', 'n2']);
    return settle().then(function () {
      ok('the merge screen is open', S.merging === true);
      // The debounced save landed on the other session's block: read-only,
      // with the conflict's own way out standing in the banner.
      S.readOnly = true;
      S.why = conflict;
      app.ops.ask(conflict, 'Keep mine', function () { app.ops.force('conflict'); });
      release();
      return open;
    }).then(settle).then(function () {
      eq('the substitution happened anyway', model.cardsForNote(bd(), merged).length, 1);
      ok('and both sources went with it', !item('n1') && !item('n2'));
      ok('the board says out loud that it could not record it', S.stranded === true);
      eq('and the badge says it too, over "read-only"', badgeText(), 'not recorded');
      ok('the banner says the notes really are merged',
        /really were merged/.test(bannerText(W)), bannerText(W));
      ok('that the board itself cannot be saved',
        /cannot be saved/.test(bannerText(W)), bannerText(W));
      ok('and why the board could not follow',
        /another Big Bang session/i.test(bannerText(W)), bannerText(W));
      ok('and what the note still holds until that is settled',
        /the note still holds the board as it was/.test(bannerText(W)), bannerText(W));
      ok('the way out is still on the banner', !!btnAt(W, '#banner', 'Keep mine'));
      ok('nothing congratulated the user on a merge that is not written down',
        !/Merged into one card/.test(bannerText(W)), bannerText(W));
      ok('and nothing is queued to save, because on this board nothing can be', S.dirty === false);
      // The user takes the way out. THIS is what makes the record honest: the
      // merge the board could not save is in the note as soon as they do.
      btnAt(W, '#banner', 'Keep mine').click();
      return waitFor(function () { return S.stranded === false && S.saving === false; }).then(settle);
    }).then(function () {
      ok('Keep mine writes the merge into the note',
        mock.content(S.session.noteId).indexOf(merged) >= 0, mock.content(S.session.noteId).slice(0, 200));
      ok('and the board stops saying it is unrecorded', S.stranded === false);
      eq('the badge is an ordinary one again', badgeText(), 'saved');
    });

  }).then(function () {

    /* ---- and Open theirs, which throws that record away ---- */

    setUp('p1', 'p2');
    var merged = mock.put({ title: 'Merged and abandoned', content: 'both' }).id;
    heldMerge(function () { return { success: true, mergedNoteId: merged }; });
    var open = app.ops.merge(['n1', 'n2']);
    return settle().then(function () {
      S.readOnly = true;
      S.why = 'Another Big Bang session saved this board while it was open.';
      release();
      return open;
    }).then(settle).then(function () {
      ok('the merge is recorded but unsaved', S.stranded === true);
      // Their board instead of ours: the record goes with ours, and the user
      // is told so rather than left to find two cards for one note later.
      app.ops.adopt({ theirs: boardOf(twoCards('p3', 'p4')), key: 'x' });
      return settle();
    }).then(function () {
      ok('the flag is cleared with the board it belonged to', S.stranded === false);
      ok('and the banner says the note write was not recorded either',
        /not recorded|nor was the note write/i.test(bannerText(W)), bannerText(W));
      ok('while making clear the notes themselves are still merged',
        /notes themselves are unchanged/i.test(bannerText(W)), bannerText(W));
    });

  }).then(function () {

    /* ---- the same window, on a smaller write ---- */

    /*
     * Also link the notes writes a relationship and then marks the line with a
     * dot to say so. The dot is the board's only record that the relationship
     * exists, so a board that has gone read-only across the write cannot
     * silently drop it either: the user would come back to a line that says
     * nothing stands behind it, and link the same two notes again.
     */
    setUp('p1', 'p2');
    var hold = null;
    W.__BB_UPDATE__ = function () {
      return new W.Promise(function (res) { hold = function () { res({ success: true, updatedCount: 1 }); }; });
    };
    app.ops.linkNotes('l1');
    ok('the question is put first', !!btnAt(W, '#banner', 'Link the notes'));
    btnAt(W, '#banner', 'Link the notes').click();
    return settle().then(function () {
      ok('the write is in flight', S.writing === true);
      S.readOnly = true;
      S.why = 'Another Big Bang session saved this board while it was open.';
      hold();
      return waitFor(function () { return S.writing === false; });
    }).then(settle).then(function () {
      W.__BB_UPDATE__ = null;
      ok('the line is marked as a real note link', model.link(bd(), 'l1').real === true);
      ok('and the board says it could not record that', S.stranded === true);
      ok('naming the write that landed', /really are linked/.test(bannerText(W)), bannerText(W));
      ok('with no toast standing in front of that saying all is well', S.toastT === null);
    });

  }).then(function () {

    /* ---- a host that throws on the stack rather than rejecting ---- */

    /*
     * The real shim is async, so this cannot happen through it - but the guard
     * claims to be released on every exit path, and a .then(ok, err) pair never
     * sees a throw that is still on the stack. A guard stuck true refuses EVERY
     * note write for the life of the board, quoting a screen that is not open.
     */
    setUp('p1', 'p2');
    var before = merges();
    W.__BB_MERGE__ = function () { throw new W.Error('sync boom'); };
    return Promise.resolve(app.ops.merge(['n1', 'n2'])).then(function (r) {
      W.__BB_MERGE__ = null;
      return settle().then(function () { return r; });
    }).then(function (r) {
      eq('a host that throws synchronously is answered like any other refusal', r, false);
      eq('the screen was still asked for', merges(), before + 1);
      ok('the guard is released', S.merging === false);
      ok('and what went wrong is said', /sync boom/.test(bannerText(W)), bannerText(W));
      app.ops.tagNotes('g1');
      ok('so a note write is asked about rather than refused for ever',
        /Add the tag/.test(bannerText(W)), bannerText(W));
      btnAt(W, '#banner', 'Cancel').click();
    });

  }).then(function () {

    /* ---- a substitution that throws ---- */

    /*
     * The same guard, released too late. Everything after the await runs with
     * S.merging still true if the release is written after applyMerge, and
     * applyMerge touches the board, the renderer and the note cache.
     */
    setUp('p1', 'p2');
    W.__BB_MERGE__ = null;
    var realForget = S.cache.forget;
    S.cache.forget = function () { throw new W.Error('cache boom'); };
    return Promise.resolve(app.ops.merge(['n1', 'n2']))
      .then(function () { }, function () { })
      .then(settle).then(function () {
        S.cache.forget = realForget;
        ok('a substitution that throws still releases the merge guard', S.merging === false);
        setUp('p1', 'p2');
        app.ops.tagNotes('g1');
        ok('so the board is not left refusing every note write',
          /Add the tag/.test(bannerText(W)), bannerText(W));
        btnAt(W, '#banner', 'Cancel').click();
      });

  }).then(function () {

    /* ---- one write at a time, in both directions ---- */

    setUp('p1', 'p2');
    var before = merges();
    S.writing = true;
    return Promise.resolve(app.ops.merge(['n1', 'n2'])).then(settle).then(function () {
      S.writing = false;
      eq('a merge while a note write is in flight opens no screen', merges(), before);
      ok('and says why', /One write at a time/.test(bannerText(W)), bannerText(W));
    });

  }).then(function () {

    /*
     * Remove both, on a line a real relationship stands behind, is a delete
     * from `relationships`. It is a note write like any other and has to pass
     * the same gate - the merge screen included, which is the whole point of
     * that gate.
     */
    setUp('p1', 'p2');
    S.store.mutate('a real note link', function (b) { return model.setLinkReal(b, 'l1', true); });
    S.merging = true;
    var refusedMerging = app.ops.unlink('l1');
    S.merging = false;
    eq('Unlink on a real link is refused while the merge screen is open', refusedMerging, false);
    ok('saying which screen is in the way', /merge screen is open/i.test(bannerText(W)), bannerText(W));
    ok('and the line is untouched', !!model.link(bd(), 'l1'));
    ok('with no question left standing behind it', !btnAt(W, '#banner', 'Remove both'));

    S.writing = true;
    var refusedWriting = app.ops.unlink('l1');
    S.writing = false;
    eq('and refused while a note write is in flight', refusedWriting, false);
    ok('for the reason a write in flight gives', /One write at a time/.test(bannerText(W)), bannerText(W));

    app.ops.unlink('l1');
    ok('with nothing in the way, the question is put instead', !!btnAt(W, '#banner', 'Remove both'));
    btnAt(W, '#banner', 'Cancel').click();
    return settle();

  }).then(function () {

    /* ---- two questions, one banner ---- */

    setUp('p1', 'p2');
    S.store.mutate('a real note link', function (b) { return model.setLinkReal(b, 'l1', true); });
    app.ops.unlink('l1');
    ok('the first question is up', !!btnAt(W, '#banner', 'Remove both'));
    app.ops.tagNotes('g1');
    ok('a second question replaces it', !!btnAt(W, '#banner', 'Add the tag'));
    ok('and the first is gone from the banner', !btnAt(W, '#banner', 'Remove both'));
    btnAt(W, '#banner', 'Cancel').click();
    ok('cancelling the second does not re-arm the first',
      !btnAt(W, '#banner', 'Remove both'), bannerText(W));
    ok('nor leave any other yes waiting to be pressed',
      !btnAt(W, '#banner', 'Add the tag'), bannerText(W));
    return settle();

  }).then(function () {

    /* ---- a yes given some time ago is not a licence ---- */

    setUp('p1', 'p2');
    app.ops.tagNotes('g1');
    ok('the question is up', !!btnAt(W, '#banner', 'Add the tag'));
    var updates = mock.updates.length;
    // Between the question and the answer, the user dropped a card on another
    // and the merge screen opened.
    S.merging = true;
    btnAt(W, '#banner', 'Add the tag').click();
    return settle().then(function () {
      S.merging = false;
      eq('a yes answered after the merge screen opened writes nothing', mock.updates.length, updates);
      ok('and says which screen is in the way', /merge screen is open/i.test(bannerText(W)), bannerText(W));
      W.__BB_MERGE__ = null;
    });
  });
}

/* ===================================================================== */
/* milestone 5: writing other people's notes                              */
/* ===================================================================== */

/*
 * Promote, Also link the notes, Tag these notes, and the task checkbox.
 *
 * These are the first writes Big Bang makes to a note that is not the board's,
 * so every assertion here comes in a pair: what the user was ASKED, and what
 * was actually written into the mock store. A toast saying a thing happened is
 * not evidence that it did - and `success:true` from the host is not either,
 * which is why the refused-write cases script updateNotes directly.
 */
function writePhase() {
  return booted('f8').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model, mock = W.Synapse.__mock;
    var board = S.store.board;
    function ban(text) { return btn(W, '#banner', text); }
    function newId() {
      // The note the promotion made: the one id in the store that was not seeded.
      return Object.keys(mock.notes).filter(function (id) {
        return id !== 'mock-note-1' && ['w1', 'w2', 'w3'].indexOf(id) < 0;
      })[0] || null;
    }

    eq('the write board loaded four cards', Object.keys(board.items).length, 4);
    eq('and nothing has been created', mock.saves.length, 0);

    /* ================= a sticky becomes a note ================= */

    return tapCard(W, 's1').then(function () {
      // One tap selects; the bar's own Actions button opens it. That is the
      // path a thumb takes, and it is the only one the bar is reached by.
      ok('a tap selects the sticky', S.sel.s1 === true);
      btn(W, '#bottombar', 'Actions').click();
      return settle();
    }).then(function () {
      ok('a sticky\'s bar offers to make it a note', !!btn(W, '#bottombar', 'Make it a note'), barText(W));
      return tapCard(W, 'n1').then(function () {
        btn(W, '#bottombar', 'Actions').click();
        return settle();
      });
    }).then(function () {
      ok('a note card\'s bar does not, being one already', !btn(W, '#bottombar', 'Make it a note'), barText(W));
      return tapCard(W, 's1').then(function () {
        btn(W, '#bottombar', 'Actions').click();
        return settle();
      });
    }).then(function () {
      var undos = S.store.undo.length;
      btn(W, '#bottombar', 'Make it a note').click();
      return settle().then(function () {
        ok('it asks first, naming the note it would create',
          /Create a new note called “call the vendor”/.test(bannerText(W)), bannerText(W));
        eq('and nothing has been written', mock.saves.length, 0);
        eq('nor is anything on the undo stack', S.store.undo.length - undos, 0);
        ban('Cancel').click();
        return settle();
      });
    }).then(function () {
      eq('cancelling writes nothing at all', mock.saves.length, 0);
      ok('the sticky is still a sticky', !!model.item(board, 's1') && model.item(board, 's1').k === 'sticky');

      /* ---- a link and an annotation hanging off the sticky ---- */

      // They are what proves the swap is a substitution rather than a delete
      // and an add: both have to come across to the new card.
      var made = app.ops.link('s1', 'n1');
      var annot = S.store.mutate('an annotation on the sticky', function (b) {
        return model.addItem(b, { k: 'annot', t: 'about the sticky', p: [10, -60], at: [{ i: 's1' }] });
      });
      return settle().then(function () { return { link: made, annot: annot }; });
    }).then(function (held) {
      var undos = S.store.undo.length;
      var at = model.item(board, 's1').p.join(',');
      app.ops.promote('s1');
      return settle().then(function () {
        ban('Create the note').click();
        return waitFor(function () { return mock.saves.length > 0 && S.writing === false; });
      }).then(settle).then(function () {
        var id = newId();
        ok('a note was created', !!id && !!mock.get(id), String(id));
        eq('with the sticky\'s first line as its title', mock.get(id).title, 'call the vendor');
        ok('which is not the whole of it', WRITE_STICKY !== 'call the vendor');
        eq('and ALL of the sticky\'s text as its body', mock.get(id).content, WRITE_STICKY);
        eq('it is an ordinary note, not a task', mock.get(id).type, 'note');
        ok('the sticky is off the board', !model.item(board, 's1'));
        var cards = model.cardsForNote(board, id);
        eq('and a card for the new note stands in its place', cards.length, 1);
        eq('at the same spot', model.item(board, cards[0]).p.join(','), at);
        eq('appearing AND the swap are ONE undo step', S.store.undo.length - undos, 1);
        eq('named for what it was', S.store.undo[S.store.undo.length - 1].label, 'make a sticky into a note');
        ok('the board is dirty', S.dirty === true);
        eq('the link that joined the sticky now joins the new card',
          [model.link(board, held.link.i).a, model.link(board, held.link.i).b].sort().join(','),
          [cards[0], 'n1'].sort().join(','));
        eq('and the annotation points at it too',
          model.item(board, held.annot).at.map(function (a) { return a.i; }).join(','), cards[0]);
        ok('the card shows the note\'s own title, read back from the store, not the sticky\'s text',
          card(W, cards[0]).querySelector('.ct').textContent === 'call the vendor',
          card(W, cards[0]).querySelector('.ct').textContent);
        ok('and it says the note outlives an undo', /the note stays/.test(bannerText(W)), bannerText(W));
        return { id: id, card: cards[0], link: held.link, annot: held.annot };
      });
    }).then(function (made) {
      /*
       * Undo is a board step. It cannot un-create a note, and the toast above
       * says so rather than pretending.
       */
      app.ops.undo();
      return settle().then(function () {
        ok('undo puts the sticky back', !!model.item(board, 's1'));
        eq('and takes the card away', model.cardsForNote(board, made.id).length, 0);
        ok('but the note it created is still in the library', !!mock.get(made.id));
        app.ops.redo();
        return settle();
      }).then(function () {
        eq('redo swaps it again', model.cardsForNote(board, made.id).length, 1);
        // Put the board back to a sticky for the failure cases below.
        app.ops.undo();
        return settle();
      });

    /* ---- a creation the host refused ---- */

    }).then(function () {
      W.__BB_SAVE__ = [{ success: false, error: 'the database is locked' }];
      var undos = S.store.undo.length, saves = mock.saves.length;
      app.ops.promote('s1');
      return settle().then(function () {
        ban('Create the note').click();
        return waitFor(function () { return mock.saves.length > saves && S.writing === false; });
      }).then(settle).then(function () {
        W.__BB_SAVE__ = null;
        ok('a refused creation leaves the sticky exactly as it was',
          !!model.item(board, 's1') && model.item(board, 's1').k === 'sticky');
        eq('with no undo step', S.store.undo.length - undos, 0);
        ok('and says what the host said', /database is locked/.test(bannerText(W)), bannerText(W));
      });
    }).then(function () {
      /*
       * saveNotes came back a success with no ids. There is no way back to the
       * note from there - an entry that did not save is simply absent from the
       * list - so nothing is swapped and nothing goes looking.
       */
      W.__BB_SAVE__ = [{ success: true, savedCount: 1 }];
      var saves = mock.saves.length;
      app.ops.promote('s1');
      return settle().then(function () {
        ban('Create the note').click();
        return waitFor(function () { return mock.saves.length > saves && S.writing === false; });
      }).then(settle).then(function () {
        W.__BB_SAVE__ = null;
        ok('a save with no ids swaps nothing', !!model.item(board, 's1'));
        ok('and says the note was not created', /not created/.test(bannerText(W)), bannerText(W));
      });

    /* ================= also link the notes ================= */

    }).then(function () {
      return tapBackground(W).then(function () {
        var g = S.r.geomOf(board, 'l1');
        return tapHandle(W, '.bb-link[data-id="l1"]', g.mid);
      });
    }).then(function () {
      eq('the link\'s bar is open', S.linkSel, 'l1');
      ok('and it offers to link the notes behind it', !!btn(W, '#bottombar', 'Also link the notes'), barText(W));
      ok('with no relationship recorded yet', model.link(board, 'l1').real === undefined);
      var updates = mock.updates.length;
      btn(W, '#bottombar', 'Also link the notes').click();
      return settle().then(function () {
        ok('it asks first, naming both notes',
          /“Alpha”/.test(bannerText(W)) && /“Beta”/.test(bannerText(W)), bannerText(W));
        ok('and the relationship it would write', /“related”/.test(bannerText(W)), bannerText(W));
        eq('nothing has been written', mock.updates.length, updates);
        ban('Cancel').click();
        return settle();
      });
    }).then(function () {
      eq('cancelling leaves the notes unlinked', mock.links.length, 0);
      ok('and the line unmarked', model.link(board, 'l1').real === undefined);

      /*
       * The write the host RAN and refused. success:true with updatedCount 0
       * is the answer that looks like a success from the outside, and a board
       * that believed it would draw a dot for a relationship that is not there.
       */
      W.__BB_UPDATE__ = [{ success: true, updatedCount: 0, errors: ['Note not found: w2'] }];
      btn(W, '#bottombar', 'Also link the notes').click();
      return settle().then(function () {
        var updates = mock.updates.length;
        ban('Link the notes').click();
        return waitFor(function () { return mock.updates.length > updates && S.writing === false; });
      }).then(settle).then(function () {
        W.__BB_UPDATE__ = null;
        ok('a write that landed on nothing does not mark the line',
          model.link(board, 'l1').real === undefined, JSON.stringify(model.link(board, 'l1')));
        ok('and the host\'s own message is reported',
          /Note not found: w2/.test(bannerText(W)), bannerText(W));
        eq('no relationship exists', mock.links.length, 0);
      });
    }).then(function () {
      var undos = S.store.undo.length;
      btn(W, '#bottombar', 'Also link the notes').click();
      return settle().then(function () {
        ban('Link the notes').click();
        return waitFor(function () { return mock.links.length > 0 && S.writing === false; });
      }).then(settle).then(function () {
        eq('a relationship is written between the two notes', mock.links.length, 1);
        eq('from the note at one end', mock.links[0].from, 'w1');
        eq('to the note at the other', mock.links[0].to, 'w2');
        ok('and only now is the line marked', model.link(board, 'l1').real === true);
        eq('which is one undo step', S.store.undo.length - undos, 1);
        var h = W.document.querySelector('.bb-link[data-id="l1"]');
        ok('the handle wears the dot that says so', h.className.indexOf('real') >= 0, h.className);
        ok('the bar now offers to take it off again', !!btn(W, '#bottombar', 'Unlink the notes'), barText(W));
        ok('and no longer offers to add it', !btn(W, '#bottombar', 'Also link the notes'), barText(W));
        return Promise.resolve(app.ops.save()).then(settle);
      }).then(function () {
        var re = W.BB.board.read(mock.notes['mock-note-1'].content);
        ok('the flag survives the note', re.board.links[0].real === true, JSON.stringify(re.board.links[0]));
      });

    /* ---- unlinking the line asks about the relationship, and defaults to no ---- */

    }).then(function () {
      var undos = S.store.undo.length, lines = board.links.length;
      btnAt(W, '#bottombar', 'Unlink').click();
      return settle().then(function () {
        ok('removing a backed line asks rather than choosing',
          /relationship stands behind this line/.test(bannerText(W)), bannerText(W));
        ok('the first answer is the one that keeps the relationship', !!ban('Remove the line only'));
        ok('taking both is offered too', !!ban('Remove both'));
        ok('and cancelling is', !!ban('Cancel'));
        eq('nothing has happened to the line yet', board.links.length, lines);
        eq('nor to the notes', mock.links.length, 1);
        eq('and nothing is on the undo stack', S.store.undo.length - undos, 0);
        ban('Remove the line only').click();
        return settle();
      }).then(function () {
        ok('the line is gone', !model.link(board, 'l1'));
        eq('and the relationship is not', mock.links.length, 1);
        ok('which is what it says', /left alone/.test(bannerText(W)), bannerText(W));
        app.ops.undo();
        return settle();
      }).then(function () {
        ok('undo brings the line back', !!model.link(board, 'l1'));
        ok('still marked', model.link(board, 'l1').real === true);
      });
    }).then(function () {
      /* ---- and the other answer takes both ---- */
      return Promise.resolve(app.ops.selectLink('l1')).then(settle).then(function () {
        btnAt(W, '#bottombar', 'Unlink').click();
        return settle();
      }).then(function () {
        ban('Remove both').click();
        return waitFor(function () { return mock.links.length === 0 && S.writing === false; });
      }).then(settle).then(function () {
        ok('the line is gone', !model.link(board, 'l1'));
        eq('and so is the relationship', mock.links.length, 0);
        ok('which is what it says', /no longer linked in your notes/.test(bannerText(W)), bannerText(W));
      });

    /* ---- a line with a sticky at one end is never offered it ---- */

    }).then(function () {
      var made = app.ops.link('n3', 's1');
      return settle().then(function () {
        return Promise.resolve(app.ops.selectLink(made.i)).then(settle);
      }).then(function () {
        ok('a line to a sticky offers no note link at all',
          !btn(W, '#bottombar', 'Also link the notes') && !btn(W, '#bottombar', 'Unlink the notes'), barText(W));
        ok('and asking for one anyway is refused out loud', app.ops.linkNotes(made.i) === false);
        ok('saying a sticky is not a note', /not a note/.test(bannerText(W)), bannerText(W));
        return Promise.resolve(app.ops.unlink(made.i)).then(settle);
      });

    /* ================= tag these notes ================= */

    }).then(function () {
      return Promise.resolve(app.ops.selectGroup('g1')).then(settle);
    }).then(function () {
      ok('a group\'s bar offers to tag its notes', !!btn(W, '#bottombar', 'Tag these notes'), barText(W));
      var updates = mock.updates.length;
      btn(W, '#bottombar', 'Tag these notes').click();
      return settle().then(function () {
        ok('it asks first, naming the tag and how many notes',
          /“Pricing”/.test(bannerText(W)) && /2 notes/.test(bannerText(W)), bannerText(W));
        ok('and says it is one-shot rather than a binding',
          /renaming the group later does not rename the tag/.test(bannerText(W)), bannerText(W));
        eq('nothing has been written', mock.updates.length, updates);
        ban('Cancel').click();
        return settle();
      });
    }).then(function () {
      eq('cancelling tags nothing', mock.tagNames('w1').length, 0);
      /*
       * Saved first, on purpose. "No dirtier than it was" proves nothing about
       * a board that was already dirty - the flag cannot go up - so the board
       * is written out and the assertion below is that tagging leaves it
       * CLEAN: what a tag changes is the notes, not the board.
       */
      return Promise.resolve(app.ops.save()).then(settle);
    }).then(function () {
      eq('the board starts clean', S.dirty, false);
      var undos = S.store.undo.length;
      btn(W, '#bottombar', 'Tag these notes').click();
      return settle().then(function () {
        ban('Add the tag').click();
        return waitFor(function () { return mock.tagNames('w1').length > 0 && S.writing === false; });
      }).then(settle).then(function () {
        eq('both notes carry the tag', mock.tagNames('w1').join(',') + '|' + mock.tagNames('w2').join(','),
          'Pricing|Pricing');
        eq('it took one call, so one approval', mock.updates[mock.updates.length - 1].length, 2);
        eq('tagging is not a board edit, so nothing was pushed onto the undo stack',
          S.store.undo.length - undos, 0);
        eq('and the board is still clean, because nothing on it changed', S.dirty, false);
        return waitFor(function () {
          return card(W, 'n1').querySelectorAll('.cc .chip.tag').length > 0;
        });
      }).then(function () {
        eq('the card re-read its note and shows the chip',
          card(W, 'n1').querySelector('.cc .chip.tag').textContent, 'Pricing');
      });
    }).then(function () {
      /*
       * A batch the host only half applied. It is a success - two notes really
       * were tagged - and the part that was refused is said rather than
       * swallowed.
       */
      W.__BB_UPDATE__ = [{ success: true, updatedCount: 1, errors: ['Note not found: w2'] }];
      btn(W, '#bottombar', 'Tag these notes').click();
      return settle().then(function () {
        var updates = mock.updates.length;
        ban('Add the tag').click();
        return waitFor(function () { return mock.updates.length > updates && S.writing === false; });
      }).then(settle).then(function () {
        W.__BB_UPDATE__ = null;
        ok('a half-applied batch says how much landed', /1 of 2 notes/.test(bannerText(W)), bannerText(W));
        ok('and why the rest did not', /Note not found: w2/.test(bannerText(W)), bannerText(W));
      });
    }).then(function () {
      /* ---- a group with no name has no tag to give ---- */
      S.store.mutate('unname the group', function (b) { return model.setText(b, 'g1', ''); });
      var updates = mock.updates.length;
      ok('an unnamed group is refused', app.ops.tagNotes('g1') === false);
      ok('and says what to do about it', /Name the group first/.test(bannerText(W)), bannerText(W));
      eq('with nothing written', mock.updates.length, updates);
      S.store.mutate('name it again', function (b) { return model.setText(b, 'g1', 'Pricing'); });
      return settle();

    /* ================= the task checkbox ================= */

    }).then(function () {
      return tapBackground(W).then(function () {
        var c = card(W, 'n3');
        ok('the task card carries a checkbox', !!c.querySelector('.tk') && c.querySelector('.tk').hidden === false);
        ok('and it is not ticked', c.className.indexOf('done') < 0, c.className);
        var tk = c.querySelector('.tk');
        var r = W.BB.app.itemScreenRect('n3');
        // The card's top-right corner, which is where the box is.
        var x = r.right - 12, y = r.top + 12;
        P(W, 'pointerdown', tk, x, y);
        P(W, 'pointerup', stageOf(W), x, y);
        return settle();
      });
    }).then(function () {
      ok('tapping the box asks about the NOTE, not the board',
        /Mark “Ship it” as done in your notes/.test(bannerText(W)), bannerText(W));
      eq('and does not select the card', Object.keys(S.sel).length, 0);
      eq('nothing has been written', mock.get('w3').status, 'todo');
      ban('Cancel').click();
      return settle();
    }).then(function () {
      eq('cancelling leaves the task alone', mock.get('w3').status, 'todo');
      var undos = S.store.undo.length, dirty = S.dirty;
      app.ops.tick('n3');
      return settle().then(function () {
        ban('Mark it done').click();
        return waitFor(function () { return mock.get('w3').status !== 'todo' && S.writing === false; });
      }).then(settle).then(function () {
        eq('the note is marked in the spelling the table uses', mock.get('w3').status, 'complete');
        eq('the call carried the status and nothing else',
          JSON.stringify(Object.keys(mock.updates[mock.updates.length - 1][0]).sort()), '["id","status"]');
        eq('ticking is not a board edit', S.store.undo.length - undos, 0);
        eq('and marks nothing dirty', S.dirty, dirty);
        return waitFor(function () { return card(W, 'n3').className.indexOf('done') >= 0; });
      }).then(function () {
        ok('the card re-read the note and draws it ticked',
          card(W, 'n3').className.indexOf('done') >= 0, card(W, 'n3').className);
        app.ops.tick('n3');
        return settle();
      }).then(function () {
        ok('tapping a ticked box offers to put it back on the list',
          /as not done/.test(bannerText(W)), bannerText(W));
        ban('Mark it not done').click();
        return waitFor(function () { return mock.get('w3').status === 'todo'; });
      }).then(settle).then(function () {
        eq('which is what it writes', mock.get('w3').status, 'todo');
      });
    }).then(function () {
      /*
       * The box counter-scales like every other affordance, but not without a
       * limit. 44px multiplied by the counter-scale at the zoom floor is 293
       * board units - wider than any card - and a target that covers the card
       * it sits on turns every tap on a zoomed-out task into a question about
       * the note behind it. The grip and the port can live with that because
       * they only appear on a card the user has already aimed at; this one is
       * on every task card all the time.
       */
      var tk = card(W, 'n3').querySelector('.tk');
      var c3 = card(W, 'n3');
      var atOne = tk.getBoundingClientRect().width;
      near('at an ordinary zoom the box is a 44px target', atOne, 44, 1, 'tick width');
      var keep = S.k;
      S.k = W.BB.gestures.MIN_Z;
      S.r.setCamera(S.tx, S.ty, S.k);
      var w = tk.getBoundingClientRect().width, cw = c3.getBoundingClientRect().width;
      ok('at the zoom floor it is still a good deal wider than 44 device pixels would be',
        w > 44 * S.k * 1.5, 'tick ' + w + ' at k=' + S.k);
      ok('but it never grows to cover the card it is on',
        w <= cw * 0.55, 'tick ' + w + ' against card ' + cw);
      S.k = keep;
      S.r.setCamera(S.tx, S.ty, S.k);
      return settle();
    }).then(function () {
      /* ---- a card that is not a task is not tickable ---- */
      ok('a plain note has no checkbox to press', card(W, 'n1').querySelector('.tk').hidden === true);
      ok('and asking anyway is refused', app.ops.tick('n1') === false);
      ok('out loud', /not one/.test(bannerText(W)), bannerText(W));

      /* ---- the box is still part of a card you can drag ---- */
      var undos = S.store.undo.length;
      var before = model.item(board, 'n3').p.slice();
      var r = W.BB.app.itemScreenRect('n3');
      var st = stageOf(W);
      var x = r.right - 12, y = r.top + 12;
      P(W, 'pointerdown', card(W, 'n3').querySelector('.tk'), x, y);
      P(W, 'pointermove', st, x + 14, y);            // past the slop: now a drag
      P(W, 'pointermove', st, x + 40, y + 30);
      P(W, 'pointerup', st, x + 40, y + 30);
      return settle().then(function () {
        eq('a press on the box that MOVES drags the card instead of ticking it',
          S.store.undo.length - undos, 1);
        ok('and the card really moved', model.item(board, 'n3').p.join(',') !== before.join(','),
          model.item(board, 'n3').p.join(','));
        eq('the note was not touched', mock.get('w3').status, 'todo');
      });

    /* ---- one write at a time ---- */

    }).then(function () {
      var release = null;
      W.__BB_UPDATE__ = function () {
        return new W.Promise(function (res) { release = function () { res({ success: true, updatedCount: 1 }); }; });
      };
      app.ops.tick('n3');
      return settle().then(function () {
        ban('Mark it done').click();
        return settle();
      }).then(function () {
        ok('a write is in flight', S.writing === true);
        ok('a second one is refused', app.ops.tagNotes('g1') === false);
        ok('saying why', /One write at a time/.test(bannerText(W)), bannerText(W));
        if (release) release();
        return waitFor(function () { return S.writing === false; });
      }).then(function () {
        W.__BB_UPDATE__ = null;
        ok('and when it comes back the next one may go', S.writing === false);
        return W;
      });
    });
  });
}

// The rows of the home list, and the buttons on them.
function homeRows(W) {
  return Array.prototype.slice.call(W.document.querySelectorAll('#home .home-row'));
}
function homeRowTitles(W) {
  return homeRows(W).map(function (b) { return b.querySelector('.hr-title').textContent; });
}
function homeRowByTitle(W, title) {
  var all = homeRows(W);
  for (var i = 0; i < all.length; i++) {
    if (all[i].querySelector('.hr-title').textContent === title) return all[i];
  }
  return null;
}
function subOf(row) { return row.querySelector('.hr-sub').textContent; }
function shows(W, id) {
  var e = W.document.getElementById(id);
  return !!e && !e.hidden && W.getComputedStyle(e).display !== 'none';
}
function dim(W, id) {
  var e = card(W, id) || W.document.querySelector('[data-id="' + id + '"]');
  return !!e && (' ' + e.className.baseVal !== undefined ? '' : '') === '' &&
    (' ' + classOf(e) + ' ').indexOf(' dim ') >= 0;
}
// SVG elements carry a SVGAnimatedString rather than a string.
function classOf(e) {
  if (!e) return '';
  return typeof e.className === 'string' ? e.className : String(e.getAttribute('class') || '');
}

/*
 * A note-action launch on SEVERAL notes: a new board holding all of them,
 * titled after them. It is the one launch that writes something before the
 * user has done anything, so what it wrote is the thing to look at.
 */
function launchPhase() {
  return booted('f12').then(function (W) {
    var app = W.BB.app, S = app.S, model = W.BB.model, mock = W.Synapse.__mock;

    ok('several notes make a board, not a canvas of the first one', S.mode === 'board');
    eq('exactly one note was created for it', mock.saves.length, 1);
    ok('and the board lives in it', !!S.session && S.session.noteId !== 'g1n', S.session && S.session.noteId);

    var made = mock.get(S.session.noteId);
    eq('the new note is titled after the notes on it', made.title, 'Alpha, Beta and Gamma');
    eq('and the bar says so', W.document.getElementById('title').textContent, 'Alpha, Beta and Gamma');
    ok('the user is told a note was made for it', /new note/i.test(bannerText(W)), bannerText(W));

    var board = S.store.board;
    eq('every note that was selected is on the board', Object.keys(board.items).length, 3);
    eq('one card each, and no duplicates', model.cardsForNote(board, 'g2n').length, 1);
    var ids = Object.keys(board.items).map(function (k) { return board.items[k].id; }).sort();
    eq('and they are the notes that were selected', ids.join(','), 'g1n,g2n,g3n');

    var re = W.BB.board.read(made.content);
    eq('the block was written into the new note', re.status, 'ok');
    eq('with all three cards in it', Object.keys(re.board.items).length, 3);
    ok('under a heading, so the note reads as something', /^# Alpha, Beta and Gamma/.test(made.content), made.content.slice(0, 60));

    // No two cards may share a spot, or a board of N notes is a pile of one.
    var spots = Object.keys(board.items).map(function (k) { return board.items[k].p.join(','); });
    eq('the cards were laid out, not stacked', spots.length, spots.filter(function (p, i) { return spots.indexOf(p) === i; }).length);

    return waitFor(function () {
      var c = W.document.querySelector('.bb-card .ct');
      return c && c.textContent === 'Alpha';
    }, 5000, 'the cards to resolve').then(function () {
      ok('and the cards resolve to the notes they point at', true);

      /*
       * A block-scope selection carries a BLOCK's id, which has no row in the
       * notes table. The launch resolves it to the note it is part of, and
       * several blocks of one note collapse to one card.
       */
      var keep = W.Synapse.Notes;
      W.Synapse.Notes = [
        { id: 'blk-1', title: 'A block', isBlockScope: true, parentNoteId: 'g1n' },
        { id: 'blk-2', title: 'Another block of the same note', isBlockScope: true, parentNoteId: 'g1n' },
        { id: 'g2n', title: 'Beta' }
      ];
      var out = app.launchNotes();
      W.Synapse.Notes = keep;
      eq('a block scope becomes the note it is part of', out.map(function (n) { return n.id; }).join(','), 'g1n,g2n');
      eq('and two blocks of one note are one card, not two', out.length, 2);
      return W;
    });
  });
}
