name: "Big Bang"
uuid: 9f6001dd-661d-4aa7-ba18-c54164b94338
app_type: normal
description: "A canvas you throw notes onto. Notes become cards you can place, link, annotate, group and merge - spatial thinking over the notes you already have, with the board itself stored as an ordinary note. Draw links and label them, leave stickies and promote them into real notes, frame cards into groups and tag them, drop one card onto another to open the app own merge screen, search and focus to find your way around a big board, and embed a board read-only inside its own note. Nothing rewrites a note body: the board lives in one fenced block appended to it."
i18n:
  zh-CN:
    name: "大爆炸"
    description: "把笔记放上画布，自由摆放、链接、批注、分组与合并，用空间方式整理已有笔记。画板本身保存在普通笔记的代码块中，不会改写笔记正文。"
