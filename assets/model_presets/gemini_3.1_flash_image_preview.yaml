model_type: gemini
model_endpoint: https://generativelanguage.googleapis.com/v1beta
model_name: gemini-3.1-flash-image-preview
model_display_name: Gemini 3.1 Flash Image Preview
api_key_url: https://aistudio.google.com/app/apikey
model_capabilities:
  - support_document_understanding
  - support_image
  - generate_image
max_input_token: 2097152
max_output_token: 65536
supported_attachment_mime_types:
  - image/png
  - image/jpeg
  - image/webp
  - application/pdf
  - application/msword
  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - text/plain
warn_premium: true
model_features:
  - google_search
  - code_execution
