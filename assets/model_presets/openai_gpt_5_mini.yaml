model_type: openai_compatible
model_endpoint: https://api.openai.com/v1/chat/completions
model_name: gpt-5-mini
model_display_name: GPT-5 Mini
api_key_url: https://platform.openai.com/api-keys
model_capabilities:
  - support_audio
  - support_video
  - support_document_understanding
  - support_image
  - support_code_generation
max_input_token: 131072
max_output_token: 65536
supported_attachment_mime_types:
  - image/png
  - image/jpeg
  - image/webp
  - application/pdf
  - application/msword
  - application/vnd.openxmlformats-officedocument.wordprocessingml.document
  - text/plain
  - audio/mpeg
  - audio/wav
  - audio/mp4
  - audio/aac
  - audio/ogg
  - video/mp4
  - video/webm
warn_premium: false
