<!DOCTYPE html>
<html>
   <head>
   <script type="text/javascript" src="synapseuser:///gh/gitbrent/pptxgenjs/dist/pptxgen.bundle.js"></script>
   </head>
   <body>
      <script>
         document.addEventListener("DOMContentLoaded", function() {
                // STEP 1: Create a Presentation
                const pptx = new PptxGenJS();

                // STEP 2: Add a Slide to the Presentation
                const slide = pptx.addSlide();

                // STEP 3: Add objects to the Slide (charts, tables, shapes, images, etc.)
                slide.addText(
                  'BONJOUR - CIAO - GUTEN TAG - HELLO - HOLA - NAMASTE - OLÀ - ZDRAS-TVUY-TE - こんにちは - 你好',
                  { x:0.0, y:0.25, w:'100%', h:1.5, align:'center', fontSize:24, color:'0088CC', fill:{ color:'e6e6e6' } }
                );

                // STEP 4: Save/Export the Presentation
                pptx.write({ outputType: "base64" })
                    .then((data) => {
                        console.log("write as base64: Here are 0-100 chars of `data`:\n");
                        console.log(data.substring(0, 100));
                    })
                    .catch((err) => {
                            console.error(err);
                    });
         });
      </script>
   </body>
</html>
